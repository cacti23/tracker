<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design</title>
<style>
:root {
  --bg: #f7f6f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc; --accent: #4f46e5; --chip: #eef0fb;
  --red-bg: #fde8e8; --red-fg: #b42318; --coral-bg: #fdeee6; --coral-fg: #b54708;
  --amber-bg: #fdf4dc; --amber-fg: #93690b; --blue-bg: #e6effd; --blue-fg: #1e5bb8;
  --teal-bg: #e0f5f2; --teal-fg: #0f766e; --green-bg: #e3f6ea; --green-fg: #15803d;
  --purple-bg: #efe9fd; --purple-fg: #6d3fd1; --gray-bg: #f0f0f2; --gray-fg: #3a3a40;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --card: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --line: #2c2c31; --accent: #8b85ff; --chip: #23263a;
    --red-bg: #3b1d1f; --red-fg: #ff9a9a; --coral-bg: #3a2418; --coral-fg: #ffab7a;
    --amber-bg: #3a3012; --amber-fg: #ffd36b; --blue-bg: #172a45; --blue-fg: #8dbdff;
    --teal-bg: #0f3331; --teal-fg: #6ee0d2; --green-bg: #14331f; --green-fg: #7eeaa8;
    --purple-bg: #2a2045; --purple-fg: #c7aeff; --gray-bg: #26272d; --gray-fg: #d6d6dc;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --card: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --line: #2c2c31; --accent: #8b85ff; --chip: #23263a;
  --red-bg: #3b1d1f; --red-fg: #ff9a9a; --coral-bg: #3a2418; --coral-fg: #ffab7a;
  --amber-bg: #3a3012; --amber-fg: #ffd36b; --blue-bg: #172a45; --blue-fg: #8dbdff;
  --teal-bg: #0f3331; --teal-fg: #6ee0d2; --green-bg: #14331f; --green-fg: #7eeaa8;
  --purple-bg: #2a2045; --purple-fg: #c7aeff; --gray-bg: #26272d; --gray-fg: #d6d6dc;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
header h1 { font-size: 24px; margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.chips button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); cursor: pointer; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
section.card { margin: 0 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
section.card[hidden] { display: none; }
.cap { margin-top: 0; font-weight: normal;  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 10px; }
.cap b { font-size: 16px; }
.tag { font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.hint { margin-left: auto; font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .hint { display: none; } }
.src { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.src a { color: var(--accent); }

.card ul { margin: 0; padding-left: 20px; }
.card li { margin: 2px 0; }
.empty { color: var(--muted); font-size: 14px; }
.views { display: inline-flex; margin-top: 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.views button { font: inherit; font-size: 14px; padding: 6px 14px; border: 0; background: var(--card); color: var(--muted); cursor: pointer; }
.views button.on { background: var(--accent); color: #fff; }
.tag.course { background: var(--purple-bg); color: var(--purple-fg); }
.lesson { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🏛️ System Design</h1>
  <p>Notes from our discussions. One idea per card, shown by topic or by course.</p>
</header>

<div class="views" id="views">
  <button type="button" data-view="topics">📚 Topics</button>
  <button type="button" data-view="courses">🎓 Courses</button>
</div>
<div class="chips" id="chips"></div>

<!--
  One <section class="card"> per note, written ONCE. It shows in both views:
    📚 Topics  → grouped by data-topic (chips are built automatically)
    🎓 Courses → only cards with data-course, grouped by data-lesson, sorted by data-order
  Example:
    <section class="card" id="sd-caching" data-topic="Caching"
             data-course="hi-sd" data-lesson="Core Concepts" data-order="3.2">
  data-course is a key of COURSES in the script below. A note that isn't from a course just leaves the course attributes out.
-->
<div id="list">

<section class="card" id="sd-start" data-topic="Start">
  <h2 class="cap"><b>👋 Start here</b></h2>
  <p class="empty">No notes yet. Each topic we discuss lands here as its own card.</p>
</section>

</div>
</div>

<script>
// Follow the tracker's theme ('dsa-theme', same origin); default dark like the tracker.
try {
  const t = localStorage.getItem('dsa-theme') || 'dark'
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
} catch (e) {}

// Courses Adi is following; a card points at one with data-course="<key>".
const COURSES = {
  'hi-sd': '🎓 HelloInterview · System Design',
}

const list = document.getElementById('list')
const cards = [...list.querySelectorAll('section.card')]
const chips = document.getElementById('chips')
const VIEW_KEY = 'sd-view-v1'

// Each card carries its topic and course as tags, so you can see both in either view
cards.forEach(c => {
  const cap = c.querySelector('.cap')
  if (c.dataset.topic && c.dataset.topic !== 'Start') cap.insertAdjacentHTML('beforeend', `<span class="tag">${c.dataset.topic}</span>`)
  if (COURSES[c.dataset.course]) cap.insertAdjacentHTML('beforeend', `<span class="tag course">${COURSES[c.dataset.course].split(' · ')[0]}${c.dataset.lesson ? ' · ' + c.dataset.lesson : ''}</span>`)
})

function setChips(names, onPick, current) {
  chips.innerHTML = ''
  names.forEach(([key, label]) => {
    const b = document.createElement('button')
    b.type = 'button'
    b.textContent = label
    b.classList.toggle('on', key === current)
    b.onclick = () => onPick(key)
    chips.appendChild(b)
  })
}

function showTopics(topic = 'All') {
  list.querySelectorAll('.lesson, .lesson-empty').forEach(h => h.remove())
  cards.forEach(c => list.appendChild(c)) // back to page order
  cards.forEach(c => { c.hidden = topic !== 'All' && c.dataset.topic !== topic })
  const topics = [...new Set(cards.map(c => c.dataset.topic))]
  setChips([['All', 'All'], ...topics.map(t => [t, t])], showTopics, topic)
}

function showCourse(course = Object.keys(COURSES)[0]) {
  list.querySelectorAll('.lesson, .lesson-empty').forEach(h => h.remove())
  const mine = cards.filter(c => c.dataset.course === course)
    .sort((a, b) => parseFloat(a.dataset.order || 0) - parseFloat(b.dataset.order || 0))
  cards.forEach(c => { c.hidden = !mine.includes(c) })
  let lesson = null
  mine.forEach(c => {
    if (c.dataset.lesson && c.dataset.lesson !== lesson) {
      lesson = c.dataset.lesson
      const h = document.createElement('h3')
      h.className = 'lesson'
      h.textContent = lesson
      list.appendChild(h)
    }
    list.appendChild(c)
  })
  if (!mine.length) {
    const h = document.createElement('p')
    h.className = 'lesson-empty empty'
    h.textContent = 'No notes from this course yet.'
    list.appendChild(h)
  }
  setChips(Object.entries(COURSES), showCourse, course)
}

function setView(view) {
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.view === view))
  view === 'courses' ? showCourse() : showTopics()
  try { localStorage.setItem(VIEW_KEY, view) } catch (e) {}
}
document.querySelectorAll('#views button').forEach(b => { b.onclick = () => setView(b.dataset.view) })
let startView = 'topics'
try { startView = localStorage.getItem(VIEW_KEY) || 'topics' } catch (e) {}
setView(startView)
</script>
<script src="../js/back-button.js"></script>
</body>
</html>
