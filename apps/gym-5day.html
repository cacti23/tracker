<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>5-Day PPL ×2 + Legs · Hany Rambod Hypertrophy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>💪</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070710;
      --surface: #0f0f1a;
      --surface2: #18182a;
      --border: rgba(255, 255, 255, 0.07);
      --border-sub: rgba(255, 255, 255, 0.04);
      --text: #dde0ee;
      --text-muted: #77778a;
      --text-faint: #44445a;
      --text-faintest: #33334a;
      --tab-row: #0f0f1a;
      --tab-active: #1a1a2a;
      --tab-inactive: transparent;
      --tab-text-active: #dde0ee;
      --tab-text-inactive: #44445a;
      --accent: #e05a2b;
      --stats-row: #0f0f1a;
      --note-bg: rgba(0, 0, 0, 0.3);
      --sets-chip: #18182a;
      --sets-text: #666680;
      --divider: rgba(255, 255, 255, 0.05);
      --toggle-bg: #1a1a2a;
      --toggle-border: rgba(255, 255, 255, 0.1);
      --heading-color: #ffffff;
      --sub-heading-color: #333350;
      --shadow: none;
      --rest-text: #33334a;
      --priority-color: #ffffff;
      --normal-color: #77778a;
      --note-color: #55556a;
      --alt-bg: rgba(22, 163, 74, 0.08);
      --alt-border: rgba(22, 163, 74, 0.25);
      --alt-text: #4ade80;
      --checkbox-border: rgba(255,255,255,0.18);
      --notes-bg: #0f0f1a;
      --variant-active: #e05a2b;
      --variant-inactive: #44445a;
    }

    [data-theme="light"] {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface2: #ebebf0;
      --border: rgba(0, 0, 0, 0.08);
      --border-sub: rgba(0, 0, 0, 0.05);
      --text: #1a1a28;
      --text-muted: #555568;
      --text-faint: #999aaa;
      --text-faintest: #bbbbcc;
      --tab-row: #e4e4ec;
      --tab-active: #ffffff;
      --tab-inactive: transparent;
      --tab-text-active: #1a1a28;
      --tab-text-inactive: #aaaabc;
      --accent: #e05a2b;
      --stats-row: #ffffff;
      --note-bg: rgba(0, 0, 0, 0.03);
      --sets-chip: #ebebf0;
      --sets-text: #888899;
      --divider: rgba(0, 0, 0, 0.06);
      --toggle-bg: #ffffff;
      --toggle-border: rgba(0, 0, 0, 0.1);
      --heading-color: #111122;
      --sub-heading-color: #c0c0d0;
      --shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
      --rest-text: #bbbbcc;
      --priority-color: #111122;
      --normal-color: #666678;
      --note-color: #9999aa;
      --alt-bg: rgba(22, 163, 74, 0.06);
      --alt-border: rgba(22, 163, 74, 0.2);
      --alt-text: #16a34a;
      --checkbox-border: rgba(0,0,0,0.18);
      --notes-bg: #ffffff;
      --variant-active: #e05a2b;
      --variant-inactive: #888899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      transition: background 0.3s, color 0.3s;
      padding-bottom: 2rem;
    }
    .glow-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 55% 35% at 15% 8%, rgba(224,90,43,0.08) 0%, transparent 65%),
                  radial-gradient(ellipse 45% 35% at 85% 85%, rgba(14,165,233,0.06) 0%, transparent 65%);
      transition: background 0.3s;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 32px 16px 120px; position: relative; z-index: 1; padding-top: max(32px, env(safe-area-inset-top)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: max(120px, calc(120px + env(safe-area-inset-bottom))); }
    .header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 36px;
      border-left: 3px solid var(--accent); padding-left: 20px;
    }
    .header-mono { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
    .header-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(44px,9vw,82px); line-height: 0.88; color: var(--heading-color); }
    .header-title span { color: var(--accent); }
    .header-sub { font-family: 'Bebas Neue', sans-serif; font-size: clamp(18px,4vw,32px); color: var(--sub-heading-color); letter-spacing: 0.06em; margin-top: 4px; }
    .header-desc { margin-top: 10px; font-size: 13px; color: var(--text-muted); font-weight: 300; }
    .toggle-btn {
      cursor: pointer; border: 1px solid var(--toggle-border); background: var(--toggle-bg);
      border-radius: 8px; padding: 10px 14px; color: var(--text-muted);
      font-size: 12px; font-family: 'DM Mono', monospace; letter-spacing: 0.07em;
      flex-shrink: 0; margin-top: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 7px;
      box-shadow: var(--shadow); min-height: 44px; min-width: 44px;
    }
    .toggle-btn:hover { opacity: 0.8; }
    /* Token is set on this device — sync is live, not just a dormant button. */
    .toggle-btn.ds-token-set { border-color: #3dd68c; color: #3dd68c; background: rgba(61,214,140,0.12); }
    .stats-bar {
      display: flex; gap: 1px; margin-bottom: 32px; background: rgba(255,255,255,0.03);
      border-radius: 10px; overflow: hidden; transition: background 0.3s;
    }
    .stat-item { flex: 1; background: var(--stats-row); padding: 13px 8px; text-align: center; }
    .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent); line-height: 1; }
    .stat-label { font-family: 'DM Mono', monospace; font-size: 8px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }
    .tab-row { display: flex; gap: 2px; margin-bottom: 28px; background: var(--tab-row); border-radius: 8px; padding: 3px; }
    .tab-btn {
      flex: 1; padding: 10px 8px; border-radius: 6px; font-size: 12px; font-weight: 500;
      letter-spacing: 0.03em; cursor: pointer; border: none; font-family: 'DM Sans', sans-serif;
      transition: all 0.2s; border-bottom: 2px solid transparent; min-height: 42px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .tab-btn.active { background: var(--tab-active); color: var(--tab-text-active); border-bottom-color: var(--accent); }
    .tab-btn.inactive { background: var(--tab-inactive); color: var(--tab-text-inactive); }
    .section-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-faint); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .section-label .line { flex: 1; height: 1px; background: var(--divider); }
    .day-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 600px) { .day-grid { grid-template-columns: repeat(2, 1fr); } }
    .day-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; cursor: pointer; box-shadow: var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s, background 0.3s;
    }
    .day-card:hover { transform: translateY(-2px); }
    .day-card.rest { cursor: default; opacity: 0.6; }
    .day-card.rest:hover { transform: none; }
    .day-card-header { padding: 12px 16px; border-bottom: 1px solid var(--border-sub); display: flex; align-items: center; gap: 10px; }
    .day-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-faintest); }
    .day-tag { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 0.04em; flex: 1; }
    .day-ex-count { font-size: 9px; color: var(--text-faint); background: var(--surface2); padding: 2px 7px; border-radius: 3px; font-family: 'DM Mono', monospace; }
    .rest-msg { padding: 14px 16px; font-size: 12px; color: var(--rest-text); font-style: italic; }
    .day-card-body { padding: 10px 16px 14px; }
    .ex-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--border-sub); }
    .ex-name { font-size: 12px; }
    .ex-name.priority { color: var(--priority-color); font-weight: 600; }
    .ex-name.normal { color: var(--normal-color); }
    .ex-sets { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-faint); white-space: nowrap; }
    .more-ex { font-size: 11px; color: var(--text-faintest); margin-top: 6px; font-family: 'DM Mono', monospace; }
    .back-btn {
      cursor: pointer; background: none; border: none; font-family: 'DM Mono', monospace;
      font-size: 12px; letter-spacing: 0.12em; display: flex; align-items: center; gap: 6px;
      padding: 12px 8px; margin: 0 -8px 20px; color: var(--text-faint); transition: opacity 0.15s; min-height: 44px;
    }
    .back-btn:hover { opacity: 0.6; }
    .expanded-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
    .expanded-header { padding: 22px 26px; border-bottom: 1px solid var(--border-sub); }
    .expanded-day-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-faint); margin-bottom: 6px; }
    .expanded-day-tag { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 0.04em; line-height: 1; }
    .expanded-notes { margin-top: 14px; font-size: 12.5px; color: var(--text-muted); line-height: 1.6; background: var(--note-bg); padding: 10px 14px; border-radius: 6px; border-left: 2px solid; }
    .expanded-ex { padding: 12px 26px; display: flex; align-items: flex-start; gap: 14px; border-bottom: 1px solid var(--border-sub); }
    .expanded-ex:last-child { border-bottom: none; }
    .expanded-ex-left { flex: 1; }
    .ex-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
    .ex-name-row .expanded-ex-name { flex: 1 1 auto; min-width: 140px; }
    .ex-checkbox {
      width: 28px; height: 28px; border: 2px solid var(--checkbox-border); border-radius: 4px;
      background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; margin-right: 4px;
    }
    .ex-checkbox.checked { background: var(--accent); border-color: var(--accent); }
    .ex-checkbox.checked::after { content: '✓'; color: #fff; font-size: 12px; font-weight: bold; }
    .expanded-ex-name { font-size: 14px; }
    .expanded-ex-name.priority { font-weight: 600; color: var(--text); }
    .expanded-ex-name.normal { font-weight: 400; color: var(--text-muted); }
    .tag-chip { font-size: 9px; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; padding: 3px 8px; border-radius: 3px; text-transform: uppercase; border: 1px solid; display: inline-block; }
    .ex-note-inline { font-size: 11px; color: var(--note-color); font-style: italic; }
    .ex-sets-chip { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--sets-text); background: var(--sets-chip); padding: 8px 12px; border-radius: 5px; white-space: nowrap; flex-shrink: 0; min-height: 40px; display: flex; align-items: center; }
    .variant-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .variant-pill {
      font-size: 11px; font-family: 'DM Mono', monospace; padding: 7px 12px; border-radius: 14px;
      border: 1px solid var(--variant-inactive); background: transparent; color: var(--text-muted);
      cursor: pointer; transition: all 0.15s; white-space: nowrap; min-height: 32px;
    }
    .variant-pill:hover { border-color: var(--variant-active); color: var(--variant-active); }
    .variant-pill.active { background: var(--variant-active); border-color: var(--variant-active); color: #fff; font-weight: 600; }
    .variant-content { max-height: 500px; overflow: hidden; transition: all 0.3s ease; }
    .variant-content.collapsed { max-height: 0; padding: 0; }
    .variant-sets {
      background: var(--surface2); border-left: 2px solid var(--variant-inactive);
      padding: 8px 12px; border-radius: 4px; margin-top: 6px; margin-bottom: 8px;
    }
    .ex-tracking { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; }
    .set-block { border-left: 2px solid transparent; padding-left: 8px; margin-bottom: 8px; transition: all 0.2s; border-radius: 4px; }
    .set-block.done { border-left-color: var(--alt-text); background: var(--alt-bg); }
    .set-row { display: grid; grid-template-columns: 44px 1fr 1fr; gap: 8px; align-items: center; }
    .set-done {
      width: 44px; height: 44px; border: 2px solid var(--checkbox-border); border-radius: 8px;
      background: transparent; color: var(--text-faint); font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; padding: 0;
    }
    .set-done.done { background: var(--alt-text); border-color: var(--alt-text); color: #fff; }
    .set-block.done .track-input { opacity: 0.65; }
    .track-input { font-size: 16px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-family: 'DM Mono', monospace; min-height: 44px; width: 100%; }
    .track-input::placeholder { color: var(--text-faint); }
    .track-input:focus { outline: none; border-color: var(--accent); background: var(--bg); }
    .set-actions { display: flex; gap: 6px; }
    .set-btn { font-size: 12px; padding: 8px 12px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); border-radius: 4px; cursor: pointer; font-family: 'DM Mono', monospace; transition: all 0.15s; min-height: 40px; }
    .set-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg); }
    .form-btn { font-size: 10px; font-family: 'DM Mono', monospace; letter-spacing: 0.05em; padding: 4px 9px; background: rgba(224,90,43,0.1); border: 1px solid rgba(224,90,43,0.35); color: var(--accent); border-radius: 4px; cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; }
    .form-btn:hover { background: var(--accent); color: #fff; }
    .ex-notes-field { font-size: 11px; padding: 6px 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; font-family: 'DM Sans', sans-serif; resize: none; min-height: 35px; }
    .ex-notes-field:focus { outline: none; border-color: var(--accent); }
    .pr-indicator { color: #fbbf24; font-size: 13px; margin-left: 4px; font-weight: 600; }
    .pr-pending { color: var(--text-faint); font-size: 10px; margin-left: 4px; font-family: 'DM Mono', monospace; }
    .set-best { font-size: 10px; color: var(--text-faint); margin-top: 2px; font-family: 'DM Mono', monospace; }
    .ex-last { font-size: 11px; color: var(--alt-text); font-family: 'DM Mono', monospace; margin-top: 4px; }
    .ex-rest { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-top: 4px; }
    .ex-rest strong { color: var(--text); font-weight: 600; }
    .ss-chip { font-size: 9px; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; padding: 3px 8px; border-radius: 3px; text-transform: uppercase; display: inline-block; margin-left: 6px; background: rgba(224,90,43,0.12); color: var(--accent); border: 1px solid rgba(224,90,43,0.35); }
    .expanded-ex.ss-block { border-left: 3px solid var(--accent); }
    .day-save-btn {
      width: 100%; margin-top: 18px; padding: 14px; background: var(--accent); border: none; color: #fff;
      border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.05em; font-weight: 600;
      cursor: pointer; min-height: 48px; transition: opacity 0.15s;
    }
    .day-save-btn:hover { opacity: 0.88; }
    .save-toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 50;
      background: var(--alt-text); color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 13px;
      font-family: 'DM Sans', sans-serif; box-shadow: 0 6px 24px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.25s;
      pointer-events: none; max-width: 90vw; text-align: center;
    }
    .save-toast.show { opacity: 1; }
    .history-list { padding: 8px 12px; }
    .history-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border-sub); font-family: 'DM Mono', monospace; font-size: 11px; }
    .history-row:last-child { border-bottom: none; }
    .history-date { color: var(--text-faint); white-space: nowrap; }
    .history-sets { color: var(--text-muted); text-align: right; }
    .history-empty { font-size: 11px; color: var(--text-faint); font-style: italic; padding: 6px 0; }
    .notes-area { width: 100%; margin-top: 14px; padding: 10px 14px; background: var(--notes-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'DM Sans', sans-serif; resize: vertical; min-height: 60px; }
    .principles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 10px; margin-bottom: 24px; }
    .principle-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; border-left: 3px solid var(--accent); box-shadow: var(--shadow); }
    .principle-icon-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .principle-icon { font-size: 18px; }
    .principle-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }
    .principle-text { font-size: 13px; color: var(--text-muted); line-height: 1.65; }
    @media (max-width: 768px) {
      .expanded-ex { flex-direction: column; padding: 16px 14px; }
      .expanded-ex-left { width: 100%; }
      .ex-tracking { gap: 12px; }
      .container { padding: 24px 14px 120px; }
      .expanded-header { padding: 18px 14px; }
      .expanded-ex-name { font-size: 15px; }
      .day-card-header { padding: 14px 12px; }
      .day-card-body { padding: 12px 12px; }
      .expanded-notes { font-size: 13px; padding: 12px 14px; }
      .header { margin-bottom: 24px; }
    }
    @media (max-width: 480px) {
      .header { gap: 12px; flex-direction: column; }
      .header-title { font-size: clamp(36px, 8vw, 52px); }
      .header-sub { font-size: clamp(14px, 3vw, 20px); }
      .expanded-day-tag { font-size: 28px; }
      .stat-value { font-size: 20px; }
      .stat-label { font-size: 9px; }
      .stat-item { padding: 12px 6px; }
      .expanded-header { padding: 16px 12px; }
      .expanded-ex { padding: 14px 12px; }
      .container { padding: 20px 12px 120px; }
      .section-label { font-size: 10px; margin-bottom: 14px; }
      .notes-area { padding: 10px; font-size: 14px; }
      .principles-grid { grid-template-columns: 1fr; gap: 12px; }
      .principle-card { padding: 16px 14px; }
      .ex-tracking { gap: 10px; }
    }
  </style>
</head>
<body>
<div class="glow-layer"></div>
<div class="container" id="app">
  <div class="header">
    <div>
      <div class="header-mono">Hany Rambod · 5-Day · 2× Frequency</div>
      <div class="header-title">MAXIMUM <span>ROI</span></div>
      <div class="header-sub">PUSH · PULL ×2 · LEGS · ≤90 MIN · HEAVY + PUMP · SUPERSETS</div>
      <div class="header-desc">Every muscle 2×/week · heavy day + pump day · 4–7 exercises, sized to what each day covers · supersets + printed rest times · constant primaries, Week A/B accessories</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <button type="button" id="dataSyncBtn" class="toggle-btn" onclick="DataSync.syncNow()" title="Sync your workout data, PRs and history to/from the cloud across devices">☁ Sync</button>
      <button type="button" class="toggle-btn" onclick="DataSync.pullLatest()" title="Force-pull the cloud's current data onto THIS device, overwriting local — use this if Sync isn't bringing your progress in">⬇</button>
      <button type="button" id="dataTokenBtn" class="toggle-btn" onclick="DataSync.setToken()" title="Set or change the GitHub token used for cloud sync (stored only in this browser)">⚙</button>
      <button class="toggle-btn" id="themeToggle" onclick="toggleTheme()">
        <span id="toggleIcon">☀️</span> <span id="toggleLabel">Light mode</span>
      </button>
    </div>
  </div>
  <div class="stats-bar" id="statsBar"></div>
  <div class="tab-row" id="tabRow"></div>
  <div id="contentArea"></div>
</div>

<script src="../js/sync.js"></script>
<script>
(function() {
  // Each exercise: { name, sets, tag, priority, note, rest, ss?, variants[], altB? }
  // `altB` is the Week B swap (accessories rotate; bold primaries stay constant for overload).
  // `ss` groups consecutive exercises into a superset (do back-to-back). `rest` is the target rest time.
  const days = [
    {
      num: "01",
      tag: "PUSH A · CHEST",
      focus: "Heavy chest overload — lean and focused",
      type: "push",
      color: "#0ea5e9",

    { icon: "🏋️", label: "Heavy + Pump", text: "Each muscle's two weekly sessions differ: a HEAVY day (5–8 reps, full rest, lean exercise count — just the compounds + FST-7, no filler isolation) and a PUMP day (10–20 reps, short rest/supersets, the full isolation workload for that muscle). Isolation work lives on one day per muscle, not both — so no session ends up carrying more than its share." },
    { icon: "🔒", label: "Constant Primaries", text: "Bold primaries (Incline BB, Weighted Pull-up, OHP, BB Row, Squat, Stiff-Leg DL, RDL) never change — so you can add weight/reps every week. Only accessories rotate Week A/B (a constant lift should never have a Week-B swap)." },
    { icon: "🔀", label: "Week A / B Rotation", text: "Flip the A↔B toggle each week: accessories swap to a new angle/grip for complete development and joint relief, while your trackable lifts stay fixed." },
    { icon: "⚡", label: "One FST-7 Per Muscle", text: "Hany Rambod's FST-7: a single finisher of 7 sets × 10–15 reps, 30–45s rest. One per main muscle per session — chasing the pump and fascia stretch, not endless junk volume. Progress it like everything else, but gated: only add weight once you hit clean reps across all 7 sets — never grind the weight up mid-set at the cost of form." },
    { icon: "⏱️", label: "90-Minute Cap", text: "~6–8 exercises / ~18–24 working sets per day, redistributed across both weekly sessions so weekly volume stays high while each session fits in 90 min. Non-competing accessories are supersetted; every exercise prints its target rest time so you stay on the clock." },
    { icon: "🛟", label: "Deload Every 6–8 Weeks", text: "Progress primaries by double-progression: hit the top of the rep range on every set, then add weight. When bar speed drops and PRs stall (usually 6–8 weeks), deload — halve the working sets or drop load ~40% for one week — then resume. The A/B rotation is variety, not recovery; as a natural, a real deload is what lets you keep adding load instead of grinding into a stall." }
  ];


  let activeDayIndex = null;
  let currentTab = "split";
  const themeKey = "gym5day_theme";
  let isDark = localStorage.getItem(themeKey) === "dark"; // default = light
  let currentWeek = "A";

  const storageKey = "gym5day_data";
  const navStateKey = "gym5day_nav";
  const historyKey = "gym5day_history_v1";
  let userData;
  try { userData = JSON.parse(localStorage.getItem(storageKey)) || {}; }
  catch (e) { userData = {}; }

  // Cloud sync (shared module in sync.js): all gym5day localStorage keys.
  if (window.DataSync) {
    DataSync.init({
      appId: 'gym5day',
      keys: ['gym5day_data', 'gym5day_nav', 'gym5day_pr_v1', 'gym5day_history_v1', 'gym5day_theme'],
      versionLabel: 'Gym 5-Day',
      autoPush: true,                                   // upload a few seconds after each edit
      noiseKeys: ['gym5day_nav', 'gym5day_theme']       // view state, not data
    });
    DataSync.autoSync();   // runs at most once / 24h if a token is set
  }

  // Resolve the exercise shown for the active week (Week B swaps to altB when present).
  function resolveEx(ex) {
    return (currentWeek === "B" && ex.altB) ? { ...ex, ...ex.altB } : ex;
  }

  function saveNavState() {
    localStorage.setItem(navStateKey, JSON.stringify({ activeDayIndex, currentTab, currentWeek }));
  }
  function loadNavState() {
    try {
      const saved = JSON.parse(localStorage.getItem(navStateKey) || '{}');
      if (saved.activeDayIndex !== null && saved.activeDayIndex !== undefined) activeDayIndex = saved.activeDayIndex;
      if (saved.currentTab) currentTab = saved.currentTab;
      if (saved.currentWeek) currentWeek = saved.currentWeek;
    } catch (e) {}
  }

  function saveUserData() {
    localStorage.setItem(storageKey, JSON.stringify(userData));
  }

  function getCompleted(dayIdx) {
    return userData[dayIdx]?.completed || [];
  }
  function setCompleted(dayIdx, exIdx, value) {
    if (!userData[dayIdx]) userData[dayIdx] = {};
    if (!userData[dayIdx].completed) userData[dayIdx].completed = [];
    if (value) {
      if (!userData[dayIdx].completed.includes(exIdx)) userData[dayIdx].completed.push(exIdx);
    } else {
      userData[dayIdx].completed = userData[dayIdx].completed.filter(i => i !== exIdx);
    }
    saveUserData();
  }

  function getNotes(dayIdx) {
    return userData[dayIdx]?.notes || "";
  }
  function setNotes(dayIdx, text) {
    if (!userData[dayIdx]) userData[dayIdx] = {};
    userData[dayIdx].notes = text;
    saveUserData();
  }

  // Per-set logs are namespaced by week ONLY for exercises that actually swap (altB) —
  // those are genuinely different lifts in Week A vs B, so their logs must stay separate.
  // Exercises with no altB are the same lift either week, so they share one log/variant choice
  // instead of artificially splitting your data in two every time you flip the toggle.
  function exKey(dayIdx, exIdx) {
    const ex = days[dayIdx]?.exercises[exIdx];
    const weekPart = (ex && ex.altB) ? currentWeek : 'X';
    return `${weekPart}-${dayIdx}-${exIdx}`;
  }
  function getExerciseData(dayIdx, exIdx) {
    const key = exKey(dayIdx, exIdx);
    return userData[key] || { sets: [{ weight: "", reps: "" }], notes: "", variant: 0 };
  }
  function setExerciseSets(dayIdx, exIdx, setsArray) {
    const key = exKey(dayIdx, exIdx);
    if (!userData[key]) userData[key] = { sets: [], notes: "", variant: 0 };
    userData[key].sets = setsArray;
    saveUserData();
  }
  function setExerciseSetRep(dayIdx, exIdx, setIdx, field, value) {
    const key = exKey(dayIdx, exIdx);
    if (!userData[key]) userData[key] = { sets: [{ weight: "", reps: "" }], notes: "", variant: 0 };
    if (!userData[key].sets[setIdx]) userData[key].sets[setIdx] = { weight: "", reps: "" };
    userData[key].sets[setIdx][field] = value;
    saveUserData();
  }
  function setExerciseNotes(dayIdx, exIdx, text) {
    const key = exKey(dayIdx, exIdx);
    if (!userData[key]) userData[key] = { sets: [{ weight: "", reps: "" }], notes: "", variant: 0 };
    userData[key].notes = text;
    saveUserData();
  }
  // Switching variants swaps in that variant's own last-logged sets (or blanks if it's never
  // been done before) — each variant tracks its own weights/reps/PRs, not the slot's generic scratch data.
  function setVariant(dayIdx, exIdx, variantIdx) {
    const key = exKey(dayIdx, exIdx);
    if (!userData[key]) userData[key] = { sets: [{ weight: "", reps: "" }], notes: "", variant: 0 };
    userData[key].variant = variantIdx;
    const exName = getExerciseName(dayIdx, exIdx);
    const lastHist = getLastHistory(exName);
    userData[key].sets = (lastHist && lastHist.sets && lastHist.sets.length)
      ? lastHist.sets.map(s => ({ weight: s.weight, reps: s.reps, done: false }))
      : [{ weight: "", reps: "" }];
    saveUserData();
  }
  function addSet(dayIdx, exIdx) {
    const exData = getExerciseData(dayIdx, exIdx);
    const prev = exData.sets[exData.sets.length - 1] || { weight: "", reps: "" };
    exData.sets.push({ weight: prev.weight || "", reps: prev.reps || "", done: false }); // prefill from previous set
    setExerciseSets(dayIdx, exIdx, exData.sets);
    window.renderContent();
  }
  function removeSet(dayIdx, exIdx) {
    const exData = getExerciseData(dayIdx, exIdx);
    if (exData.sets.length > 1) {
      exData.sets.pop();
      setExerciseSets(dayIdx, exIdx, exData.sets);
      window.renderContent();
    }
  }
  function _toggleSetDoneData(dayIdx, exIdx, setIdx) {
    const key = exKey(dayIdx, exIdx);
    if (!userData[key]) userData[key] = { sets: [{ weight: "", reps: "" }], notes: "", variant: 0 };
    if (!userData[key].sets[setIdx]) userData[key].sets[setIdx] = { weight: "", reps: "" };
    userData[key].sets[setIdx].done = !userData[key].sets[setIdx].done;
    saveUserData();
    return userData[key].sets[setIdx].done;
  }

  const prStorageKey = 'gym5day_pr_v1';
  function getPRData() {
    try {
      return JSON.parse(localStorage.getItem(prStorageKey) || '{}');
    } catch {
      return {};
    }
  }
  function savePRData(data) {
    localStorage.setItem(prStorageKey, JSON.stringify(data));
  }
  // The exercise "identity" for PRs/history is the selected variant, not the base slot —
  // so switching variants tracks a separate PR/history line per variant.
  function getExerciseName(dayIdx, exIdx) {
    const ex = days[dayIdx]?.exercises[exIdx];
    if (!ex) return '';
    const resolved = resolveEx(ex);
    const variantOptions = [{ name: resolved.name }, ...(resolved.variants || [])];
    const variantIdx = getExerciseData(dayIdx, exIdx).variant || 0;
    return (variantOptions[variantIdx] || variantOptions[0]).name;
  }
  function getBestForExercise(dayIdx, exIdx) {
    const prData = getPRData();
    const exName = getExerciseName(dayIdx, exIdx);
    const key = exName;
    const best = prData[key];
    return best ? { weight: parseFloat(best.weight) || 0, reps: parseInt(best.reps) || 0, date: best.date } : null;
  }
  function isPR(dayIdx, exIdx, weight, reps) {
    const w = parseFloat(weight) || 0;
    const r = parseInt(reps) || 0;
    if (w === 0 || r === 0) return false;
    const best = getBestForExercise(dayIdx, exIdx);
    if (!best) return true;
    return w > best.weight || (w === best.weight && r > best.reps);
  }
  function updatePRIfNeeded(dayIdx, exIdx, weight, reps) {
    const w = parseFloat(weight) || 0;
    const r = parseInt(reps) || 0;
    if (w === 0 || r === 0) return;
    if (isPR(dayIdx, exIdx, w, r)) {
      const prData = getPRData();
      const exName = getExerciseName(dayIdx, exIdx);
      prData[exName] = { weight: w.toString(), reps: r.toString(), date: new Date().toISOString().split('T')[0] };
      savePRData(prData);
    }
  }
  // A set "holds the record" when its weight/reps equal the stored PR (i.e. it's what set it).
  function isRecordSet(dayIdx, exIdx, weight, reps) {
    const w = parseFloat(weight) || 0;
    const r = parseInt(reps) || 0;
    if (w === 0 || r === 0) return false;
    const best = getBestForExercise(dayIdx, exIdx);
    return !!best && w === best.weight && r === best.reps;
  }
  // Commit a PR from one set — called ONLY when its green tick is turned on, so a mistyped
  // weight can never become a PR unless you actually confirm the set. Remembers the prior
  // record + which set set it so un-ticking can undo it. Returns true if a new PR was set.
  function commitPRFromSet(dayIdx, exIdx, setIdx, weight, reps) {
    const w = parseFloat(weight) || 0;
    const r = parseInt(reps) || 0;
    if (w === 0 || r === 0) return false;
    if (!isPR(dayIdx, exIdx, w, r)) return false;
    const prData = getPRData();
    const exName = getExerciseName(dayIdx, exIdx);
    const cur = prData[exName];
    const prev = cur ? { weight: cur.weight, reps: cur.reps, date: cur.date } : null;
    prData[exName] = {
      weight: w.toString(), reps: r.toString(), date: new Date().toISOString().split('T')[0],
      prev, src: { key: exKey(dayIdx, exIdx), setIdx }
    };
    savePRData(prData);
    return true;
  }
  // Undo a PR when its source set's tick is turned off (restores the prior record, if any).
  function revertPRFromSet(dayIdx, exIdx, setIdx) {
    const prData = getPRData();
    const exName = getExerciseName(dayIdx, exIdx);
    const rec = prData[exName];
    if (!rec || !rec.src) return;
    if (rec.src.key === exKey(dayIdx, exIdx) && rec.src.setIdx === setIdx) {
      if (rec.prev) prData[exName] = rec.prev; else delete prData[exName];
      savePRData(prData);
    }
  }
  // Once a day is saved to history its PRs are permanent — drop the undo markers so a later
  // tick/un-tick of the same set can't revert a record you've already banked.
  function lockPR(exName) {
    const prData = getPRData();
    if (prData[exName] && (prData[exName].prev !== undefined || prData[exName].src !== undefined)) {
      delete prData[exName].prev;
      delete prData[exName].src;
      savePRData(prData);
    }
  }

  // ---- History / progression log ----
  function getHistoryData() {
    try { return JSON.parse(localStorage.getItem(historyKey) || '{}'); } catch { return {}; }
  }
  function saveHistoryData(data) { localStorage.setItem(historyKey, JSON.stringify(data)); }
  function getExerciseHistory(exName) {
    const all = getHistoryData();
    return (all[exName] || []).slice().sort((a, b) => (a.date < b.date ? 1 : -1)); // newest first
  }
  function getLastHistory(exName) {
    const h = getExerciseHistory(exName);
    return h.length ? h[0] : null;
  }
  function topSetOf(sets) {
    let best = null;
    (sets || []).forEach(s => {
      const w = parseFloat(s.weight) || 0, r = parseInt(s.reps) || 0;
      if (w === 0 && r === 0) return;
      if (!best || w > best.w || (w === best.w && r > best.r)) best = { w, r };
    });
    return best;
  }
  function saveDayToHistory(dayIdx) {
    const day = days[dayIdx];
    const today = new Date().toISOString().split('T')[0];
    const all = getHistoryData();
    let saved = 0;
    day.exercises.forEach((baseEx, exIdx) => {
      const exName = getExerciseName(dayIdx, exIdx);
      const exData = getExerciseData(dayIdx, exIdx);
      const sets = (exData.sets || [])
        .filter(s => (s.weight && s.weight !== "") || (s.reps && s.reps !== ""))
        .map(s => ({ weight: s.weight, reps: s.reps }));
      if (!sets.length) return;
      // Only confirmed (green-tick ✓) sets can set a PR — catches a value edited up after ticking.
      // Un-ticked sets are never counted, so a wrong number left in the box can't become a PR.
      exData.sets.forEach(s => { if (s.done) updatePRIfNeeded(dayIdx, exIdx, s.weight, s.reps); });
      lockPR(exName);
      if (!all[exName]) all[exName] = [];
      const last = all[exName][all[exName].length - 1];
      if (last && last.date === today) last.sets = sets; // replace same-day entry
      else all[exName].push({ date: today, sets });
      saved++;
      // clear done flags for next session, keep weights/reps as reference
      exData.sets.forEach(s => { s.done = false; });
      setExerciseSets(dayIdx, exIdx, exData.sets);
    });
    saveHistoryData(all);
    return saved;
  }

  function renderExerciseHistory(exName) {
    const hist = getExerciseHistory(exName);

    return `<div class="history-list">${hist.slice(0, 12).map(h => {
      const sets = (h.sets || []).map(s => `${s.weight||'–'}×${s.reps||'–'}`).join('  ');

    }).join('')}</div>`;
  }

  // Update only the per-set status lines for one exercise (no input rebuild → keyboard stays open).
  function refreshExerciseStatus(dayIdx, exIdx) {

      const bestText = best ? `Best: ${best.weight}kg × ${best.reps}` : 'No PR yet';
      const hasVals = set.weight && set.reps;
      let badge = '';
      if (set.done && hasVals && isRecordSet(dayIdx, exIdx, set.weight, set.reps)) {

      } else if (!set.done && hasVals && isPR(dayIdx, exIdx, set.weight, set.reps)) {
        badge = '<span class="pr-pending">↑ potential PR</span>';          // typed only — not stored yet

      el.innerHTML = `<span class="set-best">${bestText}</span>${badge}`;
    });
  }

  window.revertPRFromSet = revertPRFromSet;
  window.updatePRIfNeeded = updatePRIfNeeded;

  function renderStatsBar() {

  function renderSplitGrid() {

    days.forEach((day, i) => {

            const lastHist = window.getLastHistory(variantName);
            const lastTop = lastHist ? window.topSetOf(lastHist.sets) : null;
            const safeName = variantName.replace(/'/g,"\\'");
            return `
              <div class="expanded-ex${ex.ss?' ss-block':''}" style="border-bottom:${i<day.exercises.length-1?'1px solid var(--border-sub)':'none'};">
                <div class="expanded-ex-left" style="width: 100%;">

                  ${ex.variants && ex.variants.length > 0 ? `
                    <div class="variant-pills">

                    </div>
                  ` : ''}

                  <div class="ex-tracking">
                    ${exData.sets.map((set, setIdx) => {
                      const best = window.getBestForExercise(index, i);
                      const bestText = best ? `Best: ${best.weight}kg × ${best.reps}` : 'No PR yet';
                      const hasVals = set.weight && set.reps;
                      // ⭐ PR only shows once the set is ticked done and it holds the record;
                      // while typing you get a muted "potential PR" hint — nothing is stored yet.
                      const badge = (set.done && hasVals && window.isRecordSet(index, i, set.weight, set.reps))
                        ? '<span class="pr-indicator">⭐ PR</span>'
                        : (!set.done && hasVals && window.isPR(index, i, set.weight, set.reps))
                          ? '<span class="pr-pending">↑ potential PR</span>'
                          : '';
                      return `
                      <div class="set-block${set.done?' done':''}" id="setblock-${index}-${i}-${setIdx}">
                        <div class="set-row">
                          <button class="set-done${set.done?' done':''}" onclick="window.toggleSetDone(this,${index},${i},${setIdx})" title="Mark set done — confirms it & logs any PR">${set.done?'✓':(setIdx+1)}</button>
                          <input type="text" inputmode="decimal" class="track-input" placeholder="kg" value="${set.weight}" oninput="window.updateSetRep(${index},${i},${setIdx},'weight',this.value)">
                          <input type="text" inputmode="numeric" class="track-input" placeholder="reps" value="${set.reps}" oninput="window.updateSetRep(${index},${i},${setIdx},'reps',this.value)">
                        </div>
                        <div class="set-status" data-day="${index}" data-ex="${i}" data-set="${setIdx}" style="display:flex;justify-content:space-between;align-items:center;padding:2px 0 4px 52px;">
                          <span class="set-best">${bestText}</span>
                          ${badge}
                        </div>
                      </div>
                    `;
                    }).join('')}
                    <div class="set-actions">
                      <button class="set-btn" onclick="window.addSet(${index},${i})">+ Set</button>
                      <button class="set-btn" onclick="window.removeSet(${index},${i})">− Set</button>
                    </div>
                    <textarea class="ex-notes-field" placeholder="Notes (kept for next time)" oninput="window.updateExNote(${index},${i},this.value)">${exData.notes}</textarea>
                  </div>
                </div>
                <div class="ex-sets-chip">${variantSets}</div>
              </div>`;
          }).join('')}
        </div>
        <div style="padding:0 26px 22px;">
          <textarea class="notes-area" id="dayNotes" placeholder="Day notes...">${notesText}</textarea>
          <button class="day-save-btn" onclick="window.finishDay(${index})">✓ FINISH &amp; SAVE TO HISTORY</button>
        </div>
      </div>
    `;
    return html;
  }

  function renderPrinciples() {
    return `
      <div class="section-label">Hany Rambod · Hypertrophy Principles <span class="line"></span></div>
      <div class="principles-grid">
        ${principles.map(p => `
          <div class="principle-card">
            <div class="principle-icon-row"><span class="principle-icon">${p.icon}</span><span class="principle-label">${p.label}</span></div>
            <div class="principle-text">${p.text}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  window.toggleCheckbox = function(el) {
    const dayIdx = parseInt(el.dataset.day);
    const exIdx = parseInt(el.dataset.ex);
    const currentlyChecked = getCompleted(dayIdx).includes(exIdx);
    setCompleted(dayIdx, exIdx, !currentlyChecked);
    el.classList.toggle('checked', !currentlyChecked);
  };

  window.updateSetRep = function(dayIdx, exIdx, setIdx, field, value) {
    window.setExerciseSetRep(dayIdx, exIdx, setIdx, field, value);
    // Typing NEVER stores a PR — that only happens when you tick the set done (toggleSetDone).
    // While typing you just get a muted "potential PR" hint. In-place status update only —
    // keeps the mobile keyboard open.
    window.refreshExerciseStatus(dayIdx, exIdx);
  };

  window.updateExNote = function(dayIdx, exIdx, value) {
    window.setExerciseNotes(dayIdx, exIdx, value);
  };

  // toggleSetDone data fn is defined above; here is the DOM handler used by the set-number button.
  window.toggleSetDone = function(el, dayIdx, exIdx, setIdx) {
    const done = _toggleSetDoneData(dayIdx, exIdx, setIdx);
    el.classList.toggle('done', done);
    el.textContent = done ? '✓' : (setIdx + 1);
    const block = document.getElementById(`setblock-${dayIdx}-${exIdx}-${setIdx}`);
    if (block) block.classList.toggle('done', done);
    // The green tick is the gate: ticking confirms the set and logs a PR if it beats your best;
    // un-ticking undoes that PR. This is why a mistyped weight can't sneak into your records.
    const set = window.getExerciseData(dayIdx, exIdx).sets[setIdx] || { weight: "", reps: "" };
    if (done) {
      if (window.commitPRFromSet(dayIdx, exIdx, setIdx, set.weight, set.reps)) {
        showToast(`⭐ New PR: ${parseFloat(set.weight)||0}kg × ${parseInt(set.reps)||0}`);
      }
    } else {
      window.revertPRFromSet(dayIdx, exIdx, setIdx);
    }
    window.refreshExerciseStatus(dayIdx, exIdx);
  };

  window.toggleHistory = function(el) {
    const name = el.dataset.name;
    const panel = el.closest('.expanded-ex-left').querySelector(`.variant-content[data-history="${CSS.escape(name)}"]`);
    if (panel) panel.classList.toggle('collapsed');
  };

  window.finishDay = function(dayIdx) {
    const n = window.saveDayToHistory(dayIdx);
    window.renderContent();
    showToast(n > 0 ? `✓ Saved ${n} exercise${n>1?'s':''} to history` : 'Nothing logged yet — enter some sets first');
  };

  function showToast(msg) {
    let t = document.getElementById('saveToast');
    if (!t) { t = document.createElement('div'); t.id = 'saveToast'; t.className = 'save-toast'; document.body.appendChild(t); }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function bindEvents() {
    document.querySelectorAll(".day-card:not(.rest)").forEach(card => {
      card.addEventListener("click", function() {
        const idx = parseInt(this.dataset.dayIndex);
        if (!isNaN(idx) && days[idx].type !== "rest") {
          activeDayIndex = idx;
          saveNavState();
          renderContent();
          window.scrollTo({top:0, behavior:"smooth"});
        }
      });
    });

    const notesArea = document.getElementById("dayNotes");
    if (notesArea) {
      notesArea.addEventListener("input", function() {
        if (activeDayIndex !== null) setNotes(activeDayIndex, this.value);
      });
    }
  }

  window.ytForm = function(name) {
    const q = encodeURIComponent(name + " proper form technique");
    window.open("https://www.youtube.com/results?search_query=" + q, "_blank", "noopener");
  };

  window._toggleWeek = function() {
    currentWeek = currentWeek === "A" ? "B" : "A";
    saveNavState();
    renderStatsBar();
    renderTabs();
    renderContent();
  };

  window._selectTab = function(tab) {
    currentTab = tab;
    activeDayIndex = null;
    saveNavState();
    renderTabs();
    renderContent();
  };
  window._goBack = function() {
    activeDayIndex = null;
    saveNavState();
    renderContent();
    window.scrollTo({top:0, behavior:"smooth"});
  };
  function applyTheme() {
    document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    document.getElementById("toggleIcon").textContent = isDark ? "☀️" : "🌙";
    document.getElementById("toggleLabel").textContent = isDark ? "Light mode" : "Dark mode";
  }
  window.toggleTheme = function() {
    isDark = !isDark;
    localStorage.setItem(themeKey, isDark ? "dark" : "light");
    applyTheme();
    renderContent();
    renderTabs();
  };

  function init() {
    loadNavState();
    applyTheme();
    renderStatsBar();
    renderTabs();
    renderContent();
  }
  init();
})();
</script>
<script src="../js/back-button.js"></script>
</body>
</html>
