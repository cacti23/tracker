<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070710">
<title>Habits</title>
<link rel="manifest" href="habits-manifest.json">
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070710;
    --surface: #0f0f1a;
    --surface2: #18182a;
    --border: rgba(255, 255, 255, 0.07);
    --border-sub: rgba(255, 255, 255, 0.04);
    --text: #dde0ee;
    --text-muted: #77778a;
    --text-faint: #44445a;
    --text-faintest: #33334a;
    --accent: #e05a2b;
    --toggle-bg: #1a1a2a;
    --toggle-border: rgba(255, 255, 255, 0.1);
    --heading-color: #ffffff;
    --sub-heading-color: #333350;
    --shadow: none;
    --dot-empty: #1c1c2c;
    --dot-empty-border: rgba(255,255,255,0.08);
    --modal-overlay: rgba(0,0,0,0.6);
  }
  [data-theme="light"] {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --surface2: #ebebf0;
    --border: rgba(0, 0, 0, 0.08);
    --border-sub: rgba(0, 0, 0, 0.05);
    --text: #1a1a28;
    --text-muted: #555568;
    --text-faint: #999aaa;
    --text-faintest: #bbbbcc;
    --accent: #e05a2b;
    --toggle-bg: #ffffff;
    --toggle-border: rgba(0, 0, 0, 0.1);
    --heading-color: #111122;
    --sub-heading-color: #c0c0d0;
    --shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
    --dot-empty: #eceef4;
    --dot-empty-border: rgba(0,0,0,0.06);
    --modal-overlay: rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif;
    transition: background 0.3s, color 0.3s; padding-bottom: 2rem;
  }
  .glow-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse 55% 35% at 15% 8%, rgba(224,90,43,0.08) 0%, transparent 65%),
                radial-gradient(ellipse 45% 35% at 85% 85%, rgba(14,165,233,0.06) 0%, transparent 65%);
  }
  .container { max-width: 720px; margin: 0 auto; padding: 32px 16px 100px; position: relative; z-index: 1;
    padding-top: max(32px, env(safe-area-inset-top)); padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right)); padding-bottom: max(100px, calc(100px + env(safe-area-inset-bottom))); }
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    margin-bottom: 28px; border-left: 3px solid var(--accent); padding-left: 20px; }
  .header-mono { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  .header-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(40px,9vw,64px); line-height: 0.9; color: var(--heading-color); }
  .header-title span { color: var(--accent); }
  .btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .toggle-btn {
    cursor: pointer; border: 1px solid var(--toggle-border); background: var(--toggle-bg);
    border-radius: 8px; padding: 10px 14px; color: var(--text-muted);
    font-size: 12px; font-family: 'DM Mono', monospace; letter-spacing: 0.07em;
    display: flex; align-items: center; gap: 7px; transition: all 0.2s;
  }
  .toggle-btn:hover { color: var(--text); border-color: var(--accent); }
  .toggle-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  /* Token is set on this device — sync is live, not just a dormant button. */
  .toggle-btn.ds-token-set { border-color: #3dd68c; color: #3dd68c; background: rgba(61,214,140,0.12); }
  .toggle-btn.ds-token-set:hover { border-color: #3dd68c; color: #3dd68c; }

  .view-row { display: flex; gap: 6px; margin-bottom: 20px; background: var(--surface2); border-radius: 10px; padding: 4px; width: fit-content; }
  .view-btn { border: none; background: transparent; color: var(--text-muted); font-family: 'DM Mono', monospace;
    font-size: 11px; letter-spacing: 0.06em; padding: 8px 14px; border-radius: 7px; cursor: pointer; transition: all 0.15s; }
  .view-btn.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

  .habit-card { background: var(--surface); border: 1px solid var(--border); border-left-width: 4px; border-left-style: solid; border-radius: 14px; padding: 16px 16px 14px; margin-bottom: 12px; }
  .habit-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .habit-icon { flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 19px; line-height: 1; }
  .habit-name { font-size: 15px; font-weight: 500; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stats-row { display: flex; gap: 18px; margin-bottom: 14px; padding-left: 0; flex-wrap: wrap; }
  .stat-item { display: flex; align-items: baseline; gap: 5px; }
  .stat-icon { font-size: 11px; }
  .stat-value { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; color: var(--text); }
  .stat-label { font-family: 'DM Mono', monospace; font-size: 8.5px; letter-spacing: 0.06em; color: var(--text-faint); }
  @media (max-width: 420px) { .stats-row { gap: 12px; padding-left: 0; } }
  .habit-actions { display: flex; gap: 2px; flex-shrink: 0; }
  .habit-body { display: flex; align-items: center; gap: 8px; margin-top: -6px; }
  .habit-main { flex: 1; min-width: 0; }
  .mon { flex-shrink: 0; width: 84px; display: flex; flex-direction: column; align-items: center; position: relative; }
  .mon img { position: relative; width: 76px; height: 76px; object-fit: contain; }
  .mon.bounce img { animation: mon-bounce 0.5s ease; }
  .mon.evolve img { animation: mon-evolve 1.1s ease; }
  @keyframes mon-bounce { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-7px) scale(1.12); } 70% { transform: translateY(0) scale(0.95); } }
  @keyframes mon-evolve { 0%,100% { transform: scale(1); filter: none; } 25%,75% { transform: scale(1.35); filter: brightness(3); } 50% { transform: scale(1.5); filter: brightness(0) invert(1); } }
  .toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--surface); color: var(--text); border: 1px solid var(--accent); border-radius: 999px; padding: 10px 18px; font-size: 13px; z-index: 60; box-shadow: 0 6px 24px rgba(0,0,0,0.35); max-width: calc(100vw - 32px); text-align: center; }
  @media (hover: none) { .drag-handle { display: none; } }
    .icon-btn { border: none; background: transparent; color: var(--text-faint); cursor: pointer; padding: 5px 6px; font-size: 13px; border-radius: 6px; transition: all 0.15s; line-height: 1; }
  .icon-btn:hover { color: var(--text); background: var(--surface2); }
  .icon-btn:disabled { opacity: 0.25; cursor: default; }
  .icon-btn:disabled:hover { background: transparent; color: var(--text-faint); }

  .dots-row { display: flex; gap: 5px; flex-wrap: wrap; }
  .dots-row.dots-30 { gap: 4px; }
  .dot {
    width: 22px; height: 22px; border-radius: 6px; background: var(--dot-empty); border: 1px solid var(--dot-empty-border);
    cursor: pointer; flex-shrink: 0; transition: transform 0.1s; position: relative;
  }
  .dots-30 .dot { width: 15px; height: 15px; border-radius: 4px; }
  .dot:hover { transform: scale(1.12); }
  .dot.today { box-shadow: 0 0 0 2px var(--accent) inset; }
  .dot.future { cursor: default; opacity: 0.35; }
  .dot.future:hover { transform: none; }
  .dot-label { font-family: 'DM Mono', monospace; font-size: 8.5px; color: var(--text-faintest); text-align: center; margin-top: 3px; }
  .dots-wrap { display: flex; flex-direction: column; }

  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav-title { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: var(--text-muted); }
  .cal-nav button { border: none; background: var(--surface2); color: var(--text-muted); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .cal-nav button:hover { color: var(--text); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-dow { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-faintest); text-align: center; padding-bottom: 3px; }
  .cal-cell { aspect-ratio: 1; border-radius: 6px; background: var(--dot-empty); border: 1px solid var(--dot-empty-border); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--text-faint); transition: transform 0.1s; }
  .cal-cell:hover { transform: scale(1.08); }
  .cal-cell.empty { visibility: hidden; cursor: default; }
  .cal-cell.today { box-shadow: 0 0 0 2px var(--accent) inset; }
  .cal-cell.future { cursor: default; opacity: 0.35; }
  .cal-cell.future:hover { transform: none; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-faint); }
  .empty-state-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
  .empty-state p { font-size: 13px; }

  /* reorder handle drag */
  .habit-card[draggable="true"] { cursor: grab; }
  .habit-card.dragging { opacity: 0.4; }
  .drag-handle { cursor: grab; color: var(--text-faintest); padding: 0 2px; font-size: 13px; }

  /* modal */
  .modal-overlay { position: fixed; inset: 0; background: var(--modal-overlay); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; width: 100%; max-width: 360px; }
  .modal h3 { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--heading-color); letter-spacing: 0.02em; margin-bottom: 16px; }
  .modal label { display: block; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; margin-top: 14px; }
  .modal input[type="text"] {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
  }
  .modal input[type="text"]:focus { outline: none; border-color: var(--accent); }
  .slot-header { font-family: 'Bebas Neue', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--heading-color); margin: 28px 0 12px 2px; }
  .slot-header:first-child { margin-top: 4px; }
  .slot-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .slot-chip { border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); border-radius: 999px; padding: 6px 11px; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .slot-chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .preview-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .preview-badge { font-size: 22px; line-height: 1; flex-shrink: 0; }
  .preview-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .preview-hint { font-size: 11px; color: var(--text-faint); }
  .modal-actions { display: flex; gap: 8px; margin-top: 22px; }
  .modal-actions .toggle-btn { flex: 1; justify-content: center; }

  @media (max-width: 480px) {
    .dot { width: 18px; height: 18px; }
    .dots-30 .dot { width: 12px; height: 12px; }
  }
</style>
</head>
<body>
<div class="glow-layer"></div>
<div class="container" id="app">
  <div class="header">
    <div>
      <div class="header-mono">Daily Practice</div>
      <div class="header-title">HABIT<span>S</span></div>
    </div>
    <div class="btn-row">
      <button type="button" id="dataSyncBtn" class="toggle-btn" onclick="DataSync.syncNow()" title="Sync your habits to/from the cloud across devices">☁ Sync</button>
      <button type="button" class="toggle-btn" onclick="DataSync.pullLatest()" title="Force-pull the cloud's current data onto THIS device, overwriting local — use this if Sync isn't bringing your progress in">⬇</button>
      <button type="button" class="toggle-btn" onclick="DataSync.setToken()" title="Set or change the GitHub token used for cloud sync (stored only in this browser)">⚙</button>
      <button type="button" class="toggle-btn" id="monToggle" onclick="toggleMons()" title="Show or hide the Pokémon">🎮</button>
      <button class="toggle-btn" id="themeToggle" onclick="toggleTheme()">
        <span id="toggleIcon">☀️</span> <span id="toggleLabel">Light mode</span>
      </button>
      <button class="toggle-btn primary" onclick="openAddModal()">+ Habit</button>
    </div>
  </div>

  <div class="view-row" id="viewRow"></div>
  <div id="habitList"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">New Habit</h3>
    <label>Name</label>
    <input type="text" id="habitNameInput" placeholder="e.g. Read 20 pages" maxlength="60">
    <label>When</label>
    <div class="slot-chips" id="slotChips"></div>
    <div class="preview-row" id="previewRow">
      <span class="preview-badge" id="previewBadge"></span>
      <span class="preview-color" id="previewColor"></span>
      <span class="preview-hint">Icon &amp; color are picked automatically</span>
    </div>
    <div class="modal-actions">
      <button class="toggle-btn" onclick="closeModal()">Cancel</button>
      <button class="toggle-btn primary" onclick="saveHabit()">Save</button>
    </div>
  </div>
</div>

<script src="../js/sync.js"></script>
<script>
(function() {
  const STORAGE_KEY = 'habits_data_v1';
  const themeKey = 'habits_theme';
  let isDark = localStorage.getItem(themeKey) === 'dark'; // default = light

  const PALETTE = [
    '#e05a2b', '#e0b52b', '#4ade80', '#2bb4e0', '#5a7ce0',
    '#a25ae0', '#e02b7c', '#2be0a0', '#e0752b', '#888899'
  ];

  // keyword -> emoji, checked against the habit name (first match wins)
  const EMOJI_KEYWORDS = [
    [['read', 'book'], '📚'], [['water', 'hydrat'], '💧'], [['gym', 'workout', 'lift', 'exercise'], '🏋️'],
    [['run', 'jog'], '🏃'], [['walk', 'step'], '🚶'], [['meditat', 'mindful'], '🧘'],
    [['sleep', 'bed'], '😴'], [['journal', 'diary', 'write', 'writing'], '📓'],
    [['code', 'program', 'dsa', 'leetcode'], '💻'], [['study', 'learn'], '🧠'],
    [['yoga', 'stretch'], '🤸'], [['eat', 'diet', 'meal', 'food'], '🥗'],
    [['smoke', 'quit', 'nosmok'], '🚭'], [['sav', 'budget', 'money'], '💰'],
    [['guitar', 'piano', 'music', 'practice'], '🎸'], [['clean', 'tidy'], '🧹'],
    [['sun', 'vitamin d'], '🌞'], [['pray', 'gratitude', 'thank'], '🙏'],
    [['call', 'family', 'friend'], '📞'], [['skin', 'floss', 'teeth'], '🦷'],
    [['no phone', 'screen', 'social media'], '📵'], [['bike', 'cycl'], '🚴'],
    [['swim'], '🏊'], [['cook'], '🍳'], [['vitamin', 'supplement', 'pill'], '💊']
  ];
  const EMOJI_FALLBACK = ['⭐', '🔥', '🎯', '✨', '🌱', '💪', '🎨', '🧩', '🕊️', '🌈'];

  // 3-stage evolution lines: [name, id] per stage (ids = PokeAPI sprite numbers)
  const MON_LINES = [
    [['Bulbasaur', 1], ['Ivysaur', 2], ['Venusaur', 3]],
    [['Charmander', 4], ['Charmeleon', 5], ['Charizard', 6]],
    [['Squirtle', 7], ['Wartortle', 8], ['Blastoise', 9]],
    [['Caterpie', 10], ['Metapod', 11], ['Butterfree', 12]],
    [['Oddish', 43], ['Gloom', 44], ['Vileplume', 45]],
    [['Poliwag', 60], ['Poliwhirl', 61], ['Poliwrath', 62]],
    [['Abra', 63], ['Kadabra', 64], ['Alakazam', 65]],
    [['Machop', 66], ['Machoke', 67], ['Machamp', 68]],
    [['Geodude', 74], ['Graveler', 75], ['Golem', 76]],
    [['Gastly', 92], ['Haunter', 93], ['Gengar', 94]],
    [['Dratini', 147], ['Dragonair', 148], ['Dragonite', 149]],
    [['Chikorita', 152], ['Bayleef', 153], ['Meganium', 154]],
    [['Cyndaquil', 155], ['Quilava', 156], ['Typhlosion', 157]],
    [['Totodile', 158], ['Croconaw', 159], ['Feraligatr', 160]],
    [['Treecko', 252], ['Grovyle', 253], ['Sceptile', 254]],
    [['Torchic', 255], ['Combusken', 256], ['Blaziken', 257]],
    [['Mudkip', 258], ['Marshtomp', 259], ['Swampert', 260]]
  ];
  const EVOLVE_AT = [7, 21]; // total days done needed for stage 2 and stage 3
  const monKey = 'habits_pokemon';
  let monsOn = localStorage.getItem(monKey) !== 'off';

  function monLineFor(habit) {
    let idx = habit.mon;
    if (typeof idx !== 'number' || !MON_LINES[idx]) {
      let hash = 0;
      for (let i = 0; i < habit.id.length; i++) hash = (hash * 31 + habit.id.charCodeAt(i)) >>> 0;
      idx = hash % MON_LINES.length;
    }
    return MON_LINES[idx];
  }
  function monStage(total) {
    return total >= EVOLVE_AT[1] ? 2 : total >= EVOLVE_AT[0] ? 1 : 0;
  }
  function pickMon() {
    const used = new Set(state.habits.map(h => h.mon));
    const free = MON_LINES.map((_, i) => i).filter(i => !used.has(i));
    const pool = free.length ? free : MON_LINES.map((_, i) => i);
    return pool[Math.floor(Math.random() * pool.length)];
  }
  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2800);
  }

  const SLOTS = [
    { id: 'morning', label: 'Morning', icon: '🌅' },
    { id: 'noon', label: 'Noon', icon: '☀️' },
    { id: 'evening', label: 'Evening', icon: '🌇' },
    { id: 'night', label: 'Night', icon: '🌙' },
    { id: '', label: 'Anytime', icon: '🕐' }
  ];

  const VIEWS = [
    { id: '7', label: '7 DAYS' },
    { id: '30', label: '30 DAYS' },
    { id: 'month', label: 'CALENDAR' }
  ];

  let state = loadState();
  (function assignMons() {
    const used = new Set(state.habits.map(h => h.mon).filter(m => typeof m === 'number'));
    state.habits.forEach(h => {
      if (typeof h.mon === 'number') return;
      let hash = 0;
      for (let i = 0; i < h.id.length; i++) hash = (hash * 31 + h.id.charCodeAt(i)) >>> 0;
      let idx = hash % MON_LINES.length;
      for (let n = 0; n < MON_LINES.length && used.has(idx); n++) idx = (idx + 1) % MON_LINES.length;
      h.mon = idx; used.add(idx);
    });
  })();
  let view = localStorage.getItem('habits_view') || '7';
  let editingId = null;
  let calMonths = {}; // habitId -> {y, m} currently viewed month, default = current
  let dragSrcId = null;

  function pickEmoji(name) {
    const lower = (name || '').toLowerCase();
    for (const [keywords, emoji] of EMOJI_KEYWORDS) {
      if (keywords.some(k => lower.includes(k))) return emoji;
    }
    // deterministic fallback so the same name always lands on the same emoji
    let hash = 0;
    for (let i = 0; i < lower.length; i++) hash = (hash * 31 + lower.charCodeAt(i)) >>> 0;
    return EMOJI_FALLBACK[hash % EMOJI_FALLBACK.length];
  }
  function pickColor() {
    const used = new Set(state.habits.map(h => h.color));
    const free = PALETTE.find(c => !used.has(c));
    if (free) return free;
    // every color is taken at least once (11th+ habit) — spread by usage count, least-used first
    const counts = {};
    PALETTE.forEach(c => { counts[c] = 0; });
    state.habits.forEach(h => { if (counts[h.color] !== undefined) counts[h.color]++; });
    return PALETTE.reduce((a, b) => (counts[a] <= counts[b] ? a : b));
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.habits) && parsed.logs) {
          parsed.habits.forEach(h => { if (!h.emoji) h.emoji = pickEmoji(h.name); });
          return parsed;
        }
      }
    } catch (e) {}
    return { habits: [], logs: {} };
  }
  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    scheduleAutoPush();
  }

  // Push to the cloud a couple seconds after the last edit, so changes made
  // on one device reach the others without waiting for the manual Sync button
  // or the shared 24h auto-sync throttle in sync.js.
  let autoPushTimer = null;
  function scheduleAutoPush() {
    if (!window.DataSync || !DataSync.isConfigured()) return;
    clearTimeout(autoPushTimer);
    autoPushTimer = setTimeout(() => DataSync.syncNow(), 2500);
  }
  function uid() { return 'h_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function fmtDate(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function todayStr() { return fmtDate(new Date()); }
  function contrastText(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6 ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.92)';
  }
  function isFuture(dateStr) { return dateStr > todayStr(); }

  function toggleLog(habitId, dateStr) {
    if (isFuture(dateStr)) return;
    if (!state.logs[habitId]) state.logs[habitId] = {};
    const habit = state.habits.find(h => h.id === habitId);
    const before = monStage(totalCompletions(habitId));
    const marking = !state.logs[habitId][dateStr];
    if (marking) state.logs[habitId][dateStr] = true;
    else delete state.logs[habitId][dateStr];
    const after = monStage(totalCompletions(habitId));
    saveState();
    renderHabits();
    if (!monsOn || !marking) return;
    const evolved = after > before;
    const el = document.querySelector('.mon[data-id="' + habitId + '"]');
    if (el) el.classList.add(evolved ? 'evolve' : 'bounce');
    if (evolved && habit) {
      const line = monLineFor(habit);
      showToast(line[before][0] + ' evolved into ' + line[after][0] + '!');
    }
  }

  function currentStreak(habitId) {
    const logs = state.logs[habitId] || {};
    let streak = 0;
    let d = new Date();
    // if today not done yet, streak counts from yesterday backward but still show 0 if nothing
    if (!logs[todayStr()]) d.setDate(d.getDate() - 1);
    while (logs[fmtDate(d)]) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    return streak;
  }

  function bestStreak(habitId) {
    const dates = Object.keys(state.logs[habitId] || {}).sort();
    if (dates.length === 0) return 0;
    let best = 1, run = 1;
    for (let i = 1; i < dates.length; i++) {
      const prev = new Date(dates[i - 1]);
      const cur = new Date(dates[i]);
      const diffDays = Math.round((cur - prev) / 86400000);
      run = diffDays === 1 ? run + 1 : 1;
      if (run > best) best = run;
    }
    return best;
  }

  function totalCompletions(habitId) {
    return Object.keys(state.logs[habitId] || {}).length;
  }

  // ── rendering ────────────────────────────────────────────────────────────
  function renderViewRow() {
    const row = document.getElementById('viewRow');
    row.innerHTML = '';
    VIEWS.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'view-btn' + (view === v.id ? ' active' : '');
      btn.textContent = v.label;
      btn.onclick = () => { view = v.id; localStorage.setItem('habits_view', view); renderViewRow(); renderHabits(); };
      row.appendChild(btn);
    });
  }

  function dowLabel(d) {
    return ['S','M','T','W','T','F','S'][d.getDay()];
  }

  function buildStatsRow(habit) {
    const row = document.createElement('div');
    row.className = 'stats-row';
    const cur = currentStreak(habit.id);
    const best = bestStreak(habit.id);
    const total = totalCompletions(habit.id);
    const stats = [
      { icon: '🔥', label: 'STREAK', value: cur + (cur === 1 ? ' day' : ' days') },
      { icon: '🏆', label: 'BEST', value: best + (best === 1 ? ' day' : ' days') },
      { icon: '✓', label: 'TOTAL', value: total + (total === 1 ? ' day' : ' days') }
    ];
    stats.forEach(s => {
      const item = document.createElement('div');
      item.className = 'stat-item';
      item.innerHTML = '<span class="stat-icon">' + s.icon + '</span><span class="stat-value">' + s.value + '</span><span class="stat-label">' + s.label + '</span>';
      row.appendChild(item);
    });
    return row;
  }

  function buildDotsRow(habit, days) {
    const wrap = document.createElement('div');
    wrap.className = 'dots-wrap';
    const row = document.createElement('div');
    row.className = 'dots-row' + (days === 30 ? ' dots-30' : '');
    const logs = state.logs[habit.id] || {};
    const today = new Date();
    const cells = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      cells.push(d);
    }
    cells.forEach(d => {
      const ds = fmtDate(d);
      const dot = document.createElement('div');
      dot.className = 'dot';
      if (ds === todayStr()) dot.classList.add('today');
      if (isFuture(ds)) dot.classList.add('future');
      if (logs[ds]) dot.style.background = habit.color;
      dot.title = ds;
      dot.onclick = () => toggleLog(habit.id, ds);
      row.appendChild(dot);
    });
    wrap.appendChild(row);
    if (days === 7) {
      const labels = document.createElement('div');
      labels.style.display = 'flex';
      labels.style.gap = '5px';
      cells.forEach(d => {
        const l = document.createElement('div');
        l.className = 'dot-label';
        l.style.width = '22px';
        l.textContent = dowLabel(d);
        labels.appendChild(l);
      });
      wrap.appendChild(labels);
    }
    return wrap;
  }

  function buildMonthCal(habit) {
    if (!calMonths[habit.id]) {
      const n = new Date();
      calMonths[habit.id] = { y: n.getFullYear(), m: n.getMonth() };
    }
    const { y, m } = calMonths[habit.id];
    const wrap = document.createElement('div');

    const nav = document.createElement('div');
    nav.className = 'cal-nav';
    const prevBtn = document.createElement('button');
    prevBtn.textContent = '‹';
    prevBtn.onclick = () => { calMonths[habit.id] = shiftMonth(y, m, -1); renderHabits(); };
    const title = document.createElement('div');
    title.className = 'cal-nav-title';
    title.textContent = new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' }).toUpperCase();
    const nextBtn = document.createElement('button');
    nextBtn.textContent = '›';
    const isCurrentMonth = (y === new Date().getFullYear() && m === new Date().getMonth());
    nextBtn.disabled = isCurrentMonth;
    if (isCurrentMonth) { nextBtn.style.opacity = '0.3'; nextBtn.style.cursor = 'default'; }
    nextBtn.onclick = () => { if (!isCurrentMonth) { calMonths[habit.id] = shiftMonth(y, m, 1); renderHabits(); } };
    nav.appendChild(prevBtn); nav.appendChild(title); nav.appendChild(nextBtn);
    wrap.appendChild(nav);

    const grid = document.createElement('div');
    grid.className = 'cal-grid';
    ['S','M','T','W','T','F','S'].forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });
    const first = new Date(y, m, 1);
    const startOffset = first.getDay();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const logs = state.logs[habit.id] || {};
    for (let i = 0; i < startOffset; i++) {
      const el = document.createElement('div');
      el.className = 'cal-cell empty';
      grid.appendChild(el);
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(y, m, day);
      const ds = fmtDate(d);
      const el = document.createElement('div');
      el.className = 'cal-cell';
      if (ds === todayStr()) el.classList.add('today');
      if (isFuture(ds)) el.classList.add('future');
      if (logs[ds]) { el.classList.add('filled'); el.style.background = habit.color; el.style.color = contrastText(habit.color); }
      el.textContent = day;
      el.onclick = () => toggleLog(habit.id, ds);
      grid.appendChild(el);
    }
    wrap.appendChild(grid);
    return wrap;
  }
  function shiftMonth(y, m, delta) {
    const d = new Date(y, m + delta, 1);
    return { y: d.getFullYear(), m: d.getMonth() };
  }

  function renderHabits() {
    const list = document.getElementById('habitList');
    list.innerHTML = '';
    if (state.habits.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = '<div class="empty-state-icon">✓</div><p>No habits yet. Tap "+ Habit" to start tracking.</p>';
      list.appendChild(empty);
      return;
    }
    const anySlot = state.habits.some(h => h.slot);
    SLOTS.forEach(slot => {
      const group = state.habits.filter(h => (h.slot || '') === slot.id);
      if (group.length === 0) return;
      if (anySlot) {
        const header = document.createElement('div');
        header.className = 'slot-header';
        header.textContent = slot.icon + ' ' + slot.label;
        header.addEventListener('dragover', (e) => e.preventDefault());
        header.addEventListener('drop', (e) => {
          e.preventDefault();
          const moved = state.habits.find(h => h.id === dragSrcId);
          if (!moved) return;
          moved.slot = slot.id;
          state.habits.splice(state.habits.indexOf(moved), 1);
          state.habits.push(moved);
          saveState();
          renderHabits();
        });
        list.appendChild(header);
      }
      group.forEach((habit, gi) => list.appendChild(buildCard(habit, gi, group.length)));
    });
  }

  function buildMon(habit) {
    const total = totalCompletions(habit.id);
    const stage = monStage(total);
    const line = monLineFor(habit);
    const next = EVOLVE_AT[stage];
    const wrap = document.createElement('div');
    wrap.className = 'mon';
    wrap.dataset.id = habit.id;
    wrap.title = next ? total + '/' + next + ' days to evolve' : 'fully evolved';
    wrap.style.setProperty('--mon-color', habit.color);
    const img = document.createElement('img');
    img.crossOrigin = 'anonymous';
    img.alt = line[stage][0];
    img.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/' + line[stage][1] + '.png';
    img.onerror = () => { wrap.style.display = 'none'; };
    wrap.appendChild(img);
    return wrap;
  }

  function buildCard(habit, idx, groupLen) {
    {
      const card = document.createElement('div');
      card.className = 'habit-card';
      card.style.borderLeftColor = habit.color;
      card.draggable = true;
      card.dataset.id = habit.id;
      card.addEventListener('dragstart', () => { dragSrcId = habit.id; card.classList.add('dragging'); });
      card.addEventListener('dragend', () => { card.classList.remove('dragging'); });
      card.addEventListener('dragover', (e) => e.preventDefault());
      card.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (!dragSrcId || dragSrcId === habit.id) return;
        const moved = state.habits.find(h => h.id === dragSrcId);
        if (!moved) return;
        state.habits.splice(state.habits.indexOf(moved), 1);
        moved.slot = habit.slot || '';
        state.habits.splice(state.habits.indexOf(habit), 0, moved);
        saveState();
        renderHabits();
      });

      const top = document.createElement('div');
      top.className = 'habit-top';

      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.textContent = '⋮⋮';
      top.appendChild(handle);

      const icon = document.createElement('div');
      icon.className = 'habit-icon';
      icon.textContent = habit.emoji || '⭐';
      top.appendChild(icon);

      const name = document.createElement('div');
      name.className = 'habit-name';
      name.textContent = habit.name;
      top.appendChild(name);

      const actions = document.createElement('div');
      actions.className = 'habit-actions';

      const upBtn = document.createElement('button');
      upBtn.className = 'icon-btn'; upBtn.textContent = '↑'; upBtn.title = 'Move up';
      upBtn.disabled = idx === 0;
      upBtn.onclick = () => { moveHabit(habit, -1); };

      const downBtn = document.createElement('button');
      downBtn.className = 'icon-btn'; downBtn.textContent = '↓'; downBtn.title = 'Move down';
      downBtn.disabled = idx === groupLen - 1;
      downBtn.onclick = () => { moveHabit(habit, 1); };

      const editBtn = document.createElement('button');
      editBtn.className = 'icon-btn'; editBtn.textContent = '✎'; editBtn.title = 'Edit';
      editBtn.onclick = () => openEditModal(habit);

      const delBtn = document.createElement('button');
      delBtn.className = 'icon-btn'; delBtn.textContent = '✕'; delBtn.title = 'Delete';
      delBtn.onclick = () => deleteHabit(habit.id);

      actions.appendChild(upBtn); actions.appendChild(downBtn); actions.appendChild(editBtn); actions.appendChild(delBtn);
      top.appendChild(actions);
      card.appendChild(top);

      card.appendChild(buildStatsRow(habit));
      const main = document.createElement('div');
      main.className = 'habit-main';
      if (view === '7') main.appendChild(buildDotsRow(habit, 7));
      else if (view === '30') main.appendChild(buildDotsRow(habit, 30));
      else main.appendChild(buildMonthCal(habit));

      if (monsOn) {
        const body = document.createElement('div');
        body.className = 'habit-body';
        body.appendChild(main);
        body.appendChild(buildMon(habit));
        card.appendChild(body);
      } else {
        card.appendChild(main);
      }

      return card;
    }
  }

  function moveHabit(habit, dir) {
    const group = state.habits.filter(h => (h.slot || '') === (habit.slot || ''));
    const neighbor = group[group.indexOf(habit) + dir];
    if (!neighbor) return;
    const arr = state.habits;
    const a = arr.indexOf(habit), b = arr.indexOf(neighbor);
    [arr[a], arr[b]] = [arr[b], arr[a]];
    saveState();
    renderHabits();
  }

  function deleteHabit(id) {
    const habit = state.habits.find(h => h.id === id);
    if (!habit) return;
    if (!confirm('Delete "' + habit.name + '"? This removes all its history.')) return;
    state.habits = state.habits.filter(h => h.id !== id);
    delete state.logs[id];
    saveState();
    renderHabits();
  }

  // ── add/edit modal ──────────────────────────────────────────────────────
  let modalColor = PALETTE[0];
  let modalSlot = '';

  function renderSlotChips() {
    const wrap = document.getElementById('slotChips');
    wrap.innerHTML = '';
    SLOTS.forEach(s => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'slot-chip' + (modalSlot === s.id ? ' selected' : '');
      chip.textContent = s.icon + ' ' + s.label;
      chip.onclick = () => { modalSlot = s.id; renderSlotChips(); };
      wrap.appendChild(chip);
    });
  }

  function updatePreview() {
    const name = document.getElementById('habitNameInput').value.trim();
    const emoji = name ? pickEmoji(name) : '❓';
    document.getElementById('previewBadge').textContent = emoji;
    document.getElementById('previewColor').style.background = modalColor;
  }

  window.openAddModal = function() {
    editingId = null;
    modalColor = pickColor();
    modalSlot = '';
    document.getElementById('modalTitle').textContent = 'New Habit';
    document.getElementById('habitNameInput').value = '';
    renderSlotChips();
    updatePreview();
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('habitNameInput').focus(), 50);
  };
  function openEditModal(habit) {
    editingId = habit.id;
    modalColor = habit.color;
    modalSlot = habit.slot || '';
    document.getElementById('modalTitle').textContent = 'Edit Habit';
    document.getElementById('habitNameInput').value = habit.name;
    renderSlotChips();
    updatePreview();
    document.getElementById('modalOverlay').classList.add('open');
    setTimeout(() => document.getElementById('habitNameInput').focus(), 50);
  }
  window.closeModal = function() {
    document.getElementById('modalOverlay').classList.remove('open');
  };
  window.saveHabit = function() {
    const name = document.getElementById('habitNameInput').value.trim();
    if (!name) { document.getElementById('habitNameInput').focus(); return; }
    const emoji = pickEmoji(name);
    if (editingId) {
      const habit = state.habits.find(h => h.id === editingId);
      habit.name = name;
      habit.emoji = emoji;
      habit.slot = modalSlot;
    } else {
      state.habits.push({ id: uid(), name: name, color: modalColor, emoji: emoji, slot: modalSlot, mon: pickMon() });
    }
    saveState();
    closeModal();
    renderHabits();
  };
  document.getElementById('habitNameInput').addEventListener('input', updatePreview);
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  document.getElementById('habitNameInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') saveHabit();
    if (e.key === 'Escape') closeModal();
  });

  // ── theme ────────────────────────────────────────────────────────────────
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.getElementById('toggleIcon').textContent = isDark ? '☀️' : '🌙';
    document.getElementById('toggleLabel').textContent = isDark ? 'Light mode' : 'Dark mode';
  }
  function applyMonToggle() {
    document.getElementById('monToggle').style.opacity = monsOn ? '1' : '0.45';
  }
  window.toggleMons = function() {
    monsOn = !monsOn;
    localStorage.setItem(monKey, monsOn ? 'on' : 'off');
    applyMonToggle();
    renderHabits();
  };
  window.toggleTheme = function() {
    isDark = !isDark;
    localStorage.setItem(themeKey, isDark ? 'dark' : 'light');
    applyTheme();
  };

  // ── cloud sync (shared module in sync.js) ───────────────────────────────
  if (window.DataSync) {
    DataSync.init({
      appId: 'habits',
      keys: [STORAGE_KEY, themeKey, 'habits_view', monKey],
      versionLabel: 'habits-v1'
    });
    // Check the cloud on every open (not gated to sync.js's 24h autoSync
    // throttle) so a habit added on one device shows up on another right away.
    if (DataSync.isConfigured()) DataSync.syncNow();
  }

  function init() {
    applyTheme();
    applyMonToggle();
    renderViewRow();
    renderHabits();
  }
  init();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('habits-sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
