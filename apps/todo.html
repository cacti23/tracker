<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="To-do">
<meta name="theme-color" content="#070710">
<title>To-do</title>
<link rel="icon" href="../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // Follow the tracker's theme ('dsa-theme', same origin); default dark like the tracker.
  document.documentElement.setAttribute('data-theme', localStorage.getItem('dsa-theme') === 'light' ? 'light' : 'dark')
</script>
<style>
  :root, [data-theme="dark"] {
    --bg: #070710; --surface: #0f0f1a; --surface2: #18182a;
    --border: rgba(255,255,255,0.07); --text: #dde0ee; --text-muted: #8a8a9e; --text-faint: #55556a;
    --accent: #3dd68c; --accent-dim: rgba(61,214,140,0.14); --amber: #e0b52b; --heading: #ffffff;
    --shadow: none;
  }
  [data-theme="light"] {
    --bg: #f2f2f7; --surface: #ffffff; --surface2: #ebebf0;
    --border: rgba(0,0,0,0.08); --text: #1a1a28; --text-muted: #555568; --text-faint: #9999aa;
    --accent: #1f9d63; --accent-dim: rgba(31,157,99,0.12); --amber: #b5880f; --heading: #111122;
    --shadow: 0 1px 4px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
  .container { max-width: 640px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 16px max(100px, calc(100px + env(safe-area-inset-bottom))); }

  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-bottom: 22px; border-left: 3px solid var(--accent); padding-left: 18px; }
  .header-mono { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
  .header-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(40px, 9vw, 60px); line-height: 0.9; color: var(--heading); }
  .header-title span { color: var(--accent); }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .btn { cursor: pointer; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 9px 13px;
    color: var(--text-muted); font: 12px 'DM Mono', monospace; letter-spacing: 0.05em; transition: all 0.15s; }
  .btn:hover { color: var(--text); border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #06130c; font-weight: 500; }
  .btn.ds-token-set { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* day switcher */
  .day-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .day-bar .btn { padding: 9px 14px; font-size: 15px; }
  .day-label { flex: 1; text-align: center; cursor: pointer; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 10px; }
  .day-label .big { font-weight: 600; font-size: 15px; }
  .day-label .small { font: 10px 'DM Mono', monospace; color: var(--text-faint); letter-spacing: 0.08em; margin-top: 2px; }

  .progress { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .progress-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.25s; }
  .progress-text { font: 12px 'DM Mono', monospace; color: var(--text-muted); white-space: nowrap; }

  /* add form */
  .add { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .add-row { display: flex; gap: 8px; }
  .add input { flex: 1; min-width: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font: 15px 'DM Sans', sans-serif; outline: none; }
  .add input:focus { border-color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    border-radius: 99px; padding: 6px 11px; font: 12px 'DM Sans', sans-serif; }
  .chip.on { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .chips[hidden] { display: none; }
  .chips.days .chip { padding: 6px 9px; min-width: 40px; }

  .section-title { font: 11px 'DM Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-faint); margin: 18px 2px 8px; }
  .empty { color: var(--text-faint); font-size: 13px; padding: 4px 2px; }

  .row { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .check { flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--text-faint);
    background: transparent; cursor: pointer; color: #06130c; font-size: 14px; font-weight: 700; line-height: 1; }
  .check.on { background: var(--accent); border-color: var(--accent); }
  .check:disabled { opacity: 0.35; cursor: default; }
  .row-main { flex: 1; min-width: 0; }
  .row-text { font-size: 15px; word-break: break-word; cursor: pointer; }
  .row.done .row-text { text-decoration: line-through; color: var(--text-faint); }
  .row.moved { opacity: 0.55; }
  .tag { display: inline-block; margin-top: 3px; font: 10px 'DM Mono', monospace; letter-spacing: 0.05em; color: var(--text-faint); }
  .tag.carried { color: var(--amber); }
  .del { flex-shrink: 0; border: none; background: transparent; color: var(--text-faint); cursor: pointer; font-size: 14px; padding: 4px 6px; border-radius: 6px; }
  .del:hover { color: var(--text); background: var(--surface2); }

  details.manage { margin-top: 26px; }
  details.manage summary { cursor: pointer; font: 11px 'DM Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); padding: 6px 2px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <div class="header-mono">Daily plan</div>
      <div class="header-title">TO-<span>DO</span></div>
    </div>
    <div class="btn-row">
      <button type="button" id="dataSyncBtn" class="btn" onclick="DataSync.syncNow()" title="Sync your to-dos to/from the cloud across devices">☁ Sync</button>
      <button type="button" class="btn" onclick="DataSync.pullLatest()" title="Force-pull the cloud's current data onto THIS device, overwriting local — use this if Sync isn't bringing your tasks in">⬇</button>
      <button type="button" id="dataTokenBtn" class="btn" onclick="DataSync.setToken()" title="Set or change the GitHub token used for cloud sync (stored only in this browser)">⚙</button>
    </div>
  </div>

  <div class="day-bar">
    <button type="button" class="btn" onclick="shiftDay(-1)" aria-label="Previous day">‹</button>
    <div class="day-label" id="dayLabel" onclick="goToday()" title="Back to today"></div>
    <button type="button" class="btn" onclick="shiftDay(1)" aria-label="Next day">›</button>
  </div>

  <div class="progress"><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div><div class="progress-text" id="progressText"></div></div>

  <div class="add">
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="What do you want to do?" maxlength="120" autocomplete="off">
      <button type="button" class="btn primary" onclick="addTask()">+ Add</button>
    </div>
    <div class="chips" id="repeatChips"></div>
    <div class="chips days" id="dayChips" hidden></div>
  </div>

  <div id="lists"></div>

  <details class="manage" id="manage">
    <summary>🔁 All repeating tasks</summary>
    <div id="manageList"></div>
  </details>
</div>

<script src="../js/sync.js"></script>
<script src="../js/todo.js"></script>
<script>
(function () {
  const TASKS_KEY = 'todo_tasks_v1'
  const DONE_KEY = 'todo_done_v1'
  const T = window.TodoLogic

  function load(key) {
    try { const v = JSON.parse(localStorage.getItem(key) || '{}'); return v && typeof v === 'object' && !Array.isArray(v) ? v : {} }
    catch (e) { return {} }
  }
  let tasks = load(TASKS_KEY)
  let done = load(DONE_KEY)
  function save() {
    localStorage.setItem(TASKS_KEY, JSON.stringify(tasks))
    localStorage.setItem(DONE_KEY, JSON.stringify(done))
  }

  const today = () => T.fmtDate(new Date())
  let viewDate = today()
  let repeat = 'once'
  let pickedDays = []

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]) }
  function uid() { return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) }
  function niceDate(s) {
    const d = T.parseDate(s)
    return T.DAY_NAMES[d.getDay()] + ' ' + d.getDate() + ' ' + d.toLocaleString('en', { month: 'short' })
  }

  // ── add form ─────────────────────────────────────────────────────────────
  const REPEATS = [['once', '📝 Once'], ['daily', '🔁 Every day'], ['weekdays', '💼 Mon–Fri'], ['days', '📅 Pick days']]
  function renderChips() {
    document.getElementById('repeatChips').innerHTML = REPEATS.map(([k, label]) =>
      `<button type="button" class="chip${repeat === k ? ' on' : ''}" onclick="setRepeat('${k}')">${label}</button>`).join('')
    const dayBox = document.getElementById('dayChips')
    dayBox.hidden = repeat !== 'days'
    dayBox.innerHTML = [1, 2, 3, 4, 5, 6, 0].map(d =>
      `<button type="button" class="chip${pickedDays.includes(d) ? ' on' : ''}" onclick="toggleDay(${d})">${T.DAY_NAMES[d]}</button>`).join('')
  }
  window.setRepeat = function (k) { repeat = k; renderChips() }
  window.toggleDay = function (d) {
    pickedDays = pickedDays.includes(d) ? pickedDays.filter(x => x !== d) : pickedDays.concat(d)
    renderChips()
  }

  window.addTask = function () {
    const input = document.getElementById('taskInput')
    const text = input.value.trim()
    if (!text) { input.focus(); return }
    if (repeat === 'days' && !pickedDays.length) { alert('Pick at least one day'); return }
    const id = uid()
    const createdAt = new Date().toISOString()
    // A one-off goes on the day you're looking at, so you can plan tomorrow tonight.
    // A repeating task starts today, or on the viewed day if that's in the future.
    tasks[id] = repeat === 'once'
      ? { id, text, repeat, date: viewDate, doneOn: null, createdAt }
      : { id, text, repeat, days: repeat === 'days' ? pickedDays.slice() : [], start: viewDate > today() ? viewDate : today(), createdAt }
    save()
    input.value = ''
    render()
    input.focus()
  }

  // ── row actions ──────────────────────────────────────────────────────────
  window.toggleTask = function (id) {
    if (viewDate > today()) return
    const t = tasks[id]
    if (!t) return
    if (t.repeat === 'once') {
      // Ticking a carried task on today marks it done today; ticking on its own day marks that day.
      t.doneOn = t.doneOn === viewDate ? null : viewDate
    } else {
      const k = viewDate + '|' + id
      done[k] = done[k] !== true   // keep false instead of deleting, so an untick survives a merge
    }
    save()
    render()
  }
  window.renameTask = function (id) {
    const t = tasks[id]
    if (!t) return
    const text = prompt('Edit task', t.text)
    if (text === null || !text.trim()) return
    t.text = text.trim().slice(0, 120)
    save()
    render()
  }
  window.deleteTask = function (id) {
    const t = tasks[id]
    if (!t) return
    const msg = t.repeat === 'once' ? `Delete "${t.text}"?` : `Stop repeating "${t.text}"? Past days keep it.`
    if (!confirm(msg)) return
    // Repeating: stop from today on. One-off: gone everywhere.
    t.deletedOn = t.repeat === 'once' ? '0000-00-00' : today()
    save()
    render()
  }

  // ── day switcher ─────────────────────────────────────────────────────────
  window.shiftDay = function (n) { viewDate = T.addDays(viewDate, n); render() }
  window.goToday = function () { viewDate = today(); render() }

  // ── render ───────────────────────────────────────────────────────────────
  function rowHtml(r) {
    const t = r.task
    let tag = ''
    if (r.carried) tag = `<span class="tag carried">↪ from ${esc(niceDate(t.date))}</span>`
    else if (r.moved) tag = `<span class="tag">↪ not done, moved on</span>`
    else if (t.repeat !== 'once') tag = `<span class="tag">🔁 ${esc(T.repeatLabel(t))}</span>`
    const future = viewDate > today()
    return `<div class="row${r.done ? ' done' : ''}${r.moved ? ' moved' : ''}">
      <button type="button" class="check${r.done ? ' on' : ''}" onclick="toggleTask('${t.id}')" ${future ? 'disabled title="Can\'t tick a future day"' : ''} aria-label="Done">${r.done ? '✓' : ''}</button>
      <div class="row-main"><div class="row-text" onclick="renameTask('${t.id}')" title="Tap to edit">${esc(t.text)}</div>${tag}</div>
      <button type="button" class="del" onclick="deleteTask('${t.id}')" title="Delete" aria-label="Delete">✕</button>
    </div>`
  }

  function render() {
    const now = today()
    const label = viewDate === now ? 'Today' : viewDate === T.addDays(now, -1) ? 'Yesterday' : viewDate === T.addDays(now, 1) ? 'Tomorrow' : niceDate(viewDate)
    document.getElementById('dayLabel').innerHTML =
      `<div class="big">${label === 'Today' ? '☀️ ' : ''}${esc(label)}</div><div class="small">${esc(niceDate(viewDate))}${viewDate !== now ? ' · tap for today' : ''}</div>`

    const { recurring, once } = T.dayRows(tasks, done, viewDate, now)
    const counted = recurring.concat(once.filter(r => !r.moved))
    const n = counted.filter(r => r.done).length
    document.getElementById('progressFill').style.width = counted.length ? (100 * n / counted.length) + '%' : '0'
    document.getElementById('progressText').textContent = counted.length ? `${n} / ${counted.length} done${n === counted.length ? ' 🎉' : ''}` : 'nothing planned'

    document.getElementById('lists').innerHTML =
      `<div class="section-title">🔁 Repeating</div>` +
      (recurring.length ? recurring.map(rowHtml).join('') : `<div class="empty">No repeating tasks on this day.</div>`) +
      `<div class="section-title">📝 ${viewDate === now ? 'Today' : 'This day'}</div>` +
      (once.length ? once.map(rowHtml).join('') : `<div class="empty">Nothing yet. Add what you want to do above.</div>`)

    const all = Object.values(tasks).filter(t => t && t.repeat !== 'once' && !t.deletedOn)
    document.getElementById('manageList').innerHTML = all.length
      ? all.map(t => `<div class="row"><div class="row-main"><div class="row-text" onclick="renameTask('${t.id}')" title="Tap to edit">${esc(t.text)}</div><span class="tag">🔁 ${esc(T.repeatLabel(t))} · since ${esc(niceDate(t.start))}</span></div>
          <button type="button" class="del" onclick="deleteTask('${t.id}')" title="Stop repeating" aria-label="Stop repeating">✕</button></div>`).join('')
      : `<div class="empty">No repeating tasks yet.</div>`
  }

  document.getElementById('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask() })
  // Coming back to the tab the next morning should show the new day, not yesterday.
  let lastToday = today()
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return
    if (today() !== lastToday) { if (viewDate === lastToday) viewDate = today(); lastToday = today() }
    render()
  })

  // ── cloud sync (shared module in sync.js) ───────────────────────────────
  if (window.DataSync) {
    DataSync.init({ appId: 'todo', keys: [TASKS_KEY, DONE_KEY], versionLabel: 'todo-v1', autoPush: true })
    // Check the cloud on every open so a task added on the phone shows on the laptop right away.
    if (DataSync.isConfigured()) DataSync.syncNow()
  }

  renderChips()
  render()
})()
</script>
<script src="../js/back-button.js"></script>
</body>
</html>
