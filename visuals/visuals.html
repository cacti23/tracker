<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visuals</title>
<style>
:root {
  --bg: #f7f6f2; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc; --accent: #4f46e5; --chip: #eef0fb;
  --red-bg: #fde8e8; --red-fg: #b42318; --coral-bg: #fdeee6; --coral-fg: #b54708;
  --amber-bg: #fdf4dc; --amber-fg: #93690b; --blue-bg: #e6effd; --blue-fg: #1e5bb8;
  --teal-bg: #e0f5f2; --teal-fg: #0f766e; --green-bg: #e3f6ea; --green-fg: #15803d;
  --purple-bg: #efe9fd; --purple-fg: #6d3fd1; --gray-bg: #f0f0f2; --gray-fg: #3a3a40;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --card: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --line: #2c2c31; --accent: #8b85ff; --chip: #23263a;
    --red-bg: #3b1d1f; --red-fg: #ff9a9a; --coral-bg: #3a2418; --coral-fg: #ffab7a;
    --amber-bg: #3a3012; --amber-fg: #ffd36b; --blue-bg: #172a45; --blue-fg: #8dbdff;
    --teal-bg: #0f3331; --teal-fg: #6ee0d2; --green-bg: #14331f; --green-fg: #7eeaa8;
    --purple-bg: #2a2045; --purple-fg: #c7aeff; --gray-bg: #26272d; --gray-fg: #d6d6dc;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --card: #1c1c1f; --text: #ececee; --muted: #9a9aa2; --line: #2c2c31; --accent: #8b85ff; --chip: #23263a;
  --red-bg: #3b1d1f; --red-fg: #ff9a9a; --coral-bg: #3a2418; --coral-fg: #ffab7a;
  --amber-bg: #3a3012; --amber-fg: #ffd36b; --blue-bg: #172a45; --blue-fg: #8dbdff;
  --teal-bg: #0f3331; --teal-fg: #6ee0d2; --green-bg: #14331f; --green-fg: #7eeaa8;
  --purple-bg: #2a2045; --purple-fg: #c7aeff; --gray-bg: #26272d; --gray-fg: #d6d6dc;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 60px; }
header h1 { font-size: 24px; margin: 0 0 4px; }
header p { margin: 0; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.chips button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); cursor: pointer; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
figure.card { margin: 0 0 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
figure.card[hidden] { display: none; }
figcaption { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-bottom: 10px; }
figcaption b { font-size: 16px; }
.tag { font-size: 12px; padding: 1px 9px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.hint { margin-left: auto; font-size: 12px; color: var(--muted); }
@media (max-width: 520px) { .hint { display: none; } }
.img { cursor: zoom-in; }
.img svg { display: block; width: 100%; height: auto; }
.src { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
.src a { color: var(--accent); }

/* Full-screen view: the image keeps its drawn width, so on a phone you scroll or pinch instead of squinting */
#zoom { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow: auto; padding: 48px 12px 24px; cursor: zoom-out; }
#zoom[hidden] { display: none; }
#zoom svg { display: block; width: max(100%, 680px); max-width: 1100px; height: auto; margin: 0 auto; }
#zoom .close { position: fixed; top: 10px; right: 12px; font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }

/* Shared drawing vocabulary for every SVG on this page, so a new image only needs these class names */
svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
svg .t  { font-size: 14px; fill: var(--text); }
svg .ts { font-size: 12px; fill: var(--muted); }
svg .th { font-size: 14px; font-weight: 600; fill: var(--text); }
svg .arr { stroke: var(--line); stroke-width: 1.5; fill: none; }
svg .c-red rect    { fill: var(--red-bg); }    svg .c-red text    { fill: var(--red-fg); }
svg .c-coral rect  { fill: var(--coral-bg); }  svg .c-coral text  { fill: var(--coral-fg); }
svg .c-amber rect  { fill: var(--amber-bg); }  svg .c-amber text  { fill: var(--amber-fg); }
svg .c-blue rect   { fill: var(--blue-bg); }   svg .c-blue text   { fill: var(--blue-fg); }
svg .c-teal rect   { fill: var(--teal-bg); }   svg .c-teal text   { fill: var(--teal-fg); }
svg .c-green rect  { fill: var(--green-bg); }  svg .c-green text  { fill: var(--green-fg); }
svg .c-purple rect { fill: var(--purple-bg); } svg .c-purple text { fill: var(--purple-fg); }
svg .c-gray rect   { fill: var(--gray-bg); }   svg .c-gray text   { fill: var(--gray-fg); }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🖼️ Visuals</h1>
  <p>One picture per idea, for a quick look before you code. Tap an image to open it full screen.</p>
</header>

<div class="chips" id="chips"></div>

<!-- To add a visual: copy one <figure class="card">, give it a new id and data-tag, and draw with the svg classes above. -->

<figure class="card" id="v-complexity" data-tag="Complexity">
  <figcaption><b>⏱️ Constraints → time complexity</b><span class="tag">Complexity</span><span class="hint">tap to zoom</span></figcaption>
  <div class="img">
<svg viewBox="0 0 680 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Input size to allowed time complexity, log base 10 table for 1 to 10, log rules and a worked example">
<text class="th" x="16" y="26">⏱️ Constraint → allowed complexity</text>
<text class="ts" x="16" y="46">Budget ≈ 10⁸ simple ops per second: plug n in, the result must stay near ≤ 10⁸.</text>
<text class="ts" x="16" y="74">input size</text><text class="ts" x="150" y="74">max complexity</text><text class="ts" x="390" y="74">ops</text>
<text class="t" x="16" y="103">n ≤ 12</text>
<g class="c-red"><rect x="146" y="86" width="220" height="26" rx="6"/><text class="th" x="156" y="104">O(n!)</text></g>
<text class="ts" x="390" y="103">12! ≈ 4.8·10⁸  ⚠ borderline (10 is safe)</text>
<text class="t" x="16" y="135">n ≤ 20</text>
<g class="c-red"><rect x="146" y="118" width="220" height="26" rx="6"/><text class="th" x="156" y="136">O(2ⁿ)</text></g>
<text class="ts" x="390" y="135">2²⁰ ≈ 10⁶</text>
<text class="t" x="16" y="167">n ≤ 100</text>
<g class="c-coral"><rect x="146" y="150" width="220" height="26" rx="6"/><text class="th" x="156" y="168">O(n⁴)</text></g>
<text class="ts" x="390" y="167">100⁴ = 10⁸</text>
<text class="t" x="16" y="199">n ≤ 500</text>
<g class="c-coral"><rect x="146" y="182" width="220" height="26" rx="6"/><text class="th" x="156" y="200">O(n³)</text></g>
<text class="ts" x="390" y="199">500³ = 1.25·10⁸</text>
<text class="t" x="16" y="231">n ≤ 5000</text>
<g class="c-amber"><rect x="146" y="214" width="220" height="26" rx="6"/><text class="th" x="156" y="232">O(n²)</text></g>
<text class="ts" x="390" y="231">5000² = 2.5·10⁷</text>
<text class="t" x="16" y="263">n ≤ 10⁵</text>
<g class="c-blue"><rect x="146" y="246" width="220" height="26" rx="6"/><text class="th" x="156" y="264">O(n log n)</text></g>
<text class="ts" x="390" y="263">10⁵·17 ≈ 1.7·10⁶</text>
<text class="t" x="16" y="295">n ≤ 10⁶</text>
<g class="c-teal"><rect x="146" y="278" width="220" height="26" rx="6"/><text class="th" x="156" y="296">O(n)</text></g>
<text class="ts" x="390" y="295">10⁶</text>
<text class="t" x="16" y="327">n ≤ 10⁹</text>
<g class="c-green"><rect x="146" y="310" width="220" height="26" rx="6"/><text class="th" x="156" y="328">O(log n) · O(√n)</text></g>
<text class="ts" x="390" y="327">√10⁹ ≈ 3·10⁴</text>
<line class="arr" x1="16" y1="354" x2="664" y2="354"/>
<text class="th" x="16" y="380">🔢 log₁₀ of 1–10  (★ = memorise, the rest are built from them)</text>
<g class="c-gray"><rect x="18" y="394" width="61" height="52" rx="6"/><text class="th" x="48" y="414" text-anchor="middle">1</text><text class="t" x="48" y="436" text-anchor="middle">0</text></g>
<g class="c-purple"><rect x="83" y="394" width="61" height="52" rx="6"/><text class="th" x="113" y="414" text-anchor="middle">2 ★</text><text class="t" x="113" y="436" text-anchor="middle">.301</text></g>
<g class="c-purple"><rect x="148" y="394" width="61" height="52" rx="6"/><text class="th" x="178" y="414" text-anchor="middle">3 ★</text><text class="t" x="178" y="436" text-anchor="middle">.477</text></g>
<g class="c-gray"><rect x="212" y="394" width="61" height="52" rx="6"/><text class="th" x="243" y="414" text-anchor="middle">4</text><text class="t" x="243" y="436" text-anchor="middle">.602</text></g>
<text class="ts" x="243" y="464" text-anchor="middle">2·log2</text>
<g class="c-gray"><rect x="277" y="394" width="61" height="52" rx="6"/><text class="th" x="308" y="414" text-anchor="middle">5</text><text class="t" x="308" y="436" text-anchor="middle">.699</text></g>
<text class="ts" x="308" y="464" text-anchor="middle">1−log2</text>
<g class="c-gray"><rect x="342" y="394" width="61" height="52" rx="6"/><text class="th" x="372" y="414" text-anchor="middle">6</text><text class="t" x="372" y="436" text-anchor="middle">.778</text></g>
<text class="ts" x="372" y="464" text-anchor="middle">log2+log3</text>
<g class="c-purple"><rect x="407" y="394" width="61" height="52" rx="6"/><text class="th" x="437" y="414" text-anchor="middle">7 ★</text><text class="t" x="437" y="436" text-anchor="middle">.845</text></g>
<g class="c-gray"><rect x="472" y="394" width="61" height="52" rx="6"/><text class="th" x="502" y="414" text-anchor="middle">8</text><text class="t" x="502" y="436" text-anchor="middle">.903</text></g>
<text class="ts" x="502" y="464" text-anchor="middle">3·log2</text>
<g class="c-gray"><rect x="536" y="394" width="61" height="52" rx="6"/><text class="th" x="567" y="414" text-anchor="middle">9</text><text class="t" x="567" y="436" text-anchor="middle">.954</text></g>
<text class="ts" x="567" y="464" text-anchor="middle">2·log3</text>
<g class="c-gray"><rect x="601" y="394" width="61" height="52" rx="6"/><text class="th" x="632" y="414" text-anchor="middle">10</text><text class="t" x="632" y="436" text-anchor="middle">1</text></g>
<text class="th" x="16" y="494">📐 Rules</text>
<text class="t" x="16" y="518">• log(a·b) = log a + log b</text>
<text class="t" x="16" y="540">• log(a/b) = log a − log b</text>
<text class="t" x="16" y="562">• log(aᵏ) = k · log a</text>
<text class="t" x="16" y="584">• log₂ of 10⁵ ≈ 17 · 10⁶ ≈ 20 · 10⁹ ≈ 30</text>
<text class="th" x="370" y="494">🧮 Example: n = 5000, O(n²)</text>
<text class="t" x="370" y="518">ops = 5000² = 2.5·10⁷</text>
<text class="t" x="370" y="540">log 2.5 = log(10/4) = 1 − .602 = .398</text>
<text class="t" x="370" y="562">so ops ≈ 10^7.4</text>
<text class="t" x="370" y="584">10^7.4 &lt; 10⁸  ✅ passes</text>
</svg>
  </div>
  <p class="src">Checked against the <a href="https://usaco.guide/bronze/time-comp" target="_blank" rel="noopener">USACO Guide</a> table (it is a bit stricter: n! at 10, n⁴ at 80, n³ at 400) and a standard log₁₀ table.</p>
</figure>

</div>

<div id="zoom" hidden><button class="close" type="button">✕ Close</button></div>

<script>
// Follow the tracker's theme ('dsa-theme', same origin); the tracker defaults to dark, so match that when embedded.
try {
  const t = localStorage.getItem('dsa-theme') || (window.top !== window.self ? 'dark' : null)
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
} catch (e) {}

const cards = [...document.querySelectorAll('figure.card')]
const chips = document.getElementById('chips')
const tags = ['All', ...new Set(cards.map(c => c.dataset.tag))]
function filter(tag) {
  cards.forEach(c => { c.hidden = tag !== 'All' && c.dataset.tag !== tag })
  chips.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.textContent === tag))
}
tags.forEach(tag => {
  const b = document.createElement('button')
  b.type = 'button'
  b.textContent = tag
  b.onclick = () => filter(tag)
  chips.appendChild(b)
})
filter('All')

const zoom = document.getElementById('zoom')
function closeZoom() {
  zoom.hidden = true
  zoom.querySelector('svg')?.remove()
}
document.querySelectorAll('.img').forEach(el => {
  el.onclick = () => {
    zoom.appendChild(el.querySelector('svg').cloneNode(true))
    zoom.hidden = false
  }
})
zoom.onclick = closeZoom
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeZoom() })
</script>
<script src="../js/back-button.js"></script>
</body>
</html>
