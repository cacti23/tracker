name: ✏️ Wrong answer or content fix
description: A wrong explanation, a broken link, or a better resource.
labels: [content]
body:
  - type: input
    id: where
    attributes:
      label: Where is it?
      description: Topic, problem name or lesson.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What should it say?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source (optional)
      description: A link that backs up the fix.
