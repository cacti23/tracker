// ─── NOTES TAB ────────────────────────────────────────────────────────────────
// Standalone "things to remember" notes, scoped to the current topic. Storage +
// accessors live in data.js (TOPIC_NOTES_KEY / getTopicNotes / upsertTopicNote …).
let _editingNoteId = null   // null = not editing; '__new__' = adding; else a note id

// Tiny safe markdown: escape first, then apply - bullets, **bold**, `code`.
// Markdown → HTML for notes. Escapes first (XSS-safe even though notes sync via gist),
// then handles: # headings, **bold**, *italic*, `code`, ```fenced blocks```, - / 1. lists,
// > blockquotes, --- rules, ~~strike~~, [text](url), GFM | pipe | tables |. Code spans/blocks
// are protected so inline markup inside them (and things like snake_case) are never reformatted.
function renderNoteBody(text) {
  if (!text || !text.trim()) return '<p class="text-faint">(empty)</p>'
  const esc = escHtml(text)

  // 1) Pull fenced code blocks out so their contents are never touched.
  // Language on the fence (```typescript) becomes both a header label and a Prism
  // language-xxx class — the autoloader plugin fetches whatever grammar that names.
  const blocks = []
  const src = esc.replace(/```([^\n]*)\n?([\s\S]*?)```/g, (_, lang, c) => {
    const tag = lang.trim().toLowerCase()
    return '@@CB' + (blocks.push(
      '<div class="note-code-wrap">' +
      (tag ? '<div class="note-code-lang">' + tag + '</div>' : '') +
      '<pre class="note-code"><code class="language-' + (tag || 'none') + '">' + c.replace(/\n$/, '') + '</code></pre>' +
      '</div>'
    ) - 1) + '@@'
  })

  // 2) Inline formatting — protect `code` spans first so * / ** inside them are left alone.
  const inline = s => {
    const spans = []
    s = s.replace(/`([^`]+)`/g, (_, c) => '@@CS' + (spans.push('<code>' + c + '</code>') - 1) + '@@')
    s = s
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    return s.replace(/@@CS(\d+)@@/g, (_, i) => spans[+i])
  }

  // 3) Block-level pass.
  let html = '', listType = null
  const closeList = () => { if (listType) { html += listType === 'ol' ? '</ol>' : '</ul>'; listType = null } }
  // GFM pipe-table row → cells (strip optional outer pipes, split, trim). No escaped-pipe support.
  const splitRow = line => { let s = line.trim(); if (s.startsWith('|')) s = s.slice(1); if (s.endsWith('|')) s = s.slice(0, -1); return s.split('|').map(c => c.trim()) }
  const tableSep = /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?$/
  let m
  const lines = src.split(/\r?\n/)
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i]
    const cb = raw.match(/^@@CB(\d+)@@$/)
    if (cb) { closeList(); html += blocks[+cb[1]]; continue }
    const t = raw.trim()
    if (!t) { closeList(); continue }
    if (t.includes('|') && lines[i + 1] && tableSep.test(lines[i + 1].trim())) {                            // pipe-table: header + separator row
      closeList()
      const header = splitRow(t)
      const aligns = splitRow(lines[i + 1].trim()).map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : c.startsWith(':') ? 'left' : '')
      const rows = []
      let j = i + 2
      while (j < lines.length && lines[j].trim().includes('|')) { rows.push(splitRow(lines[j])); j++ }
      const cell = (tag, c, k) => '<' + tag + (aligns[k] ? ' style="text-align:' + aligns[k] + '"' : '') + '>' + inline(c || '') + '</' + tag + '>'
      html += '<table class="note-table"><thead><tr>' + header.map((c, k) => cell('th', c, k)).join('') + '</tr></thead>'
      if (rows.length) html += '<tbody>' + rows.map(r => '<tr>' + header.map((_, k) => cell('td', r[k], k)).join('') + '</tr>').join('') + '</tbody>'
      html += '</table>'
      i = j - 1
      continue
    }
    if (/^([-*_])(\s*\1){2,}$/.test(t)) { closeList(); html += '<hr class="note-hr">'; continue }            // --- *** ___
    if ((m = t.match(/^(#{1,6})\s+(.*)$/))) { closeList(); const l = m[1].length; html += '<h' + l + ' class="note-h note-h' + l + '">' + inline(m[2]) + '</h' + l + '>'; continue }
    if ((m = t.match(/^&gt;\s?(.*)$/)))    { closeList(); html += '<blockquote class="note-quote">' + inline(m[1]) + '</blockquote>'; continue }  // > is &gt; after escHtml
    if ((m = t.match(/^(\d+)[.)]\s+(.*)$/))) { if (listType !== 'ol') { closeList(); html += '<ol class="note-bullets">'; listType = 'ol' } html += '<li>' + inline(m[2]) + '</li>'; continue }
    if ((m = t.match(/^[-*+•]\s+(.*)$/)))  { if (listType !== 'ul') { closeList(); html += '<ul class="note-bullets">'; listType = 'ul' } html += '<li>' + inline(m[1]) + '</li>'; continue }
    closeList(); html += '<p>' + inline(t) + '</p>'
  }
  closeList()
  // Safety net: restore any fenced-block placeholders that weren't on their own line.
  html = html.replace(/@@CB(\d+)@@/g, (_, i) => blocks[+i])
  return html || '<p class="text-faint">(empty)</p>'
}

// Accordion open/closed state — per-device UI preference (not synced), keyed by topic.
// No stored entry for a topic = first visit → pinned notes default open.
const NOTES_OPEN_KEY = 'dsa-notes-open-v1'
let _noteQuery = ''   // live search filter; reset on topic switch

function _openNoteSet(notes) {
  try {
    const all = JSON.parse(localStorage.getItem(NOTES_OPEN_KEY) || '{}')
    if (Object.prototype.hasOwnProperty.call(all, currentTopicKey)) return new Set(all[currentTopicKey])
  } catch {}
  return new Set(notes.filter(n => n.pinned).map(n => n.id))
}
function _saveOpenNoteSet(set) {
  try {
    const all = JSON.parse(localStorage.getItem(NOTES_OPEN_KEY) || '{}')
    all[currentTopicKey] = [...set]
    localStorage.setItem(NOTES_OPEN_KEY, JSON.stringify(all))
  } catch {}
}

function toggleNoteOpen(id) {
  const open = _openNoteSet(getTopicNotes(currentTopicKey))
  open.has(id) ? open.delete(id) : open.add(id)
  _saveOpenNoteSet(open)
  _renderNotesList()
}

function toggleAllNotes() {
  const notes = getTopicNotes(currentTopicKey)
  const open = _openNoteSet(notes)
  const allOpen = notes.length > 0 && notes.every(n => open.has(n.id))
  _saveOpenNoteSet(allOpen ? new Set() : new Set(notes.map(n => n.id)))
  _renderNotesList()
}

function _onNoteSearch(v) { _noteQuery = v; _renderNotesList() }

// Escape-safe title highlighting: match on the raw string, escape the pieces.
function _hlNoteTitle(title, q) {
  if (!q) return escHtml(title)
  const lower = title.toLowerCase()
  let out = '', i = 0, j
  while ((j = lower.indexOf(q, i)) !== -1) {
    out += escHtml(title.slice(i, j)) + '<mark>' + escHtml(title.slice(j, j + q.length)) + '</mark>'
    i = j + q.length
  }
  return out + escHtml(title.slice(i))
}

function noteAccItem(n, isOpen, q) {
  const date = n.updatedAt ? new Date(n.updatedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''
  return '<div class="note-acc' + (isOpen ? ' open' : '') + (n.pinned ? ' pinned' : '') + '" id="note-card-' + n.id + '">' +
    '<div class="note-acc-head" onclick="toggleNoteOpen(\'' + n.id + '\')">' +
    '<span class="note-acc-chev">▶</span>' +
    '<span class="note-acc-title">' + (n.pinned ? '📌 ' : '') + _hlNoteTitle(n.title || 'Untitled', q) + '</span>' +
    '<span class="note-acc-meta">' + date + '</span>' +
    '<span class="note-card-actions" onclick="event.stopPropagation()">' +
    '<button title="' + (n.pinned ? 'Unpin' : 'Pin to top') + '" onclick="toggleTopicNotePin(\'' + n.id + '\')">📌</button>' +
    '<button title="Print" onclick="printTopicNote(\'' + n.id + '\')">🖨️</button>' +
    '<button title="Edit" onclick="editTopicNote(\'' + n.id + '\')">✏️</button>' +
    '<button title="Delete" onclick="removeTopicNote(\'' + n.id + '\')">🗑️</button>' +
    '</span></div>' +
    '<div class="note-acc-body"><div class="note-card-body">' + renderNoteBody(n.body) + '</div></div>' +
    '</div>'
}

// Print a single note: fill #print-note-host with just this note's title + rendered body,
// hide the rest of the app via body.print-note-mode (see @media print CSS), then trigger the
// browser's native print dialog. afterprint cleans the mode back off (also on cancel).
function printTopicNote(id) {
  const n = getTopicNotes(currentTopicKey).find(x => x.id === id)
  const host = document.getElementById('print-note-host')
  if (!n || !host) return
  host.innerHTML = '<div class="note-card-body">' +
    '<h1 class="note-h note-h1">' + escHtml(n.title || 'Untitled') + '</h1>' +
    renderNoteBody(n.body) +
    '</div>'
  if (window.Prism) Prism.highlightAllUnder(host)
  document.body.classList.add('print-note-mode')
  window.print()
}
window.addEventListener('afterprint', () => document.body.classList.remove('print-note-mode'))

// Renders only the accordion list + toggle-all label. Called on every search
// keystroke, so the search input itself must live outside this host (focus).
function _renderNotesList() {
  const host = document.getElementById('notes-acc-host')
  if (!host) return
  const notes = getTopicNotes(currentTopicKey)
  const q = _noteQuery.trim().toLowerCase()
  const open = _openNoteSet(notes)

  const btn = document.getElementById('btn-notes-toggle-all')
  if (btn) btn.textContent = notes.length > 0 && notes.every(n => open.has(n.id)) ? '⊟ Collapse all' : '⊞ Expand all'

  if (!notes.length) {
    host.innerHTML = '<div class="notes-empty text-center py-5 text-secondary">' +
      '<div style="font-size:2rem">🗒️</div>' +
      '<p class="small mt-2 mb-0">No notes yet. Capture key insights, gotchas, and patterns as you learn.</p></div>'
    return
  }

  const shown = q
    ? notes.filter(n => (n.title || '').toLowerCase().includes(q) || (n.body || '').toLowerCase().includes(q))
    : notes
  if (!shown.length) {
    host.innerHTML = '<p class="text-faint text-center py-4 mb-0">No notes match “' + escHtml(_noteQuery.trim()) + '”</p>'
    return
  }
  // While searching, body matches open automatically so you can see the hit.
  host.innerHTML = '<div class="notes-acc">' + shown.map(n => {
    const isOpen = open.has(n.id) || (q !== '' && (n.body || '').toLowerCase().includes(q))
    return noteAccItem(n, isOpen, q)
  }).join('') + '</div>'
  // Syntax-highlight any fenced code blocks in the notes we just inserted (autoloader
  // fetches whichever language grammar the fence names, e.g. ```typescript).
  if (window.Prism) Prism.highlightAllUnder(host)
}

function renderTopicNotes() {
  const host = document.getElementById('tab-notes')
  if (!host) return
  const topic = TOPICS.find(t => t.key === currentTopicKey)
  const notes = getTopicNotes(currentTopicKey)

  let html = '<div class="notes-head d-flex align-items-center justify-content-between mb-3">' +
    '<div><h6 class="mb-0">📝 Notes' + (topic ? ' — ' + escHtml(topic.label) : '') +
    (notes.length ? ' <span class="text-faint" style="font-weight:400">(' + notes.length + ')</span>' : '') + '</h6>' +
    '<span class="text-faint" style="font-size:var(--fs-xs)">Concise things to remember for this topic</span></div>' +
    '<button class="btn-add-note" onclick="startNewTopicNote()">＋ New note</button>' +
    '</div>'

  html += '<div id="note-editor-host"></div>'

  if (notes.length) {
    html += '<div class="notes-toolbar">' +
      '<input class="note-search" id="note-search" type="search" placeholder="🔍 Search notes — title or body…" value="' + escHtml(_noteQuery) + '"' +
      ' oninput="_onNoteSearch(this.value)" onkeydown="if(event.key===\'Escape\'){this.value=\'\';_onNoteSearch(\'\')}">' +
      '<button class="btn-notes-toggle-all" id="btn-notes-toggle-all" onclick="toggleAllNotes()"></button>' +
      '</div>'
  }

  html += '<div id="notes-acc-host"></div>'
  host.innerHTML = html
  _renderNotesList()

  // Re-open the editor if we were mid-edit when a re-render happened.
  if (_editingNoteId === '__new__') renderNoteEditor({ id: null, title: '', body: '' })
  else if (_editingNoteId) {
    const n = notes.find(x => x.id === _editingNoteId)
    if (n) renderNoteEditor(n)
  }
}

// Remember the size the user drags the note editor to, so every note opens that big.
// Per-device UI preference (not synced).
const NOTE_EDITOR_H_KEY = 'dsa-note-editor-h-v1'
function _noteEditorHeightStyle() {
  try { const h = localStorage.getItem(NOTE_EDITOR_H_KEY); return h ? ' style="height:' + h + '"' : '' } catch { return '' }
}
function _saveNoteEditorHeight(el) {
  // Only remember pixel heights from a manual drag — never the Expand button's vh height.
  try { const h = el && el.style.height; if (h && /px$/.test(h)) localStorage.setItem(NOTE_EDITOR_H_KEY, h) } catch {}
}
function _toggleNoteEditorExpand(btn) {
  const ta = document.getElementById('note-edit-body')
  if (!ta) return
  if (ta.dataset.expanded === '1') {
    ta.dataset.expanded = '0'
    let saved = '220px'; try { saved = localStorage.getItem(NOTE_EDITOR_H_KEY) || '220px' } catch {}
    ta.style.height = saved
    btn.textContent = '⤢ Expand'
  } else {
    ta.dataset.expanded = '1'
    ta.style.height = '75vh'
    btn.textContent = '⤡ Shrink'
  }
}

function renderNoteEditor(n) {
  const host = document.getElementById('note-editor-host')
  if (!host) return
  host.innerHTML =
    '<div class="note-editor">' +
    '<input class="note-editor-title" id="note-edit-title" placeholder="Note title (e.g. Topological sort)" value="' + escHtml(n.title || '') + '">' +
    '<textarea class="note-editor-body" id="note-edit-body"' + _noteEditorHeightStyle() + ' onmouseup="_saveNoteEditorHeight(this)" placeholder="Markdown supported — # heading · **bold** · *italic* · `code` · ```block``` - bullets · 1. list · &gt; quote · [link](url). Drag the bottom-right corner to resize.">' + escHtml(n.body || '') + '</textarea>' +
    '<div class="note-editor-actions">' +
    '<button class="btn-note-expand" onclick="_toggleNoteEditorExpand(this)" title="Expand / shrink the editor">⤢ Expand</button>' +
    '<span class="note-editor-hint">**bold** · `code` · drag the ▝ corner to resize</span>' +
    '<button class="btn-note-cancel" onclick="cancelNoteEditor()">Cancel</button>' +
    '<button class="btn-note-save" onclick="saveTopicNoteFromEditor()">Save</button>' +
    '</div></div>'
  const t = document.getElementById('note-edit-title')
  if (t) t.focus()
}

function startNewTopicNote() {
  _editingNoteId = '__new__'
  renderNoteEditor({ id: null, title: '', body: '' })
  document.getElementById('note-editor-host')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
}

function editTopicNote(id) {
  const n = getTopicNotes(currentTopicKey).find(x => x.id === id)
  if (!n) return
  _editingNoteId = id
  renderNoteEditor(n)
  document.getElementById('note-editor-host')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
}

function cancelNoteEditor() {
  _editingNoteId = null
  const h = document.getElementById('note-editor-host')
  if (h) h.innerHTML = ''
}

function saveTopicNoteFromEditor() {
  const title = (document.getElementById('note-edit-title')?.value || '').trim()
  const body  = (document.getElementById('note-edit-body')?.value || '').trim()
  if (!title && !body) { cancelNoteEditor(); return }
  const existing = (_editingNoteId && _editingNoteId !== '__new__')
    ? getTopicNotes(currentTopicKey).find(x => x.id === _editingNoteId)
    : null
  const note = {
    id: existing ? existing.id : 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title,
    body,
    pinned: existing ? !!existing.pinned : false,
    updatedAt: Date.now(),
  }
  upsertTopicNote(currentTopicKey, note)
  _editingNoteId = null
  // Open the note you just saved so the result is visible.
  const open = _openNoteSet(getTopicNotes(currentTopicKey))
  open.add(note.id)
  _saveOpenNoteSet(open)
  renderTopicNotes()
}

function toggleTopicNotePin(id) {
  const n = getTopicNotes(currentTopicKey).find(x => x.id === id)
  if (!n) return
  upsertTopicNote(currentTopicKey, { ...n, pinned: !n.pinned, updatedAt: n.updatedAt || Date.now() })
  renderTopicNotes()
}

function removeTopicNote(id) {
  if (!confirm('Delete this note?')) return
  deleteTopicNote(currentTopicKey, id)
  if (_editingNoteId === id) _editingNoteId = null
  renderTopicNotes()
}

// ─── QUESTIONS TAB ────────────────────────────────────────────────────────────
// AI: if adding P7, P8 etc — add to PATTERN_HEADING_CLASS here AND
// add matching .ph-p7, .ph-p8 CSS rules in section 18 of the stylesheet.
const PATTERN_HEADING_CLASS = { P1: 'ph-p1', P2: 'ph-p2', P3: 'ph-p3', P4: 'ph-p4', P5: 'ph-p5', P6: 'ph-p6', P7: 'ph-p7', P8: 'ph-p8', P9: 'ph-p9', P10: 'ph-p10', P11: 'ph-p11', P12: 'ph-p12', P13: 'ph-p13', P14: 'ph-p14', P15: 'ph-p15' }

// ─── QUESTION FILTER ──────────────────────────────────────────────────────────
function setQFilter(filter) {
  currentQFilter = filter
  document.querySelectorAll('.q-filter-btn[data-filter]').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-filter') === filter)
  })
  const mod = TOPIC_MODULES[currentTopicKey]
  if (mod) _renderFilteredQuestions(mod)
}

// Frequency filter — independent dimension; composes with status + company filters.
function setFreqFilter(f) {
  currentFreqFilter = f
  document.querySelectorAll('.q-freq-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-freq') === f)
  })
  const mod = TOPIC_MODULES[currentTopicKey]
  if (mod) _renderFilteredQuestions(mod)
}

// Click a company chip to show only its questions; click the active one (or "All") to clear.
function setCompanyFilter(key) {
  currentCompanyFilter = (currentCompanyFilter === key) ? null : key
  document.querySelectorAll('.company-chip').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-company') === (currentCompanyFilter || ''))
  })
  const mod = TOPIC_MODULES[currentTopicKey]
  if (mod) _renderFilteredQuestions(mod)
}

function renderQuestions(mod) {
  const container = document.getElementById('tab-questions')
  const allQEntries = Object.entries(mod.questions)

  if (allQEntries.length === 0) {
    container.innerHTML = '<div class="text-center py-5"><span style="font-size:2rem;" class="text-secondary">📭</span><p class="text-secondary mt-3 small">No questions yet.</p></div>'
    return
  }

  // Count per status for filter buttonslabels
  const counts = { all: allQEntries.length, Pending: 0, 'In Progress': 0, Solved: 0 }
  allQEntries.forEach(([k]) => { counts[getStatus(k)]++ })

  const filters = ['all', 'Pending', 'In Progress', 'Solved']
  const filterLabels = { all: 'All', Pending: '📋 Pending', 'In Progress': '🚧 In Progress', Solved: '✅ Solved' }
  let html = '<div class="q-filter-bar">'
  filters.forEach(f => {
    const isActive = f === currentQFilter
    html += '<button type="button" class="q-filter-btn' + (isActive ? ' active' : '') + '" data-filter="' + f + '" onclick="setQFilter(\'' + f + '\')">' +
      filterLabels[f] + ' <span style="opacity:0.6">(' + counts[f] + ')</span></button>'
  })
  html += '</div>'

  // Frequency filter (violet) — independent dimension, composes with status + company.
  const freqCounts = { all: allQEntries.length, High: 0, Medium: 0, Low: 0 }
  allQEntries.forEach(([, q]) => { if (freqCounts[q.freq] !== undefined) freqCounts[q.freq]++ })
  const freqOrder = ['all', 'High', 'Medium', 'Low']
  const freqBtnLabels = { all: 'All', High: '🔴 High', Medium: '🟡 Medium', Low: '⚪ Low' }
  html += '<div class="q-filter-bar"><span class="company-filter-label">📊 Frequency</span>'
  freqOrder.forEach(f => {
    const isActive = f === currentFreqFilter
    html += '<button type="button" class="q-filter-btn q-freq-btn' + (isActive ? ' active' : '') + '" data-freq="' + f + '" onclick="setFreqFilter(\'' + f + '\')">' +
      freqBtnLabels[f] + ' <span style="opacity:0.6">(' + freqCounts[f] + ')</span></button>'
  })
  html += '</div>'

  // Company filter chips — only companies that actually tag a question in THIS topic,
  // sorted by how many (most relevant first). Counts reflect this topic only.
  const compCounts = {}
  allQEntries.forEach(([, q]) => getCompanies(q.leetcode).forEach(c => { compCounts[c] = (compCounts[c] || 0) + 1 }))
  const presentCompanies = COMPANIES.filter(c => compCounts[c.key]).sort((a, b) => compCounts[b.key] - compCounts[a.key])
  if (presentCompanies.length) {
    html += '<div class="company-filter-bar">'
    html += '<span class="company-filter-label">🏢 Asked at</span>'
    html += '<button type="button" class="company-chip' + (currentCompanyFilter === null ? ' active' : '') + '" data-company="" onclick="setCompanyFilter(null)">All</button>'
    presentCompanies.forEach(c => {
      const active = currentCompanyFilter === c.key
      html += '<button type="button" class="company-chip' + (active ? ' active' : '') + '" data-company="' + c.key + '" onclick="setCompanyFilter(\'' + c.key + '\')">' +
        c.label + ' <span style="opacity:0.6">(' + compCounts[c.key] + ')</span></button>'
    })
    html += '</div>'
  }

  html += '<div id="q-filtered-list"></div>'
  container.innerHTML = html
  _renderFilteredQuestions(mod)
}

function _renderFilteredQuestions(mod) {
  const listEl = document.getElementById('q-filtered-list')
  if (!listEl) return

  const allQEntries = Object.entries(mod.questions)
  const filtered = allQEntries
    .filter(([k]) => currentQFilter === 'all' || getStatus(k) === currentQFilter)
    .filter(([, q]) => currentFreqFilter === 'all' || q.freq === currentFreqFilter)
    .filter(([, q]) => !currentCompanyFilter || getCompanies(q.leetcode).includes(currentCompanyFilter))

  if (filtered.length === 0) {
    const parts = []
    if (currentQFilter !== 'all') parts.push(currentQFilter)
    if (currentFreqFilter !== 'all') parts.push(FREQ_LABEL[currentFreqFilter])
    if (currentCompanyFilter) parts.push('@ ' + (COMPANY_LABEL[currentCompanyFilter] || currentCompanyFilter))
    listEl.innerHTML = '<div class="text-center py-5 text-secondary"><p class="small">No ' + (parts.join(' ') || '') + ' questions.</p></div>'
    return
  }

  const byPattern = {}
  mod.patterns.forEach(p => { byPattern[p.id] = [] })
  byPattern['_other'] = []

  filtered.forEach(([k, q]) => {
    const pat = mod.patterns.find(p => p.questionIds.includes(k))
    if (pat) byPattern[pat.id].push([k, q])
    else byPattern['_other'].push([k, q])
  })

  let html = ''
  mod.patterns.forEach(p => {
    const qs = byPattern[p.id]
    if (!qs.length) return
    const phCls = 'ph ' + (PATTERN_HEADING_CLASS[p.id] || '')
    const signalPills = p.recognitionSignals.map(s => '<span class="ph-signal-pill">' + escHtml(s) + '</span>').join('')

    // ── Pattern heading + always-visible signal pills ──
    html += '<div class="ph-wrap mb-3">'
    html += '<div class="' + phCls + '">'
    html += '<span class="ph-id">' + p.id + '</span>'
    html += '<span>' + escHtml(p.name) + '</span>'
    html += '<span class="ms-auto ph-count">' + qs.length + ' question' + (qs.length !== 1 ? 's' : '') + '</span>'
    html += '</div>'
    if (signalPills) {
      html += '<div class="ph-signals"><span class="ph-spot-label">Spot it →</span>' + signalPills + '</div>'
    }
    html += '</div>'

    html += '<div class="accordion mb-3" id="acc-q-' + p.id + '">'
    qs.forEach(([k, q], i) => { html += buildQuestionAccordionItem(k, q, 'q-' + p.id, i) })
    html += '</div>'
  })

  if (byPattern['_other'].length) {
    html += '<div class="accordion mb-3" id="acc-q-other">'
    byPattern['_other'].forEach(([k, q], i) => { html += buildQuestionAccordionItem(k, q, 'q-other', i) })
    html += '</div>'
  }

  listEl.innerHTML = html
}

function buildQuestionAccordionItem(lcKey, q, groupId, index) {
  const id = 'acc-' + groupId + '-' + index
  const status   = getStatus(lcKey)
  const solveN   = getSolveCount(lcKey)
  const solveRing = '<span class="solve-ring-wrap" onclick="event.stopPropagation()" title="' + _solveRingTitle(solveN) + '">'
    + '<button class="solve-ring-adj" onclick="_adjSolveCount(\'' + lcKey + '\',-1)">−</button>'
    + '<span class="solve-ring ' + _solveRingCls(solveN) + '" data-solve-key="' + lcKey + '">' + _solveRingEmoji(solveN) + '<span class="solve-ring-num">' + solveN + '</span></span>'
    + '<button class="solve-ring-adj" onclick="_adjSolveCount(\'' + lcKey + '\',1)">+</button>'
    + '</span>'

  const reviseCtrl = _reviseControlHtml(lcKey)

  const tags = (q.tags || []).map(t => '<span class="badge badge-tag me-1">' + t + '</span>').join('')
  const companyChips = getCompanies(q.leetcode).slice()
    .sort((a, b) => (COMPANY_ORDER[a] ?? 99) - (COMPANY_ORDER[b] ?? 99))
    .map(c => companyPill(c)).join('')
  const companyRow = companyChips ? '<div class="mb-2 small d-flex flex-wrap align-items-center gap-1"><span class="q-section-label me-1">🏢 Asked at</span><span class="q-companies">' + companyChips + '</span></div>' : ''
  const altApproaches = (q.alternateApproaches || []).map(a =>
    '<span class="badge bg-secondary me-1" title="' + escHtml(a.tradeoff) + '">' + escHtml(a.technique) + '</span>'
  ).join('')

  const conditionLabel = { 'two-pointers': 'Pointer condition', 'binary-search': 'Feasibility check', 'sorting': 'Key condition', 'heap': 'Key condition', 'recursion': 'Base case', 'trees': 'Recurrence / base case', 'stack': 'Push / pop rule', 'linked-list': 'Pointer move', 'trie': 'Node step', 'design': 'Core operation', 'bit-manipulation': 'Bit trick', 'intervals': 'Sort / merge rule' }[currentTopicKey] || 'Shrink trigger'
  const existingNote = getNote(lcKey)

  // Hidden by choice (Jul 2026): shrink/complexity/gotcha/FAANG rows were never
  // read. The fields still exist in data.js — flip to true to show them again.
  const SHOW_QUESTION_EXTRAS = false

  const insightRow    = q.keyInsight    ? '<div class="insight-box mb-2 small"><strong class="text-info">💡 Insight:</strong> '  + escHtml(q.keyInsight)   + '</div>' : ''
  const shrinkRow     = q.shrinkTrigger ? '<p class="mb-2 small"><span class="text-secondary">' + conditionLabel + ':</span> <code>' + escHtml(q.shrinkTrigger) + '</code></p>' : ''
  const complexityRow = (q.timeComplexity || q.spaceComplexity) ?
    '<div class="d-flex gap-3 mb-2">' +
    (q.timeComplexity  ? '<span class="text-secondary small">⏱ ' + q.timeComplexity  + '</span>' : '') +
    (q.spaceComplexity ? '<span class="text-secondary small">💾 ' + q.spaceComplexity + '</span>' : '') +
    '</div>' : ''
  const gotchaRow  = q.gotcha    ? '<div class="gotcha-box mb-2 small"><strong class="text-danger">⚠ Gotcha:</strong> '  + escHtml(q.gotcha)    + '</div>' : ''
  const faangRow   = q.faangNote ? '<div class="faang-box mb-2 small"><strong class="text-success">★ FAANG:</strong> '  + escHtml(q.faangNote) + '</div>' : ''
  const altRow     = altApproaches ? '<div class="mb-2 small d-flex flex-wrap align-items-center gap-1"><span class="q-section-label me-1">🔀 Alt approaches</span><span>' + altApproaches + '</span></div>' : ''
  const subsRow    = '<div class="mt-3 pt-2" style="border-top:1px solid var(--border)" id="subs-' + lcKey + '">' + _subsRowHtml(lcKey) + '</div>'
  const noteRow    = '<div class="mt-3 pt-2" style="border-top:1px solid var(--border)"><p class="mb-2"><span class="q-section-label">📝 My notes</span></p>' +
    '<textarea class="note-area" placeholder="Add your attempt notes, observations, or reminders here…" id="note-' + lcKey + '"' +
    ' onblur="saveNoteFromTextarea(\'' + lcKey + '\')">' + escHtml(existingNote) + '</textarea>' +
    '<span class="note-saved-flash" id="note-flash-' + lcKey + '">Saved</span>' +
    '</div>'

  return (
    '<div class="accordion-item" data-lc-key="' + lcKey + '">' +
    '<h2 class="accordion-header">' +

    // ── Status dot + LC button — outside the accordion toggle button
    '<div class="q-header-actions">' +
    '<span class="status-cycle-btn ' + (STATUS_DOT[status] || 'bg-secondary') + '"' +
    ' title="Status: ' + status + ' — click to cycle"' +
    ' aria-label="Status: ' + status + ' — click to cycle"' +
    ' onclick="cycleQuestionStatus(\'' + lcKey + '\', this)"' +
    ' data-lc-key="' + lcKey + '">' +
    STATUS_EMOJI[status] +
    '</span>' +
    '<span class="status-cycle-btn bg-secondary qa-ghost"' +
    ' title="Open on LeetCode"' +
    ' aria-label="Open ' + escHtml(q.title) + ' on LeetCode"' +
    ' onclick="window.open(\'' + q.link + '\', \'_blank\')">↗</span>' +
    _subBtnHtml(lcKey) +
    '<span class="qa-div"></span>' +
    reviseCtrl +
    '<span class="qa-div"></span>' +
    solveRing +
    '</div>' +

    '<button class="accordion-button collapsed rounded" type="button" data-bs-toggle="collapse" data-bs-target="#' + id + '">' +
    // ── Title + sub-row (badges) — two-line layout
    '<span class="q-header-content">' +
    '<span class="q-title">' + escHtml(q.title) + '</span>' +
    '<span class="q-meta">' +
    '<span class="badge bg-' + DIFFICULTY_BADGE[q.difficulty] + ' q-badge">' + q.difficulty + '</span>' +
    (q.freq ? '<span class="q-badge-sep"></span>' + freqBadge(q) : '') +
    _reviseGradeBadge(lcKey) +
    (existingNote ? '<span class="q-badge-sep"></span><span class="badge bg-secondary q-badge" title="Has notes">📝</span>' : '') +
    '</span>' +
    companyPillsRow(q.leetcode) +
    '</span>' +

    '</button></h2>' +
    '<div id="' + id + '" class="accordion-collapse collapse">' +
    '<div class="accordion-body small">' +
    (tags ? '<div class="mb-3 d-flex flex-wrap gap-1">' + tags + '</div>' : '') +
    companyRow +
    insightRow + (SHOW_QUESTION_EXTRAS ? shrinkRow + complexityRow + gotchaRow + faangRow : '') + altRow + subsRow + noteRow +
    '</div></div></div>'
  )
}

function setQuestionStatus(lcKey, status, btnEl) {
  setStatus(lcKey, status)
  // Update the question's status dot in the main accordion (if it's rendered).
  // Scope to .status-cycle-btn: practice rows ALSO carry [data-lc-key], so a bare
  // [data-lc-key] lookup (used when no btnEl is passed — e.g. from the practice panel)
  // would grab the first practice row and corrupt it into a green ✅ blob. The status
  // dot is the only .status-cycle-btn with a data-lc-key, so this targets it exactly.
  const cycleBtn = btnEl || document.querySelector('.status-cycle-btn[data-lc-key="' + lcKey + '"]')
  if (cycleBtn) {
    cycleBtn.className  = 'status-cycle-btn ' + (STATUS_DOT[status] || 'bg-secondary')
    cycleBtn.title      = 'Status: ' + status + ' — click to cycle'
    cycleBtn.setAttribute('aria-label', 'Status: ' + status + ' — click to cycle')
    cycleBtn.textContent = STATUS_EMOJI[status] ?? '📋'
  }
  // Refresh topic tracker and sidebar nav badge
  const mod = TOPIC_MODULES[currentTopicKey]
  if (mod) {
    renderTopicTracker(mod)
    const navBadge = document.getElementById('nav-badge-' + currentTopicKey)
    if (navBadge) {
      const qKeys  = Object.keys(mod.questions)
      const solved = qKeys.filter(k => getStatus(k) === 'Solved').length
      navBadge.textContent = solved + '/' + qKeys.length
      navBadge.className = 'badge rounded-pill text-xxs ' + _navBadgeCls(solved, qKeys.length)
    }
  }
  // If filtered view is active, re-render filtered list to reflect new status
  if (currentQFilter !== 'all' && mod) _renderFilteredQuestions(mod)
}

function cycleQuestionStatus(lcKey, cycleBtn) {
  const current = getStatus(lcKey)
  const next    = STATUS_CYCLE[current] || 'In Progress'
  setQuestionStatus(lcKey, next, cycleBtn)
}

// ─── REVISE GRADE CONTROL (active-recall queue) ───────────────────────────────
// Replaces the old single 👀 eye. Three grades drive the REVISE ladder independently of
// the CODE/solve ladder. Crucially, grading does NOT credit a code solve (the old eye did).
function _reviseTitle(state) {
  if (state === 'none')  return 'Active recall — grade how well you re-derived this from the problem statement (not a code solve)'
  if (state === 'due')   return 'Due for a recall pass — grade ✓ Solid / ~ Shaky / ✗ Forgot'
  return 'Revised — fresh. Grade again when it next comes due to keep the spacing going'
}
function _reviseControlHtml(lcKey) {
  const state = getReviseState(lcKey)
  return '<span class="revise-ctrl revise-' + state + '" id="revise-ctrl-' + lcKey + '"' +
    ' title="' + _reviseTitle(state) + '" onclick="event.stopPropagation()">' +
    '<span class="revise-dot">🧠</span>' +
    '<button class="rev-grade rev-solid"  title="Recalled it cold — push the next review further out"   onclick="gradeRevise(\'' + lcKey + '\',\'solid\',this)">✓</button>' +
    '<button class="rev-grade rev-shaky"  title="Shaky — needed a hint, keep it in short rotation"        onclick="gradeRevise(\'' + lcKey + '\',\'shaky\',this)">~</button>' +
    '<button class="rev-grade rev-forgot" title="Forgot — re-queue it for a cold solve in the CODE queue" onclick="gradeRevise(\'' + lcKey + '\',\'forgot\',this)">✗</button>' +
    '</span>'
}
function _refreshReviseCtrl(lcKey) {
  const c = document.getElementById('revise-ctrl-' + lcKey)
  if (!c) return
  const st = getReviseState(lcKey)
  c.className = 'revise-ctrl revise-' + st
  c.title = _reviseTitle(st)
}
// Always-present badge showing your LAST revise grade (✓/~/✗), so the rating you gave stays
// visible on cards & practice rows. Hidden (rg-none) until first graded. Display-only — reads
// the persisted grade, changes nothing.
function _reviseGradeBadge(lcKey) {
  const r = getRevise(lcKey)
  const map = { solid: ['rg-solid', '✓', 'recalled cold'], shaky: ['rg-shaky', '~', 'shaky'], forgot: ['rg-forgot', '✗', 'forgot'] }
  const m = r && r.grade && map[r.grade]
  return '<span class="revise-grade-badge ' + (m ? m[0] : 'rg-none') + '" data-rg-key="' + lcKey + '"' +
    (m ? ' title="Last revise grade: ' + m[2] + '"' : '') + '>' + (m ? m[1] : '') + '</span>'
}
// Live-update every on-screen grade badge for a question (card + any practice rows).
function _refreshReviseGradeBadges(lcKey) {
  document.querySelectorAll('.revise-grade-badge[data-rg-key="' + lcKey + '"]').forEach(el => { el.outerHTML = _reviseGradeBadge(lcKey) })
}
// Grade a recall pass. Solid/Shaky/Forgot move the revise ladder; Forgot also force-queues a
// cold re-solve. No solve-count change (recall ≠ coding). Counts toward the daily streak.
function gradeRevise(lcKey, grade, el) {
  // ✓ "recalled it cold" credits ONE solve on the confidence ring (deduped to once/day) — a clean
  // recall is a real successful rep. ~ shaky and ✗ forgot never credit. This is the ONLY link from
  // recall to the solve count, and only on an explicit positive grade (unlike the old eye, which
  // bumped on every passive click). Status is untouched here beyond the 📋→🚧 nudge below.
  const prev  = getRevise(lcKey)
  const today = _localDay()
  const creditedSolidToday = prev && prev.grade === 'solid' && prev.last && _localDay(new Date(prev.last)) === today
  markRevised(lcKey, grade)
  setCodeForced(lcKey, grade === 'forgot')
  if (grade === 'solid' && !creditedSolidToday) _adjSolveCount(lcKey, 1)
  _updateStreak()
  // Engaging with recall promotes an untouched (📋 Pending) question — never downgrades, never auto-✅.
  if (getStatus(lcKey) === 'Pending') setQuestionStatus(lcKey, 'In Progress')
  _refreshReviseCtrl(lcKey)
  _refreshReviseGradeBadges(lcKey)
  _refreshDueCounts()
}

// ─── SAVE NOTE ────────────────────────────────────────────────────────────────
function saveNoteFromTextarea(lcKey) {
  const ta = document.getElementById('note-' + lcKey)
  if (!ta) return
  setNote(lcKey, ta.value)
  // Update the 📝 badge in the accordion header without a full re-render
  const item = ta.closest('.accordion-item')
  if (item) {
    const meta = item.querySelector('.q-meta')
    if (meta) {
      const existing = meta.querySelector('[title="Has notes"]')
      if (ta.value.trim() && !existing) {
        meta.insertAdjacentHTML('beforeend',
          '<span class="q-badge-sep"></span><span class="badge bg-secondary q-badge" title="Has notes">📝</span>')
      } else if (!ta.value.trim() && existing) {
        const sep = existing.previousElementSibling
        if (sep && sep.classList.contains('q-badge-sep')) sep.remove()
        existing.remove()
      }
    }
  }
  const flash = document.getElementById('note-flash-' + lcKey)
  if (flash) {
    flash.classList.add('show')
    setTimeout(() => flash.classList.remove('show'), 1500)
  }
}

// ─── PER-QUESTION SUBMISSION LINKS ────────────────────────────────────────────
// Up to MAX_SUBMISSIONS LeetCode submission URLs per question, shown as pills
// above "My notes". Storage lives in data.js (SUBMISSIONS_KEY / getSubmissions …).
// Safety allowlist: https-only, known judge hosts only. Checked on save AND again
// at render time, so a tampered/synced payload can never put javascript:/data: or
// an unknown host into a pill's href. URL() lowercases and punycodes the hostname,
// so lookalike unicode domains fail the regex too.
function _isSafeSubmissionUrl(u) {
  try {
    const p = new URL(u)
    if (p.protocol !== 'https:') return false
    if (/(^|\.)leetcode\.(com|cn)$/.test(p.hostname)) return p.pathname.includes('/submissions')
    if (/(^|\.)lintcode\.com$/.test(p.hostname)) return true
    if (/(^|\.)neetcode\.io$/.test(p.hostname)) return p.pathname.includes('/history')
    return false
  } catch { return false }
}

function _subsRowHtml(lcKey) {
  const subs = getSubmissions(lcKey)
  const fmt = ts => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
  let html = '<p class="mb-2"><span class="q-section-label">🔗 My submissions</span> <span class="text-faint" style="font-size:var(--fs-xs)">(' + subs.length + '/' + MAX_SUBMISSIONS + ')</span></p>' +
    '<div class="subs-row">' +
    subs.map((s, i) => {
      const x = '<span class="sub-pill-x" title="Remove link" onclick="event.preventDefault();event.stopPropagation();removeSubmission(\'' + lcKey + '\',' + i + ')">✕</span>'
      // Render-time guard: anything that fails the allowlist gets an inert pill
      // (no href) so it can still be seen and deleted, but never followed.
      if (!_isSafeSubmissionUrl(s.url)) {
        return '<span class="sub-pill sub-pill-blocked" title="Blocked — not a recognized LeetCode/LintCode link">🚫 #' + (i + 1) + ' · ' + fmt(s.addedAt) + x + '</span>'
      }
      return '<a class="sub-pill" href="' + escHtml(s.url) + '" target="_blank" rel="noopener noreferrer" title="' + escHtml(s.url) + '">' +
        '↗ #' + (i + 1) + ' · ' + fmt(s.addedAt) + x + '</a>'
    }).join('')
  if (subs.length < MAX_SUBMISSIONS) {
    html += '<button class="btn-add-sub" onclick="showAddSubmission(\'' + lcKey + '\')">＋ Add link</button>'
  }
  html += '</div><div id="sub-add-' + lcKey + '"></div>'
  return html
}

function _refreshSubsRow(lcKey) {
  const host = document.getElementById('subs-' + lcKey)
  if (!host) return
  host.innerHTML = _subsRowHtml(lcKey)
  // Keep the 🔗 button in the question header in step without a full re-render
  _refreshSubBtn(lcKey)
}

// ─── 🔗 MY-SOLUTION BUTTON (question header) ─────────────────────────────────
// Lives next to ↗ so you can open your saved submission without expanding the card.
//   0 links → dim; click opens a small paste-a-link form
//   1 link  → click opens it in a new tab
//   2+      → click opens a small list (newest first) with an Add option while under the cap
function _subBtnTitle(n) {
  if (!n) return 'Add a link to your submission'
  return n === 1 ? 'Open my solution' : 'My solutions (' + n + ') — pick one'
}
function _subBtnHtml(lcKey) {
  const n = getSubmissions(lcKey).length
  return '<span class="status-cycle-btn sub-open-btn ' + (n ? 'has-subs' : 'qa-ghost') + '"' +
    ' data-sub-btn="' + lcKey + '" role="button" title="' + _subBtnTitle(n) + '" aria-label="' + _subBtnTitle(n) + '"' +
    ' onclick="event.stopPropagation();onSubBtnClick(\'' + lcKey + '\', this)">🔗' +
    (n > 1 ? '<span class="sub-btn-count">' + n + '</span>' : '') + '</span>'
}
function _refreshSubBtn(lcKey) {
  document.querySelectorAll('.sub-open-btn[data-sub-btn="' + lcKey + '"]').forEach(btn => {
    const n = getSubmissions(lcKey).length
    btn.classList.toggle('has-subs', n > 0)
    btn.classList.toggle('qa-ghost', n === 0)
    btn.title = _subBtnTitle(n)
    btn.setAttribute('aria-label', _subBtnTitle(n))
    btn.innerHTML = '🔗' + (n > 1 ? '<span class="sub-btn-count">' + n + '</span>' : '')
  })
}
function _closeSubMenu() {
  document.getElementById('sub-menu')?.remove()
  document.removeEventListener('mousedown', _subMenuOutside, true)
  document.removeEventListener('keydown', _subMenuKey, true)
  window.removeEventListener('scroll', _subMenuReflow, true)
  window.removeEventListener('resize', _subMenuReflow)
}
// Scroll/resize close the popover because it is fixed-position and would drift off its button. But
// pasting a long link scrolls the INPUT sideways (the capture listener sees that too), and a phone
// keyboard opening fires resize, so ignore scrolls inside the menu and height-only resizes.
let _subMenuW = 0
function _subMenuReflow(e) {
  if (e.type === 'scroll' && document.getElementById('sub-menu')?.contains(e.target)) return
  if (e.type === 'resize' && window.innerWidth === _subMenuW) return
  _closeSubMenu()
}
function _subMenuOutside(e) {
  const m = document.getElementById('sub-menu')
  if (m && !m.contains(e.target) && !e.target.closest('.sub-open-btn')) _closeSubMenu()
}
function _subMenuKey(e) { if (e.key === 'Escape') _closeSubMenu() }
function onSubBtnClick(lcKey, btn) {
  const wasOpenFor = document.getElementById('sub-menu')?.dataset.key === lcKey
  _closeSubMenu()
  if (wasOpenFor) return
  const subs = getSubmissions(lcKey)
  if (subs.length === 1 && _isSafeSubmissionUrl(subs[0].url)) {
    window.open(subs[0].url, '_blank', 'noopener,noreferrer')
    return
  }
  const menu = document.createElement('div')
  menu.id = 'sub-menu'; menu.className = 'sub-menu'; menu.dataset.key = lcKey
  document.body.appendChild(menu)
  _renderSubMenu(lcKey, !subs.length)
  const r = btn.getBoundingClientRect()
  const w = menu.offsetWidth
  menu.style.left = Math.max(8, Math.min(r.left, document.documentElement.clientWidth - w - 8)) + 'px'
  menu.style.top  = Math.min(r.bottom + 6, Math.max(8, window.innerHeight - menu.offsetHeight - 8)) + 'px'
  document.addEventListener('mousedown', _subMenuOutside, true)
  document.addEventListener('keydown', _subMenuKey, true)
  _subMenuW = window.innerWidth
  window.addEventListener('scroll', _subMenuReflow, true)
  window.addEventListener('resize', _subMenuReflow)
  menu.querySelector('input')?.focus({ preventScroll: true })
}
function _renderSubMenu(lcKey, adding) {
  const menu = document.getElementById('sub-menu')
  if (!menu) return
  const subs = getSubmissions(lcKey)
  const fmt = ts => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
  let html = ''
  if (adding) {
    html = '<div class="sub-menu-title">Paste a LeetCode submission, LintCode or NeetCode history link</div>' +
      '<input class="sub-input" id="sub-menu-input" placeholder="https://leetcode.com/…/submissions/…"' +
      ' onkeydown="if(event.key===\'Enter\')saveSubmissionFromMenu(\'' + lcKey + '\')">' +
      '<div class="sub-err" id="sub-menu-err"></div>' +
      '<div class="sub-menu-actions"><button class="btn-note-cancel" onclick="_closeSubMenu()">Cancel</button>' +
      '<button class="btn-note-save" onclick="saveSubmissionFromMenu(\'' + lcKey + '\')">Save</button></div>'
  } else {
    html = '<div class="sub-menu-title">My solutions</div>' +
      subs.map((s, i) => ({ s, i })).reverse().map(({ s, i }) =>
        _isSafeSubmissionUrl(s.url)
          ? '<a class="sub-menu-item" href="' + escHtml(s.url) + '" target="_blank" rel="noopener noreferrer" onclick="_closeSubMenu()"><span>#' + (i + 1) + ' · ' + fmt(s.addedAt) + '</span><span>↗</span></a>'
          : '<span class="sub-menu-item blocked" title="Blocked — not a recognized link"><span>🚫 #' + (i + 1) + ' · ' + fmt(s.addedAt) + '</span></span>'
      ).join('') +
      (subs.length < MAX_SUBMISSIONS ? '<div class="sub-menu-item sub-menu-add" onclick="_renderSubMenu(\'' + lcKey + '\', true);document.getElementById(\'sub-menu-input\')?.focus({preventScroll:true})">＋ Add link</div>' : '')
  }
  menu.innerHTML = html
}
function saveSubmissionFromMenu(lcKey) {
  const url = (document.getElementById('sub-menu-input')?.value || '').trim()
  const err = document.getElementById('sub-menu-err')
  if (!_isSafeSubmissionUrl(url)) {
    if (err) err.textContent = "That doesn't look like a valid link — expected a leetcode.com …/submissions/…, lintcode.com or neetcode.io …/history link."
    return
  }
  if (!addSubmission(lcKey, url)) {
    if (err) err.textContent = 'Max ' + MAX_SUBMISSIONS + ' links per question — remove one in the card first.'
    return
  }
  _refreshSubsRow(lcKey)   // updates the card's list (if rendered) and the header button
  _refreshSubBtn(lcKey)
  _closeSubMenu()
}

function showAddSubmission(lcKey) {
  const host = document.getElementById('sub-add-' + lcKey)
  if (!host) return
  host.innerHTML = '<div class="d-flex gap-2 align-items-center mt-2">' +
    '<input class="sub-input" id="sub-input-' + lcKey + '" placeholder="Paste a LeetCode submission URL (…/submissions/…), a LintCode link, or a NeetCode history link"' +
    ' onkeydown="if(event.key===\'Enter\')saveSubmissionFromInput(\'' + lcKey + '\');else if(event.key===\'Escape\')cancelAddSubmission(\'' + lcKey + '\')">' +
    '<button class="btn-note-save" onclick="saveSubmissionFromInput(\'' + lcKey + '\')">Save</button>' +
    '<button class="btn-note-cancel" onclick="cancelAddSubmission(\'' + lcKey + '\')">Cancel</button>' +
    '</div><div class="sub-err" id="sub-err-' + lcKey + '"></div>'
  document.getElementById('sub-input-' + lcKey)?.focus()
}

function cancelAddSubmission(lcKey) {
  const host = document.getElementById('sub-add-' + lcKey)
  if (host) host.innerHTML = ''
}

function saveSubmissionFromInput(lcKey) {
  const url = (document.getElementById('sub-input-' + lcKey)?.value || '').trim()
  const err = document.getElementById('sub-err-' + lcKey)
  if (!_isSafeSubmissionUrl(url)) {
    if (err) err.textContent = "That doesn't look like a valid link — expected https://leetcode.com/…/submissions/…, a https://lintcode.com/… link, or a https://neetcode.io/…/history link"
    return
  }
  if (!addSubmission(lcKey, url)) {
    if (err) err.textContent = 'Max ' + MAX_SUBMISSIONS + ' links per question — remove one first.'
    return
  }
  _refreshSubsRow(lcKey)
}

function removeSubmission(lcKey, i) {
  if (!confirm('Remove this submission link?')) return
  removeSubmissionAt(lcKey, i)
  _refreshSubsRow(lcKey)
}

// ─── TOPIC TRACKER (always visible) ─────────────────────────────────────────
function renderTopicTracker(mod) {
  const el = document.getElementById('topic-tracker')
  if (!el) return
  if (!mod) { el.innerHTML = ''; return }

  const qKeys     = Object.keys(mod.questions)
  const solved    = qKeys.filter(k => getStatus(k) === 'Solved').length
  const inProg    = qKeys.filter(k => getStatus(k) === 'In Progress').length
  const pending   = qKeys.filter(k => getStatus(k) === 'Pending').length
  const pct       = qKeys.length ? Math.round(solved    / qKeys.length * 100) : 0
  const inProgPct = qKeys.length ? Math.round(inProg    / qKeys.length * 100) : 0

  el.innerHTML =
    '<div class="card mb-3">' +
    '<div class="card-body py-2 px-3">' +
    '<div class="d-flex align-items-center justify-content-between mb-1">' +
    '<span class="text-secondary text-sm-custom">' + escHtml(mod.goal) + '</span>' +

// ─── PRACTICE SESSION ─────────────────────────────────────────────────────────

function _shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]]
  }
  return arr
}

// Weighted shuffle: entries with fewer solve counts appear first (more likely to be practiced).
// Weight = random() / (solveCount + 1) — lower solves → higher weight → sorts earlier.
function _weightedShuffle(entries) {
  return entries
    .map(e => ({ e, w: Math.random() / (getSolveCount(e[0]) + 1) }))
    .sort((a, b) => b.w - a.w)
    .map(x => x.e)
}

// Interview-frequency weight for ranking: High > unset (Medium-ish default) > Medium > Low.
// Used by Graded so limited practice time is spent on your weakest AND highest-impact problems.
function _freqWeight(q) {
  return q && q.freq === 'High' ? 3 : q && q.freq === 'Medium' ? 2 : q && q.freq === 'Low' ? 1 : 1.5
}
// Like _weightedShuffle, but also favors higher interview-frequency questions within the tier.
function _weightedShuffleByImpact(entries) {
  return entries
    .map(e => ({ e, w: (Math.random() / (getSolveCount(e[0]) + 1)) * _freqWeight(e[1]) }))
    .sort((a, b) => b.w - a.w)
    .map(x => x.e)
}

// Order a practice pool. Normally unsolved-first (you practice what you haven't solved);
// but with "Worked-on only" ON, mix 🚧 In Progress + ✅ Solved together (weighted) so the
// completed ones aren't sliced off below the count cap — otherwise you'd see only In Progress.
function _orderPracticePool(entries) {
  if (_practiceWorkedOnly) return _weightedShuffle(entries)
  return [
    ..._weightedShuffle(entries.filter(([k]) => getStatus(k) !== 'Solved')),
    ..._weightedShuffle(entries.filter(([k]) => getStatus(k) === 'Solved')),
  ]
}

// Grade-aware ordering: serve your weakest problems first. Lower rank = served earlier.
// 0 = a "forgot" recall force-queued it · 1 = last recall was shaky · 2 = everything else.
function _weaknessRank(lcKey) {
  if (isCodeForced(lcKey)) return 0
  const r = getRevise(lcKey)
  if (r && r.grade === 'shaky') return 1
  return 2
}
// Stable sort a list of [lcKey, q] pairs by weakness (keeps the prior weighted order within a tier).
function _orderByWeakness(pairs) {
  return pairs
    .map((p, i) => [p, i])
    .sort((a, b) => (_weaknessRank(a[0][0]) - _weaknessRank(b[0][0])) || (a[1] - b[1]))
    .map(x => x[0])
}

// Dispatcher: Graded renders grade-rows (✓/~/✗ + saved-solution link, right on the row);
// anything else (Worked-on-only pool, plain generated sets) renders solve-rows.
function _qpRowsHtml() {
  if (!_qpResults) return ''
  if (_qpRevised) return _qpResults.map((entry, i) => _buildReviseItem(entry, i, 'qp')).join('')
  return _qpResults.map((entry, i) => _buildPracticeItem(entry, i, true)).join('')
}

// Fine-grained relative time: "just now" / "30 min" / "4h" / "1d" / "12d" from an ISO timestamp.
function _agoLabel(iso) {
  if (!iso) return ''
  const ms = Date.now() - new Date(iso).getTime()
  const min = Math.floor(ms / 60000)
  if (min < 1)  return 'just now'
  if (min < 60) return min + ' min'
  const hr = Math.floor(min / 60)
  if (hr < 24)  return hr + 'h'
  const days = Math.floor(hr / 24)
  return days + 'd'
}

// Revised-log row: a question you've already graded. Shows its grade badge + how long ago, and
// lets you re-grade in place (no vanish — this is a review log, not a sweep).
function _buildRevisedItem([lcKey, q], i, ctx) {
  const fn = ctx === 'ps' ? '_psGradedGrade' : '_qpRevisedGrade'   // which list this row lives in
  const tKey   = Object.keys(TOPIC_MODULES).find(k => TOPIC_MODULES[k].questions?.[lcKey])
  const tEntry = tKey ? TOPICS.find(t => t.key === tKey) : null
  const topicIcon = tEntry ? '<span class="text-xxs text-secondary flex-shrink-0">' + tEntry.icon + '</span>' : ''
  const r = getRevise(lcKey)
  return (
    '<div class="ps-q-row" data-lc-key="' + lcKey + '">' +
    '<span class="ps-q-num">' + (i + 1) + '</span>' +
    topicIcon +
    '<a href="' + escHtml(q.link) + '" target="_blank" rel="noopener noreferrer" class="ps-q-title ps-q-title-link" title="Open to read: ' + escHtml(q.title) + '">' + escHtml(q.title) + '</a>' +
    '<span class="badge bg-' + DIFFICULTY_BADGE[q.difficulty] + ' q-badge flex-shrink-0">' + q.difficulty + '</span>' +
    _reviseGradeBadge(lcKey) +
    '<span class="rev-ago" title="Last revised">' + _agoLabel(r && r.last) + '</span>' +
    '<span class="rev-grade-group flex-shrink-0">' +
      '<button class="rev-grade rev-solid"  title="Recalled it cold"          onclick="' + fn + '(event,\'' + lcKey + '\',\'solid\')">✓</button>' +
      '<button class="rev-grade rev-shaky"  title="Shaky — needed a hint"     onclick="' + fn + '(event,\'' + lcKey + '\',\'shaky\')">~</button>' +
      '<button class="rev-grade rev-forgot" title="Forgot — re-queue to code" onclick="' + fn + '(event,\'' + lcKey + '\',\'forgot\')">✗</button>' +
    '</span>' +
    '<a href="' + escHtml(q.link) + '" target="_blank" rel="noopener noreferrer" class="ps-q-link" title="Open on LeetCode" onclick="event.stopPropagation()">↗</a>' +
    '</div>'
  )
}

// Re-grade a row in the Revised log: updates the grade (and badge, via gradeRevise) + the "ago"
// label, in place. The row stays — it's a log, not a sweep.
function _qpRevisedGrade(ev, lcKey, grade) {
  ev.stopPropagation()
  gradeRevise(lcKey, grade)
  const row = ev.currentTarget.closest('.ps-q-row')
  if (row) { const a = row.querySelector('.rev-ago'); if (a) a.textContent = 'today' }
}

// Render one REVISE row: title + difficulty + a "last grade" tag + the ✓/~/✗ recall buttons.
// No click-to-solve — only the grade buttons act (recall ≠ coding).
function _buildReviseItem([lcKey, q], i, ctx) {
  const fn = ctx === 'ps' ? '_psRecallGrade' : '_qpReviseGrade'   // which list this row lives in
  // Every graded row stays in place (never swept off the list) — grading just tints the row and
  // marks the chosen button, so the row itself is your record of what you graded today.
  // The tint/badge only reflect a grade thrown THIS session — a stale grade from a prior day
  // doesn't pre-mark the row, so every row starts neutral and ungraded until you click it.
  const doneThisSession = ctx === 'ps' ? _psDoneThisSession.has(lcKey) : _qpDoneThisSession.has(lcKey)
  const forced = isCodeForced(lcKey)
  const rv     = doneThisSession ? getRevise(lcKey) : null
  const rowCls = forced ? ' ps-q-forgot' : (rv && rv.grade === 'solid') ? ' ps-q-solid' : (rv && rv.grade === 'shaky') ? ' ps-q-shaky' : ''
  const tKey   = Object.keys(TOPIC_MODULES).find(k => TOPIC_MODULES[k].questions?.[lcKey])
  const tEntry = tKey ? TOPICS.find(t => t.key === tKey) : null
  const topicIcon = tEntry ? '<span class="text-xxs text-secondary flex-shrink-0">' + tEntry.icon + '</span>' : ''
  const chosen = g => (rv && rv.grade === g) ? ' rev-chosen' : ''
  const subs = getSubmissions(lcKey)
  const subLink = subs.length ?
    '<a href="' + escHtml(subs[subs.length - 1].url) + '" target="_blank" rel="noopener noreferrer" class="ps-q-link" title="Open your' +
    (subs.length > 1 ? ' most recent saved submission (' + subs.length + ' saved)' : ' saved submission') +
    '" onclick="event.stopPropagation()">🔗</a>' : ''
  // ~20% of a freshly generated Revise/By Pattern set is randomly flagged to actually CODE,
  // not just recall — a spot-check so pure mental recall can't quietly become the whole habit.
  const codePick = ctx === 'ps' && _psReviseCodeFlagged.has(lcKey)
  const codeBadge = codePick ?
    '<span class="ps-code-pick flex-shrink-0" title="Randomly picked to CODE this one — actually write and run the solution, don\'t just recall it">⌨️ Code</span>' : ''
  // Jump-to-question assumes a single "current topic" page context, which the dashboard doesn't
  // have — it doesn't work there. Only offer it in the per-topic Practice Session.
  const jumpBtn = ctx === 'ps' ?
    '<button type="button" class="ps-q-link ps-jump-btn" title="Jump to the full question below" aria-label="Jump to question" onclick="_jumpToQuestion(event,\'' + lcKey + '\')">⤵</button>' : ''
  return (
    '<div class="ps-q-row' + rowCls + '" data-lc-key="' + lcKey + '">' +
    '<span class="ps-q-num">' + (i + 1) + '</span>' +
    topicIcon +
    '<a href="' + escHtml(q.link) + '" target="_blank" rel="noopener noreferrer" class="ps-q-title ps-q-title-link" title="Open to read: ' + escHtml(q.title) + '">' + escHtml(q.title) + '</a>' +
    // Dashboard rows drop difficulty (and never had status) to match the plain generator's rows —
    // frequency stays instead. Per-topic Graded/By Pattern keep difficulty, untouched.
    (ctx === 'ps' ? '<span class="badge bg-' + DIFFICULTY_BADGE[q.difficulty] + ' q-badge flex-shrink-0">' + q.difficulty + '</span>' : (q.freq ? freqBadge(q, ' flex-shrink-0') : '')) +
    codeBadge +
    (doneThisSession ? _reviseGradeBadge(lcKey) : '') +
    '<span class="rev-grade-group flex-shrink-0">' +
      '<button class="rev-grade rev-solid' + chosen('solid') + '"  title="Recalled it cold — push the next review further out"   onclick="' + fn + '(event,\'' + lcKey + '\',\'solid\')">✓</button>' +
      '<button class="rev-grade rev-shaky' + chosen('shaky') + '"  title="Shaky — needed a hint, keep it in short rotation"        onclick="' + fn + '(event,\'' + lcKey + '\',\'shaky\')">~</button>' +
      '<button class="rev-grade rev-forgot' + chosen('forgot') + '" title="Forgot — re-queue it for a cold solve in the CODE queue" onclick="' + fn + '(event,\'' + lcKey + '\',\'forgot\')">✗</button>' +
    '</span>' +
    jumpBtn +
    subLink +
    '<a href="' + escHtml(q.link) + '" target="_blank" rel="noopener noreferrer" class="ps-q-link" title="Open on LeetCode" onclick="event.stopPropagation()">↗</a>' +
    '</div>'
  )
}

// Read-only row for the 🕘 Recent log: what you graded, in Graded/By Pattern, and when — no
// grade controls here, this is a history, not another place to grade from.
const RECENT_GRADE_BADGE = { solid: ['rg-solid', '✓'], shaky: ['rg-shaky', '~'], forgot: ['rg-forgot', '✗'] }
function _buildRecentItem([lcKey, q], i) {
  const entry = getRecentLog().find(e => e.lcKey === lcKey)
  const grade = entry ? entry.grade : null
  const ts    = entry ? entry.ts : null

  return (
    '<div class="ps-q-row" data-lc-key="' + lcKey + '">' +
