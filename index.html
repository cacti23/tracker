function setQuestionStatus(lcKey, status, btnEl) {
  setStatus(lcKey, status)
  // Update cycle button in header
  const itemEl = btnEl ? btnEl.closest('.accordion-item') : document.querySelector('[data-lc-key="' + lcKey + '"]')?.closest('.accordion-item')
  if (itemEl) {
    // AI: querySelector uses [data-lc-key] to find the status dot explicitly.
    // Do NOT use .status-cycle-btn — there are two per item (status + LC button).
    const cycleBtn = itemEl.querySelector('[data-lc-key]')
    if (cycleBtn) {
      cycleBtn.className  = 'status-cycle-btn ' + (STATUS_DOT[status] || 'bg-secondary')
      cycleBtn.title      = 'Status: ' + status + ' — click to cycle'
      cycleBtn.setAttribute('aria-label', 'Status: ' + status + ' — click to cycle')
      cycleBtn.textContent = STATUS_EMOJI[status] ?? '📋'
    }
  }
  // Refresh topic tracker and sidebar nav badge
  const mod = TOPIC_MODULES[currentTopicKey]
  if (mod) {
    renderTopicTracker(mod)
    const navBadge = document.getElementById('nav-badge-' + currentTopicKey)
    if (navBadge) {
      const qKeys  = Object.keys(mod.questions)
      const solved = qKeys.filter(k => getStatus(k) === 'Solved').length
      navBadge.textContent = solved + '/' + qKeys.length
      navBadge.className = 'badge rounded-pill text-xxs ' + _navBadgeCls(solved, qKeys.length)
    }
  }
  // If filtered view is active, re-render filtered list to reflect new status
  if (currentQFilter !== 'all' && mod) _renderFilteredQuestions(mod)
}

function cycleQuestionStatus(lcKey, cycleBtn) {
  const current = getStatus(lcKey)
  const next    = STATUS_CYCLE[current] || 'In Progress'
  setQuestionStatus(lcKey, next, cycleBtn)
}

// ─── SAVE NOTE ────────────────────────────────────────────────────────────────
function saveNoteFromTextarea(lcKey) {
  const ta = document.getElementById('note-' + lcKey)
  if (!ta) return
  setNote(lcKey, ta.value)
  // Update the 📝 badge in the accordion header without a full re-render
  const item = ta.closest('.accordion-item')
  if (item) {
    const meta = item.querySelector('.q-meta')
    if (meta) {
      const existing = meta.querySelector('[title="Has notes"]')
      if (ta.value.trim() && !existing) {
        meta.insertAdjacentHTML('beforeend',
          '<span class="q-badge-sep"></span><span class="badge bg-secondary q-badge" title="Has notes">📝</span>')
      } else if (!ta.value.trim() && existing) {
        const sep = existing.previousElementSibling
        if (sep && sep.classList.contains('q-badge-sep')) sep.remove()
        existing.remove()
      }
    }
  }
  const flash = document.getElementById('note-flash-' + lcKey)
  if (flash) {
    flash.classList.add('show')
    setTimeout(() => flash.classList.remove('show'), 1500)
  }
}

// ─── PRACTICE SESSION ─────────────────────────────────────────────────────────

function _shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]]
  }
  return arr
}

// Weighted shuffle: entries with fewer solve counts appear first (more likely to be practiced).
// Weight = random() / (solveCount + 1) — lower solves → higher weight → sorts earlier.
function _weightedShuffle(entries) {
  return entries
    .map(e => ({ e, w: Math.random() / (getSolveCount(e[0]) + 1) }))
    .sort((a, b) => b.w - a.w)
    .map(x => x.e)
}

// Generate a practice set for a single topic.
// Priority: Pinned (fills first, capped at count) → Unsolved (weighted) → Solved (weighted).
function _genPracticeSet(topicKey, count) {
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return []
  const all         = Object.entries(mod.questions)
  const pinned      = _shuffle(all.filter(([k]) => isPinned(k))).slice(0, count)
  const unpinned    = all.filter(([k]) => !isPinned(k))
  const unsolved    = _weightedShuffle(unpinned.filter(([k]) => getStatus(k) !== 'Solved'))
  const solved      = _weightedShuffle(unpinned.filter(([k]) => getStatus(k) === 'Solved'))
  const fillCount   = Math.max(0, count - pinned.length)
  return [...pinned, ...[...unsolved, ...solved].slice(0, fillCount)]
}

// Render a single practice row. showTopic=true adds the topic icon (dashboard).
function _buildPracticeItem([lcKey, q], i, showTopic) {
  const pinned = isPinned(lcKey)
  const status = getStatus(lcKey)
  // Dashboard (showTopic=true) uses its own session sets so topic navigation never wipes them
  const doneInSession = showTopic ? _qpDoneThisSession.has(lcKey) : _psDoneThisSession.has(lcKey)
  const due = isDue(lcKey)
  let topicIcon = ''
  if (showTopic) {
    const tKey = Object.keys(TOPIC_MODULES).find(k => TOPIC_MODULES[k].questions?.[lcKey])
    const tEntry = tKey ? TOPICS.find(t => t.key === tKey) : null
    if (tEntry) topicIcon = '<span class="text-xxs text-secondary flex-shrink-0">' + tEntry.icon + '</span>'
  }
  const struggled    = showTopic ? _qpStruggledThisSession.has(lcKey) : _psStruggledThisSession.has(lcKey)
  const solvedCls    = doneInSession ? (struggled ? ' ps-q-struggled' : ' ps-q-solved') : ''
  const dueDot = due && !doneInSession ? '<span class="ps-due-dot" title="Due for review">●</span>' : ''
  const pinBtnCls = 'ps-pin-btn' + (pinned ? ' pinned' : '')
  const pinTitle  = pinned ? 'Unpin — remove from always-practice list' : 'Pin — keep in every future session'
  const rowClickFn   = showTopic ? '_qpRowClick' : '_psRowClick'
  const struggleFn   = showTopic ? '_qpStruggleClick' : '_psStruggleClick'
  return (
    '<div class="ps-q-row' + solvedCls + '" data-lc-key="' + lcKey + '" onclick="' + rowClickFn + '(event,\'' + lcKey + '\')">' +
    '<span class="ps-q-num">' + (i + 1) + '</span>' +
    dueDot +
    topicIcon +
    '<span class="ps-q-title" title="' + escHtml(q.title) + '">' + escHtml(q.title) + '</span>' +
    '<span class="badge bg-' + DIFFICULTY_BADGE[q.difficulty] + ' q-badge flex-shrink-0">' + q.difficulty + '</span>' +
    (q.freq ? freqBadge(q, ' flex-shrink-0') : '') +
    '<span class="badge ' + STATUS_DOT[status] + ' q-badge flex-shrink-0">' + STATUS_EMOJI[status] + '</span>' +
    '<button class="ps-struggle-btn" title="Struggled — review again tomorrow (no clean-solve credit)" onclick="event.stopPropagation();' + struggleFn + '(this,\'' + lcKey + '\')" aria-label="Mark struggled">🔁</button>' +
    '<button class="' + pinBtnCls + '" title="' + pinTitle + '" onclick="event.stopPropagation();_psPinToggle(this,\'' + lcKey + '\')" aria-label="Pin question">📌</button>' +
    '<a href="' + escHtml(q.link) + '" target="_blank" rel="noopener noreferrer" class="ps-q-link" title="Open on LeetCode" onclick="event.stopPropagation()">↗</a>' +
    '</div>'
  )
}

// Build the full inner HTML for the Practice Session accordion body.
function _buildPracticePanel(topicKey, mod) {
  const total    = Object.keys(mod.questions).length
  const count    = Math.max(1, Math.min(_psQCount, total))
  const pinCount = Object.keys(mod.questions).filter(k => isPinned(k)).length

  // Track current topic for persistence
  const prevTopic = _psCurrentTopic
  _psCurrentTopic = topicKey

  // Hybrid approach: Empty on first visit, persist if returning mid-session
  if (_psCurrentItems.length === 0) {
    // Check if there's a persisted session from this topic
    const savedSession = _psLoadSession()
    if (savedSession && savedSession.topicKey === topicKey) {
      // Restore persisted session
      _psCurrentItems = savedSession.items.map(([lcKey, q]) => [lcKey, TOPIC_MODULES[topicKey].questions[lcKey] || q])
      _psQCount = _psCurrentItems.length
    } else if (prevTopic === topicKey) {
      // Same topic, generate fresh session
      _psCurrentItems = _genPracticeSet(topicKey, count)
      _psQCount = _psCurrentItems.length
    }
    // If first visit to this topic: leave empty (no auto-generation)
  }

  let html = ''
  // ── Controls bar ──────────────────────────────────────────────────────────
  html += '<div class="ps-ctrl-bar">'
  
  if (_psCurrentItems.length === 0) {
    // Empty state: show Generate button instead of controls
    html += '<button type="button" class="ps-shuffle-btn" onclick="_psShuffle(\'' + topicKey + '\')">▶ Generate for Practice</button>'
    html += '<span class="ms-auto text-xxs text-secondary text-muted">Click to start a practice session</span>'
  } else {
    // Loaded state: show all controls
    html += '<button type="button" class="ps-count-btn" onclick="_psAdjCount(-1,\'' + topicKey + '\')">−</button>'
    html += '<span class="ps-count-val" id="ps-count-val">' + _psCurrentItems.length + '</span>'
    html += '<button type="button" class="ps-count-btn" onclick="_psAdjCount(1,\'' + topicKey + '\')">+</button>'
    html += '<button type="button" class="ps-count-btn" title="Show all questions" onclick="_psSetAll(\'' + topicKey + '\')">All</button>'
    html += '<span class="text-secondary text-xs">/ ' + total + '</span>'
    html += '<button type="button" class="ps-shuffle-btn ms-1" id="ps-btn-reset" onclick="_psShuffle(\'' + topicKey + '\')">↺ Reset</button>'
    if (pinCount) html += '<span class="ms-auto text-xxs text-secondary">📌 ' + pinCount + ' pinned</span>'
  }
  
  html += '</div>'
  // ── Question list ──────────────────────────────────────────────────────────
  html += '<div id="ps-list">'
  if (_psCurrentItems.length === 0) {
    html += '<div style="text-align: center; padding: 2rem 1rem;">'
    html += '<p class="text-secondary text-xs mb-2">No practice session loaded</p>'
    html += '<p class="text-faint text-xs">Click "Generate for Practice" above to begin</p>'
    html += '</div>'
  } else {
    html += _psCurrentItems.map((item, i) => _buildPracticeItem(item, i, false)).join('')
  }
  html += '</div>'
  // ── Timer bar ──────────────────────────────────────────────────────────────
  html += '<div class="ps-timer-bar">'
  html += '<span class="text-secondary text-xs flex-shrink-0">⏱ Timer:</span>'
  html += '<button type="button" class="ps-preset-btn' + (_psTimerPreset===1  ? ' ps-active':'') + '" onclick="_psTimerSet(1,this)">1m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_psTimerPreset===5  ? ' ps-active':'') + '" onclick="_psTimerSet(5,this)">5m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_psTimerPreset===10 ? ' ps-active':'') + '" onclick="_psTimerSet(10,this)">10m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_psTimerPreset===20 ? ' ps-active':'') + '" onclick="_psTimerSet(20,this)">20m</button>'
  html += '<span class="ps-timer-display' + (_psTimerRun ? ' ps-running' : '') + (_psTimerRem === 0 && _psTimerTotal > 0 ? ' ps-expired' : '') + '" id="ps-timer-disp">' + _fmtTimer(_psTimerRem || _psTimerTotal) + '</span>'
  html += '<button type="button" class="ps-timer-ctrl" id="ps-timer-play" onclick="_psTimerToggle()" title="Start / Pause">'
  html += (_psTimerRun ? '⏸' : '▶') + '</button>'
  html += '<button type="button" class="ps-timer-ctrl" onclick="_psTimerReset()" title="Reset timer">↺</button>'
  html += '</div>'
  return html
}

function _fmtTimer(secs) {
  if (!secs) return 'Off'
  const m = Math.floor(secs / 60), s = secs % 60
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
}

function _psAdjCount(delta, topicKey) {
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return
  if (_psTimerRun) return  // locked while timer is running — use Reset to restart

  const total = Object.keys(mod.questions).length
  const currentCount = _psCurrentItems.length
  const newCount = Math.max(1, Math.min(total, currentCount + delta))
  if (newCount === currentCount) return

  if (newCount > currentCount) {
    // Add questions from the remaining pool (not already shown)
    const currentKeys = new Set(_psCurrentItems.map(([k]) => k))
    const pool = Object.entries(mod.questions).filter(([k]) => !currentKeys.has(k))
    const unsolved = _weightedShuffle(pool.filter(([k]) => getStatus(k) !== 'Solved'))
    const solved   = _weightedShuffle(pool.filter(([k]) => getStatus(k) === 'Solved'))
    const toAdd = [...unsolved, ...solved].slice(0, newCount - currentCount)
    _psCurrentItems = [..._psCurrentItems, ...toAdd]
  } else {
    // Remove from end — skip done-in-session items (preserve their solved state)
    const toRemove = currentCount - newCount
    const newItems = [..._psCurrentItems]
    let removed = 0
    // Pass 1: remove undone questions from the end
    for (let i = newItems.length - 1; i >= 0 && removed < toRemove; i--) {
      if (!_psDoneThisSession.has(newItems[i][0])) { newItems.splice(i, 1); removed++ }
    }
    // Pass 2: if still need to remove, take done ones from the end
    for (let i = newItems.length - 1; i >= 0 && removed < toRemove; i--) {
      newItems.splice(i, 1); removed++
    }
    _psCurrentItems = newItems
  }

  _psQCount = _psCurrentItems.length
  const valEl = document.getElementById('ps-count-val')
  if (valEl) valEl.textContent = _psQCount
  const listEl = document.getElementById('ps-list')
  if (listEl) {
    listEl.innerHTML = _psCurrentItems.length
      ? _psCurrentItems.map((item, i) => _buildPracticeItem(item, i, false)).join('')
      : '<p class="text-secondary text-xs mb-0">No questions in this topic yet.</p>'
  }
  _psSaveSession()  // Persist the updated list
}

function _psSetAll(topicKey) {
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return
  if (_psTimerRun) return  // locked while timer is running
  const currentKeys = new Set(_psCurrentItems.map(([k]) => k))
  const toAdd = Object.entries(mod.questions).filter(([k]) => !currentKeys.has(k))
  _psCurrentItems = [..._psCurrentItems, ...toAdd]
  _psQCount = _psCurrentItems.length
  const valEl = document.getElementById('ps-count-val')
  if (valEl) valEl.textContent = _psQCount
  const listEl = document.getElementById('ps-list')
  if (listEl) listEl.innerHTML = _psCurrentItems.map((item, i) => _buildPracticeItem(item, i, false)).join('')
  _psSaveSession()  // Persist the updated list
}

function _psShuffle(topicKey) {
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return
  _stopTimer()

  // Save which keys were done this session BEFORE clearing, so we can push
  // them to the bottom of the new set — they've been practiced already today.
  const prevDone = new Set(_psDoneThisSession)
  _psDoneThisSession.clear(); _psStruggledThisSession.clear()

  const count = Math.max(1, Math.min(_psQCount, Object.keys(mod.questions).length))
  const generated = _genPracticeSet(topicKey, count)

  // Split: questions NOT done this session appear first, done ones at bottom
  const fresh  = generated.filter(([k]) => !prevDone.has(k))
  const done   = generated.filter(([k]) =>  prevDone.has(k))
  _psCurrentItems = [...fresh, ...done]

  _psQCount = _psCurrentItems.length
  _psSaveSession()  // Persist the new session
  
  const valEl = document.getElementById('ps-count-val')
  if (valEl) valEl.textContent = _psQCount
  const listEl = document.getElementById('ps-list')
  if (!listEl) return
  listEl.innerHTML = _psCurrentItems.length
    ? _psCurrentItems.map((item, i) => _buildPracticeItem(item, i, false)).join('')
    : '<p class="text-secondary text-xs mb-0">No questions in this topic yet.</p>'
}

// ── Solve-count ring helpers ──────────────────────────────────────────────────
function _solveRingCls(n) {
  if (n >= 30) return 'solve-ring-diamond'
  if (n >= 20) return 'solve-ring-gold'
  if (n >= 10) return 'solve-ring-silver'
  if (n >= 5)  return 'solve-ring-bronze'
  return 'solve-ring-dim'
}

function _solveRingEmoji(n) {
  if (n >= 30) return '💎'
  if (n >= 25) return '🏆'
  if (n >= 20) return '🔥'
  if (n >= 15) return '⭐'
  if (n >= 10) return '🥈'
  if (n >= 5)  return '🥉'
  if (n >  0)  return '✏️'
  return '○'
}

function _adjSolveCount(lcKey, delta) {
  const counts = JSON.parse(localStorage.getItem(SOLVE_COUNT_KEY) || '{}')
  counts[lcKey] = Math.max(0, (counts[lcKey] || 0) + delta)
  localStorage.setItem(SOLVE_COUNT_KEY, JSON.stringify(counts))
  const n = counts[lcKey]
  const ring = document.querySelector('[data-solve-key="' + lcKey + '"]')
  if (ring) {
    ring.className   = 'solve-ring ' + _solveRingCls(n)
    ring.innerHTML   = _solveRingEmoji(n) + '<span class="solve-ring-num">' + n + '</span>'
    ring.title       = n + ' solve' + (n === 1 ? '' : 's')
  }
}

// Flash a row's outcome style, then slide it to the bottom of its list, renumber, and run onSettled(list).
function _animateRowToBottom(rowEl, outcomeCls, onSettled) {
  rowEl.classList.add(outcomeCls)
  setTimeout(() => {
    rowEl.classList.add('ps-q-moving')
    setTimeout(() => {
      const list = rowEl.parentElement
      if (list) {
        list.appendChild(rowEl)
        rowEl.classList.remove('ps-q-moving')
        Array.from(list.querySelectorAll('.ps-q-row')).forEach((r, idx) => {
          const num = r.querySelector('.ps-q-num')
          if (num) num.textContent = idx + 1
        })
        if (onSettled) onSettled(list)
      }
    }, 320)
  }, 50)
}

// Handle click on a practice row: a clean solve — credit a solve, expand the review interval, slide to bottom.
function _psRowClick(event, lcKey) {
  // Ignore clicks on the link, pin, or struggle button — they already stopPropagation
  if (event.target.classList.contains('ps-q-link')) return
  if (event.target.classList.contains('ps-pin-btn')) return
  if (event.target.classList.contains('ps-struggle-btn')) return

  const rowEl = event.currentTarget
  if (!rowEl) return

  // Prevent double-counting if already done this session
  if (_psDoneThisSession.has(lcKey)) return
  _psDoneThisSession.add(lcKey)

  // Clean solve: mark practiced + push the review interval one step further out
  markPracticed(lcKey)
  bumpReviewInterval(lcKey)

  const newCount = incSolveCount(lcKey)

  // Update solve ring on the main accordion item if visible
  const acRing = document.querySelector('[data-solve-key="' + lcKey + '"]')
  if (acRing) {
    acRing.className = 'solve-ring ' + _solveRingCls(newCount)
    acRing.innerHTML = _solveRingEmoji(newCount) + '<span class="solve-ring-num">' + newCount + '</span>'
    acRing.title     = newCount + ' solve' + (newCount === 1 ? '' : 's')
  }

  // Persist session state after marking as done
  _psSaveSession()

  _animateRowToBottom(rowEl, 'ps-q-solved', () => {
    // Show session-complete banner if every question in this set is done
    if (_psCurrentItems.length > 0 && _psDoneThisSession.size >= _psCurrentItems.length) {
      _psShowSessionComplete()
    }
  })
}

// Struggled on a practice row: keep it in heavy rotation (interval back to 1 day) without crediting a clean solve.
function _psStruggleClick(btnEl, lcKey) {
  const rowEl = btnEl.closest('.ps-q-row')
  if (!rowEl || _psDoneThisSession.has(lcKey)) return
  _psDoneThisSession.add(lcKey)
  _psStruggledThisSession.add(lcKey)

  markPracticed(lcKey)
  resetReviewInterval(lcKey)
  _psSaveSession()

  _animateRowToBottom(rowEl, 'ps-q-struggled', () => {
    if (_psCurrentItems.length > 0 && _psDoneThisSession.size >= _psCurrentItems.length) {
      _psShowSessionComplete()
    }
  })
}

// Toggle pin from inside the practice session row.
// Updates button visuals immediately without re-rendering the whole list.
function _psPinToggle(btnEl, lcKey) {
  const nowPinned = togglePin(lcKey)
  btnEl.classList.toggle('pinned', nowPinned)
  btnEl.title = nowPinned ? 'Unpin — remove from always-practice list' : 'Pin — keep in every future session'
  // Sync the 📌 ring badge in the question accordion if it is currently visible
  const acRing = document.querySelector('[data-pin-key="' + lcKey + '"]')
  if (acRing) {
    acRing.classList.toggle('pinned', nowPinned)
    acRing.title = nowPinned ? 'Unpin from practice set' : 'Pin — always include in practice'
  }
}



// Show a compact banner at the top of ps-list when all session questions are done.
function _psShowSessionComplete() {
  const listEl = document.getElementById('ps-list')
  if (!listEl || listEl.querySelector('.ps-session-done')) return
  const total = _psDoneThisSession.size
  let msg = '✅ Session complete · <span style="color:var(--green)">' + total + ' solved</span>'
  listEl.insertAdjacentHTML('afterbegin', '<div class="ps-session-done">' + msg + '</div>')
}

function _qpShowSessionComplete() {
  const listEl = document.getElementById('qp-results')
  if (!listEl || listEl.querySelector('.ps-session-done')) return
  const total = _qpDoneThisSession.size
  let msg = '✅ Session complete · <span style="color:var(--green)">' + total + ' solved</span>'
  listEl.insertAdjacentHTML('afterbegin', '<div class="ps-session-done">' + msg + '</div>')
}

// ─── DASHBOARD ROW CLICK HANDLERS ────────────────────────────────────────────
// Dashboard QP handlers use _qpDoneThisSession so that topic navigation never clears QP state.

// After a dashboard row settles at the bottom, re-sync results order and maybe show the complete banner.
function _qpAfterRowSettled(list) {
  // Sync _qpResults order to match DOM so navigating back restores positions
  if (_qpResults) {
    const qMap = Object.fromEntries(_qpResults)
    _qpResults = Array.from(list.querySelectorAll('.ps-q-row[data-lc-key]'))
      .map(r => { const k = r.getAttribute('data-lc-key'); return k && qMap[k] ? [k, qMap[k]] : null })
      .filter(Boolean)
    _saveQpState()
  }
  if (_qpResults && _qpResults.length > 0 && _qpDoneThisSession.size >= _qpResults.length) {
    _qpShowSessionComplete()
  }
}

function _qpRowClick(event, lcKey) {
  if (event.target.classList.contains('ps-q-link')) return
  if (event.target.classList.contains('ps-pin-btn')) return
  if (event.target.classList.contains('ps-struggle-btn')) return
  const rowEl = event.currentTarget
  if (!rowEl) return
  if (_qpDoneThisSession.has(lcKey)) return
  _qpDoneThisSession.add(lcKey)
  markPracticed(lcKey)
  bumpReviewInterval(lcKey)
  const newCount = incSolveCount(lcKey)
  const acRing = document.querySelector('[data-solve-key="' + lcKey + '"]')
  if (acRing) {
    acRing.className = 'solve-ring ' + _solveRingCls(newCount)
    acRing.innerHTML = _solveRingEmoji(newCount) + '<span class="solve-ring-num">' + newCount + '</span>'
    acRing.title     = newCount + ' solve' + (newCount === 1 ? '' : 's')
  }
  _animateRowToBottom(rowEl, 'ps-q-solved', _qpAfterRowSettled)
}

// Struggled on a dashboard row: interval back to 1 day, no clean-solve credit.
function _qpStruggleClick(btnEl, lcKey) {
  const rowEl = btnEl.closest('.ps-q-row')
  if (!rowEl || _qpDoneThisSession.has(lcKey)) return
  _qpDoneThisSession.add(lcKey)
  _qpStruggledThisSession.add(lcKey)
  markPracticed(lcKey)
  resetReviewInterval(lcKey)
  _animateRowToBottom(rowEl, 'ps-q-struggled', _qpAfterRowSettled)
}

// ── Timer controls ────────────────────────────────────────────────────────────
function _psTimerSet(mins, btn) {
  _stopTimer()
  _psTimerPreset = mins
  _psTimerTotal  = mins * 60
  _psTimerRem    = _psTimerTotal
  // Scope to this panel's timer bar only — avoids clearing dashboard preset buttons
  const bar = btn ? btn.closest('.ps-timer-bar') : null
  if (bar) bar.querySelectorAll('.ps-preset-btn').forEach(b => b.classList.remove('ps-active'))
  if (btn) btn.classList.add('ps-active')
  _syncTimerDisplay()
}

function _psTimerToggle() {
  if (!_psTimerTotal) return   // nothing configured yet
  if (_psTimerRun) {
    _stopTimer()
  } else {
    if (_psTimerRem <= 0) _psTimerRem = _psTimerTotal
    _psTimerRun = true
    const btn = document.getElementById('ps-timer-play')
    if (btn) btn.textContent = '⏸'
    _psTimerIv = setInterval(_psTimerTick, 1000)
    // Lock count controls while session is running
    ;['ps-btn-dec','ps-btn-inc','ps-btn-all'].forEach(id => { const b = document.getElementById(id); if (b) { b.disabled = true } })
  }
}

function _stopTimer() {
  if (_psTimerIv) { clearInterval(_psTimerIv); _psTimerIv = null }
  _psTimerRun = false
  const btn = document.getElementById('ps-timer-play')
  if (btn) btn.textContent = '▶'
  // Re-enable count controls when timer is stopped/reset
  ;['ps-btn-dec','ps-btn-inc','ps-btn-all'].forEach(id => { const b = document.getElementById(id); if (b) { b.disabled = false } })
}

function _psTimerReset() {
  _stopTimer()
  _psTimerRem = _psTimerTotal
  const disp = document.getElementById('ps-timer-disp')
  if (disp) disp.classList.remove('ps-expired', 'ps-running')
  _syncTimerDisplay()
}

function _psTimerTick() {
  if (_psTimerRem <= 0) {
    _stopTimer()
    _psTimerRem = 0
    const disp = document.getElementById('ps-timer-disp')
    if (disp) { disp.textContent = '00:00'; disp.className = 'ps-timer-display ps-expired' }
    return
  }
  _psTimerRem--
  _syncTimerDisplay()
}

function _syncTimerDisplay() {
  const disp = document.getElementById('ps-timer-disp')
  if (!disp) return
  const secs = _psTimerRem || _psTimerTotal
  disp.textContent = _fmtTimer(secs)
  disp.className = 'ps-timer-display' +
    (_psTimerRun ? ' ps-running' : '') +
    (!secs && _psTimerTotal > 0 ? ' ps-expired' : '')
}

// ── Pin toggle ────────────────────────────────────────────────────────────────
function toggleQuestionPin(lcKey, btn) {
  const nowPinned = togglePin(lcKey)
  btn.classList.toggle('pinned', nowPinned)
  btn.title = nowPinned ? 'Unpin from practice set' : 'Pin — always include in practice'
  // Sync the 📌 badge in .q-meta without a full re-render
  const item = btn.closest('.accordion-item')
  if (item) {
    const meta = item.querySelector('.q-meta')
    if (meta) {
      const existing = meta.querySelector('.pin-badge')
      if (nowPinned && !existing) {
        const sep = document.createElement('span'); sep.className = 'q-badge-sep'
        const badge = document.createElement('span')
        badge.className = 'badge bg-secondary q-badge pin-badge'; badge.title = 'Pinned to practice'; badge.textContent = '📌'
        meta.appendChild(sep); meta.appendChild(badge)
      } else if (!nowPinned && existing) {
        const sep = existing.previousElementSibling
        if (sep && sep.classList.contains('q-badge-sep')) sep.remove()
        existing.remove()
      }
    }
  }
  // Sync the 📌 practice-row button if this question is visible in the per-topic practice panel.
  // NOTE: _psShuffle below fully rebuilds the list, so we only need this sync when
  // the accordion is on the dashboard (currentTopicKey = null) where _psShuffle won't run.
  if (!currentTopicKey) {
    const psPin = document.querySelector('.ps-pin-btn[aria-label="Pin question"][onclick*="' + lcKey + '"]')
    if (psPin) { psPin.classList.toggle('pinned', nowPinned); psPin.title = nowPinned ? 'Unpin — remove from always-practice list' : 'Pin — keep in every future session' }
  }
  // Refresh per-topic practice panel (only when a topic is loaded)
  if (currentTopicKey) _psShuffle(currentTopicKey)
  // Update the pinned-count label in the per-topic ctrl bar
  const mod = TOPIC_MODULES[currentTopicKey]
  if (mod) {
    const pinCount = Object.keys(mod.questions).filter(k => isPinned(k)).length
    const ctrl = document.querySelector('#ps-body .ps-ctrl-bar')
    if (ctrl) {
      const existing = ctrl.querySelector('.ps-pin-count')
      if (existing) existing.remove()
      if (pinCount) {
        const sp = document.createElement('span')
        sp.className = 'ms-auto text-xxs text-secondary ps-pin-count'
        sp.textContent = '📌 ' + pinCount + ' pinned'
        ctrl.appendChild(sp)
      }
    }
  }
  // Update the pinned-count label in the QP panel (visible on dashboard)
  const qpPinLabel = document.querySelector('#quick-practice-panel [title="Pinned questions fill first when generating a set"]')
  if (qpPinLabel) {
    let qpPinned = 0
    _qpTopics.forEach(key => {
      const m = TOPIC_MODULES[key]
      if (m) Object.keys(m.questions).forEach(k => { if (isPinned(k)) qpPinned++ })
    })
    if (qpPinned > 0) qpPinLabel.textContent = '📌 ' + qpPinned + ' pinned (priority)'
    else qpPinLabel.style.display = 'none'
  }
}

// ─── QUICK PRACTICE (Dashboard) ───────────────────────────────────────────────

function _renderQuickPractice() {
  const el = document.getElementById('quick-practice-panel')
  if (!el) return
  const validTopics = TOPICS.filter(t => TOPIC_MODULES[t.key])

  let totalQ = 0
  _qpTopics.forEach(key => {
    const mod = TOPIC_MODULES[key]
    if (mod) totalQ += Object.keys(mod.questions).length
  })
  const maxQ   = totalQ
  const count  = maxQ ? Math.max(1, Math.min(_qpCount, maxQ)) : _qpCount

  // Count pinned only from SELECTED topics (not all topics)
  let totalPinned = 0
  _qpTopics.forEach(key => {
    const mod = TOPIC_MODULES[key]
    if (mod) Object.keys(mod.questions).forEach(k => { if (isPinned(k)) totalPinned++ })
  })

  let html = '<div class="card mt-4"><div class="card-body">'
  html += '<div class="d-flex align-items-center gap-2 mb-3">'
  html += '<span class="icon-xl">🎲</span>'
  html += '<h6 class="mb-0 fw-semibold">Quick Practice</h6>'
  html += '<span class="text-secondary text-xs mt-1">— pick topics, get a random set</span>'
  html += '</div>'

  // Topic chips
  html += '<div class="d-flex flex-wrap gap-2 mb-3">'
  validTopics.forEach(t => {
    const isActive = _qpTopics.has(t.key)
    html += '<button type="button" class="qp-chip' + (isActive ? ' active' : '') + '" onclick="_qpToggleTopic(\'' + t.key + '\')">' +
      t.icon + ' ' + escHtml(t.label) + '</button>'
  })
  const allSelected = validTopics.every(t => _qpTopics.has(t.key))
  html += '<button type="button" class="qp-chip' + (allSelected ? ' active' : '') + '" onclick="_qpSelectAll()">' +
    (allSelected ? '✓ All' : '+ All') + '</button>'
  html += '</div>'

  // Count + generate row
  const disabled = _qpTopics.size === 0
  html += '<div class="d-flex align-items-center gap-2 flex-wrap">'
  html += '<button type="button" class="ps-count-btn" id="qp-btn-dec" onclick="_qpAdjCount(-1)">−</button>'
  html += '<span class="ps-count-val" id="qp-count-val">' + count + '</span>'
  html += '<button type="button" class="ps-count-btn" id="qp-btn-inc" onclick="_qpAdjCount(1)">+</button>'
  html += '<span class="text-secondary text-xs">questions</span>'
  if (maxQ) html += '<span class="text-faint text-xxs">(max&nbsp;' + maxQ + ' from selected)</span>'
  html += '<button type="button" class="ps-shuffle-btn ms-2"' + (disabled ? ' disabled' : '') + ' onclick="_qpGenerate()">🎲 Generate Set</button>'
  html += '<button type="button" class="qp-chip' + (_qpDueOnly ? ' active' : '') + ' ms-1" onclick="_qpToggleDueOnly()" title="Show only questions due for review (>3 days since last practice)">⏰ Due only</button>'
  if (totalPinned) html += '<span class="text-xxs text-secondary ms-2" title="Pinned questions fill first when generating a set">📌 ' + totalPinned + ' pinned (priority)</span>'
  html += '</div>'

  // Timer bar (mirrors per-topic timer)
  const qpTimerDisp = _fmtTimer(_qpTimerRem || _qpTimerTotal)
  html += '<div class="ps-timer-bar mt-2">'
  html += '<span class="text-secondary text-xs flex-shrink-0">⏱ Timer:</span>'
  html += '<button type="button" class="ps-preset-btn' + (_qpTimerPreset===5  ? ' ps-active':'') + '" onclick="_qpTimerSet(5,this)">5m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_qpTimerPreset===10 ? ' ps-active':'') + '" onclick="_qpTimerSet(10,this)">10m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_qpTimerPreset===20 ? ' ps-active':'') + '" onclick="_qpTimerSet(20,this)">20m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_qpTimerPreset===30 ? ' ps-active':'') + '" onclick="_qpTimerSet(30,this)">30m</button>'
  html += '<span class="ps-timer-display' + (_qpTimerRun ? ' ps-running' : '') + (_qpTimerRem===0 && _qpTimerTotal>0 ? ' ps-expired':'') + '" id="qp-timer-disp">' + qpTimerDisp + '</span>'
  html += '<button type="button" class="ps-timer-ctrl" id="qp-timer-play" onclick="_qpTimerToggle()" title="Start / Pause">' + (_qpTimerRun ? '⏸' : '▶') + '</button>'
  html += '<button type="button" class="ps-timer-ctrl" onclick="_qpTimerReset()" title="Reset timer">↺</button>'
  html += '</div>'

  // Results
  html += '<div id="qp-results" class="mt-3"></div>'
  html += '</div></div>'
  el.innerHTML = html

  // Restore previous results if available (preserves solved styling via _qpDoneThisSession)
  if (_qpResults && _qpResults.length > 0) {
    document.getElementById('qp-results').innerHTML =
      _qpResults.map((entry, i) => _buildPracticeItem(entry, i, true)).join('')
    // Restore session-complete banner if the full set was already finished
    if (_qpDoneThisSession.size >= _qpResults.length) _qpShowSessionComplete()
  }
  // Re-apply +/- lock if timer was running when we navigated away
  if (_qpTimerRun) {
    const dec = document.getElementById('qp-btn-dec')
    const inc = document.getElementById('qp-btn-inc')
    if (dec) dec.disabled = true
    if (inc) inc.disabled = true
  }
}

function _qpToggleTopic(key) {
  if (_qpTimerRun) return  // don't change topic selection mid-session
  if (_qpTopics.has(key)) _qpTopics.delete(key); else _qpTopics.add(key)
  _qpResults = null  // clear stale results when topic selection changes
  _saveQpState()
  _renderQuickPractice()
}

function _qpSelectAll() {
  if (_qpTimerRun) return  // don't change topic selection mid-session
  const validTopics = TOPICS.filter(t => TOPIC_MODULES[t.key])
  const allSelected = validTopics.every(t => _qpTopics.has(t.key))
  if (allSelected) {
    _qpTopics.clear()
  } else {
    validTopics.forEach(t => _qpTopics.add(t.key))
  }
  _qpResults = null
  _saveQpState()
  _renderQuickPractice()
}

function _qpAdjCount(delta) {
  if (_qpTimerRun) return  // locked while timer is running
  let maxQ = 0
  _qpTopics.forEach(key => {
    const mod = TOPIC_MODULES[key]
    if (mod) maxQ += Object.keys(mod.questions).length
  })
  _qpCount = Math.max(1, Math.min(maxQ || 99, _qpCount + delta))
  const el = document.getElementById('qp-count-val')
  if (el) el.textContent = _qpCount

  // If results already exist, do smart add/remove instead of resetting
  if (!_qpResults || _qpResults.length === 0) return

  const currentCount = _qpResults.length
  if (_qpCount > currentCount) {
    // Add more from the remaining pool (respect dueOnly filter)
    const currentKeys = new Set(_qpResults.map(([k]) => k))
    const pool = []
    _qpTopics.forEach(key => {
      const mod = TOPIC_MODULES[key]
      if (mod) Object.entries(mod.questions).forEach(([k, q]) => {
        if (currentKeys.has(k)) return
        if (_qpDueOnly && !isDue(k)) return
        pool.push([k, q])
      })
    })
    const unsolved = _weightedShuffle(pool.filter(([k]) => getStatus(k) !== 'Solved'))
    const solved   = _weightedShuffle(pool.filter(([k]) => getStatus(k) === 'Solved'))
    const toAdd = [...unsolved, ...solved].slice(0, _qpCount - currentCount)
    _qpResults = [..._qpResults, ...toAdd]
  } else if (_qpCount < currentCount) {
    // Remove from end, skip done-in-session items first
    const toRemove = currentCount - _qpCount
    const newResults = [..._qpResults]
    let removed = 0
    for (let i = newResults.length - 1; i >= 0 && removed < toRemove; i--) {
      if (!_qpDoneThisSession.has(newResults[i][0])) { newResults.splice(i, 1); removed++ }
    }
    for (let i = newResults.length - 1; i >= 0 && removed < toRemove; i--) {
      newResults.splice(i, 1); removed++
    }
    _qpResults = newResults
  }

  // Sync count display to actual list length and re-render
  if (el) el.textContent = _qpResults.length
  _saveQpState()
  const resultsEl = document.getElementById('qp-results')
  if (resultsEl) {
    resultsEl.innerHTML = _qpResults.map((entry, i) => _buildPracticeItem(entry, i, true)).join('')
    // Only show session-complete if every question currently in the list is done
    // (not just because count was reduced below the done count)
    const doneInCurrentResults = _qpResults.filter(([k]) => _qpDoneThisSession.has(k)).length
    if (doneInCurrentResults > 0 && doneInCurrentResults >= _qpResults.length) _qpShowSessionComplete()
  }
}

function _qpGenerate() {
  if (_qpTopics.size === 0) return
  if (_qpTimerRun) return  // don't reset session while timer is running

  // Build candidate pool — respect "Due only" filter when active
  const seen = new Set()
  const pool = []
  _qpTopics.forEach(key => {
    const mod = TOPIC_MODULES[key]
    if (!mod) return
    Object.entries(mod.questions).forEach(([k, q]) => {
      if (seen.has(k)) return  // dedup
      seen.add(k)
      if (_qpDueOnly && !isDue(k)) return  // skip non-due when filter is on
      pool.push([k, q])
    })
  })

  const maxQ  = pool.length
  if (maxQ === 0) {
    const el = document.getElementById('qp-results')
    if (el) el.innerHTML = '<p class="text-secondary text-xs mt-2 mb-0">' + (_qpDueOnly ? 'No questions due for review across the selected topics.' : 'No questions found.') + '</p>'
    _qpResults = []
    return
  }
  const count = Math.max(1, Math.min(_qpCount, maxQ))

  // Snapshot done-this-session BEFORE clearing, so previously solved questions
  // land at the bottom of the new set instead of back at the top.
  const prevDone = new Set(_qpDoneThisSession)
  _qpDoneThisSession.clear(); _qpStruggledThisSession.clear()

  // Pinned questions get highest priority but the total is still capped at count.
  const pinned      = _shuffle(pool.filter(([k]) => isPinned(k))).slice(0, count)
  const unpinned    = pool.filter(([k]) => !isPinned(k))
  const unsolved    = _weightedShuffle(unpinned.filter(([k]) => getStatus(k) !== 'Solved'))
  const solved      = _weightedShuffle(unpinned.filter(([k]) => getStatus(k) === 'Solved'))
  const fillCount   = Math.max(0, count - pinned.length)
  const generated   = [...pinned, ...[...unsolved, ...solved].slice(0, fillCount)]

  const fresh = generated.filter(([k]) => !prevDone.has(k))
  const done  = generated.filter(([k]) =>  prevDone.has(k))
  _qpResults = [...fresh, ...done]
  _saveQpState()

  // Lock +/- while timer is running
  if (_qpTimerRun) {
    const dec = document.getElementById('qp-btn-dec')
    const inc = document.getElementById('qp-btn-inc')
    if (dec) dec.disabled = true
    if (inc) inc.disabled = true
  }

  const el = document.getElementById('qp-results')
  if (el) el.innerHTML = _qpResults.map((entry, i) => _buildPracticeItem(entry, i, true)).join('')
  // Sync _qpCount and display to actual result length (pool may be smaller than requested)
  _qpCount = _qpResults.length
  const countEl = document.getElementById('qp-count-val')
  if (countEl) countEl.textContent = _qpResults.length
}

function _qpToggleDueOnly() {
  _qpDueOnly = !_qpDueOnly
  _qpResults = null
  // Clear session state too — the pool is changing so done state against
  // the old set is meaningless and would pollute the next generated set's prevDone snapshot
  _qpDoneThisSession.clear(); _qpStruggledThisSession.clear()
  _saveQpState()
  _renderQuickPractice()
}

// ── Dashboard timer ───────────────────────────────────────────────────────────
function _qpTimerSet(mins, btn) {
  _qpStopTimer()
  _qpTimerPreset = mins
  _qpTimerTotal  = mins * 60
  _qpTimerRem    = _qpTimerTotal
  // Scope selector to qp timer bar only to avoid conflicting with per-topic preset buttons
  const bar = btn ? btn.closest('.ps-timer-bar') : null
  if (bar) bar.querySelectorAll('.ps-preset-btn').forEach(b => b.classList.remove('ps-active'))
  if (btn) btn.classList.add('ps-active')
  _qpSyncTimerDisplay()
}

function _qpTimerToggle() {
  if (!_qpTimerTotal) return
  if (_qpTimerRun) {
    _qpStopTimer()
  } else {
    if (_qpTimerRem <= 0) _qpTimerRem = _qpTimerTotal
    _qpTimerRun = true
    const btn = document.getElementById('qp-timer-play')
    if (btn) btn.textContent = '⏸'
    _qpTimerIv = setInterval(_qpTimerTick, 1000)
    // Lock count controls while running
    const dec = document.getElementById('qp-btn-dec')
    const inc = document.getElementById('qp-btn-inc')
    if (dec) dec.disabled = true
    if (inc) inc.disabled = true
  }
}

function _qpStopTimer() {
  if (_qpTimerIv) { clearInterval(_qpTimerIv); _qpTimerIv = null }
  _qpTimerRun = false
  const btn = document.getElementById('qp-timer-play')
  if (btn) btn.textContent = '▶'
  const dec = document.getElementById('qp-btn-dec')
  const inc = document.getElementById('qp-btn-inc')
  if (dec) dec.disabled = false
  if (inc) inc.disabled = false
}

function _qpTimerReset() {
  _qpStopTimer()
  _qpTimerRem = _qpTimerTotal
  const disp = document.getElementById('qp-timer-disp')
  if (disp) disp.classList.remove('ps-expired', 'ps-running')
  _qpSyncTimerDisplay()
}

function _qpTimerTick() {
  if (_qpTimerRem <= 0) {
    _qpStopTimer()
    _qpTimerRem = 0
    const disp = document.getElementById('qp-timer-disp')
    if (disp) { disp.textContent = '00:00'; disp.className = 'ps-timer-display ps-expired' }
    return
  }
  _qpTimerRem--
  _qpSyncTimerDisplay()
}

function _qpSyncTimerDisplay() {
  const disp = document.getElementById('qp-timer-disp')
  if (!disp) return
  const secs = _qpTimerRem || _qpTimerTotal
  disp.textContent = _fmtTimer(secs)
  disp.className = 'ps-timer-display' +
    (_qpTimerRun ? ' ps-running' : '') +
    (!secs && _qpTimerTotal > 0 ? ' ps-expired' : '')
}

  html.setAttribute('data-bs-theme', next)
  localStorage.setItem('dsa-theme', next)
  document.getElementById('theme-toggle-btn').textContent = next === 'dark' ? '🌙' : '☀️'

}

function setActiveNav(key) {

function escHtml(str) {
  if (!str) return ''
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// ── DATA BACKUP / RESTORE ────────────────────────────────────────────────────
const BACKUP_KEYS = [
  'dsa-progress-v1',
  'dsa-notes-v1',
  'dsa-topic-notes-v1',
  'dsa-pins-v1',
  'dsa-solve-counts-v1',
  'dsa-last-practiced-v1',
  'dsa-review-interval-v1',
  'dsa-streak-v1',
  'dsa-qp-state-v1',
  'dsa-theme'
]

// Cloud sync (shared module in sync.js): reuse the BACKUP_KEYS allowlist.
if (window.DataSync) {
  DataSync.init({ appId: 'dsa', keys: BACKUP_KEYS, versionLabel: 'DSA Notebook' })
  DataSync.autoSync()   // runs at most once / 24h if a token is set
}

function exportData() {
  const backup = {}
  BACKUP_KEYS.forEach(key => {
    const val = localStorage.getItem(key)
    if (val !== null) backup[key] = val
  })
  const json = JSON.stringify(backup, null, 2)
  const blob = new Blob([json], { type: 'application/json' })
  const url  = URL.createObjectURL(blob)
  const a    = document.createElement('a')
  a.href     = url
  a.download = `dsa-notebook-backup-${new Date().toISOString().slice(0,10)}.json`
  document.body.appendChild(a)
  a.click()
  document.body.removeChild(a)
  URL.revokeObjectURL(url)
}

function importData(input) {
  const file = input.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = function(e) {
    try {
      const backup = JSON.parse(e.target.result)
      if (typeof backup !== 'object' || Array.isArray(backup)) throw new Error('Invalid backup format')
      // Only restore known keys to avoid arbitrary data injection
      let restored = 0
      BACKUP_KEYS.forEach(key => {
        if (Object.prototype.hasOwnProperty.call(backup, key) && typeof backup[key] === 'string') {
          localStorage.setItem(key, backup[key])
          restored++
        }
      })
      input.value = '' // reset so same file can be re-imported if needed
      alert(`✅ Restored ${restored} data entr${restored === 1 ? 'y' : 'ies'}. The page will now reload.`)
      location.reload()
    } catch (err) {
      input.value = ''
      alert('❌ Import failed: the file does not appear to be a valid DSA Notebook backup.\n\n' + err.message)
    }
  }
  reader.readAsText(file)
}
