<script>
/* <![CDATA[ */

// ─── HTML GENERATION STYLE ───────────────────────────────────────────────────
// AI: all HTML generation uses string concatenation (+ operator) with escHtml()
// for any user-facing data. Template literals (backticks) are used only in
// buildNav() and buildTopicTabs() where interpolation is cleaner and no
// user data is concatenated directly. Do not mix styles within a function.
// ─────────────────────────────────────────────────────────────────────────────

// ─── BADGE / STATUS MAPS ──────────────────────────────────────────────────────
// AI: all status/difficulty display mappings live here — update here only.
const DIFFICULTY_BADGE = { Easy: 'success', Medium: 'warning', Hard: 'danger' }
const STATUS_DOT       = { Solved: 'bg-success', 'In Progress': 'bg-warning', Pending: 'bg-secondary' }
const STATUS_EMOJI      = { Solved: '✅', 'In Progress': '🚧', Pending: '📋' }
const STATUS_CYCLE      = { Pending: 'In Progress', 'In Progress': 'Solved', Solved: 'Pending' }

// Interview frequency (how often a question is asked). Source field: q.freq in data.js.
// High = Blind 75 / FAANG-flagged "must-know"; Medium = NeetCode 150 / commonly asked;
// Low = pattern-completeness, less commonly asked directly.
// Frequency badge = traffic-light dot + word in a tinted box (🔴 red / 🟡 yellow / ⚪ grey).
// Difficulty keeps its solid green/amber/red pill (no dot); the leading dot + tinted box
// is what separates the two dimensions at a glance.
const FREQ_DOT   = { High: '🔴', Medium: '🟡', Low: '⚪' }
const FREQ_LABEL = { High: 'High', Medium: 'Medium', Low: 'Low' }
const FREQ_DESC  = { High: 'asked very often — drill first', Medium: 'commonly asked', Low: 'less common — pattern completeness' }
function freqBadge(q, extraCls) {
  const f = q && q.freq
  if (!f || !FREQ_LABEL[f]) return ''
  return '<span class="badge freq-badge freq-' + f.toLowerCase() + (extraCls || '') + '"' +
    ' title="Interview frequency: ' + FREQ_LABEL[f] + ' — ' + FREQ_DESC[f] + '">' +
    FREQ_DOT[f] + ' ' + FREQ_LABEL[f] + '</span>'
}

// ─── QUICK-REF PANEL IDs ──────────────────────────────────────────────────────
const QR_IDS = {
  practice: 'qr-practice',
}

// ─── TOPIC TABS ───────────────────────────────────────────────────────────────
// AI: single source of truth for tab definitions.
// Adding a tab here automatically renders it in the HTML nav and wires up
// the tab pane. You must also add a render function and call it in renderCurrentTab().
const TOPIC_TABS = [
  { key: 'questions',  label: 'Questions'  },
  { key: 'notes',      label: '📝 Notes'   },
]

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentTopicKey = null
let currentTab = 'questions'
let currentQFilter = 'all'
let currentFreqFilter = 'all'   // 'all' | 'High' | 'Medium' | 'Low' (interview frequency)
let currentCompanyFilter = null   // null = all companies
const COMPANY_LABEL = Object.fromEntries(COMPANIES.map(c => [c.key, c.label]))

// Brand-ish accent colors for company pills (rendering layer — data.js stays data-only).
// Pills tint this color: solid text + low-alpha background + faint border.
const COMPANY_COLOR = {
  google: '#4f86f7', meta: '#8b7bf7', amazon: '#ff9f43', apple: '#b9c0c8',
  microsoft: '#34c3a0', netflix: '#f0494b', bloomberg: '#f78fb3', uber: '#9aa4b2',
  linkedin: '#4aa3e8', adobe: '#ff6b6b', nvidia: '#86c232', atlassian: '#4c9aff',
  stripe: '#a78bfa', doordash: '#ff5a5f', airbnb: '#ff6f9c', databricks: '#ff7a59',
  snowflake: '#56b8e8', coinbase: '#6b8cff',
}
// Display order = COMPANIES order (tier 1 first), so the most relevant names lead.
const COMPANY_ORDER = Object.fromEntries(COMPANIES.map((c, i) => [c.key, i]))

// One colored company pill. `cls` overrides the class (defaults to .company-pill).
function companyPill(key, cls) {
  const color = COMPANY_COLOR[key] || '#8a93a0'
  return '<span class="' + (cls || 'company-pill') + '"' +
    ' style="color:' + color + ';border-color:' + color + ';background:' + color + '14">' +
    escHtml(COMPANY_LABEL[key] || key) + '</span>'
}

// Compact colored pills for a question header — top companies by tier, capped with a +N overflow.
function companyPillsRow(lc, max) {
  const keys = getCompanies(lc).slice().sort((a, b) => (COMPANY_ORDER[a] ?? 99) - (COMPANY_ORDER[b] ?? 99))
  if (!keys.length) return ''
  const cap = max || 4
  const shown = keys.slice(0, cap).map(k => companyPill(k)).join('')
  const rest = keys.slice(cap)
  const more = rest.length
    ? '<span class="company-pill company-pill-more" title="' + escHtml(rest.map(k => COMPANY_LABEL[k] || k).join(', ')) + '">+' + rest.length + '</span>'
    : ''
  return '<span class="q-companies">' + shown + more + '</span>'
}

// ─── PRACTICE SESSION STATE ──────────────────────────────────────────────────
let _psQCount     = 5     // question count — shared across ALL modes (Worked/Graded/Mock/Revise/By Pattern) so it's exactly what you set it to, no matter which mode you're in
let _psTimerTotal = 0     // timer set value in seconds (0 = off)
let _psTimerRem   = 0     // remaining seconds
let _psTimerRun   = false // is timer running?
let _psTimerIv    = null  // setInterval handle
let _psTimerPreset = 0    // last selected preset in minutes
let _psDoneThisSession      = new Set()  // keys done in current per-topic practice batch
let _psStruggledThisSession = new Set()  // subset of done that were marked "struggled"
let _psCurrentItems         = []         // current ordered list for per-topic session
let _psCurrentTopic         = null       // currently active topic key for practice session
let _psMode                 = 'graded'   // per-topic mode default: 'graded' (your graded questions, weakest first) | 'worked' | 'mock' | 'revise' (active recall over the WHOLE topic) | 'revise-pattern' (active recall scoped to selected pattern(s) — see _psRevisePatterns)
let _psMockReveal           = false      // reveal hidden difficulty after a per-topic Mock
let _psRevisePatterns       = new Set()  // 'revise-pattern' mode only: pattern IDs (P1, P2…) to scope the due-set to; empty = nothing selected yet
let _psReviseCodeFlagged    = new Set()  // Revise/By Pattern only: ~20% of the current set, randomly picked, marked "actually code this" (not just recall)
let _psClearedTopics        = new Set()  // topics whose set was emptied with 🗑 Clear — the panel stays empty (with a Generate button) instead of auto-regenerating; dropped by any real regenerate
let _psReviseShownThisSession = new Set()  // Revise/By Pattern only: keys already surfaced by a Refresh since the last full cycle — used to push them to the back so repeated manual Refreshes (with a capped count) cycle through the whole due-set before repeating anything

// ─── PRACTICE SESSION PERSISTENCE ────────────────────────────────────────────
// Store/restore practice sessions (ALL modes — Worked/Graded/Mock) so a refresh or topic
// navigation never reshuffles your set: only ↺ Reset/Refresh or a mode switch regenerates.
// Format: { [topicKey]: { mode, items: [[lcKey, {title, difficulty}]], doneInSession: [lcKeys...],
//           struggledInSession: [lcKeys...], mockReveal } } — one saved session per topic.
const PS_SESSION_KEY = 'dsa-practice-session-v1'
function _psAllSessions() {
  try {
    const raw = JSON.parse(localStorage.getItem(PS_SESSION_KEY) || 'null')
    if (!raw) return {}
    // Legacy single-session format ({ topicKey, items, ... } — Worked-only) → per-topic map
    if (raw.topicKey) return { [raw.topicKey]: Object.assign({ mode: 'worked' }, raw) }
    return raw
  } catch { return {} }
}
function _psSaveSession() {
  if (!_psCurrentTopic) return
  try {
    const all = _psAllSessions()
    // Graded's empty "pick a count and hit Generate" state must NOT be saved as a session —
    // an empty-but-truthy saved session would make _psLoadSession return it on the next visit,
    // which restores it (and its "always show weak graded questions" merge) INSTEAD of leaving
    // the panel empty, silently defeating the "Graded starts empty" behavior. No items yet means
    // no session yet: clear any stale entry instead of writing an empty one.
    if (_psCurrentItems.length === 0 && (_psMode === 'graded' || _psClearedTopics.has(_psCurrentTopic))) {
      delete all[_psCurrentTopic]
      localStorage.setItem(PS_SESSION_KEY, JSON.stringify(all))
      return
    }
    all[_psCurrentTopic] = {
      mode: _psMode,
      items: _psCurrentItems.map(([lcKey, q]) => [lcKey, { title: q.title, difficulty: q.difficulty }]),
      doneInSession: Array.from(_psDoneThisSession),
      struggledInSession: Array.from(_psStruggledThisSession),
      mockReveal: _psMockReveal,
      revisePatterns: Array.from(_psRevisePatterns),
      codeFlagged: Array.from(_psReviseCodeFlagged),
      reviseShown: Array.from(_psReviseShownThisSession),
      qCount: _psQCount,
    }
    localStorage.setItem(PS_SESSION_KEY, JSON.stringify(all))
  } catch {}
}
function _psLoadSession(topicKey) {
  const session = _psAllSessions()[topicKey]
  if (!session || !Array.isArray(session.items)) return null
  // Restore done state from persisted session
  _psDoneThisSession      = new Set(session.doneInSession || [])
  _psStruggledThisSession = new Set(session.struggledInSession || [])
  _psRevisePatterns       = new Set(session.revisePatterns || [])
  _psReviseCodeFlagged    = new Set(session.codeFlagged || [])
  _psReviseShownThisSession = new Set(session.reviseShown || [])
  if (typeof session.qCount === 'number') _psQCount = session.qCount
  return session
}

// ─── DASHBOARD QUICK PRACTICE SESSION STATE ──────────────────────────────────
// Kept separate from per-topic state so navigating to a topic page and back
// never wipes the dashboard session progress.
let _qpDoneThisSession      = new Set()  // keys marked done on the dashboard qp panel
let _qpStruggledThisSession = new Set()  // subset of qp done that were marked "struggled"

// ─── LAST-PRACTICED TRACKING ─────────────────────────────────────────────────
// shape: { [lcKey]: ISO timestamp }
const LAST_PRACTICED_KEY = 'dsa-last-practiced-v1'
function getLastPracticed(lcKey) {
  try { return JSON.parse(localStorage.getItem(LAST_PRACTICED_KEY) || '{}')[lcKey] || null } catch { return null }
}
function markPracticed(lcKey) {
  try {
    const d = JSON.parse(localStorage.getItem(LAST_PRACTICED_KEY) || '{}')
    d[lcKey] = new Date().toISOString()
    localStorage.setItem(LAST_PRACTICED_KEY, JSON.stringify(d))
  } catch {}
  _updateStreak()
}

// ─── CODE COOLDOWN INTERVALS ──────────────────────────────────────────────────
// shape: { [lcKey]: days }. After you SOLVE a question it "rests" this many days before it can
// reappear in practice (the cooldown). Default 1 so the first solve bumps to the first rung (2).
const REVIEW_INTERVAL_KEY = 'dsa-review-interval-v1'
function getReviewInterval(lcKey) {
  try { return JSON.parse(localStorage.getItem(REVIEW_INTERVAL_KEY) || '{}')[lcKey] || 1 } catch { return 1 }
}
function setReviewInterval(lcKey, days) {
  try {
    const d = JSON.parse(localStorage.getItem(REVIEW_INTERVAL_KEY) || '{}')
    d[lcKey] = days
    localStorage.setItem(REVIEW_INTERVAL_KEY, JSON.stringify(d))
  } catch {}
}
// Cooldown ladder: each clean solve pushes the next reappearance further out, capped at 14 days.
const REVIEW_LADDER = [2, 4, 7, 14]
function bumpReviewInterval(lcKey) {
  const cur  = getReviewInterval(lcKey)
  const next = REVIEW_LADDER.find(d => d > cur) ?? REVIEW_LADDER[REVIEW_LADDER.length - 1]
  setReviewInterval(lcKey, next)
  return next
}
function resetReviewInterval(lcKey) {
  setReviewInterval(lcKey, REVIEW_LADDER[0])
  return REVIEW_LADDER[0]
}
// Give a ✓ Solid grade in Graded the same "clean solve" credit the old click-to-solve row gave:
// push the code-cooldown ladder further out, timestamp it as practiced, and mark the question
// Solved if it isn't already. The confidence-ring bump is NOT repeated here — gradeRevise()
// already does that (deduped once/day) before this runs.
function _psCreditCleanSolve(lcKey) {
  markPracticed(lcKey)
  bumpReviewInterval(lcKey)
  if (getStatus(lcKey) !== 'Solved') setQuestionStatus(lcKey, 'Solved')
}

// ─── STREAK TRACKING ──────────────────────────────────────────────────────────
const STREAK_KEY = 'dsa-streak-v1'
// n calendar days before now (setDate keeps it correct across DST, unlike subtracting 86400000 ms)
function _daysAgo(n) { const d = new Date(); d.setDate(d.getDate() - n); return d }
function _updateStreak() {
  try {
    const today = _localDay()
    const data  = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"date":"","streak":0,"longest":0}')
    if (data.date === today) return  // already counted today
    const yesterday = _localDay(_daysAgo(1))
    const newStreak  = data.date === yesterday ? (data.streak || 0) + 1 : 1
    const newLongest = Math.max(newStreak, data.longest || 0)
    localStorage.setItem(STREAK_KEY, JSON.stringify({ date: today, streak: newStreak, longest: newLongest }))
  } catch {}
}
function getStreak() {
  try {
    const data      = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"date":"","streak":0,"longest":0}')
    const today     = _localDay()
    const yesterday = _localDay(_daysAgo(1))
    if (data.date !== today && data.date !== yesterday) return { streak: 0, longest: data.longest || 0, today: false }
    return { streak: data.streak || 0, longest: data.longest || 0, today: data.date === today }
  } catch { return { streak: 0, longest: 0, today: false } }
}

// A question is "due" if never practiced OR last practiced > N days ago (N = per-key review interval)
function isDue(lcKey) {
  const last = getLastPracticed(lcKey)
  if (!last) return true
  return (Date.now() - new Date(last).getTime()) > getReviewInterval(lcKey) * 24 * 60 * 60 * 1000
}

// CODE queue "due": you've engaged with it and it's overdue on the code ladder, OR a "forgot"
// recall force-queued it for a fresh cold solve. Never-touched 📋 Pending problems are the
// learn backlog (shown as the Pending count) — not counted here, to keep the number actionable.
function isCodeDue(lcKey) {
  if (isCodeForced(lcKey)) return true
  if (!_isEngaged(lcKey)) return false
  return isDue(lcKey)
}

// COOLDOWN: a question you've solved "rests" and is hidden from ALL practice generation (Worked /
// Graded / Mock, topic + dashboard) until its cooldown ladder (2→4→7→14) comes due again. A
// ✗-forgot (force-queued) question is never on cooldown — it always resurfaces. Never-solved
// questions are always "due" (isDue true), so they're never on cooldown either.
function _onCooldown(lcKey) { return !isDue(lcKey) && !isCodeForced(lcKey) }

// Unique question keys across topics. 49 questions are cross-listed in 2+ topics (same lcKey ⇒ same
// status / grade / cooldown), so summing per-topic lengths double-counts them — anything that reports a
// GLOBAL number (totals, due counts, "max N") must count each lcKey once.
function _uniqueQuestionKeys(topicKeys) {
  const set = new Set()
  ;(topicKeys || TOPICS.map(t => t.key)).forEach(k => {
    const mod = TOPIC_MODULES[k]
    if (mod) Object.keys(mod.questions).forEach(q => set.add(q))
  })
  return set
}

// Live-update the dashboard's two due-counts (no-op when not on the dashboard).
function _refreshDueCounts() {
  const rEl = document.getElementById('due-revise-count')
  const cEl = document.getElementById('due-code-count')
  if (!rEl && !cEl) return
  let codeDue = 0, reviseDue = 0
  _uniqueQuestionKeys().forEach(k => { if (isCodeDue(k)) codeDue++; if (isReviseDue(k)) reviseDue++ })
  if (rEl) rEl.textContent = reviseDue
  if (cEl) cEl.textContent = codeDue
}
// ─── QUICK PRACTICE STATE (dashboard) ────────────────────────────────────────
let _qpTopics  = new Set()  // selected topic keys
let _qpCount   = 10         // question count
let _qpResults = null       // last generated results ([lcKey, q][])
let _qpTimerTotal  = 0      // set value in seconds
let _qpTimerRem    = 0      // remaining seconds
let _qpTimerRun    = false  // is running?
let _qpTimerIv     = null   // setInterval handle
let _qpTimerPreset = 0      // last preset in minutes
let _qpDueOnly     = false  // when true: generate only "due for review" questions
let _qpMock        = false  // Mock Mode removed from the dashboard UI — only Graded (on/off) + Generate remain
let _qpMockReveal  = false  // after a mock run, reveal the hidden topic/difficulty for post-mortem (not persisted)
let _qpRevise      = false  // Revise Session: active-recall pass — pulls revise-due problems with ✓/~/✗ grade buttons (no cold-solve). Mutually exclusive with Mock.
let _qpRevised     = false  // Revised log: read-only list of everything you've already graded, newest-first, with grade + "ago". Re-grade in place. Mutually exclusive with Mock/Revise.
let _practiceWorkedOnly = false  // when true: practice pool excludes 📋 Pending (only 🚧 In Progress + ✅ Solved). Shared by dashboard Quick Practice + per-topic Practice Session.

// ─── QP STATE PERSISTENCE ─────────────────────────────────────────────────────
const QP_STATE_KEY = 'dsa-qp-state-v1'
function _saveQpState() {
  try {
    const state = {
      topics:  Array.from(_qpTopics),
      count:   _qpCount,
      dueOnly: _qpDueOnly,
      mock:    _qpMock,
      revise:  _qpRevise,
      revised: _qpRevised,
      workedOnly: _practiceWorkedOnly,
      results: _qpResults ? _qpResults.map(([k]) => k) : null,
      // Which of THIS generated set you've graded/solved this session — without this, closing
      // and reopening the tab restores the same question list (results, above) but the tint
      // showing what you'd already graded would vanish, since that's normally in-memory only.
      // Cleared by _qpGenerate() on every real regenerate, same as the in-memory Set always was.
      doneThisSession: Array.from(_qpDoneThisSession),
    }
    localStorage.setItem(QP_STATE_KEY, JSON.stringify(state))
  } catch {}
}
// Fully replaces in-memory QP state from whatever's on disk right now — safe to call
// more than once (e.g. re-synced when the tab regains focus, see the visibilitychange
// listener below), not just once at page load. Being additive/partial here (the old
// version only ever ADDED to _qpTopics and left _qpResults alone when disk had none)
// is exactly how a background tab could re-save a stale in-memory snapshot on top of
// what a different, more-recently-active tab had just written — this makes reload
// idempotent so a re-sync always matches disk exactly, not "disk merged with whatever
// I already had in memory".
function _loadQpState() {
  _qpTopics = new Set()
  _qpResults = null
  _qpDoneThisSession = new Set()
  try {
    const raw = localStorage.getItem(QP_STATE_KEY)
    if (!raw) return
    const state = JSON.parse(raw)
    if (Array.isArray(state.topics)) state.topics.forEach(k => _qpTopics.add(k))
    if (typeof state.count   === 'number') _qpCount   = state.count
    // Graded IS restored — unlike Mock/"Worked-on only" (deliberately NOT restored below), its
    // toggle chip is still on the dashboard, so there's always a way to switch it back off; not
    // restoring it just meant a reload after finishing a Graded set silently re-rendered that
    // same set as plain rows and showed the wrong ("solved" instead of "graded") banner.
    if (typeof state.revised === 'boolean') _qpRevised = state.revised
    // Mock / "Worked-on only" are NOT restored: their dashboard toggle chips were removed, so a
    // `true` saved from before that removal would otherwise be permanently stuck on with no
    // button left to turn it back off, silently shrinking the pool or hiding everything.
    if (Array.isArray(state.results)) {
      // Re-hydrate [lcKey, q] pairs from TOPIC_MODULES
      const pairs = []
      state.results.forEach(k => {
        for (const topicKey of Object.keys(TOPIC_MODULES)) {
          const q = TOPIC_MODULES[topicKey].questions[k]
          if (q) { pairs.push([k, q]); break }
        }
      })
      if (pairs.length > 0) _qpResults = pairs
    }
    if (Array.isArray(state.doneThisSession)) _qpDoneThisSession = new Set(state.doneThisSession)
  } catch {}
}

// Keep a backgrounded tab from clobbering a more-recently-active one: each tab only
// loads dashboard/practice state from localStorage ONCE, into its own in-memory copy
// (_qpResults, _qpDoneThisSession, ...) — it never re-reads disk between actions. If
// you leave a tab open, grade a fresh batch in a DIFFERENT tab, then come back and
// interact with the old one, it would otherwise save ITS stale in-memory copy over
// the newer one on disk, making today's grading look like it "disappeared". Re-sync
// from disk the moment a tab regains focus/visibility, before you can act in it.

// ─── NAV BADGE COLOUR ───────────────────────────────────────────────────────
// 5-level colour ramp: grey → yellow → teal → blue → green as you fill the topic
function _navBadgeCls(solved, total) {
  if (!total)                        return 'bg-secondary'
  if (solved === total)              return 'bg-success'
  const pct = solved / total * 100
  if (pct >= 75)                     return 'bg-primary'   // 75-99 %  → blue (almost!)
  if (pct >= 50)                     return 'bg-info'      // 50-74 %  → teal
  if (pct > 0)                       return 'bg-warning'   // 1-49 %   → yellow
  return 'bg-secondary'                                    // 0 %      → grey
}

function buildNav() {
  const container = document.getElementById('nav-topics')
  container.innerHTML = TOPICS.map(t => {
    const mod = TOPIC_MODULES[t.key]
    if (!mod) return `
      <button type="button" id="nav-${t.key}" onclick="loadTopic('${t.key}')" class="nav-link">
        <span class="nav-topic-icon">${t.icon}</span>
        <span class="nav-topic-label">${t.label}</span>
      </button>
    `
    const qKeys   = Object.keys(mod.questions)
    const solved  = qKeys.filter(k => getStatus(k) === 'Solved').length
    const total   = qKeys.length
    const badgeCls = _navBadgeCls(solved, total)
    return `
      <button type="button"
         id="nav-${t.key}"
         onclick="loadTopic('${t.key}')"
         class="nav-link">
        <span class="nav-topic-icon">${t.icon}</span>
        <span class="nav-topic-label">${t.label}</span>
        <span id="nav-badge-${t.key}" class="badge ${badgeCls} rounded-pill text-xxs">${solved}/${total}</span>
      </button>
    `
  }).join('')
}

function handleGlobalSearch() {

}

function renderSearchResults(results) {
  showView('view-search-results')
  document.getElementById('page-title').textContent = '🔍 Search Results'
  
  // Render daily question card at top
  const dailyQ = getDailyQuestion()
  if (dailyQ) {
    document.getElementById('daily-question-card').innerHTML = renderDailyQuestionCard(dailyQ)
  }
  
  // Render search results
  const resultsList = document.getElementById('search-results-list')
  if (results.length === 0) {
    resultsList.innerHTML = '<div class="alert alert-info">No questions match your search. Try different keywords!</div>'
    return
  }
  
  let html = '<div class="row g-2">'
  results.forEach(r => {
    const id = 'qr_' + r.lcKey.replace(/_/g, '')
    html += `<div class="col-md-6">
      <div class="card" style="cursor:pointer;" onclick="goToQuestion('${r.topicKey}', '${r.lcKey}')">
        <div class="card-body p-3">
          <div class="d-flex gap-2 mb-1">
            <span>${r.topicIcon} <small class="text-muted">${r.topicLabel}</small></span>
            <span class="ms-auto d-flex gap-1 align-items-center"><strong class="badge" style="background:var(--${getDifficultyColor(r.question.difficulty)})">${r.question.difficulty}</strong>${freqBadge(r.question)}</span>
          </div>
          <h6 class="mb-1">${escHtml(r.question.title)}</h6>
          <div class="d-flex gap-1 mb-1">

function getDifficultyColor(difficulty) {
  switch(difficulty) {
    case 'Easy': return 'green'
    case 'Medium': return 'yellow'
    case 'Hard': return 'red'
    default: return 'accent'
  }
}

function goToQuestion(topicKey, lcKey) {
  // Clear search and navigate to topic/question
  document.getElementById('global-search-input').value = ''
  loadTopic(topicKey)  // lands on the Questions tab by default (TOPIC_TABS[0])
  // Expand this question's accordion item and scroll it into view, with a flash to make it
  // easy to spot. Uses the same data-lc-key lookup _jumpToQuestion relies on elsewhere — the
  // old selector here (id="q_"+lcKey) never matched anything, so this silently did nothing.
  requestAnimationFrame(() => {
    const item = document.querySelector('#tab-questions .accordion-item[data-lc-key="' + lcKey + '"]')
    if (!item) return
    const collapseEl = item.querySelector('.accordion-collapse')
    if (collapseEl && window.bootstrap) bootstrap.Collapse.getOrCreateInstance(collapseEl, { toggle: false }).show()
    item.scrollIntoView({ behavior: 'smooth', block: 'center' })
    item.classList.remove('ps-jump-highlight')
    void item.offsetWidth  // restart the flash animation if clicked again
    item.classList.add('ps-jump-highlight')
  })
}

function skipToDailyQuestion(currentLcKey) {
  const newQ = getRandomDailyQuestion(currentLcKey)

    }

    if (dailyPanel) {

    }
  }
}

// Per-device UI state (intentionally NOT synced via BACKUP_KEYS).
const CURRENT_VIEW_KEY = 'dsa-current-view-v1'
function _saveCurrentView(v) { try { localStorage.setItem(CURRENT_VIEW_KEY, v) } catch {} }

  let saved = null
  try { saved = localStorage.getItem(CURRENT_VIEW_KEY) } catch {}
  if (saved === 'google') loadGoogle()
  else if (saved === 'papers') loadPapers()
  else if (saved && saved !== 'dashboard' && TOPICS.some(t => t.key === saved)) loadTopic(saved)
  else loadDashboard()
}

function loadDashboard() {
  showView('view-dashboard')
  _stopTimer()       // stop per-topic timer if navigating here from a topic page
  document.getElementById('page-title').textContent = '🏠 Dashboard'
  document.getElementById('header-tabs').innerHTML = ''
  clearActiveNav()
  const dash = document.getElementById('nav-dashboard')
  if (dash) dash.classList.add('active')
  currentTopicKey = null
  _saveCurrentView('dashboard')

  // One-pass: compute global totals + per-topic stats simultaneously
  let totalQ = 0, totalSolved = 0, totalInProg = 0, totalPending = 0
  const topicStats = TOPICS.map(t => {
    const mod = TOPIC_MODULES[t.key]
    if (!mod) return { key: t.key, icon: t.icon, label: t.label, mod: null }
    const qKeys  = Object.keys(mod.questions)
    const solved  = qKeys.filter(k => getStatus(k) === 'Solved').length
    const inProg  = qKeys.filter(k => getStatus(k) === 'In Progress').length
    const pending = qKeys.filter(k => getStatus(k) === 'Pending').length
    return {
      key: t.key, icon: t.icon, label: t.label, mod,
      total: qKeys.length, solved, inProg, pending,
      pct:       qKeys.length ? Math.round(solved / qKeys.length * 100) : 0,
      inProgPct: qKeys.length ? Math.round(inProg / qKeys.length * 100) : 0
    }
  })

  // Global totals count each question ONCE (cross-listed questions appear in several topic cards above).
  const _uniq = _uniqueQuestionKeys()
  _uniq.forEach(k => {
    totalQ++
    const st = getStatus(k)
    if (st === 'Solved') totalSolved++
    else if (st === 'In Progress') totalInProg++
    else totalPending++
  })
  const solvedPct  = totalQ ? Math.round(totalSolved / totalQ * 100) : 0
  const inProgPct  = totalQ ? Math.round(totalInProg / totalQ * 100) : 0

  // Count both spaced-repetition queues across all topics:
  //   reviseDue = problems due for an active-recall pass · codeDue = problems due for a cold solve
  let codeDue = 0, reviseDue = 0
  _uniq.forEach(k => { if (isCodeDue(k)) codeDue++; if (isReviseDue(k)) reviseDue++ })

  // ── Overall tracker ─────────────────────────────────────────────────────────
  const streak = getStreak()
  const streakHtml = streak.streak > 0
    ? '<span class="ps-streak-badge">🔥 ' + streak.streak + (streak.streak === 1 ? ' day' : ' days') + (streak.longest > streak.streak ? ' <span style="opacity:0.6;font-size:0.62rem">best ' + streak.longest + '</span>' : '') + '</span>'
    : '<span class="ps-streak-badge streak-zero">🔥 Start streak</span>'
  document.getElementById('overall-tracker').innerHTML =
    '<div class="card">' +
    '<div class="card-body">' +
    '<div class="d-flex align-items-center gap-2 mb-2">' +
    '<h6 class="mb-0 fw-semibold me-auto">Overall Progress</h6>' +
    streakHtml +
    '<span class="text-secondary small">' + totalSolved + ' / ' + totalQ + ' solved</span>' +
    '</div>' +
    '<div class="progress progress-md mb-2">' +
    '<div class="progress-bar bg-success" style="width:' + solvedPct + '%" title="Solved: ' + totalSolved + '"></div>' +
    '<div class="progress-bar bg-warning" style="width:' + inProgPct + '%" title="In Progress: ' + totalInProg + '"></div>' +
    '</div>' +
    '<div class="d-flex gap-3 small">' +
    '<span class="text-success">✅ <strong>' + totalSolved + '</strong> Solved</span>' +
    '<span class="text-warning">🚧 <strong>' + totalInProg + '</strong> In Progress</span>' +
    '<span class="text-secondary">📋 <strong>' + totalPending + '</strong> Pending</span>' +
    '<span class="text-warning ms-auto" title="Cold-solve queue: questions due to (re)code from scratch">⌨️ <strong id="due-code-count">' + codeDue + '</strong> to code</span>' +
    '</div>' +
    '</div></div>'

  // ── Daily Question Panel ─────────────────────────────────────────────────────
  const dailyQ = getDailyQuestion()
  if (dailyQ) {
    document.getElementById('daily-question-panel').innerHTML = renderDailyQuestionCard(dailyQ)
  } else {
    document.getElementById('daily-question-panel').innerHTML = ''
  }

  // ── Per-topic cards ──────────────────────────────────────────────────────────
  document.getElementById('topic-cards').innerHTML = topicStats.map(s => {
    if (!s.mod) {
      return (
        '<div class="col-12 col-md-6 col-lg-4">' +
        '<div class="card h-100 text-center" role="button" onclick="loadTopic(\'' + s.key + '\')">' +
        '<div class="card-body d-flex flex-column justify-content-center align-items-center py-4">' +
        '<div class="icon-lg mb-2">' + s.icon + '</div>' +
        '<h6 class="mb-1">' + escHtml(s.label) + '</h6>' +
        '<span class="badge bg-secondary">Coming soon</span>' +
        '</div></div></div>'
      )
    }
    return (
      '<div class="col-12 col-md-6 col-lg-4">' +
      '<div class="card h-100" role="button" onclick="loadTopic(\'' + s.key + '\')">' +
      '<div class="card-body">' +
      '<div class="d-flex align-items-center gap-2 mb-2">' +
      '<span class="icon-xl">' + s.icon + '</span>' +
      '<h6 class="mb-0 fw-semibold">' + escHtml(s.label) + '</h6>' +
      '</div>' +
      '<div class="d-flex flex-wrap gap-3 small text-secondary mb-3">' +
      '<span>📝 ' + s.total + ' questions</span>' +
      '<span>🧩 ' + s.mod.patterns.length + ' patterns</span>' +
      '</div>' +
      '<div class="d-flex justify-content-between small mb-1">' +

      '<span class="fw-semibold">' + s.solved + ' / ' + s.total + '</span>' +
      '</div>' +
      '<div class="progress progress-sm mb-2">' +
      '<div class="progress-bar bg-success" style="width:' + s.pct + '%"></div>' +

      '<div class="d-flex gap-3 small">' +
      '<span class="text-success">✅ ' + s.solved + '</span>' +
      '<span class="text-warning">🚧 ' + s.inProg + '</span>' +
      '<span class="text-secondary">📋 ' + s.pending + '</span>' +

// ─── LOAD TOPIC ───────────────────────────────────────────────────────────────
function loadTopic(key) {
  const topic = TOPICS.find(t => t.key === key)
  if (!topic) return

  currentTopicKey = key
  _saveCurrentView(key)
  currentTab = TOPIC_TABS[0].key  // always start on first tab
  _editingNoteId = null           // drop any in-progress note edit from the prior topic
  _noteQuery = ''                 // clear notes search on topic switch
  currentQFilter = 'all'          // reset filter on topic switch
  currentCompanyFilter = null     // reset company filter on topic switch
  currentFreqFilter = 'all'       // reset frequency filter on topic switch
  _stopTimer()                    // stop any running per-topic practice timer
  _qpStopTimer()                  // stop QP timer if it was running on dashboard

  // Clear in-memory session state — the practice panel build restores this topic's saved session
  _psCurrentItems = []
  _psDoneThisSession.clear(); _psStruggledThisSession.clear()
  _psQCount = 5
  _psRevisePatterns = new Set()
  _psReviseShownThisSession = new Set()

  showView('view-topic')
  document.getElementById('page-title').textContent = topic.icon + ' ' + topic.label
  setActiveNav(key)
  buildTopicTabs()  // renders nav + panes from TOPIC_TABS registry

  const mod = TOPIC_MODULES[key]
  renderTopicTracker(mod)
  renderTopicAlwaysVisible(mod)
  renderCurrentTab()
}
