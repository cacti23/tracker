<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DSA Notebook — curated patterns, templates and questions for FAANG interview preparation.">
  <meta name="theme-color" content="#0f1117">
  <title>DSA Notebook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>⚡</text></svg>">
  <!-- ═══ THEME INIT — DO NOT MOVE. Must execute before stylesheet renders to avoid flash of wrong theme. ═══ -->
  <script>
    (function() {
      const t = localStorage.getItem('dsa-theme') || 'dark'
      document.documentElement.setAttribute('data-bs-theme', t)
    })()
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /*
     * v28 — Lean CSS philosophy:
     * Set Bootstrap --bs-* vars in [data-bs-theme="dark"|"light"] → Bootstrap renders components.
     * Custom CSS only for things Bootstrap cannot express: layout, custom components,
     * visual flourishes. Zero !important wars except where Bootstrap utilities require it.
     *
     * AI INSTRUCTIONS:
     * - Design tokens live in :root (dark) and [data-bs-theme="light"] — change colors there only.
     * - Never hardcode colors in CSS rules or JS templates — always use var(--token-name).
     * - Never add Bootstrap utility classes that hardcode colors (text-light, text-white, bg-dark etc).
     * - Utility classes for font sizes etc live in section 15a — add new ones there.
     * - Status/difficulty maps live in BADGE / STATUS MAPS block in JS — update there only.
     * - To add a new topic: append to TOPICS array + TOPIC_MODULES object. No other changes needed.
     */

    /* ── 1. DESIGN TOKENS ───────────────────────────────────────────────────── */
    :root {
      /* Dark theme — deep navy, not pitch black. Each level is perceptibly different. */
      --bg-base:     #0f1117;   /* page background                */
      --bg-surface:  #161b27;   /* sidebar, header                */
      --bg-elevated: #1c2333;   /* cards, accordions              */
      --bg-hover:    #242e42;   /* hover, active accordion        */
      --border:      rgba(99,120,180,0.25);  /* clearly visible    */
      --border-glow: rgba(99,162,255,0.45);
      --accent:      #4f8ef7;
      --accent-dim:  rgba(79,142,247,0.13);
      --accent-glow: rgba(79,142,247,0.22);
      --green:       #3dd68c;   --green-dim:  rgba(61,214,140,0.12);
      --yellow:      #f0c060;   --yellow-dim: rgba(240,192,96,0.12);
      --red:         #f76e6e;   --red-dim:    rgba(247,110,110,0.12);
      --purple:      #b48ef7;   --purple-dim: rgba(180,142,247,0.12);
      --teal:        #4fd1c5;   --teal-dim:   rgba(79,209,197,0.12);
      --text-primary:#dde3f0;   /* softer than pure white, less eye strain */
      --text-muted:  #8a9bc0;
      --text-faint:  #4d5c7a;   /* lifted from near-invisible #3d4a6a     */
      --radius:      10px;
      --radius-lg:   14px;
      --font-body:   'Outfit', system-ui, sans-serif;
      --font-mono:   'Space Mono', 'Courier New', monospace;
      /* Type scale — use these tokens, not raw rem values */
      --fs-xs:   0.68rem;   /* meta labels, badges         */
      --fs-sm:   0.78rem;   /* secondary text, small prose */
      --fs-base: 0.88rem;   /* body, accordion titles      */
    }

    /* ── 2. BOOTSTRAP COMPONENT VARS ───────────────────────────────────────────
     * The ONLY correct way to retheme Bootstrap 5.3.
     * No !important needed — Bootstrap reads these vars for every component.
     */
    [data-bs-theme="dark"] {
      --bs-body-bg:                  var(--bg-base);
      --bs-body-color:               var(--text-primary);
      --bs-body-font-family:         var(--font-body);
      --bs-body-font-size:           1rem;
      --bs-border-color:             var(--border);
      --bs-border-color-translucent: var(--border);
      --bs-secondary-color:          var(--text-muted);
      --bs-secondary-bg:             var(--bg-surface);
      --bs-tertiary-bg:              var(--bg-elevated);
      /* Card */
      --bs-card-bg:                  var(--bg-elevated);
      --bs-card-border-color:        var(--border);
      --bs-card-cap-bg:              var(--bg-elevated);
      --bs-card-color:               var(--text-primary);
      --bs-card-border-radius:       var(--radius-lg);
      /* Accordion */
      --bs-accordion-bg:             var(--bg-elevated);
      --bs-accordion-border-color:   var(--border);
      --bs-accordion-border-radius:  var(--radius);
      --bs-accordion-inner-border-radius: calc(var(--radius) - 1px);
      --bs-accordion-btn-bg:         var(--bg-elevated);
      --bs-accordion-btn-color:      var(--text-primary);
      --bs-accordion-btn-focus-box-shadow: none;
      --bs-accordion-btn-padding-x:  1rem;
      --bs-accordion-btn-padding-y:  0.7rem;
      --bs-accordion-active-bg:      var(--bg-hover);
      --bs-accordion-active-color:   var(--text-primary);
      --bs-accordion-body-padding-x: 1.1rem;
      --bs-accordion-body-padding-y: 1rem;
      /* Nav */
      --bs-nav-link-color:           var(--text-muted);
      --bs-nav-link-hover-color:     var(--text-primary);
      /* Progress */
      --bs-progress-bg:              rgba(255,255,255,0.05);
      --bs-progress-border-radius:   99px;
      --bs-progress-height:          0.35rem;
      /* Table */
      --bs-table-bg:                 transparent;
      --bs-table-hover-bg:           var(--bg-hover);
      --bs-table-border-color:       var(--border);
      /* Badge */
      --bs-badge-border-radius:      6px;
      --bs-badge-font-weight:        500;
    }

    /* ── 2a. LIGHT THEME TOKEN OVERRIDES ────────────────────────────────────────
     * Bootstrap handles all component colors. We only override our custom tokens.
     * AI: to adjust light theme, change values here only.                        */
    [data-bs-theme="light"] {
      --bg-base:     #f0f2f7;   /* page — off-white, not pure white              */
      --bg-surface:  #f8f9fc;   /* sidebar, header — one step lighter than base  */
      --bg-elevated: #ffffff;   /* cards, accordions — white pops off the base   */
      --bg-hover:    #e8ecf5;
      --border:      rgba(60,80,140,0.18);
      --border-glow: rgba(79,142,247,0.4);
      --text-primary:#1a1d2e;
      --text-muted:  #4a5270;
      --text-faint:  #7a85a8;   /* lifted for readability                        */
    }

    /* ── 3. BASE — only what Bootstrap does not set ─────────────────────────── */
    html { scroll-behavior: smooth; }
    pre, code { font-family: var(--font-mono); }
    pre {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      overflow-x: auto;
      font-size: 0.76rem;
      line-height: 1.7;
    }
    code { color: var(--accent); font-size: 0.82em; }
    small, .small { font-size: 0.8rem; }

    /* ── 5. SIDEBAR — Bootstrap has no sidebar component ───────────────────── */
    #sidebar {
      width: 260px; min-height: 100vh; flex-shrink: 0;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      transition: width 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    #sidebar.collapsed { width: 0; overflow: hidden; }
    #sidebar nav { padding: 0.6rem; overflow-y: auto; flex: 1; }

    .sidebar-brand {
      padding: 1rem 1.1rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; white-space: nowrap;
    }
    .sidebar-brand-name {
      font-size: 0.88rem; font-weight: 700; letter-spacing: 0.03em;
      color: var(--text-primary); display: flex; align-items: center; gap: 0.45rem;
    }
    .sidebar-brand-name .bolt {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 7px; font-size: 0.85rem;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .sidebar-close-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 7px;
      color: var(--text-muted); width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 0.8rem;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .sidebar-close-btn:hover { border-color: var(--border-glow); color: var(--text-primary); background: var(--bg-hover); }
    .sidebar-section-label {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-faint); padding: 0.5rem 0.75rem 0.3rem; white-space: nowrap;
    }
    .sidebar-footer {
      padding: 0.65rem 1.1rem; border-top: 1px solid var(--border);
      font-size: 0.68rem; color: var(--text-faint); white-space: nowrap;
    }
    .sidebar-data-btns {
      display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.5rem 0.7rem;
      border-top: 1px solid var(--border);
    }
    .sidebar-data-btn {
      flex: 1 1 calc(50% - 0.2rem); display: flex; align-items: center; justify-content: center; gap: 0.35rem;
      padding: 0.36rem 0.5rem; border-radius: var(--radius); border: 1px solid var(--border);
      background: transparent; font-size: 0.72rem; font-weight: 500; font-family: var(--font-body);
      color: var(--text-muted); cursor: pointer; white-space: nowrap;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .sidebar-data-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-glow); }
    .sidebar-habit-link {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.75rem; margin: 0.4rem 0.6rem;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: transparent; text-decoration: none;
      font-size: 0.82rem; font-weight: 500; font-family: var(--font-body);
      color: var(--text-muted); white-space: nowrap;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .sidebar-habit-link:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-glow); }
    .sidebar-gym-link {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.75rem; margin: 0.4rem 0.6rem;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: transparent; text-decoration: none;
      font-size: 0.82rem; font-weight: 500; font-family: var(--font-body);
      color: var(--text-muted); white-space: nowrap;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .sidebar-gym-link:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-glow); }
    .sidebar-dsa-link {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.75rem; margin: 0.4rem 0.6rem;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: transparent; text-decoration: none;
      font-size: 0.82rem; font-weight: 500; font-family: var(--font-body);
      color: var(--text-muted); white-space: nowrap;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .sidebar-dsa-link:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-glow); }

    /* ── 6. SIDEBAR NAV BUTTONS ─────────────────────────────────────────────── */
    button.nav-link {
      -webkit-appearance: none; appearance: none;
      background: transparent; border: 1px solid transparent;
      cursor: pointer; width: 100%; text-align: left;
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.75rem; border-radius: var(--radius); margin-bottom: 2px;
      font-size: 0.82rem; font-weight: 500; font-family: var(--font-body);
      color: var(--text-muted);
      transition: background 0.14s, color 0.14s, border-color 0.14s;
      white-space: nowrap;
    }
    button.nav-link:hover { background: var(--bg-hover); color: var(--text-primary); }
    button.nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button.nav-link:focus:not(:focus-visible) { outline: none; box-shadow: none; }
    /* Scoped to #sidebar — id specificity beats any Bootstrap .nav-link rule */
    #sidebar button.nav-link.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: var(--border-glow);
      border-left: 3px solid var(--accent);
      padding-left: calc(0.75rem - 2px); /* compensate 3px border */
    }
    .nav-topic-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
    .nav-topic-label { flex: 1; }

    /* ── 7. HEADER — Bootstrap has no sticky glassmorphic header ────────────── */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.4rem;
      display: flex; align-items: center; gap: 0.85rem;
      position: sticky; top: 0; z-index: 100;
    }
    .header-menu-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-muted); width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem; flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .header-menu-btn:hover { border-color: var(--border-glow); color: var(--text-primary); background: var(--bg-hover); }
    #page-title {
      font-size: 0.92rem; font-weight: 600; color: var(--text-primary);
      margin: 0; padding: 0; border: none; background: transparent;
      cursor: pointer; transition: color 0.15s;
    }
    #page-title:hover { color: var(--accent); }

    /* ── 8. CARD — Bootstrap renders bg/border via vars; we add shadow + hover ─ */
    .card {
      box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: transform 0.22s cubic-bezier(0.22,1,0.36,1), box-shadow 0.22s, border-color 0.18s;
    }
    [data-bs-theme="light"] .card {
      box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.06);
    }
    .card[role="button"]:hover {
      transform: translateY(-3px) scale(1.004); cursor: pointer;
      box-shadow: 0 0 0 1px var(--border-glow), 0 8px 32px var(--accent-glow);
      border-color: var(--border-glow) !important; /* beats Bootstrap border utility on hover only */
    }

    /* ── 9. PROGRESS BARS — Bootstrap renders bg; we add gradient + glow ────── */
    /* bg-success/warning use !important in Bootstrap — must match to override */
    .progress-bar.bg-success { background: linear-gradient(90deg, #2ebd7a, var(--green)) !important; }
    .progress-bar.bg-warning { background: linear-gradient(90deg, #d4943a, var(--yellow)) !important; }

    /* ── 10. BADGES — Bootstrap solid colors; we want muted tints ──────────── */
    /* bg-X utilities use !important — must match specificity + source order to win */
    .badge.bg-primary   { background: var(--accent-dim)  !important; color: var(--accent)      !important; border: 1px solid rgba(79,142,247,0.3)   !important; }
    .badge.bg-secondary { background: var(--bg-elevated)  !important; color: var(--text-muted)  !important; }
    .badge.bg-success   { background: var(--green-dim)   !important; color: var(--green)        !important; border: 1px solid rgba(61,214,140,0.25)  !important; }
    .badge.bg-warning   { background: var(--yellow-dim)  !important; color: var(--yellow)       !important; border: 1px solid rgba(240,192,96,0.25)  !important; }
    .badge.bg-danger    { background: var(--red-dim)     !important; color: var(--red)          !important; border: 1px solid rgba(247,110,110,0.25) !important; }
    .badge.bg-dark      { background: var(--bg-surface)  !important; color: var(--text-muted)   !important; border: 1px solid var(--border) !important; }
    .badge-tag { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-glow); font-size: 0.62rem; }

    /* ── 11. ACCORDION — Bootstrap renders via vars; we add chevron tint ────── */
    .accordion-button::after,
    .accordion-button:not(.collapsed)::after {
      filter: invert(55%) sepia(60%) saturate(400%) hue-rotate(195deg) brightness(110%);
      opacity: 0.8;
    }
    .accordion-button { font-size: var(--fs-base); font-weight: 500; font-family: var(--font-body); align-items: flex-start; }
    /* Each item is a self-contained card — full border on all sides, gap via margin */
    .accordion-item   { margin-bottom: 0.5rem; border: 1px solid var(--border) !important; border-radius: var(--radius) !important; overflow: hidden; }
    /* Open state — accent left border signals which question is active */
    .accordion-button:not(.collapsed) {
      border-left: 3px solid var(--accent);
      padding-left: calc(var(--bs-accordion-btn-padding-x) - 2px); /* compensate for border width */
    }

    /* ── 12. SECTION NAV PILLS (topic tabs) ─────────────────────────────────── */
    .section-nav-pills { gap: 4px; }
    .section-nav-pills button.nav-link {
      padding: 0.32rem 0.85rem; border-radius: 8px; font-size: 0.8rem; margin-bottom: 0; border: 1px solid transparent;
    }
    .section-nav-pills button.nav-link:hover { background: var(--bg-hover); color: var(--text-primary); }
    .section-nav-pills button.nav-link.active { background: var(--accent-dim); color: var(--accent); border-color: var(--border-glow); }

    /* ── 13. ACCORDION QUESTION HEADER — custom two-row layout ─────────────── */
    .q-header-content { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 0.28rem; padding-right: 0.5rem; }
    .q-title  { font-size: 0.86rem; font-weight: 600; color: var(--text-primary); line-height: 1.35; }
    .q-meta   { display: flex; align-items: center; flex-wrap: wrap; gap: 0.35rem; }
    .q-badge  { font-size: 0.6rem !important; padding: 0.15em 0.45em; }
    .q-badge-sep { width: 1px; height: 12px; background: var(--border); display: inline-block; }
    /* Frequency = traffic-light dot + tinted box (red/yellow/grey). Difficulty stays a solid pill. */
    .freq-badge  { font-size: 0.6rem !important; padding: 0.15em 0.5em; border-radius: 0.3rem; white-space: nowrap; font-weight: 600; }
    .freq-high   { background: rgba(255,99,99,0.15);  color: #ff9a9a; border: 1px solid rgba(255,99,99,0.42); }
    .freq-medium { background: rgba(240,192,96,0.15); color: #f0c873; border: 1px solid rgba(240,192,96,0.42); }
    .freq-low    { background: rgba(150,158,168,0.13); color: #aab1bb; border: 1px solid rgba(150,158,168,0.36); }

    /* Company pills — small brand-tinted tags shown on each question card */
    .q-companies { display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem; }
    .company-pill {
      display: inline-block; font-size: 0.58rem; font-weight: 600; line-height: 1.45;
      padding: 0.12em 0.5em; border-radius: 0.32rem; border: 1px solid transparent;
      white-space: nowrap; letter-spacing: 0.01em;
    }
    .company-pill-more {
      color: var(--text-faint) !important; border-color: var(--border) !important;
      background: var(--bg-hover) !important; cursor: default;
    }

    /* ── 14. STATUS CYCLE BUTTON ────────────────────────────────────────────── */
    .status-cycle-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 8px; border: 1px solid transparent;
      font-size: 0.85rem; flex-shrink: 0; margin-right: 0.6rem;
      cursor: pointer; background: var(--bg-hover); line-height: 1;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .status-cycle-btn:hover { transform: scale(1.18); border-color: var(--border-glow); background: var(--bg-hover); }
    .status-cycle-btn.bg-success  { background: var(--green-dim);  border-color: rgba(61,214,140,0.3); }
    .status-cycle-btn.bg-warning  { background: var(--yellow-dim); border-color: rgba(240,192,96,0.3); }
    .status-cycle-btn.bg-secondary { background: var(--bg-elevated); border-color: var(--border); }

    /* ── 15. LC HEADER LINK ─────────────────────────────────────────────────── */
    .lc-header-link {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.15em 0.5em; border-radius: 5px; border: 1px solid transparent;
      color: var(--text-faint); font-size: 0.68rem; font-weight: 500;
      white-space: nowrap; cursor: pointer; background: none;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .lc-header-link:hover { color: var(--accent); border-color: var(--border-glow); background: var(--accent-dim); }

    /* ── 15a. UTILITY CLASSES — named aliases for recurring inline styles ────
     * AI: use var(--fs-xs/sm/base) tokens for font sizes, not raw rem values.
     * Add new utilities here rather than using inline style="".              */
    .text-xxs   { font-size: 0.62rem; }        /* badge labels only           */
    .text-xs    { font-size: var(--fs-xs); }   /* meta, secondary labels      */
    .text-faint { color: var(--text-faint); }  /* de-emphasised helper text   */
    .text-sm    { font-size: var(--fs-sm); }   /* small prose, descriptions   */
    /* Legacy aliases — kept for compatibility, prefer text-xs/text-sm above  */
    .text-2xs        { font-size: 0.70rem; }
    .text-sm-custom  { font-size: var(--fs-sm); }
    .icon-lg         { font-size: 2rem; }
    .icon-xl         { font-size: 1.4rem; }
    .ph-id           { font-size: var(--fs-xs); opacity: 0.7; }
    .ph-count        { font-size: var(--fs-xs); font-weight: 400; opacity: 0.65; }
    .section-label-heading { font-size: 0.65rem; letter-spacing: 0.08em; }
    /* AI: use these for progress bars instead of inline style="height:Xpx" */
    .progress-xs     { height: 5px; }
    .progress-sm     { height: 6px; }
    .progress-md     { height: 8px; }

    /* ── 16. INFO BOXES ─────────────────────────────────────────────────────── */
    .gotcha-box  { background: var(--red-dim);    border-left: 3px solid var(--red);    padding: 0.55rem 0.9rem; border-radius: 0 var(--radius) var(--radius) 0; }
    .faang-box   { background: var(--green-dim);  border-left: 3px solid var(--green);  padding: 0.55rem 0.9rem; border-radius: 0 var(--radius) var(--radius) 0; }
    .insight-box { background: var(--accent-dim); border-left: 3px solid var(--accent); padding: 0.55rem 0.9rem; border-radius: 0 var(--radius) var(--radius) 0; }
    .tip-box     { background: var(--yellow-dim); border-left: 3px solid var(--yellow); padding: 0.75rem 1rem;   border-radius: 0 var(--radius) var(--radius) 0; font-size: 0.84rem; }

    /* ── 16a. WHEN TO USE / AVOID ───────────────────────────────────────────── */
    .wtu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 640px) { .wtu-grid { grid-template-columns: 1fr; } }
    .wtu-use  { background: var(--green-dim);  border: 1px solid rgba(61,214,140,0.2);  border-radius: var(--radius); padding: 0.75rem 0.9rem; }
    .wtu-avoid{ background: var(--red-dim);    border: 1px solid rgba(247,110,110,0.2); border-radius: var(--radius); padding: 0.75rem 0.9rem; }
    .wtu-label{ font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .wtu-use   .wtu-label { color: var(--green); }
    .wtu-avoid .wtu-label { color: var(--red); }
    .wtu-list { list-style: none; padding: 0; margin: 0; }
    .wtu-list li { font-size: var(--fs-xs); color: var(--text-muted); padding: 0.3rem 0; border-bottom: 1px solid var(--border); line-height: 1.5; }
    .wtu-list li:last-child { border-bottom: none; padding-bottom: 0; }
    .wtu-list li::before { margin-right: 0.4rem; }

    /* ── 17. PATTERN HEADINGS ───────────────────────────────────────────────── */
    .ph-wrap { margin: 1.75rem 0 0.6rem; }
    #tab-questions .ph-wrap:first-of-type { margin-top: 0; }
    .ph    { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.8rem; border-radius: 0 var(--radius) var(--radius) 0; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.02em; margin: 0; }
    .ph-signals { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; padding: 0.35rem 0.8rem 0; }
    .ph-spot-label { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); flex-shrink: 0; margin-right: 0.15rem; }
    .ph-signal-pill { display: inline-block; font-size: 0.6rem; padding: 0.15em 0.52em; border-radius: 20px; background: var(--bg-hover); border: 1px solid var(--border); color: var(--text-muted); line-height: 1.4; }
    /* AI: first pattern heading needs no top margin — controlled by CSS, not JS */
    #tab-questions .ph-wrap:first-of-type { margin-top: 0; }
    .ph-p1 { background: var(--accent-dim);  border-left: 3px solid var(--accent);  color: var(--accent); }
    .ph-p2 { background: var(--green-dim);   border-left: 3px solid var(--green);   color: var(--green); }
    .ph-p3 { background: var(--yellow-dim);  border-left: 3px solid var(--yellow);  color: var(--yellow); }
    .ph-p4 { background: var(--purple-dim);  border-left: 3px solid var(--purple);  color: var(--purple); }
    .ph-p5 { background: var(--red-dim);     border-left: 3px solid var(--red);     color: var(--red); }
    .ph-p6 { background: var(--teal-dim);    border-left: 3px solid var(--teal);    color: var(--teal); }
    .ph-p7  { background: var(--purple-dim);  border-left: 3px solid var(--purple);  color: var(--purple); }
    .ph-p8  { background: var(--red-dim);     border-left: 3px solid var(--red);     color: var(--red); }
    .ph-p9  { background: var(--green-dim);   border-left: 3px solid var(--green);   color: var(--green); }
    .ph-p10 { background: var(--accent-dim);  border-left: 3px solid var(--accent);  color: var(--accent); }
    .ph-p11 { background: var(--yellow-dim);  border-left: 3px solid var(--yellow);  color: var(--yellow); }
    .ph-p12 { background: var(--teal-dim);    border-left: 3px solid var(--teal);    color: var(--teal); }
    .ph-p13 { background: var(--purple-dim);  border-left: 3px solid var(--purple);  color: var(--purple); }

    /* ── 19. PATTERN CARD ───────────────────────────────────────────────────── */
    /* border-secondary utility no longer on the element — no !important needed */
    .pattern-card { border-left: 3px solid var(--accent); }

    /* ── 20. ANIMATIONS ─────────────────────────────────────────────────────── */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .anim-fade-in { animation: fadeIn 0.22s ease both; }

    /* ── 21. SCROLLBAR ──────────────────────────────────────────────────────── */
    ::-webkit-scrollbar       { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-glow); }

    /* ── 22. REDUCED MOTION ─────────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ── 23. STATUS FILTER BAR (questions tab) ──────────────────────────────── */
    .q-filter-bar { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .q-filter-btn {
      padding: 0.22rem 0.75rem; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); font-size: var(--fs-xs);
      font-family: var(--font-body); cursor: pointer; line-height: 1.5;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .q-filter-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .q-filter-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--border-glow); }
    .q-freq-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--border-glow); }
    .q-filter-count { font-size: var(--fs-xs); color: var(--text-faint); margin-left: auto; }
    .company-filter-bar { display: flex; gap: 5px; margin: -0.4rem 0 1rem; flex-wrap: wrap; align-items: center; }
    .company-filter-label { font-size: var(--fs-xs); color: var(--text-faint); margin-right: 2px; }
    .company-chip {
      padding: 0.16rem 0.6rem; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); font-size: var(--fs-xs);
      font-family: var(--font-body); cursor: pointer; line-height: 1.4;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .company-chip:hover { background: var(--bg-hover); color: var(--text-primary); }
    .company-chip.active { background: var(--accent-dim); color: var(--accent); border-color: var(--border-glow); }
    .company-badge {
      display: inline-block; font-size: 10px; padding: 1px 7px; margin: 0 3px 3px 0;
      border-radius: 20px; background: var(--bg-hover); color: var(--text-muted); border: 1px solid var(--border);
    }



    /* ── 25. QUESTION NOTES ──────────────────────────────────────────────────── */
    .note-area {
      width: 100%; background: var(--bg-base); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body);
      font-size: var(--fs-sm); padding: 0.55rem 0.8rem; resize: vertical; min-height: 64px;
      transition: border-color 0.15s;
    }
    .note-area:focus { outline: none; border-color: var(--border-glow); }
    .note-area::placeholder { color: var(--text-faint); }
    .note-saved-flash { color: var(--green); font-size: var(--fs-xs); opacity: 0; transition: opacity 0.3s; }
    .note-saved-flash.show { opacity: 1; }

    /* ── Topic notes: standalone "things to remember" cards (Notes tab) ──────── */
    .btn-add-note {
      background: var(--accent-dim); color: var(--accent); border: 1px solid var(--border-glow);
      border-radius: 20px; padding: 0.3rem 0.9rem; font-size: var(--fs-xs); cursor: pointer; white-space: nowrap;
      transition: background 0.14s, color 0.14s;
    }
    .btn-add-note:hover { background: var(--accent); color: var(--bg-base); }

    .note-editor {
      background: var(--bg-base); border: 1px solid var(--border-glow); border-radius: var(--radius);
      padding: 0.7rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem;
    }
    .note-editor-title, .note-editor-body {
      width: 100%; background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body);
      padding: 0.5rem 0.7rem; font-size: var(--fs-sm);
    }
    .note-editor-title { font-weight: 600; }
    .note-editor-title:focus, .note-editor-body:focus { outline: none; border-color: var(--border-glow); }
    .note-editor-body { min-height: 110px; resize: vertical; line-height: 1.5; }
    .note-editor-actions { display: flex; align-items: center; gap: 0.5rem; }
    .note-editor-hint { font-size: var(--fs-xs); color: var(--text-faint); margin-right: auto; font-family: var(--font-mono); }
    .btn-note-save, .btn-note-cancel {
      border-radius: 20px; padding: 0.3rem 0.95rem; font-size: var(--fs-xs); cursor: pointer; border: 1px solid var(--border);
    }
    .btn-note-save { background: var(--accent); color: var(--bg-base); border-color: var(--accent); }
    .btn-note-cancel { background: transparent; color: var(--text-muted); }
    .btn-note-cancel:hover { background: var(--bg-hover); color: var(--text-primary); }

    .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 0.75rem; align-items: start; }
    .note-card {
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 0.7rem 0.8rem; display: flex; flex-direction: column; gap: 0.4rem;
    }
    .note-card.pinned { border-color: var(--border-glow); }
    .note-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.5rem; }
    .note-card-title { font-weight: 600; font-size: 0.84rem; color: var(--text-primary); line-height: 1.3; }
    .note-card-actions { display: flex; gap: 0.1rem; flex-shrink: 0; }
    .note-card-actions button {
      background: none; border: none; cursor: pointer; font-size: 0.72rem; opacity: 0.45;
      padding: 0.1rem 0.22rem; border-radius: 0.25rem; transition: opacity 0.12s, background 0.12s;
    }
    .note-card-actions button:hover { opacity: 1; background: var(--bg-hover); }
    .note-card.pinned .note-card-actions button[title="Unpin"] { opacity: 0.9; }
    .note-card-body { font-size: var(--fs-sm); color: var(--text-muted); line-height: 1.5; }
    .note-card-body p { margin: 0 0 0.4rem; }
    .note-card-body p:last-child { margin-bottom: 0; }
    .note-card-body ul.note-bullets { margin: 0 0 0.35rem; padding-left: 1.1rem; }
    .note-card-body ul.note-bullets li { margin-bottom: 0.15rem; }
    .note-card-body code { background: var(--bg-hover); padding: 0.05em 0.32em; border-radius: 0.25rem; font-family: var(--font-mono); font-size: 0.9em; color: var(--text-primary); }
    .note-card-body strong { color: var(--text-primary); }

    /* ── 26. QUESTION HEADER ACTIONS ─────────────────────────────────────────────────── */
    /* Action buttons sit outside the accordion <button> so clicks on them       */
    /* never activate Bootstrap’s toggle, regardless of where in the span they land. */
    .accordion-header { display: flex; align-items: stretch; }
    .accordion-header .accordion-button { flex: 1; min-width: 0; }
    .q-header-actions {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.7rem 0.35rem 0.7rem 0.75rem; flex-shrink: 0;
      background: var(--bg-elevated); transition: background 0.15s;
    }
    .q-header-actions .status-cycle-btn { margin-right: 0; }
    .accordion-header:has(.accordion-button:not(.collapsed)) .q-header-actions { background: var(--bg-hover); }

    /* ── 29. PRACTICE SESSION ───────────────────────────────────────────────── */
    .pin-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: 0.75rem;
      flex-shrink: 0; transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .pin-btn:hover { transform: scale(1.18); border-color: var(--border-glow); background: var(--bg-hover); }
    .pin-btn.pinned { background: var(--accent-dim); border-color: var(--accent-glow); }
    .ps-ctrl-bar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .ps-count-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: 0.9rem; line-height:1;
      transition: border-color 0.15s, background 0.15s;
    }
    .ps-count-btn:hover { border-color: var(--border-glow); background: var(--bg-hover); }
    .ps-count-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--border); background: var(--bg-elevated); }
    .ps-count-val { font-size: var(--fs-sm); font-weight: 600; min-width: 1.5ch; text-align: center; }
    .ps-shuffle-btn {
      padding: 0.22rem 0.7rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: var(--fs-xs);
      color: var(--text-primary); transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .ps-shuffle-btn:hover { border-color: var(--border-glow); background: var(--accent-dim); color: var(--accent); }
    .ps-shuffle-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ps-timer-bar { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.65rem; padding-top: 0.65rem; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .ps-preset-btn {
      padding: 0.18rem 0.5rem; border-radius: 5px; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: var(--fs-xs);
      color: var(--text-muted); font-family: var(--font-mono);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .ps-preset-btn:hover { border-color: var(--border-glow); color: var(--accent); background: var(--accent-dim); }
    .ps-preset-btn.ps-active { border-color: var(--accent-glow); background: var(--accent-dim); color: var(--accent); }
    .ps-timer-display { font-family: var(--font-mono); font-size: 0.9rem; min-width: 4.2ch; text-align: center; color: var(--text-primary); }
    .ps-timer-display.ps-running { color: var(--accent); }
    .ps-timer-display.ps-expired { color: var(--red); animation: ps-pulse 1s ease infinite; }
    @keyframes ps-pulse { 0%,100% { opacity:1; } 50% { opacity:0.45; } }
    .ps-timer-ctrl {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: 0.75rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .ps-timer-ctrl:hover { border-color: var(--border-glow); background: var(--bg-hover); }
    .ps-q-row { display: flex; align-items: center; gap: 0.42rem; padding: 0.38rem 0.6rem; border-radius: 8px; background: var(--bg-base); border: 1px solid var(--border); margin-bottom: 0.32rem; cursor: pointer; transition: background 0.2s, border-color 0.2s, opacity 0.35s; }
    .ps-q-row:hover { border-color: var(--border-glow); background: var(--bg-hover); }
    .ps-q-row.ps-q-solved { background: rgba(40,167,69,0.12); border-color: rgba(40,167,69,0.4); opacity: 0.7; }
    .ps-q-row.ps-q-solved .ps-q-title { text-decoration: line-through; color: var(--text-faint); }
    .ps-q-row.ps-q-struggled { background: rgba(245,158,11,0.13); border-color: rgba(245,158,11,0.45); opacity: 0.78; }
    .ps-q-row.ps-q-struggled .ps-q-title { color: var(--text-faint); }
    .ps-q-row.ps-q-moving { transition: opacity 0.3s; opacity: 0; }
    .ps-struggle-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 5px; border: 1px solid transparent;
      background: transparent; cursor: pointer; font-size: 0.72rem; flex-shrink: 0;
      opacity: 0.18; transition: opacity 0.15s, border-color 0.15s, background 0.15s;
      padding: 0; line-height: 1;
    }
    .ps-struggle-btn:hover { opacity: 1; border-color: rgba(245,158,11,0.5); background: rgba(245,158,11,0.12); }
    .ps-due-dot { font-size: 0.52rem; color: var(--yellow); flex-shrink: 0; line-height: 1; }
    /* ── Solve ring (radial solve-count badge on question accordion) ── */
    .solve-ring-wrap { display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; padding: 0 2px; }
    .solve-ring {
      display: inline-flex; align-items: center; justify-content: center; gap: 3px;
      height: 32px; padding: 0 10px; border-radius: 16px; border: 1.5px solid;
      font-size: 1rem; font-weight: 700; font-family: var(--font-mono); flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s; white-space: nowrap;
    }
    .solve-ring-num { font-size: 0.78rem; opacity: 0.9; }
    .solve-ring-dim    { border-color: var(--border);     color: var(--text-faint); background: var(--bg-base); }
    .solve-ring-bronze { border-color: #cd7f32;           color: #cd7f32;           background: rgba(205,127,50,0.12); }
    .solve-ring-silver { border-color: #9ca3af;           color: #9ca3af;           background: rgba(156,163,175,0.12); }
    .solve-ring-gold   { border-color: #ffd700;           color: #ffd700;           background: rgba(255,215,0,0.12);   box-shadow: 0 0 5px rgba(255,215,0,0.3); }
    .solve-ring-diamond{ border-color: var(--accent);     color: var(--accent);     background: var(--accent-dim);      box-shadow: 0 0 7px var(--accent-glow); }
    .solve-ring-adj {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: 0.85rem; line-height: 1;
      color: var(--text-muted); padding: 0; transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .solve-ring-adj:hover { border-color: var(--border-glow); color: var(--text-primary); background: var(--bg-hover); }
    .ps-q-num { font-size: var(--fs-xs); color: var(--text-faint); min-width: 1.3rem; font-family: var(--font-mono); }
    .ps-q-title { flex: 1; font-size: var(--fs-sm); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ps-q-link {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--border);
      background: var(--bg-elevated); text-decoration: none; color: var(--text-muted);
      font-size: 0.7rem; flex-shrink: 0; transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .ps-q-link:hover { border-color: var(--border-glow); color: var(--accent); background: var(--accent-dim); }
    .ps-pin-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 5px; border: 1px solid transparent;
      background: transparent; cursor: pointer; font-size: 0.72rem; flex-shrink: 0;
      opacity: 0.18; transition: opacity 0.15s, border-color 0.15s, background 0.15s;
      padding: 0; line-height: 1;
    }
    .ps-pin-btn:hover { opacity: 0.75; border-color: var(--border); background: var(--bg-elevated); }
    .ps-pin-btn.pinned { opacity: 1; border-color: rgba(255,200,0,0.4); background: rgba(255,200,0,0.1); }
    .ps-session-done {
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
      padding: 0.5rem 0.75rem; border-radius: 8px; margin-bottom: 0.5rem;
      background: rgba(61,214,140,0.1); border: 1px solid rgba(61,214,140,0.35);
      font-size: var(--fs-sm); color: var(--text-primary);
    }
    .ps-streak-badge {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.18rem 0.55rem; border-radius: 20px;
      background: rgba(240,192,96,0.12); border: 1px solid rgba(240,192,96,0.3);
      font-size: var(--fs-xs); color: var(--yellow); font-weight: 600; white-space: nowrap;
    }
    .ps-streak-badge.streak-zero { background: var(--bg-elevated); border-color: var(--border); color: var(--text-faint); }
    /* ── Daily ritual ticks (header, next to search) ── */
    .header-ritual { display: inline-flex; align-items: center; gap: 0.4rem; margin: 0 0.3rem; flex-shrink: 0; }
    .ritual-chip {
      display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap;
      padding: 0.28rem 0.65rem; border-radius: 16px; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg-elevated);
      color: var(--text-muted); font-size: var(--fs-xs); font-weight: 600;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .ritual-chip:hover { border-color: var(--border-glow); color: var(--text-primary); }
    .ritual-chip.done { border-color: var(--green); background: rgba(61,214,140,0.14); color: var(--text-primary); }
    .ritual-box {
      display: inline-flex; align-items: center; justify-content: center;
      width: 15px; height: 15px; flex-shrink: 0; border-radius: 4px;
      border: 1.5px solid var(--text-faint); background: transparent;

<script>
/* <![CDATA[ */

// ─── HTML GENERATION STYLE ───────────────────────────────────────────────────
// AI: all HTML generation uses string concatenation (+ operator) with escHtml()
// for any user-facing data. Template literals (backticks) are used only in
// buildNav() and buildTopicTabs() where interpolation is cleaner and no
// user data is concatenated directly. Do not mix styles within a function.
// ─────────────────────────────────────────────────────────────────────────────

// ─── BADGE / STATUS MAPS ──────────────────────────────────────────────────────
// AI: all status/difficulty display mappings live here — update here only.
const DIFFICULTY_BADGE = { Easy: 'success', Medium: 'warning', Hard: 'danger' }
const STATUS_DOT       = { Solved: 'bg-success', 'In Progress': 'bg-warning', Pending: 'bg-secondary' }
const STATUS_EMOJI      = { Solved: '✅', 'In Progress': '🚧', Pending: '📋' }
const STATUS_CYCLE      = { Pending: 'In Progress', 'In Progress': 'Solved', Solved: 'Pending' }

// Interview frequency (how often a question is asked). Source field: q.freq in data.js.
// High = Blind 75 / FAANG-flagged "must-know"; Medium = NeetCode 150 / commonly asked;
// Low = pattern-completeness, less commonly asked directly.
// Frequency badge = traffic-light dot + word in a tinted box (🔴 red / 🟡 yellow / ⚪ grey).
// Difficulty keeps its solid green/amber/red pill (no dot); the leading dot + tinted box
// is what separates the two dimensions at a glance.
const FREQ_DOT   = { High: '🔴', Medium: '🟡', Low: '⚪' }
const FREQ_LABEL = { High: 'High', Medium: 'Medium', Low: 'Low' }
const FREQ_DESC  = { High: 'asked very often — drill first', Medium: 'commonly asked', Low: 'less common — pattern completeness' }
function freqBadge(q, extraCls) {
  const f = q && q.freq
  if (!f || !FREQ_LABEL[f]) return ''
  return '<span class="badge freq-badge freq-' + f.toLowerCase() + (extraCls || '') + '"' +
    ' title="Interview frequency: ' + FREQ_LABEL[f] + ' — ' + FREQ_DESC[f] + '">' +
    FREQ_DOT[f] + ' ' + FREQ_LABEL[f] + '</span>'
}

// ─── QUICK-REF PANEL IDs ──────────────────────────────────────────────────────
const QR_IDS = {
  practice: 'qr-practice',
}

// ─── TOPIC TABS ───────────────────────────────────────────────────────────────
// AI: single source of truth for tab definitions.
// Adding a tab here automatically renders it in the HTML nav and wires up
// the tab pane. You must also add a render function and call it in renderCurrentTab().
const TOPIC_TABS = [
  { key: 'questions',  label: 'Questions'  },
  { key: 'notes',      label: '📝 Notes'   },
]

// ─── STATE ───────────────────────────────────────────────────────────────────
let currentTopicKey = null
let currentTab = 'questions'
let currentQFilter = 'all'
let currentFreqFilter = 'all'   // 'all' | 'High' | 'Medium' | 'Low' (interview frequency)
let currentCompanyFilter = null   // null = all companies
const COMPANY_LABEL = Object.fromEntries(COMPANIES.map(c => [c.key, c.label]))

// Brand-ish accent colors for company pills (rendering layer — data.js stays data-only).
// Pills tint this color: solid text + low-alpha background + faint border.
const COMPANY_COLOR = {
  google: '#4f86f7', meta: '#8b7bf7', amazon: '#ff9f43', apple: '#b9c0c8',
  microsoft: '#34c3a0', netflix: '#f0494b', bloomberg: '#f78fb3', uber: '#9aa4b2',
  linkedin: '#4aa3e8', adobe: '#ff6b6b', nvidia: '#86c232', atlassian: '#4c9aff',
  stripe: '#a78bfa', doordash: '#ff5a5f', airbnb: '#ff6f9c', databricks: '#ff7a59',
  snowflake: '#56b8e8', coinbase: '#6b8cff',
}
// Display order = COMPANIES order (tier 1 first), so the most relevant names lead.
const COMPANY_ORDER = Object.fromEntries(COMPANIES.map((c, i) => [c.key, i]))

// One colored company pill. `cls` overrides the class (defaults to .company-pill).
function companyPill(key, cls) {
  const color = COMPANY_COLOR[key] || '#8a93a0'
  return '<span class="' + (cls || 'company-pill') + '"' +
    ' style="color:' + color + ';border-color:' + color + '55;background:' + color + '1f">' +
    escHtml(COMPANY_LABEL[key] || key) + '</span>'
}

// Compact colored pills for a question header — top companies by tier, capped with a +N overflow.
function companyPillsRow(lc, max) {
  const keys = getCompanies(lc).slice().sort((a, b) => (COMPANY_ORDER[a] ?? 99) - (COMPANY_ORDER[b] ?? 99))
  if (!keys.length) return ''
  const cap = max || 4
  const shown = keys.slice(0, cap).map(k => companyPill(k)).join('')
  const rest = keys.slice(cap)
  const more = rest.length
    ? '<span class="company-pill company-pill-more" title="' + escHtml(rest.map(k => COMPANY_LABEL[k] || k).join(', ')) + '">+' + rest.length + '</span>'
    : ''
  return '<span class="q-companies">' + shown + more + '</span>'
}

// ─── PRACTICE SESSION STATE ──────────────────────────────────────────────────
let _psQCount     = 5     // question count for per-topic practice
let _psTimerTotal = 0     // timer set value in seconds (0 = off)
let _psTimerRem   = 0     // remaining seconds
let _psTimerRun   = false // is timer running?
let _psTimerIv    = null  // setInterval handle
let _psTimerPreset = 0    // last selected preset in minutes
let _psDoneThisSession      = new Set()  // keys done in current per-topic practice batch
let _psStruggledThisSession = new Set()  // subset of done that were marked "struggled"
let _psCurrentItems         = []         // current ordered list for per-topic session
let _psCurrentTopic         = null       // currently active topic key for practice session

// ─── PRACTICE SESSION PERSISTENCE ────────────────────────────────────────────
// Store/restore the practice session (which topic + which questions) to survive page navigation.
// Format: { topicKey, items: [[lcKey, question], ...], doneInSession: [lcKeys...] }
const PS_SESSION_KEY = 'dsa-practice-session-v1'
function _psSaveSession() {
  if (!_psCurrentTopic || _psCurrentItems.length === 0) return
  try {
    const session = {
      topicKey: _psCurrentTopic,
      items: _psCurrentItems.map(([lcKey, q]) => [lcKey, { title: q.title, difficulty: q.difficulty }]),
      doneInSession: Array.from(_psDoneThisSession),
      struggledInSession: Array.from(_psStruggledThisSession)
    }
    localStorage.setItem(PS_SESSION_KEY, JSON.stringify(session))
  } catch {}
}
function _psLoadSession() {
  try {
    const session = JSON.parse(localStorage.getItem(PS_SESSION_KEY) || null)
    if (!session || !session.topicKey) return null
    // Restore done state from persisted session
    if (session.doneInSession) _psDoneThisSession = new Set(session.doneInSession)
    if (session.struggledInSession) _psStruggledThisSession = new Set(session.struggledInSession)
    return session
  } catch { return null }
}
function _psClearSession() {
  localStorage.removeItem(PS_SESSION_KEY)
  _psDoneThisSession.clear(); _psStruggledThisSession.clear()
}

// ─── DASHBOARD QUICK PRACTICE SESSION STATE ──────────────────────────────────
// Kept separate from per-topic state so navigating to a topic page and back
// never wipes the dashboard session progress.
let _qpDoneThisSession      = new Set()  // keys marked done on the dashboard qp panel
let _qpStruggledThisSession = new Set()  // subset of qp done that were marked "struggled"

// ─── LAST-PRACTICED TRACKING ─────────────────────────────────────────────────
// shape: { [lcKey]: ISO timestamp }
const LAST_PRACTICED_KEY = 'dsa-last-practiced-v1'
function getLastPracticed(lcKey) {
  try { return JSON.parse(localStorage.getItem(LAST_PRACTICED_KEY) || '{}')[lcKey] || null } catch { return null }
}
function markPracticed(lcKey) {
  try {
    const d = JSON.parse(localStorage.getItem(LAST_PRACTICED_KEY) || '{}')
    d[lcKey] = new Date().toISOString()
    localStorage.setItem(LAST_PRACTICED_KEY, JSON.stringify(d))
  } catch {}
  _updateStreak()
}

// ─── ADAPTIVE REVIEW INTERVALS ────────────────────────────────────────────────
// shape: { [lcKey]: days }  — default 3
const REVIEW_INTERVAL_KEY = 'dsa-review-interval-v1'
function getReviewInterval(lcKey) {
  try { return JSON.parse(localStorage.getItem(REVIEW_INTERVAL_KEY) || '{}')[lcKey] || 3 } catch { return 3 }
}
function setReviewInterval(lcKey, days) {
  try {
    const d = JSON.parse(localStorage.getItem(REVIEW_INTERVAL_KEY) || '{}')
    d[lcKey] = days
    localStorage.setItem(REVIEW_INTERVAL_KEY, JSON.stringify(d))
  } catch {}
}
// Spaced-repetition ladder: a clean solve pushes the next review further out,
// a struggle drops it back to 1 day so it returns tomorrow.
const REVIEW_LADDER = [1, 3, 7, 14, 30]
function bumpReviewInterval(lcKey) {
  const cur  = getReviewInterval(lcKey)
  const next = REVIEW_LADDER.find(d => d > cur) ?? REVIEW_LADDER[REVIEW_LADDER.length - 1]
  setReviewInterval(lcKey, next)
  return next
}
function resetReviewInterval(lcKey) {
  setReviewInterval(lcKey, REVIEW_LADDER[0])
  return REVIEW_LADDER[0]
}

// ─── STREAK TRACKING ──────────────────────────────────────────────────────────
const STREAK_KEY = 'dsa-streak-v1'
function _updateStreak() {
  try {
    const today = new Date().toISOString().slice(0, 10)
    const data  = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"date":"","streak":0,"longest":0}')
    if (data.date === today) return  // already counted today
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10)
    const newStreak  = data.date === yesterday ? (data.streak || 0) + 1 : 1
    const newLongest = Math.max(newStreak, data.longest || 0)
    localStorage.setItem(STREAK_KEY, JSON.stringify({ date: today, streak: newStreak, longest: newLongest }))
  } catch {}
}
function getStreak() {
  try {
    const data      = JSON.parse(localStorage.getItem(STREAK_KEY) || '{"date":"","streak":0,"longest":0}')
    const today     = new Date().toISOString().slice(0, 10)
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10)
    if (data.date !== today && data.date !== yesterday) return { streak: 0, longest: data.longest || 0, today: false }
    return { streak: data.streak || 0, longest: data.longest || 0, today: data.date === today }
  } catch { return { streak: 0, longest: 0, today: false } }
}

// ─── DAILY RITUAL CHECKLIST ───────────────────────────────────────────────────
// shape: { date: 'YYYY-MM-DD', revise: bool, study: bool }. Auto-resets when the date changes.
const RITUAL_KEY = 'dsa-daily-ritual-v1'
const RITUAL_STEPS = [
  { key: 'revise', short: '🔁 Revise 1h', label: 'Revise due problems', note: 'do this first' },
  { key: 'study',  short: '✏️ Study',     label: 'Study new problems',  note: '' },
]
function getRitual() {
  const today = new Date().toISOString().slice(0, 10)
  try {
    const r = JSON.parse(localStorage.getItem(RITUAL_KEY) || 'null')
    if (r && r.date === today) return r   // same day → keep ticks
  } catch {}
  return { date: today, revise: false, study: false }   // new day (or first ever) → fresh
}
function toggleRitual(step) {
  const r = getRitual()
  r[step] = !r[step]
  r.date = new Date().toISOString().slice(0, 10)
  try { localStorage.setItem(RITUAL_KEY, JSON.stringify(r)) } catch {}
  _renderHeaderRitual()
}
function renderHeaderRitual() {
  const r = getRitual()
  return RITUAL_STEPS.map(s => {
    const on  = !!r[s.key]
    const tip = on
      ? s.label + ' — done today (click to undo)'
      : s.label + (s.note ? ' · ' + s.note : '') + ' (click when done)'
    return (
      '<button type="button" class="ritual-chip' + (on ? ' done' : '') + '" ' +
      'onclick="toggleRitual(\'' + s.key + '\')" title="' + tip + '" aria-pressed="' + on + '">' +
      '<span class="ritual-box">' + (on ? '✓' : '') + '</span>' +
      '<span class="ritual-chip-text">' + s.short + '</span>' +
      '</button>'
    )
  }).join('')
}
function _renderHeaderRitual() {
  const el = document.getElementById('header-ritual')
  if (el) el.innerHTML = renderHeaderRitual()
}

// A question is "due" if never practiced OR last practiced > N days ago (N = per-key review interval)
function isDue(lcKey) {
  const last = getLastPracticed(lcKey)
  if (!last) return true
  return (Date.now() - new Date(last).getTime()) > getReviewInterval(lcKey) * 24 * 60 * 60 * 1000
}
// ─── QUICK PRACTICE STATE (dashboard) ────────────────────────────────────────
let _qpTopics  = new Set()  // selected topic keys
let _qpCount   = 10         // question count
let _qpResults = null       // last generated results ([lcKey, q][])
let _qpTimerTotal  = 0      // set value in seconds
let _qpTimerRem    = 0      // remaining seconds
let _qpTimerRun    = false  // is running?
let _qpTimerIv     = null   // setInterval handle
let _qpTimerPreset = 0      // last preset in minutes
let _qpDueOnly     = false  // when true: generate only "due for review" questions

// ─── QP STATE PERSISTENCE ─────────────────────────────────────────────────────
const QP_STATE_KEY = 'dsa-qp-state-v1'
function _saveQpState() {
  try {
    const state = {
      topics:  Array.from(_qpTopics),
      count:   _qpCount,
      dueOnly: _qpDueOnly,
      results: _qpResults ? _qpResults.map(([k]) => k) : null,
    }
    localStorage.setItem(QP_STATE_KEY, JSON.stringify(state))
  } catch {}
}
function _loadQpState() {
  try {
    const raw = localStorage.getItem(QP_STATE_KEY)
    if (!raw) return
    const state = JSON.parse(raw)
    if (Array.isArray(state.topics)) state.topics.forEach(k => _qpTopics.add(k))
    if (typeof state.count   === 'number') _qpCount   = state.count
    if (typeof state.dueOnly === 'boolean') _qpDueOnly = state.dueOnly
    if (Array.isArray(state.results)) {
      // Re-hydrate [lcKey, q] pairs from TOPIC_MODULES
      const pairs = []
      state.results.forEach(k => {
        for (const topicKey of Object.keys(TOPIC_MODULES)) {
          const q = TOPIC_MODULES[topicKey].questions[k]
          if (q) { pairs.push([k, q]); break }
        }
      })
      if (pairs.length > 0) _qpResults = pairs
    }
  } catch {}
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  syncThemeIcon()
  _loadQpState()
  buildNav()
  _renderHeaderRitual()
  loadDashboard()
})

// ─── NAV BADGE COLOUR ───────────────────────────────────────────────────────
// 5-level colour ramp: grey → yellow → teal → blue → green as you fill the topic
function _navBadgeCls(solved, total) {
  if (!total)                        return 'bg-secondary'
  if (solved === total)              return 'bg-success'
  const pct = solved / total * 100
  if (pct >= 75)                     return 'bg-primary'   // 75-99 %  → blue (almost!)
  if (pct >= 50)                     return 'bg-info'      // 50-74 %  → teal
  if (pct > 0)                       return 'bg-warning'   // 1-49 %   → yellow
  return 'bg-secondary'                                    // 0 %      → grey
}

// ─── BUILD NAV ────────────────────────────────────────────────────────────────
function buildNav() {
  const container = document.getElementById('nav-topics')
  container.innerHTML = TOPICS.map(t => {
    const mod = TOPIC_MODULES[t.key]
    if (!mod) return `
      <button type="button" id="nav-${t.key}" onclick="loadTopic('${t.key}')" class="nav-link">
        <span class="nav-topic-icon">${t.icon}</span>
        <span class="nav-topic-label">${t.label}</span>
      </button>
    `
    const qKeys   = Object.keys(mod.questions)
    const solved  = qKeys.filter(k => getStatus(k) === 'Solved').length
    const total   = qKeys.length
    const badgeCls = _navBadgeCls(solved, total)
    return `
      <button type="button"
         id="nav-${t.key}"
         onclick="loadTopic('${t.key}')"
         class="nav-link">
        <span class="nav-topic-icon">${t.icon}</span>
        <span class="nav-topic-label">${t.label}</span>
        <span id="nav-badge-${t.key}" class="badge ${badgeCls} rounded-pill text-xxs">${solved}/${total}</span>
      </button>
    `
  }).join('')
}

// ─── GLOBAL SEARCH ────────────────────────────────────────────────────────────
function handleGlobalSearch() {
  const input = document.getElementById('global-search-input')
  if (!input) return
  
  const query = input.value.trim()
  
  if (query.length === 0) {
    // If search is empty, go back to dashboard
    document.getElementById('global-search-input').value = ''
    loadDashboard()
    return
  }
  
  // Perform search
  const results = searchGlobalQuestions(query)
  renderSearchResults(results)
}

function renderSearchResults(results) {
  showView('view-search-results')
  document.getElementById('page-title').textContent = '🔍 Search Results'
  
  // Render daily question card at top
  const dailyQ = getDailyQuestion()
  if (dailyQ) {
    document.getElementById('daily-question-card').innerHTML = renderDailyQuestionCard(dailyQ)
  }
  
  // Render search results
  const resultsList = document.getElementById('search-results-list')
  if (results.length === 0) {
    resultsList.innerHTML = '<div class="alert alert-info">No questions match your search. Try different keywords!</div>'
    return
  }

function getDifficultyColor(difficulty) {
  switch(difficulty) {
    case 'Easy': return 'green'
    case 'Medium': return 'yellow'
    case 'Hard': return 'red'
    default: return 'accent'
  }
}

function goToQuestion(topicKey, lcKey) {
  // Clear search and navigate to topic/question
  document.getElementById('global-search-input').value = ''
  loadTopic(topicKey)
  // Scroll to question
  setTimeout(() => {
    const el = document.getElementById('q_' + lcKey.replace(/_/g, ''))
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' })
  }, 100)
}

function skipToDailyQuestion(currentLcKey) {
  const newQ = getRandomDailyQuestion(currentLcKey)
  if (newQ) {

    const dailyCard = document.getElementById('daily-question-card')
    if (dailyCard) {

    }
    // Update dashboard panel if visible
    const dailyPanel = document.getElementById('daily-question-panel')
    if (dailyPanel) {
      dailyPanel.innerHTML = renderDailyQuestionCard(newQ)
    }
  }
}

// ─── BUILD TOPIC TABS ─────────────────────────────────────────────────────────
// AI: renders tab nav + pane divs from TOPIC_TABS. Called once per loadTopic().
// To add a tab: update TOPIC_TABS constant — this function needs no changes.
function buildTopicTabs() {
  const nav   = document.getElementById('topic-tabs')
  const panes = document.getElementById('topic-tab-panes')
  if (!nav || !panes) return

  // Hide tab nav when there is only one tab — a single pill adds no value
  nav.style.display = TOPIC_TABS.length <= 1 ? 'none' : ''

  nav.innerHTML = TOPIC_TABS.map((t, i) =>
    `<li class="nav-item">
      <button class="nav-link${i === 0 ? ' active' : ''}" type="button"
        data-tab="${t.key}" onclick="showTopicTab('${t.key}')">${t.label}</button>
    </li>`
  ).join('')

  panes.innerHTML = TOPIC_TABS.map((t, i) =>
    `<div id="tab-${t.key}"${i > 0 ? ' class="d-none"' : ''}></div>`
  ).join('')
}

// ─── LOAD TOPIC ───────────────────────────────────────────────────────────────
function loadTopic(key) {
  const topic = TOPICS.find(t => t.key === key)
  if (!topic) return

  currentTopicKey = key
  currentTab = TOPIC_TABS[0].key  // always start on first tab
  _editingNoteId = null           // drop any in-progress note edit from the prior topic
  currentQFilter = 'all'          // reset filter on topic switch
  currentCompanyFilter = null     // reset company filter on topic switch
  currentFreqFilter = 'all'       // reset frequency filter on topic switch
  _stopTimer()                    // stop any running per-topic practice timer
  _qpStopTimer()                  // stop QP timer if it was running on dashboard

  // Reset per-topic session completely so a fresh session starts for every topic
  _psCurrentItems = []
  _psDoneThisSession.clear(); _psStruggledThisSession.clear()
  _psQCount = 5

  showView('view-topic')
  document.getElementById('page-title').textContent = topic.icon + ' ' + topic.label
  setActiveNav(key)
  buildTopicTabs()  // renders nav + panes from TOPIC_TABS registry

  const mod = TOPIC_MODULES[key]
  renderTopicTracker(mod)
  renderTopicAlwaysVisible(mod)
  renderCurrentTab()
}

function showTopicTab(tab) {
  currentTab = tab
  document.querySelectorAll('#topic-tabs .nav-link').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-tab') === tab)
  })
  renderCurrentTab()
}

function renderCurrentTab() {
  // AI: tab visibility is driven by TOPIC_TABS — do not hardcode tab keys here
  TOPIC_TABS.forEach(t => {
    const el = document.getElementById('tab-' + t.key)
    if (el) el.classList.toggle('d-none', t.key !== currentTab)
  })

  // Notes tab is independent of the question module — render it before the guard.
  if (currentTab === 'notes') { renderTopicNotes(); return }

  const mod = TOPIC_MODULES[currentTopicKey]
  if (!mod) {
    const el = document.getElementById('tab-' + currentTab)
    if (el) el.innerHTML = '<div class="text-center py-5 text-secondary"><span class="icon-lg">⏳</span><p class="mt-3 small">Module coming soon.</p></div>'
    return
  }

  if (currentTab === 'questions') renderQuestions(mod)
}

// Standalone "things to remember" notes, scoped to the current topic. Storage +
// accessors live in data.js (TOPIC_NOTES_KEY / getTopicNotes / upsertTopicNote …).
let _editingNoteId = null   // null = not editing; '__new__' = adding; else a note id

// Tiny safe markdown: escape first, then apply - bullets, **bold**, `code`.
function renderNoteBody(text) {
  const esc = escHtml(text || '')
  const inline = s => s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
  let html = '', inList = false
  const closeList = () => { if (inList) { html += '</ul>'; inList = false } }
  esc.split(/\r?\n/).forEach(raw => {
    const line = raw.trim()
    const m = line.match(/^(?:[-*•])\s+(.*)$/)
    if (m) {
      if (!inList) { html += '<ul class="note-bullets">'; inList = true }
      html += '<li>' + inline(m[1]) + '</li>'
    } else if (!line) {
      closeList()
    } else {
      closeList()
      html += '<p>' + inline(line) + '</p>'
    }
  })
  closeList()
  return html || '<p class="text-faint">(empty)</p>'
}

function noteCard(n) {
  return '<div class="note-card' + (n.pinned ? ' pinned' : '') + '" id="note-card-' + n.id + '">' +
    '<div class="note-card-head">' +
    '<span class="note-card-title">' + (n.pinned ? '📌 ' : '') + escHtml(n.title || 'Untitled') + '</span>' +
    '<span class="note-card-actions">' +
    '<button title="' + (n.pinned ? 'Unpin' : 'Pin to top') + '" onclick="toggleTopicNotePin(\'' + n.id + '\')">📌</button>' +
    '<button title="Edit" onclick="editTopicNote(\'' + n.id + '\')">✏️</button>' +
    '<button title="Delete" onclick="removeTopicNote(\'' + n.id + '\')">🗑️</button>' +
    '</span></div>' +
    '<div class="note-card-body">' + renderNoteBody(n.body) + '</div>' +
    '</div>'
}

function renderTopicNotes() {
  const host = document.getElementById('tab-notes')
  if (!host) return
  const topic = TOPICS.find(t => t.key === currentTopicKey)
  const notes = getTopicNotes(currentTopicKey)

  let html = '<div class="notes-head d-flex align-items-center justify-content-between mb-3">' +
    '<div><h6 class="mb-0">📝 Notes' + (topic ? ' — ' + escHtml(topic.label) : '') + '</h6>' +
    '<span class="text-faint" style="font-size:var(--fs-xs)">Concise things to remember for this topic</span></div>' +
    '<button class="btn-add-note" onclick="startNewTopicNote()">＋ New note</button>' +
    '</div>'

  html += '<div id="note-editor-host"></div>'

  if (!notes.length) {
    html += '<div class="notes-empty text-center py-5 text-secondary">' +
      '<div style="font-size:2rem">🗒️</div>' +
      '<p class="small mt-2 mb-0">No notes yet. Capture key insights, gotchas, and patterns as you learn.</p></div>'
  } else {
    html += '<div class="notes-grid">' + notes.map(noteCard).join('') + '</div>'
  }
  host.innerHTML = html

  // Re-open the editor if we were mid-edit when a re-render happened.
  if (_editingNoteId === '__new__') renderNoteEditor({ id: null, title: '', body: '' })
  else if (_editingNoteId) {
    const n = notes.find(x => x.id === _editingNoteId)
    if (n) renderNoteEditor(n)
  }
}

function renderNoteEditor(n) {
  const host = document.getElementById('note-editor-host')
  if (!host) return
  host.innerHTML =
    '<div class="note-editor">' +
    '<input class="note-editor-title" id="note-edit-title" placeholder="Note title (e.g. Topological sort)" value="' + escHtml(n.title || '') + '">' +
    '<textarea class="note-editor-body" id="note-edit-body" placeholder="Freeform notes…   - bullets    **bold**    `code`">' + escHtml(n.body || '') + '</textarea>' +
    '<div class="note-editor-actions">' +
    '<span class="note-editor-hint">- bullets · **bold** · `code`</span>' +
    '<button class="btn-note-cancel" onclick="cancelNoteEditor()">Cancel</button>' +
    '<button class="btn-note-save" onclick="saveTopicNoteFromEditor()">Save</button>' +
    '</div></div>'
  const t = document.getElementById('note-edit-title')
  if (t) t.focus()
}

function startNewTopicNote() {
  _editingNoteId = '__new__'
  renderNoteEditor({ id: null, title: '', body: '' })
  document.getElementById('note-editor-host')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
}

function editTopicNote(id) {
  const n = getTopicNotes(currentTopicKey).find(x => x.id === id)
  if (!n) return
  _editingNoteId = id
  renderNoteEditor(n)
  document.getElementById('note-editor-host')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
}

function cancelNoteEditor() {
  _editingNoteId = null
  const h = document.getElementById('note-editor-host')
  if (h) h.innerHTML = ''
}

function saveTopicNoteFromEditor() {
  const title = (document.getElementById('note-edit-title')?.value || '').trim()
  const body  = (document.getElementById('note-edit-body')?.value || '').trim()
  if (!title && !body) { cancelNoteEditor(); return }
  const existing = (_editingNoteId && _editingNoteId !== '__new__')
    ? getTopicNotes(currentTopicKey).find(x => x.id === _editingNoteId)
    : null
  const note = {
    id: existing ? existing.id : 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title,
    body,
    pinned: existing ? !!existing.pinned : false,
    updatedAt: Date.now(),
  }
  upsertTopicNote(currentTopicKey, note)
  _editingNoteId = null
  renderTopicNotes()
}

function toggleTopicNotePin(id) {
  const n = getTopicNotes(currentTopicKey).find(x => x.id === id)
  if (!n) return
  upsertTopicNote(currentTopicKey, { ...n, pinned: !n.pinned, updatedAt: n.updatedAt || Date.now() })
  renderTopicNotes()
}

function removeTopicNote(id) {
  if (!confirm('Delete this note?')) return
  deleteTopicNote(currentTopicKey, id)
  if (_editingNoteId === id) _editingNoteId = null
  renderTopicNotes()
}

function setCompanyFilter(key) {

  document.querySelectorAll('.company-chip').forEach(btn => {

function renderQuestions(mod) {
  const container = document.getElementById('tab-questions')
  const allQEntries = Object.entries(mod.questions)

  if (allQEntries.length === 0) {
    container.innerHTML = '<div class="text-center py-5"><span style="font-size:2rem;" class="text-secondary">📭</span><p class="text-secondary mt-3 small">No questions yet.</p></div>'
    return
  }

  // Count per status for filter buttonslabels
  const counts = { all: allQEntries.length, Pending: 0, 'In Progress': 0, Solved: 0 }
  allQEntries.forEach(([k]) => { counts[getStatus(k)]++ })

  const filters = ['all', 'Pending', 'In Progress', 'Solved']
  const filterLabels = { all: 'All', Pending: '📋 Pending', 'In Progress': '🚧 In Progress', Solved: '✅ Solved' }
  let html = '<div class="q-filter-bar">'
  filters.forEach(f => {
    const isActive = f === currentQFilter
    html += '<button type="button" class="q-filter-btn' + (isActive ? ' active' : '') + '" data-filter="' + f + '" onclick="setQFilter(\'' + f + '\')">' +
      filterLabels[f] + ' <span style="opacity:0.6">(' + counts[f] + ')</span></button>'
  })
  html += '</div>'

  // Frequency filter (violet) — independent dimension, composes with status + company.
  const freqCounts = { all: allQEntries.length, High: 0, Medium: 0, Low: 0 }
  allQEntries.forEach(([, q]) => { if (freqCounts[q.freq] !== undefined) freqCounts[q.freq]++ })
  const freqOrder = ['all', 'High', 'Medium', 'Low']
  const freqBtnLabels = { all: 'All', High: '🔴 High', Medium: '🟡 Medium', Low: '⚪ Low' }
  html += '<div class="q-filter-bar"><span class="company-filter-label">📊 Frequency</span>'
  freqOrder.forEach(f => {
    const isActive = f === currentFreqFilter
    html += '<button type="button" class="q-filter-btn q-freq-btn' + (isActive ? ' active' : '') + '" data-freq="' + f + '" onclick="setFreqFilter(\'' + f + '\')">' +
      freqBtnLabels[f] + ' <span style="opacity:0.6">(' + freqCounts[f] + ')</span></button>'
  })
  html += '</div>'

  // Company filter chips — only companies that actually tag a question in THIS topic,
  // sorted by how many (most relevant first). Counts reflect this topic only.
  const compCounts = {}
  allQEntries.forEach(([, q]) => getCompanies(q.leetcode).forEach(c => { compCounts[c] = (compCounts[c] || 0) + 1 }))
  const presentCompanies = COMPANIES.filter(c => compCounts[c.key]).sort((a, b) => compCounts[b.key] - compCounts[a.key])
  if (presentCompanies.length) {
    html += '<div class="company-filter-bar">'
    html += '<span class="company-filter-label">🏢 Asked at</span>'
    html += '<button type="button" class="company-chip' + (currentCompanyFilter === null ? ' active' : '') + '" data-company="" onclick="setCompanyFilter(null)">All</button>'
    presentCompanies.forEach(c => {
      const active = currentCompanyFilter === c.key
      html += '<button type="button" class="company-chip' + (active ? ' active' : '') + '" data-company="' + c.key + '" onclick="setCompanyFilter(\'' + c.key + '\')">' +
        c.label + ' <span style="opacity:0.6">(' + compCounts[c.key] + ')</span></button>'
    })
    html += '</div>'
  }

  html += '<div id="q-filtered-list"></div>'
  container.innerHTML = html
  _renderFilteredQuestions(mod)
}

function _renderFilteredQuestions(mod) {
  const listEl = document.getElementById('q-filtered-list')
  if (!listEl) return

  const allQEntries = Object.entries(mod.questions)
  const filtered = allQEntries
    .filter(([k]) => currentQFilter === 'all' || getStatus(k) === currentQFilter)
    .filter(([, q]) => currentFreqFilter === 'all' || q.freq === currentFreqFilter)
    .filter(([, q]) => !currentCompanyFilter || getCompanies(q.leetcode).includes(currentCompanyFilter))

  if (filtered.length === 0) {
    const parts = []
    if (currentQFilter !== 'all') parts.push(currentQFilter)
    if (currentFreqFilter !== 'all') parts.push(FREQ_LABEL[currentFreqFilter])
    if (currentCompanyFilter) parts.push('@ ' + (COMPANY_LABEL[currentCompanyFilter] || currentCompanyFilter))
    listEl.innerHTML = '<div class="text-center py-5 text-secondary"><p class="small">No ' + (parts.join(' ') || '') + ' questions.</p></div>'
    return
  }

  const byPattern = {}
  mod.patterns.forEach(p => { byPattern[p.id] = [] })
  byPattern['_other'] = []

  filtered.forEach(([k, q]) => {
    const pat = mod.patterns.find(p => p.questionIds.includes(k))
    if (pat) byPattern[pat.id].push([k, q])
    else byPattern['_other'].push([k, q])
  })

  let html = ''
  mod.patterns.forEach(p => {
    const qs = byPattern[p.id]
    if (!qs.length) return
    const phCls = 'ph ' + (PATTERN_HEADING_CLASS[p.id] || '')
    const signalPills = p.recognitionSignals.map(s => '<span class="ph-signal-pill">' + escHtml(s) + '</span>').join('')

    // ── Pattern heading + always-visible signal pills ──
    html += '<div class="ph-wrap mb-3">'
    html += '<div class="' + phCls + '">'
    html += '<span class="ph-id">' + p.id + '</span>'
    html += '<span>' + escHtml(p.name) + '</span>'
    html += '<span class="ms-auto ph-count">' + qs.length + ' question' + (qs.length !== 1 ? 's' : '') + '</span>'
    html += '</div>'
    if (signalPills) {
      html += '<div class="ph-signals"><span class="ph-spot-label">Spot it →</span>' + signalPills + '</div>'
    }
    html += '</div>'

    html += '<div class="accordion mb-3" id="acc-q-' + p.id + '">'
    qs.forEach(([k, q], i) => { html += buildQuestionAccordionItem(k, q, 'q-' + p.id, i) })
    html += '</div>'
  })

  if (byPattern['_other'].length) {
    html += '<div class="accordion mb-3" id="acc-q-other">'
    byPattern['_other'].forEach(([k, q], i) => { html += buildQuestionAccordionItem(k, q, 'q-other', i) })
    html += '</div>'
  }

  listEl.innerHTML = html
}

function buildQuestionAccordionItem(lcKey, q, groupId, index) {
  const id = 'acc-' + groupId + '-' + index
  const status   = getStatus(lcKey)
  const solveN   = getSolveCount(lcKey)

    + '<span class="solve-ring ' + _solveRingCls(solveN) + '" data-solve-key="' + lcKey + '">' + _solveRingEmoji(solveN) + '<span class="solve-ring-num">' + solveN + '</span></span>'
    + '<button class="solve-ring-adj" onclick="_adjSolveCount(\'' + lcKey + '\',1)">+</button>'

  const conditionLabel = { 'two-pointers': 'Pointer condition', 'binary-search': 'Feasibility check', 'sorting': 'Key condition', 'heap': 'Key condition', 'recursion': 'Base case', 'trees': 'Recurrence / base case', 'stack': 'Push / pop rule', 'linked-list': 'Pointer move', 'trie': 'Node step', 'design': 'Core operation', 'bit-manipulation': 'Bit trick', 'intervals': 'Sort / merge rule' }[currentTopicKey] || 'Shrink trigger'
  const existingNote = getNote(lcKey)

  const insightRow    = q.keyInsight    ? '<div class="insight-box mb-2 small"><strong class="text-info">💡 Insight:</strong> '  + escHtml(q.keyInsight)   + '</div>' : ''
  const shrinkRow     = q.shrinkTrigger ? '<p class="mb-2 small"><span class="text-secondary">' + conditionLabel + ':</span> <code>' + escHtml(q.shrinkTrigger) + '</code></p>' : ''

  const faangRow   = q.faangNote ? '<div class="faang-box mb-2 small"><strong class="text-success">★ FAANG:</strong> '  + escHtml(q.faangNote) + '</div>' : ''

  const noteRow    = '<div class="mt-3 pt-2" style="border-top:1px solid var(--border)"><p class="text-secondary text-xs mb-1">📝 My notes</p>' +
