<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="DSA Notebook — curated patterns, templates and questions for FAANG interview preparation.">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DSA Notebook">
  <meta name="mobile-web-app-capable" content="yes">
  <title>DSA Notebook</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>⚡</text></svg>">
  <!-- ═══ THEME INIT — DO NOT MOVE. Must execute before stylesheet renders to avoid flash of wrong theme. ═══ -->
  <script>
    (function() {
      const t = localStorage.getItem('dsa-theme') || 'dark'
      document.documentElement.setAttribute('data-bs-theme', t)
      // Same for the sidebar: a closed sidebar must not flash open (and re-open on every reload).
      // <html> carries the state until the sidebar exists, then #sidebar.collapsed takes over.
      try {
        if (localStorage.getItem('dsa-sidebar-collapsed') === '1') {
          document.documentElement.classList.add('sidebar-collapsed')
          document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('sidebar')?.classList.add('collapsed')
            document.documentElement.classList.remove('sidebar-collapsed')
          })
        }
      } catch (e) {}
    })()
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    /*
     * v28 — Lean CSS philosophy:
     * Set Bootstrap --bs-* vars in [data-bs-theme="dark"|"light"] → Bootstrap renders components.
     * Custom CSS only for things Bootstrap cannot express: layout, custom components,
     * visual flourishes. Zero !important wars except where Bootstrap utilities require it.
     *
     * AI INSTRUCTIONS:
     * - Design tokens live in :root (dark) and [data-bs-theme="light"] — change colors there only.
     * - Never hardcode colors in CSS rules or JS templates — always use var(--token-name).
     * - Never add Bootstrap utility classes that hardcode colors (text-light, text-white, bg-dark etc).
     * - Utility classes for font sizes etc live in section 15a — add new ones there.
     * - Status/difficulty maps live in BADGE / STATUS MAPS block in JS — update there only.
     * - To add a new topic: append to TOPICS array + TOPIC_MODULES object. No other changes needed.
     */

    /* ── 1. DESIGN TOKENS ───────────────────────────────────────────────────── */
    :root {
      /* Dark theme — deep navy, not pitch black. Each level is perceptibly different. */
      --bg-base:     #0f1117;   /* page background                */
      --bg-surface:  #161b27;   /* sidebar, header                */
      --bg-elevated: #1c2333;   /* cards, accordions              */
      --bg-hover:    #242e42;   /* hover, active accordion        */
      --border:      rgba(99,120,180,0.25);  /* clearly visible    */
      --border-glow: rgba(99,162,255,0.45);
      --accent:      #4f8ef7;
      --accent-dim:  rgba(79,142,247,0.13);
      --accent-glow: rgba(79,142,247,0.22);
      --green:       #3dd68c;   --green-dim:  rgba(61,214,140,0.12);
      --yellow:      #f0c060;   --yellow-dim: rgba(240,192,96,0.12);
      --red:         #f76e6e;   --red-dim:    rgba(247,110,110,0.12);
      --purple:      #b48ef7;   --purple-dim: rgba(180,142,247,0.12);
      --teal:        #4fd1c5;   --teal-dim:   rgba(79,209,197,0.12);
      --text-primary:#dde3f0;   /* softer than pure white, less eye strain */
      --text-muted:  #8a9bc0;
      --text-faint:  #4d5c7a;   /* lifted from near-invisible #3d4a6a     */
      --radius:      10px;
      --radius-lg:   14px;
      --font-body:   'Outfit', system-ui, sans-serif;
      --font-mono:   'Space Mono', 'Courier New', monospace;
      /* Type scale — use these tokens, not raw rem values */
      --fs-xs:   0.68rem;   /* meta labels, badges         */
      --fs-sm:   0.78rem;   /* secondary text, small prose */
      --fs-base: 0.88rem;   /* body, accordion titles      */
    }

    /* ── 2. BOOTSTRAP COMPONENT VARS ───────────────────────────────────────────
     * The ONLY correct way to retheme Bootstrap 5.3.
     * No !important needed — Bootstrap reads these vars for every component.
     */
    [data-bs-theme="dark"] {
      --bs-body-bg:                  var(--bg-base);
      --bs-body-color:               var(--text-primary);
      --bs-body-font-family:         var(--font-body);
      --bs-body-font-size:           1rem;
      --bs-border-color:             var(--border);
      --bs-border-color-translucent: var(--border);
      --bs-secondary-color:          var(--text-muted);
      --bs-secondary-bg:             var(--bg-surface);
      --bs-tertiary-bg:              var(--bg-elevated);
      /* Card */
      --bs-card-bg:                  var(--bg-elevated);
      --bs-card-border-color:        var(--border);
      --bs-card-cap-bg:              var(--bg-elevated);
      --bs-card-color:               var(--text-primary);
      --bs-card-border-radius:       var(--radius-lg);
      /* Accordion */
      --bs-accordion-bg:             var(--bg-elevated);
      --bs-accordion-border-color:   var(--border);
      --bs-accordion-border-radius:  var(--radius);
      --bs-accordion-inner-border-radius: calc(var(--radius) - 1px);
      --bs-accordion-btn-bg:         var(--bg-elevated);
      --bs-accordion-btn-color:      var(--text-primary);
      --bs-accordion-btn-focus-box-shadow: none;
      --bs-accordion-btn-padding-x:  1rem;
      --bs-accordion-btn-padding-y:  0.7rem;
      --bs-accordion-active-bg:      var(--bg-hover);
      --bs-accordion-active-color:   var(--text-primary);
      --bs-accordion-body-padding-x: 1.1rem;
      --bs-accordion-body-padding-y: 1rem;
      /* Nav */
      --bs-nav-link-color:           var(--text-muted);
      --bs-nav-link-hover-color:     var(--text-primary);
      /* Progress */
      --bs-progress-bg:              rgba(255,255,255,0.05);
      --bs-progress-border-radius:   99px;
      --bs-progress-height:          0.35rem;
      /* Table */
      --bs-table-bg:                 transparent;
      --bs-table-hover-bg:           var(--bg-hover);
      --bs-table-border-color:       var(--border);
      /* Badge */
      --bs-badge-border-radius:      6px;
      --bs-badge-font-weight:        500;
    }

    /* ── 2a. LIGHT THEME TOKEN OVERRIDES ────────────────────────────────────────
     * Bootstrap handles all component colors. We only override our custom tokens.
     * AI: to adjust light theme, change values here only.                        */
    [data-bs-theme="light"] {
      --bg-base:     #f0f2f7;   /* page — off-white, not pure white              */
      --bg-surface:  #f8f9fc;   /* sidebar, header — one step lighter than base  */
      --bg-elevated: #ffffff;   /* cards, accordions — white pops off the base   */
      --bg-hover:    #e8ecf5;
      --border:      rgba(60,80,140,0.18);
      --border-glow: rgba(79,142,247,0.4);
      --text-primary:#1a1d2e;
      --text-muted:  #4a5270;
      --text-faint:  #7a85a8;   /* lifted for readability                        */
    }

    /* ── 3. BASE — only what Bootstrap does not set ─────────────────────────── */
    html { scroll-behavior: smooth; }
    pre, code { font-family: var(--font-mono); }
    pre {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      overflow-x: auto;
      font-size: 0.76rem;
      line-height: 1.7;
    }
    code { color: var(--accent); font-size: 0.82em; }
    small, .small { font-size: 0.8rem; }

    /* ── 5. SIDEBAR — Bootstrap has no sidebar component ───────────────────── */
    #sidebar {
      width: 260px; min-height: 100vh; flex-shrink: 0;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      transition: width 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    #sidebar.collapsed, .sidebar-collapsed #sidebar { width: 0; overflow: hidden; }
    #sidebar nav { padding: 0.6rem; overflow-y: auto; flex: 1; }

    .sidebar-brand {
      padding: 1rem 1.1rem; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; white-space: nowrap;
    }
    .sidebar-brand-name {
      font-size: 0.88rem; font-weight: 700; letter-spacing: 0.03em;
      color: var(--text-primary); display: flex; align-items: center; gap: 0.45rem;
    }
    .sidebar-brand-name .bolt {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 7px; font-size: 0.85rem;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .sidebar-close-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 7px;
      color: var(--text-muted); width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 0.8rem;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .sidebar-close-btn:hover { border-color: var(--border-glow); color: var(--text-primary); background: var(--bg-hover); }
    .sidebar-section-label {
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-faint); padding: 0.5rem 0.75rem 0.3rem; white-space: nowrap;
    }
    .sidebar-footer {
      padding: 0.65rem 1.1rem; border-top: 1px solid var(--border);
      font-size: 0.68rem; color: var(--text-faint); white-space: nowrap;
    }
    .sidebar-data-btns {
      display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0.5rem 0.7rem;
      border-top: 1px solid var(--border);
    }
    .sidebar-data-btn {
      flex: 1 1 calc(50% - 0.2rem); display: flex; align-items: center; justify-content: center; gap: 0.35rem;
      padding: 0.36rem 0.5rem; border-radius: var(--radius); border: 1px solid var(--border);
      background: transparent; font-size: 0.72rem; font-weight: 500; font-family: var(--font-body);
      color: var(--text-muted); cursor: pointer; white-space: nowrap;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .sidebar-data-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-glow); }
    /* Token is set on this device — sync is live, not just a dormant button. */
    .sidebar-data-btn.ds-token-set { border-color: var(--green); color: var(--green); background: var(--green-dim); }
    .sidebar-data-btn.ds-token-set:hover { background: var(--green-dim); border-color: var(--green); color: var(--green); }
    /* Divider between the nav (topics, companies, papers) and the app links below it, so a
       short nav doesn't sit flush against "5-Day Elite Split". */
    .sidebar-nav { border-bottom: 1px solid var(--border); margin-bottom: 0.6rem; }
    .sidebar-gym-link {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.75rem; margin: 0.4rem 0.6rem;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: transparent; text-decoration: none;
      font-size: 0.82rem; font-weight: 500; font-family: var(--font-body);
      color: var(--text-muted); white-space: nowrap;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .sidebar-gym-link:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-glow); }
    .sidebar-dsa-link {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.75rem; margin: 0.4rem 0.6rem;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: transparent; text-decoration: none;
      font-size: 0.82rem; font-weight: 500; font-family: var(--font-body);
      color: var(--text-muted); white-space: nowrap;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .sidebar-dsa-link:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-glow); }

    /* ── 6. SIDEBAR NAV BUTTONS ─────────────────────────────────────────────── */
    /* Scoped to button.nav-link (topics, tabs) AND a.nav-link (external links, e.g. the
       Companies section) so both render identically — an <a> was previously falling back
       to raw browser link styling (no padding/font/color) because this rule only matched
       <button>, which misaligned it against the Topics list above it. */
    button.nav-link, a.nav-link {
      -webkit-appearance: none; appearance: none;
      background: transparent; border: 1px solid transparent;
      cursor: pointer; width: 100%; text-align: left;
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.5rem 0.75rem; border-radius: var(--radius); margin-bottom: 2px;
      font-size: 0.82rem; font-weight: 500; font-family: var(--font-body);
      color: var(--text-muted);
      transition: background 0.14s, color 0.14s, border-color 0.14s;
      white-space: nowrap; text-decoration: none; box-sizing: border-box;
    }
    button.nav-link:hover, a.nav-link:hover { background: var(--bg-hover); color: var(--text-primary); }
    button.nav-link:focus-visible, a.nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button.nav-link:focus:not(:focus-visible), a.nav-link:focus:not(:focus-visible) { outline: none; box-shadow: none; }
    /* Scoped to #sidebar — id specificity beats any Bootstrap .nav-link rule */
    #sidebar button.nav-link.active {
      background: var(--accent-dim);
      color: var(--accent);
      border-color: var(--border-glow);
      border-left: 3px solid var(--accent);
      padding-left: calc(0.75rem - 2px); /* compensate 3px border */
    }
    .nav-topic-icon { font-size: 1rem; width: 20px; text-align: center; flex-shrink: 0; }
    .nav-topic-label { flex: 1; }

    /* ── EMBEDDED PAGES (Google, Paper Club) ────────────────────────────────────
       The embedded page owns its own scrolling, so the app shell is locked to exactly one
       viewport while one is open. Otherwise the frame is taller than the space left under the
       header, the outer page scrolls too, and the frame slides up when the inner scroll hits
       its end. The frame fills whatever height the header and tabs leave. */
    #main-col { min-width: 0; min-height: 100vh; }
    body.embed-view { overflow: hidden; }
    body.embed-view > .d-flex { height: 100vh; }
    body.embed-view #main-col { min-height: 0; height: 100vh; }
    body.embed-view main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    body.embed-view #view-google, body.embed-view #view-papers { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
    .embed-frame { width: 100%; flex: 1 1 auto; min-height: 0; height: calc(100vh - 8rem);
      border: 1px solid var(--border, #2a2f3d); border-radius: 12px; background: transparent; }

    /* ── 7. HEADER — Bootstrap has no sticky glassmorphic header ────────────── */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.4rem;
      display: flex; align-items: center; gap: 0.85rem;
      position: sticky; top: 0; z-index: 100;
    }
    .header-menu-btn {
      background: transparent; border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-muted); width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem; flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .header-menu-btn:hover { border-color: var(--border-glow); color: var(--text-primary); background: var(--bg-hover); }
    #page-title {
      font-size: 0.92rem; font-weight: 600; color: var(--text-primary);
      margin: 0; padding: 0; border: none; background: transparent;
      cursor: pointer; transition: color 0.15s;
    }
    #page-title:hover { color: var(--accent); }

    /* ── 8. CARD — Bootstrap renders bg/border via vars; we add shadow + hover ─ */
    .card {
      box-shadow: 0 2px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.04);
      transition: transform 0.22s cubic-bezier(0.22,1,0.36,1), box-shadow 0.22s, border-color 0.18s;
    }
    [data-bs-theme="light"] .card {
      box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.06);
    }
    .card[role="button"]:hover {
      transform: translateY(-3px) scale(1.004); cursor: pointer;
      box-shadow: 0 0 0 1px var(--border-glow), 0 8px 32px var(--accent-glow);
      border-color: var(--border-glow) !important; /* beats Bootstrap border utility on hover only */
    }

    /* ── 9. PROGRESS BARS — Bootstrap renders bg; we add gradient + glow ────── */
    /* bg-success/warning use !important in Bootstrap — must match to override */
    .progress-bar.bg-success { background: linear-gradient(90deg, #2ebd7a, var(--green)) !important; }
    .progress-bar.bg-warning { background: linear-gradient(90deg, #d4943a, var(--yellow)) !important; }

    /* ── 10. BADGES — Bootstrap solid colors; we want muted tints ──────────── */
    /* bg-X utilities use !important — must match specificity + source order to win */
    .badge.bg-primary   { background: var(--accent-dim)  !important; color: var(--accent)      !important; border: 1px solid rgba(79,142,247,0.3)   !important; }
    .badge.bg-secondary { background: var(--bg-elevated)  !important; color: var(--text-muted)  !important; }
    .badge.bg-success   { background: var(--green-dim)   !important; color: var(--green)        !important; border: 1px solid rgba(61,214,140,0.25)  !important; }
    .badge.bg-warning   { background: var(--yellow-dim)  !important; color: var(--yellow)       !important; border: 1px solid rgba(240,192,96,0.25)  !important; }
    .badge.bg-danger    { background: var(--red-dim)     !important; color: var(--red)          !important; border: 1px solid rgba(247,110,110,0.25) !important; }
    .badge.bg-dark      { background: var(--bg-surface)  !important; color: var(--text-muted)   !important; border: 1px solid var(--border) !important; }
    .badge-tag { background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-glow); font-size: 0.62rem; }

    /* ── 11. ACCORDION — Bootstrap renders via vars; we add chevron tint ────── */
    .accordion-button::after,
    .accordion-button:not(.collapsed)::after {
      filter: invert(55%) sepia(60%) saturate(400%) hue-rotate(195deg) brightness(110%);
      opacity: 0.8;
    }
    .accordion-button { font-size: var(--fs-base); font-weight: 500; font-family: var(--font-body); align-items: flex-start; }
    /* Each item is a self-contained card — full border on all sides, gap via margin */
    .accordion-item   { margin-bottom: 0.5rem; border: 1px solid var(--border) !important; border-radius: var(--radius) !important; overflow: hidden; }
    /* Open state — accent left border signals which question is active */
    .accordion-button:not(.collapsed) {
      border-left: 3px solid var(--accent);
      padding-left: calc(var(--bs-accordion-btn-padding-x) - 2px); /* compensate for border width */
    }

    /* ── 12. SECTION NAV PILLS (topic tabs) ─────────────────────────────────── */
    .section-nav-pills { gap: 4px; }
    .section-nav-pills button.nav-link {
      padding: 0.32rem 0.85rem; border-radius: 8px; font-size: 0.8rem; margin-bottom: 0; border: 1px solid transparent;
    }
    .section-nav-pills button.nav-link:hover { background: var(--bg-hover); color: var(--text-primary); }
    .section-nav-pills button.nav-link.active { background: var(--accent-dim); color: var(--accent); border-color: var(--border-glow); }

    /* ── 13. ACCORDION QUESTION HEADER — custom two-row layout ─────────────── */
    .q-header-content { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 0.28rem; padding-right: 0.5rem; }
    .q-title  { font-size: 0.86rem; font-weight: 600; color: var(--text-primary); line-height: 1.35; }
    .q-meta   { display: flex; align-items: center; flex-wrap: wrap; gap: 0.35rem; }
    .q-badge  { font-size: 0.6rem !important; padding: 0.15em 0.45em; }
    .q-badge-sep { width: 1px; height: 12px; background: var(--border); display: inline-block; }
    /* Frequency = traffic-light dot + tinted box (red/yellow/grey). Difficulty stays a solid pill. */
    /* Frequency = bare colored dot + word, NO box — distinct from the solid
       difficulty pill and the outlined company pills (different SHAPE per type). */
    .freq-badge  { font-size: 0.62rem !important; padding: 0; border: 0 !important; background: none !important; white-space: nowrap; font-weight: 700; }
    .freq-high   { color: #ff8c8c; }
    .freq-medium { color: #f0c873; }
    .freq-low    { color: #aab1bb; }

    /* Company pills — small brand-tinted tags shown on each question card */
    .q-companies { display: flex; align-items: center; flex-wrap: wrap; gap: 0.3rem; }
    .company-pill {
      display: inline-block; font-size: 0.58rem; font-weight: 600; line-height: 1.45;
      padding: 0.12em 0.55em; border-radius: 999px; border: 1px solid transparent;
      white-space: nowrap; letter-spacing: 0.01em;
    }
    .company-pill-more {
      color: var(--text-faint) !important; border-color: var(--border) !important;
      background: var(--bg-hover) !important; cursor: default;
    }

    /* ── 14. STATUS CYCLE BUTTON ────────────────────────────────────────────── */
    .status-cycle-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 8px; border: 1px solid transparent;
      font-size: 0.85rem; flex-shrink: 0; margin-right: 0.6rem;
      cursor: pointer; background: var(--bg-hover); line-height: 1;
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .status-cycle-btn:hover { transform: scale(1.18); border-color: var(--border-glow); background: var(--bg-hover); }
    .status-cycle-btn.bg-success  { background: var(--green-dim);  border-color: rgba(61,214,140,0.3); }
    .status-cycle-btn.bg-warning  { background: var(--yellow-dim); border-color: rgba(240,192,96,0.3); }
    .status-cycle-btn.bg-secondary { background: var(--bg-elevated); border-color: var(--border); }

    /* ── 15. LC HEADER LINK ─────────────────────────────────────────────────── */
    .lc-header-link {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.15em 0.5em; border-radius: 5px; border: 1px solid transparent;
      color: var(--text-faint); font-size: 0.68rem; font-weight: 500;
      white-space: nowrap; cursor: pointer; background: none;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .lc-header-link:hover { color: var(--accent); border-color: var(--border-glow); background: var(--accent-dim); }

    /* ── 15a. UTILITY CLASSES — named aliases for recurring inline styles ────
     * AI: use var(--fs-xs/sm/base) tokens for font sizes, not raw rem values.
     * Add new utilities here rather than using inline style="".              */
    .text-xxs   { font-size: 0.62rem; }        /* badge labels only           */
    .text-xs    { font-size: var(--fs-xs); }   /* meta, secondary labels      */
    .text-faint { color: var(--text-faint); }  /* de-emphasised helper text   */
    .text-sm    { font-size: var(--fs-sm); }   /* small prose, descriptions   */
    /* Legacy aliases — kept for compatibility, prefer text-xs/text-sm above  */
    .text-2xs        { font-size: 0.70rem; }
    .text-sm-custom  { font-size: var(--fs-sm); }
    .icon-lg         { font-size: 2rem; }
    .icon-xl         { font-size: 1.4rem; }
    .ph-id           { font-size: var(--fs-xs); opacity: 0.7; }
    .ph-count        { font-size: var(--fs-xs); font-weight: 400; opacity: 0.65; }
    .section-label-heading { font-size: 0.65rem; letter-spacing: 0.08em; }
    /* AI: use these for progress bars instead of inline style="height:Xpx" */
    .progress-xs     { height: 5px; }
    .progress-sm     { height: 6px; }
    .progress-md     { height: 8px; }

    /* ── 16. INFO BOXES ─────────────────────────────────────────────────────── */
    .gotcha-box  { background: var(--red-dim);    border-left: 3px solid var(--red);    padding: 0.55rem 0.9rem; border-radius: 0 var(--radius) var(--radius) 0; }
    .faang-box   { background: var(--green-dim);  border-left: 3px solid var(--green);  padding: 0.55rem 0.9rem; border-radius: 0 var(--radius) var(--radius) 0; }
    .insight-box { background: var(--accent-dim); border-left: 3px solid var(--accent); padding: 0.55rem 0.9rem; border-radius: 0 var(--radius) var(--radius) 0; }
    .tip-box     { background: var(--yellow-dim); border-left: 3px solid var(--yellow); padding: 0.75rem 1rem;   border-radius: 0 var(--radius) var(--radius) 0; font-size: 0.84rem; }

    /* ── 16a. WHEN TO USE / AVOID ───────────────────────────────────────────── */
    .wtu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 640px) { .wtu-grid { grid-template-columns: 1fr; } }
    .wtu-use  { background: var(--green-dim);  border: 1px solid rgba(61,214,140,0.2);  border-radius: var(--radius); padding: 0.75rem 0.9rem; }
    .wtu-avoid{ background: var(--red-dim);    border: 1px solid rgba(247,110,110,0.2); border-radius: var(--radius); padding: 0.75rem 0.9rem; }
    .wtu-label{ font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .wtu-use   .wtu-label { color: var(--green); }
    .wtu-avoid .wtu-label { color: var(--red); }
    .wtu-list { list-style: none; padding: 0; margin: 0; }
    .wtu-list li { font-size: var(--fs-xs); color: var(--text-muted); padding: 0.3rem 0; border-bottom: 1px solid var(--border); line-height: 1.5; }
    .wtu-list li:last-child { border-bottom: none; padding-bottom: 0; }
    .wtu-list li::before { margin-right: 0.4rem; }

    /* ── 17. PATTERN HEADINGS ───────────────────────────────────────────────── */
    .ph-wrap { margin: 1.75rem 0 0.6rem; }
    #tab-questions .ph-wrap:first-of-type { margin-top: 0; }
    .ph    { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0.8rem; border-radius: 0 var(--radius) var(--radius) 0; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.02em; margin: 0; }
    .ph-signals { display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center; padding: 0.35rem 0.8rem 0; }
    .ph-spot-label { font-size: 0.58rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-faint); flex-shrink: 0; margin-right: 0.15rem; }
    .ph-signal-pill { display: inline-block; font-size: 0.6rem; padding: 0.15em 0.52em; border-radius: 20px; background: var(--bg-hover); border: 1px solid var(--border); color: var(--text-muted); line-height: 1.4; }
    /* AI: first pattern heading needs no top margin — controlled by CSS, not JS */
    #tab-questions .ph-wrap:first-of-type { margin-top: 0; }
    .ph-p1 { background: var(--accent-dim);  border-left: 3px solid var(--accent);  color: var(--accent); }
    .ph-p2 { background: var(--green-dim);   border-left: 3px solid var(--green);   color: var(--green); }
    .ph-p3 { background: var(--yellow-dim);  border-left: 3px solid var(--yellow);  color: var(--yellow); }
    .ph-p4 { background: var(--purple-dim);  border-left: 3px solid var(--purple);  color: var(--purple); }
    .ph-p5 { background: var(--red-dim);     border-left: 3px solid var(--red);     color: var(--red); }
    .ph-p6 { background: var(--teal-dim);    border-left: 3px solid var(--teal);    color: var(--teal); }
    .ph-p7  { background: var(--purple-dim);  border-left: 3px solid var(--purple);  color: var(--purple); }
    .ph-p8  { background: var(--red-dim);     border-left: 3px solid var(--red);     color: var(--red); }
    .ph-p9  { background: var(--green-dim);   border-left: 3px solid var(--green);   color: var(--green); }
    .ph-p10 { background: var(--accent-dim);  border-left: 3px solid var(--accent);  color: var(--accent); }
    .ph-p11 { background: var(--yellow-dim);  border-left: 3px solid var(--yellow);  color: var(--yellow); }
    .ph-p12 { background: var(--teal-dim);    border-left: 3px solid var(--teal);    color: var(--teal); }
    .ph-p13 { background: var(--purple-dim);  border-left: 3px solid var(--purple);  color: var(--purple); }
    .ph-p14 { background: var(--red-dim);     border-left: 3px solid var(--red);     color: var(--red); }
    .ph-p15 { background: var(--green-dim);   border-left: 3px solid var(--green);   color: var(--green); }

    /* ── 19. PATTERN CARD ───────────────────────────────────────────────────── */
    /* border-secondary utility no longer on the element — no !important needed */
    .pattern-card { border-left: 3px solid var(--accent); }

    /* ── 20. ANIMATIONS ─────────────────────────────────────────────────────── */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .anim-fade-in { animation: fadeIn 0.22s ease both; }

    /* ── 21. SCROLLBAR ──────────────────────────────────────────────────────── */
    ::-webkit-scrollbar       { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-glow); }

    /* ── 22. REDUCED MOTION ─────────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ── 23. STATUS FILTER BAR (questions tab) ──────────────────────────────── */
    .q-filter-bar { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
    .q-filter-btn {
      padding: 0.22rem 0.75rem; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); font-size: var(--fs-xs);
      font-family: var(--font-body); cursor: pointer; line-height: 1.5;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .q-filter-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .q-filter-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--border-glow); }
    .q-freq-btn.active { background: var(--accent-dim); color: var(--accent); border-color: var(--border-glow); }
    .q-filter-count { font-size: var(--fs-xs); color: var(--text-faint); margin-left: auto; }
    .company-filter-bar { display: flex; gap: 5px; margin: -0.4rem 0 1rem; flex-wrap: wrap; align-items: center; }
    .company-filter-label { font-size: var(--fs-xs); color: var(--text-faint); margin-right: 2px; }
    .company-chip {
      padding: 0.16rem 0.6rem; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); font-size: var(--fs-xs);
      font-family: var(--font-body); cursor: pointer; line-height: 1.4;
      transition: background 0.14s, color 0.14s, border-color 0.14s;
    }
    .company-chip:hover { background: var(--bg-hover); color: var(--text-primary); }
    .company-chip.active { background: var(--accent-dim); color: var(--accent); border-color: var(--border-glow); }
    .company-badge {
      display: inline-block; font-size: 10px; padding: 1px 7px; margin: 0 3px 3px 0;
      border-radius: 20px; background: var(--bg-hover); color: var(--text-muted); border: 1px solid var(--border);
    }



    /* ── 25. QUESTION NOTES ──────────────────────────────────────────────────── */
    .note-area {
      width: 100%; background: var(--bg-base); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body);
      font-size: var(--fs-sm); padding: 0.55rem 0.8rem; resize: vertical; min-height: 64px;
      transition: border-color 0.15s;
    }
    .note-area:focus { outline: none; border-color: var(--border-glow); }
    .note-area::placeholder { color: var(--text-faint); }
    .note-saved-flash { color: var(--green); font-size: var(--fs-xs); opacity: 0; transition: opacity 0.3s; }
    .note-saved-flash.show { opacity: 1; }

    /* ── Topic notes: standalone "things to remember" cards (Notes tab) ──────── */
    .btn-add-note {
      background: var(--accent-dim); color: var(--accent); border: 1px solid var(--border-glow);
      border-radius: 20px; padding: 0.3rem 0.9rem; font-size: var(--fs-xs); cursor: pointer; white-space: nowrap;
      transition: background 0.14s, color 0.14s;
    }
    .btn-add-note:hover { background: var(--accent); color: var(--bg-base); }

    .note-editor {
      background: var(--bg-base); border: 1px solid var(--border-glow); border-radius: var(--radius);
      padding: 0.7rem; margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.5rem;
    }
    .note-editor-title, .note-editor-body {
      width: 100%; background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-body);
      padding: 0.5rem 0.7rem; font-size: var(--fs-sm);
    }
    .note-editor-title { font-weight: 600; }
    .note-editor-title:focus, .note-editor-body:focus { outline: none; border-color: var(--border-glow); }
    .note-editor-body { min-height: 220px; resize: both; max-width: 100%; line-height: 1.5; }
    .note-editor-body::-webkit-resizer { background: var(--border-glow); border-bottom-right-radius: 6px; }
    .note-editor-actions { display: flex; align-items: center; gap: 0.5rem; }
    .note-editor-hint { font-size: var(--fs-xs); color: var(--text-faint); margin-right: auto; font-family: var(--font-mono); }
    .btn-note-save, .btn-note-cancel, .btn-note-expand {
      border-radius: 20px; padding: 0.3rem 0.95rem; font-size: var(--fs-xs); cursor: pointer; border: 1px solid var(--border);
    }
    .btn-note-save { background: var(--accent); color: var(--bg-base); border-color: var(--accent); }
    .btn-note-cancel { background: transparent; color: var(--text-muted); }
    .btn-note-cancel:hover { background: var(--bg-hover); color: var(--text-primary); }
    .btn-note-expand { background: transparent; color: var(--text-muted); margin-right: 0.25rem; }
    .btn-note-expand:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* Toolbar: live search + expand/collapse all */
    .notes-toolbar { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    .note-search {
      flex: 1; min-width: 0; background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text-primary); font-family: var(--font-body);
      font-size: var(--fs-sm); padding: 0.35rem 0.9rem;
    }
    .note-search:focus { outline: none; border-color: var(--border-glow); }
    .note-search::placeholder { color: var(--text-faint); }
    .btn-notes-toggle-all {
      background: transparent; color: var(--text-muted); border: 1px solid var(--border);
      border-radius: 20px; padding: 0.3rem 0.9rem; font-size: var(--fs-xs); cursor: pointer; white-space: nowrap;
    }
    .btn-notes-toggle-all:hover { background: var(--bg-hover); color: var(--text-primary); }

    /* Accordion: one collapsed row per note, click the header to expand */
    .notes-acc { display: flex; flex-direction: column; gap: 0.5rem; }
    .note-acc { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius); }
    .note-acc.pinned { border-color: var(--border-glow); }
    .note-acc-head { display: flex; align-items: center; gap: 0.55rem; padding: 0.55rem 0.8rem; cursor: pointer; user-select: none; }
    .note-acc-chev { font-size: 0.62rem; color: var(--text-faint); flex-shrink: 0; transition: transform 0.15s; }
    .note-acc.open .note-acc-chev { transform: rotate(90deg); }
    .note-acc-title {
      flex: 1; min-width: 0; font-weight: 600; font-size: 0.84rem; color: var(--text-primary);
      line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .note-acc.open .note-acc-title { white-space: normal; }
    .note-acc-title mark { background: var(--accent-dim); color: var(--accent); padding: 0 0.12em; border-radius: 0.2em; }
    .note-acc-meta { font-size: var(--fs-xs); color: var(--text-faint); white-space: nowrap; flex-shrink: 0; }
    .note-acc-body { display: none; padding: 0.55rem 0.8rem 0.7rem; border-top: 1px solid var(--border); }
    .note-acc.open .note-acc-body { display: block; }
    .note-card-actions { display: flex; gap: 0.1rem; flex-shrink: 0; }
    .note-card-actions button {
      background: none; border: none; cursor: pointer; font-size: 0.72rem; opacity: 0.45;
      padding: 0.1rem 0.22rem; border-radius: 0.25rem; transition: opacity 0.12s, background 0.12s;
    }
    .note-card-actions button:hover { opacity: 1; background: var(--bg-hover); }
    .note-acc.pinned .note-card-actions button[title="Unpin"] { opacity: 0.9; }
    .note-card-body { font-size: 0.92rem; color: var(--text-muted); line-height: 1.65; }
    .note-card-body > *:first-child { margin-top: 0 !important; }
    .note-card-body p { margin: 0 0 0.65rem; }
    .note-card-body p:last-child { margin-bottom: 0; }
    .note-card-body ul.note-bullets { margin: 0 0 0.6rem; padding-left: 1.25rem; }
    .note-card-body ul.note-bullets li { margin-bottom: 0.3rem; }
    .note-card-body code { background: var(--bg-hover); padding: 0.1em 0.4em; border-radius: 0.3rem; font-family: var(--font-mono); font-size: 0.88em; color: var(--text-primary); }
    .note-card-body strong { color: var(--text-primary); font-weight: 700; }
    .note-card-body em { font-style: italic; }
    .note-card-body del { opacity: 0.55; }
    .note-card-body a { color: var(--accent, #6ea8fe); text-decoration: underline; }
    .note-card-body ol.note-bullets { margin: 0 0 0.6rem; padding-left: 1.4rem; }
    .note-card-body ol.note-bullets li { margin-bottom: 0.3rem; }
    /* Headings: big + bold like a real doc, not a form label — the emoji in the text does the rest */
    .note-card-body h1.note-h, .note-card-body h2.note-h, .note-card-body h3.note-h,
    .note-card-body h4.note-h, .note-card-body h5.note-h, .note-card-body h6.note-h {
      color: var(--text-primary); font-weight: 800; line-height: 1.3; }
    .note-card-body h1.note-h { font-size: 1.4rem; margin: 1.2rem 0 0.6rem; letter-spacing: -0.01em; }
    .note-card-body h2.note-h { font-size: 1.14rem; margin: 1.1rem 0 0.55rem; }
    .note-card-body h3.note-h { font-size: 1.02rem; margin: 0.95rem 0 0.5rem; }
    .note-card-body h4.note-h, .note-card-body h5.note-h, .note-card-body h6.note-h { font-size: 0.94rem; color: var(--text-muted); margin: 0.85rem 0 0.45rem; }
    /* Callout box, not a thin sidebar line — matches the "boxed tip" look */
    .note-card-body blockquote.note-quote {
      margin: 0 0 0.65rem; padding: 0.65rem 0.9rem;
      border-left: 3px solid var(--accent); background: var(--accent-dim);
      border-radius: 0 0.4rem 0.4rem 0; color: var(--text-primary);
    }
    .note-card-body hr.note-hr { border: 0; border-top: 1px solid var(--border, rgba(255,255,255,0.12)); margin: 1rem 0; }
    /* Code blocks: bordered card with a language label strip, Prism handles the token colors inside */
    .note-code-wrap { margin: 0 0 0.65rem; border: 1px solid var(--border, rgba(255,255,255,0.12)); border-radius: 0.5rem; overflow: hidden; }
    .note-code-lang { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-faint); padding: 0.35rem 0.75rem; background: var(--bg-hover); border-bottom: 1px solid var(--border, rgba(255,255,255,0.12)); text-transform: lowercase; }
    .note-card-body pre.note-code { background: var(--bg-hover); margin: 0; padding: 0.65rem 0.8rem; overflow-x: auto; }
    .note-card-body pre.note-code code { background: none !important; padding: 0 !important; font-family: var(--font-mono); font-size: 0.85em; white-space: pre; text-shadow: none !important; }
    .note-card-body table.note-table { border-collapse: collapse; width: 100%; margin: 0 0 0.6rem; font-size: 0.92em; }
    .note-card-body table.note-table th, .note-card-body table.note-table td { border: 1px solid var(--border, rgba(255,255,255,0.12)); padding: 0.35rem 0.6rem; text-align: left; }
    .note-card-body table.note-table th { background: var(--bg-hover); color: var(--text-primary); font-weight: 600; }

    /* Per-note print (🖨️ button on each note card) — printTopicNote() fills this with the
       rendered note, adds .print-note-mode to <body>, then calls window.print(). Reuses the
       .note-card-body/.note-h/.note-quote/etc classes so the printed note keeps the same
       formatting as on screen; only colors flip to ink-on-paper here. */
    #print-note-host { display: none; }
    @media print {
      body.print-note-mode > .d-flex { display: none !important; }
      body.print-note-mode #print-note-host {
        display: block; background: #fff; color: #111;
        max-width: 100%; padding: 0.3in 0.2in; font-size: 12pt;
      }
      #print-note-host .note-card-body { color: #222; }
      #print-note-host h1.note-h, #print-note-host h2.note-h, #print-note-host h3.note-h,
      #print-note-host h4.note-h, #print-note-host h5.note-h, #print-note-host h6.note-h { color: #000; }
      #print-note-host blockquote.note-quote { background: #eef2fb !important; border-left-color: #3a5fcd !important; color: #111 !important; }
      #print-note-host .note-code-lang { background: #eee !important; color: #555 !important; border-color: #ccc !important; }
      #print-note-host .note-code-wrap { border-color: #ccc !important; }
      #print-note-host pre.note-code { page-break-inside: avoid; border-color: #ccc !important; }
      #print-note-host table.note-table th, #print-note-host table.note-table td { border-color: #ccc !important; }
      #print-note-host code { color: #111; }
    }

    /* Section labels inside the question body ("Asked at" / "My submissions" /
       "My notes") — badge pills so they stand out from surrounding text */
    .q-section-label {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: var(--accent-dim); color: var(--accent);
      border: 1px solid var(--border-glow); border-radius: 20px;
      padding: 0.24rem 0.7rem; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase; line-height: 1; white-space: nowrap;
    }

    /* Per-question LeetCode submission links (max 3, shown above My notes) */
    .subs-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }
    .sub-pill {
      display: inline-flex; align-items: center; gap: 0.35rem;
      background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 20px;
      padding: 0.18rem 0.65rem; font-size: var(--fs-xs); color: var(--text-primary);
      text-decoration: none; font-family: var(--font-mono);
    }
    .sub-pill:hover { border-color: var(--border-glow); color: var(--accent); }
    .sub-pill-blocked { opacity: 0.6; cursor: default; text-decoration: line-through; }
    .sub-pill-x { cursor: pointer; opacity: 0.45; padding: 0 0.1rem; }
    .sub-pill-x:hover { opacity: 1; }
    .btn-add-sub {
      background: transparent; color: var(--text-muted); border: 1px dashed var(--border);
      border-radius: 20px; padding: 0.18rem 0.7rem; font-size: var(--fs-xs); cursor: pointer; white-space: nowrap;
    }
    .btn-add-sub:hover { background: var(--bg-hover); color: var(--text-primary); border-style: solid; }
    .sub-input {
      flex: 1; min-width: 0; background: var(--bg-base); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text-primary); font-family: var(--font-mono);
      font-size: var(--fs-xs); padding: 0.35rem 0.6rem;
    }
    .sub-input:focus { outline: none; border-color: var(--border-glow); }
    .sub-input::placeholder { color: var(--text-faint); }
    .sub-err { color: var(--red, #e5484d); font-size: var(--fs-xs); margin-top: 0.25rem; }

    /* 🔗 "My solution" button in the question header: sits next to ↗ so a saved submission is
       one click away without opening the accordion. Dim until you have a link saved. */
    .sub-open-btn { position: relative; margin-right: 0; }
    .sub-open-btn.has-subs, .status-cycle-btn.sub-open-btn.has-subs { background: var(--accent-dim); border-color: var(--accent); }
    .sub-open-btn .sub-btn-count {
      position: absolute; top: -6px; right: -6px; min-width: 15px; height: 15px; padding: 0 3px;
      border-radius: 8px; background: var(--accent); color: var(--bg-base);
      font-size: 0.6rem; font-weight: 700; line-height: 15px; text-align: center; pointer-events: none;
    }
    .sub-menu {
      position: fixed; z-index: 1080; box-sizing: border-box; width: 290px; max-width: calc(100vw - 16px);
      background: var(--bg-surface); border: 1px solid var(--border-glow); border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(0,0,0,0.35); padding: 0.5rem;
    }
    .sub-menu-title { font-size: var(--fs-xs); color: var(--text-muted); margin: 0.1rem 0.25rem 0.4rem; }
    .sub-menu-item {
      display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
      padding: 0.4rem 0.55rem; border-radius: 6px; font-size: var(--fs-xs); font-family: var(--font-mono);
      color: var(--text-primary); text-decoration: none; cursor: pointer;
    }
    .sub-menu-item:hover { background: var(--bg-hover); color: var(--accent); }
    .sub-menu-item.blocked { opacity: 0.55; cursor: default; text-decoration: line-through; }
    .sub-menu-add { color: var(--text-muted); border-top: 1px solid var(--border); border-radius: 0 0 6px 6px; margin-top: 0.25rem; padding-top: 0.55rem; font-family: inherit; }
    .sub-menu .sub-input { width: 100%; }
    .sub-menu-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; justify-content: flex-end; }

    /* ── 26. QUESTION HEADER ACTIONS ─────────────────────────────────────────────────── */
    /* Action buttons sit outside the accordion <button> so clicks on them       */
    /* never activate Bootstrap’s toggle, regardless of where in the span they land. */
    .accordion-header { display: flex; align-items: stretch; }
    .accordion-header .accordion-button { flex: 1; min-width: 0; }
    .q-header-actions {
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0.7rem 0.35rem 0.7rem 0.75rem; flex-shrink: 0;
      background: var(--bg-elevated); transition: background 0.15s;
    }
    .q-header-actions .status-cycle-btn { margin-right: 0; }
    .accordion-header:has(.accordion-button:not(.collapsed)) .q-header-actions { background: var(--bg-hover); }

    /* ── Calm & grouped action cluster: hairline dividers split it into
       [status · open · links] │ [seen] │ [solve-ring]; occasional buttons recede
       at rest and go full-opacity on card hover / when the card is open. ── */
    .qa-div { width: 1px; align-self: center; height: 18px; background: var(--border); flex-shrink: 0; margin: 0 0.12rem; }
    .qa-ghost, .solve-ring-adj { opacity: 0.5; }
    .accordion-header:hover .qa-ghost,
    .accordion-header:hover .solve-ring-adj,
    .accordion-header:has(.accordion-button:not(.collapsed)) .qa-ghost,
    .accordion-header:has(.accordion-button:not(.collapsed)) .solve-ring-adj { opacity: 1; }

    /* ── 29. PRACTICE SESSION ───────────────────────────────────────────────── */

    /* 👀 Seen / revised flag — independent of status & solve-ring. Grey = never seen,
       green = fresh (within 15 days), amber = "review again" (15+ days). */
    .seen-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 3px;
      min-width: 28px; height: 28px; padding: 0 6px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg-elevated); cursor: pointer;
      font-size: 0.72rem; flex-shrink: 0;
      transition: transform 0.15s, border-color 0.15s, background 0.15s, opacity 0.2s, filter 0.2s;
    }
    .seen-btn:hover { transform: scale(1.18); border-color: var(--border-glow); background: var(--bg-hover); opacity: 1; filter: none; }
    /* never seen — dim grey eye */
    .seen-none  { filter: grayscale(1); opacity: 0.5; }
    /* seen ≤15 days — vivid green eye */
    .seen-fresh { background: var(--green-dim);  border-color: rgba(61,214,140,0.45); }
    /* seen >15 days — colour shifts to amber AND the whole badge fades ("review again") */
    .seen-stale { background: var(--yellow-dim); border-color: rgba(240,192,96,0.35); opacity: 0.5; filter: grayscale(0.4); }

    /* 🧠 Revise control — active-recall grader (replaces the old 👀 eye). Three grade buttons
       drive the REVISE spaced-repetition queue; the box state shows whether a recall is due. */
    .revise-ctrl {
      display: inline-flex; align-items: center; gap: 1px;
      height: 28px; padding: 0 5px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg-elevated); flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s, opacity 0.2s, filter 0.2s;
    }
    .revise-dot { font-size: 0.72rem; line-height: 1; margin-right: 2px; }
    .rev-grade {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 20px; border-radius: 5px; border: 1px solid transparent;
      background: transparent; cursor: pointer; font-size: 0.74rem; font-weight: 700;
      font-family: var(--font-mono); color: var(--text-muted); line-height: 1;
      transition: transform 0.12s, background 0.12s, color 0.12s, border-color 0.12s;
    }
    .rev-grade:hover { transform: scale(1.18); }
    .rev-solid:hover  { color: var(--green);  background: var(--green-dim);     border-color: rgba(61,214,140,0.45); }
    .rev-shaky:hover  { color: var(--yellow); background: var(--yellow-dim);    border-color: rgba(240,192,96,0.4); }
    .rev-forgot:hover { color: var(--red);    background: rgba(229,83,83,0.12); border-color: rgba(229,83,83,0.4); }
    /* whole-control state: grey = not a revision candidate, amber = recall due, green = fresh */
    .revise-none  { filter: grayscale(1); opacity: 0.5; }
    .revise-due   { border-color: rgba(240,192,96,0.45); background: var(--yellow-dim); }
    .revise-fresh { border-color: rgba(61,214,140,0.4); }
    .qp-mock-note { font-size: var(--fs-xs); color: var(--text-muted); padding: 0.4rem 0.6rem; border-radius: 8px; background: var(--accent-dim); border: 1px solid var(--border); }
    /* Revise-session row: the ✓/~/✗ grade buttons + the chosen-grade highlight + "last grade" tag */
    .rev-grade-group { display: inline-flex; align-items: center; gap: 2px; }
    .rev-grade.rev-chosen.rev-solid  { color: var(--green);  background: var(--green-dim);     border-color: rgba(61,214,140,0.55); }
    .rev-grade.rev-chosen.rev-shaky  { color: var(--yellow); background: var(--yellow-dim);    border-color: rgba(240,192,96,0.55); }
    .rev-grade.rev-chosen.rev-forgot { color: var(--red);    background: rgba(229,83,83,0.16); border-color: rgba(229,83,83,0.55); }
    .rev-weak-tag { font-family: var(--font-mono); font-size: 0.64rem; font-weight: 700; padding: 0 4px; border-radius: 4px; flex-shrink: 0; }
    .rev-weak-forgot { color: var(--red);    background: rgba(229,83,83,0.14); }
    .rev-weak-shaky  { color: var(--yellow); background: var(--yellow-dim); }
    /* Revise-row title is a click-to-read link to the problem (still looks like the title) */
    .ps-q-title-link { color: inherit; text-decoration: none; }
    .ps-q-title-link:hover { text-decoration: underline; color: var(--accent); }
    /* Forgot residue row: stays in the Revise list as your "code this" list — highlighted, never struck */
    .ps-q-row.ps-q-forgot { background: rgba(229,83,83,0.08); border-color: rgba(229,83,83,0.4); }
    .ps-q-row.ps-q-forgot:hover { background: rgba(229,83,83,0.14); border-color: rgba(229,83,83,0.55); }
    /* Graded-but-kept rows: solid/shaky stay in place (never swept), tinted to show they're done */
    .ps-q-row.ps-q-solid { background: var(--green-dim); border-color: rgba(61,214,140,0.4); }
    .ps-q-row.ps-q-solid:hover { border-color: rgba(61,214,140,0.55); }
    .ps-q-row.ps-q-shaky { background: var(--yellow-dim); border-color: rgba(240,192,96,0.4); }
    .ps-q-row.ps-q-shaky:hover { border-color: rgba(240,192,96,0.55); }
    /* Persisted "last revise grade" badge shown on cards & practice rows (display-only) */
    .revise-grade-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 16px; height: 16px; padding: 0 4px; border-radius: 4px; flex-shrink: 0;
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 800; line-height: 1;
    }
    .revise-grade-badge.rg-none { display: none; }
    .rg-solid  { color: var(--green);  background: var(--green-dim); }
    .rg-shaky  { color: var(--yellow); background: var(--yellow-dim); }
    .rg-forgot { color: var(--red);    background: rgba(229,83,83,0.16); }
    /* Revise/By Pattern: ~20% random spot-check flag — "actually code this one", not just recall */
    .ps-code-pick {
      display: inline-flex; align-items: center; gap: 0.2rem;
      padding: 0.1rem 0.4rem; border-radius: 10px; white-space: nowrap;
      color: var(--purple); background: var(--purple-dim); border: 1px solid rgba(180,142,247,0.35);
      font-size: 0.66rem; font-weight: 700; line-height: 1.4;
    }
    /* "Last revised … ago" label on Revised-log rows */
    .rev-ago { font-size: 0.62rem; color: var(--text-faint); font-family: var(--font-mono); white-space: nowrap; flex-shrink: 0; }
    .ps-ctrl-bar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
    .ps-count-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: 0.9rem; line-height:1;
      transition: border-color 0.15s, background 0.15s;
    }
    .ps-count-btn:hover { border-color: var(--border-glow); background: var(--bg-hover); }
    .ps-count-btn:disabled { opacity: 0.3; cursor: not-allowed; border-color: var(--border); background: var(--bg-elevated); }
    .ps-count-val { font-size: var(--fs-sm); font-weight: 600; min-width: 1.5ch; text-align: center; }
    .ps-count-input {
      font-size: var(--fs-sm); font-weight: 600; width: 2.6rem; text-align: center;
      border: 1px solid var(--border); border-radius: 6px; background: var(--bg-elevated);
      color: var(--text-primary); padding: 0.15rem 0.3rem; font-family: inherit;
      -moz-appearance: textfield; appearance: textfield;
    }
    .ps-count-input:focus { outline: none; border-color: var(--border-glow); }
    /* −/+ buttons already sit next to this input — hide the native spinner so it doesn't
       overlap the digits (it was rendering on top of the number in a box this narrow). */
    .ps-count-input::-webkit-inner-spin-button, .ps-count-input::-webkit-outer-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    .ps-shuffle-btn {
      padding: 0.22rem 0.7rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: var(--fs-xs);
      color: var(--text-primary); transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .ps-shuffle-btn:hover { border-color: var(--border-glow); background: var(--accent-dim); color: var(--accent); }
    .ps-shuffle-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .ps-timer-bar { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.65rem; padding-top: 0.65rem; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .ps-preset-btn {
      padding: 0.18rem 0.5rem; border-radius: 5px; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: var(--fs-xs);
      color: var(--text-muted); font-family: var(--font-mono);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .ps-preset-btn:hover { border-color: var(--border-glow); color: var(--accent); background: var(--accent-dim); }
    .ps-preset-btn.ps-active { border-color: var(--accent-glow); background: var(--accent-dim); color: var(--accent); }
    .ps-timer-display { font-family: var(--font-mono); font-size: 0.9rem; min-width: 4.2ch; text-align: center; color: var(--text-primary); }
    .ps-timer-display.ps-running { color: var(--accent); }
    .ps-timer-display.ps-expired { color: var(--red); animation: ps-pulse 1s ease infinite; }
    @keyframes ps-pulse { 0%,100% { opacity:1; } 50% { opacity:0.45; } }
    .ps-timer-ctrl {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: 0.75rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .ps-timer-ctrl:hover { border-color: var(--border-glow); background: var(--bg-hover); }
    .ps-q-row { display: flex; align-items: center; gap: 0.42rem; padding: 0.38rem 0.6rem; border-radius: 8px; background: var(--bg-base); border: 1px solid var(--border); margin-bottom: 0.32rem; cursor: pointer; transition: background 0.2s, border-color 0.2s, opacity 0.35s; }
    .ps-q-row:hover { border-color: var(--border-glow); background: var(--bg-hover); }
    .ps-q-row.ps-q-solved { background: rgba(40,167,69,0.12); border-color: rgba(40,167,69,0.4); opacity: 0.7; }
    .ps-q-row.ps-q-solved .ps-q-title { text-decoration: line-through; color: var(--text-faint); }
    .ps-q-row.ps-q-moving { transition: opacity 0.3s; opacity: 0; }
    .ps-due-dot { font-size: 0.52rem; color: var(--yellow); flex-shrink: 0; line-height: 1; }
    /* ── Solve ring (radial solve-count badge on question accordion) ── */
    .solve-ring-wrap { display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0; padding: 0 2px; }
    .solve-ring {
      display: inline-flex; align-items: center; justify-content: center; gap: 3px;
      height: 32px; padding: 0 10px; border-radius: 16px; border: 1.5px solid;
      font-size: 1rem; font-weight: 700; font-family: var(--font-mono); flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s; white-space: nowrap;
    }
    .solve-ring-num { font-size: 0.78rem; opacity: 0.9; }
    .solve-ring-dim    { border-color: var(--border);     color: var(--text-faint); background: var(--bg-base); }
    .solve-ring-bronze { border-color: #cd7f32;           color: #cd7f32;           background: rgba(205,127,50,0.12); }
    .solve-ring-silver { border-color: #9ca3af;           color: #9ca3af;           background: rgba(156,163,175,0.12); }
    .solve-ring-gold   { border-color: #ffd700;           color: #ffd700;           background: rgba(255,215,0,0.12);   box-shadow: 0 0 5px rgba(255,215,0,0.3); }
    .solve-ring-diamond{ border-color: var(--accent);     color: var(--accent);     background: var(--accent-dim);      box-shadow: 0 0 7px var(--accent-glow); }
    .solve-ring-adj {
      display: inline-flex; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: 0.85rem; line-height: 1;
      color: var(--text-muted); padding: 0; transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .solve-ring-adj:hover { border-color: var(--border-glow); color: var(--text-primary); background: var(--bg-hover); }
    .ps-q-num { font-size: var(--fs-xs); color: var(--text-faint); min-width: 1.3rem; font-family: var(--font-mono); }
    .ps-q-title { flex: 1; font-size: var(--fs-sm); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ps-q-link {
      display: inline-flex; align-items: center; justify-content: center;
      width: 24px; height: 24px; border-radius: 5px; border: 1px solid var(--border);
      background: var(--bg-elevated); text-decoration: none; color: var(--text-muted);
      font-size: 0.7rem; flex-shrink: 0; transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .ps-q-link:hover { border-color: var(--border-glow); color: var(--accent); background: var(--accent-dim); }
    .ps-jump-btn { cursor: pointer; font-size: 0.75rem; }
    @keyframes ps-jump-flash {
      0%, 100% { background: transparent; box-shadow: none; }
      20% { background: var(--accent-dim); box-shadow: 0 0 0 2px var(--border-glow); }
    }
    .accordion-item.ps-jump-highlight { animation: ps-jump-flash 1.4s ease-out; border-radius: 8px; }
    .ps-session-done {
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
      padding: 0.5rem 0.75rem; border-radius: 8px; margin-bottom: 0.5rem;
      background: rgba(61,214,140,0.1); border: 1px solid rgba(61,214,140,0.35);
      font-size: var(--fs-sm); color: var(--text-primary);
    }
    .ps-streak-badge {
      display: inline-flex; align-items: center; gap: 0.25rem;
      padding: 0.18rem 0.55rem; border-radius: 20px;
      background: rgba(240,192,96,0.12); border: 1px solid rgba(240,192,96,0.3);
      font-size: var(--fs-xs); color: var(--yellow); font-weight: 600; white-space: nowrap;
    }
    .ps-streak-badge.streak-zero { background: var(--bg-elevated); border-color: var(--border); color: var(--text-faint); }
    .qp-chip {
      padding: 0.22rem 0.6rem; border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg-elevated); cursor: pointer; font-size: var(--fs-xs);
      color: var(--text-muted); transition: all 0.15s; user-select: none;
    }
    .qp-chip:hover { border-color: var(--border-glow); color: var(--text-primary); }
    .qp-chip.active { background: var(--accent-dim); border-color: var(--border-glow); color: var(--accent); }

    #backToTopBtn {
      position: fixed; right: 1.5rem; bottom: 1.5rem; z-index: 90;
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent); color: #fff; border: none;
      font-size: 1.2rem; line-height: 1; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      opacity: 0; visibility: hidden; transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s, visibility 0.2s, background 0.15s;
    }
    #backToTopBtn.show { opacity: 1; visibility: visible; transform: translateY(0); }
    #backToTopBtn:hover { filter: brightness(1.12); }
