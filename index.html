    '<span class="badge bg-' + DIFFICULTY_BADGE[q.difficulty] + ' q-badge flex-shrink-0">' + q.difficulty + '</span>' +
    '<span class="revise-grade-badge ' + badge[0] + '">' + badge[1] + '</span>' +
    (ts ? '<span class="rev-ago" title="' + escHtml(new Date(ts).toLocaleString()) + '">' + _agoLabel(ts) + ' ago</span>' : '') +
    '<a href="' + escHtml(q.link) + '" target="_blank" rel="noopener noreferrer" class="ps-q-link" title="Open on LeetCode" onclick="event.stopPropagation()">↗</a>' +
    '</div>'
  )
}

// Grade a row in the Revise Session: drives the revise queue (and force-codes on "forgot"),
// then marks the row graded. Rows stay put — regrading is allowed (click a different button).
function _qpReviseGrade(ev, lcKey, grade) {
  ev.stopPropagation()
  gradeRevise(lcKey, grade)               // data + dashboard counts + (card refresh is a no-op here)
  logRecent(lcKey, grade)
  // ✓ Solid in GRADED specifically gets full "clean solve" credit — see _psCreditCleanSolve.
  if (grade === 'solid' && _qpRevised) _psCreditCleanSolve(lcKey)
  _qpDoneThisSession.add(lcKey)
  _saveQpState()
  const listEl = document.getElementById('qp-results')
  if (!listEl) return
  // Re-render just this row in place so its tint + chosen grade button update immediately.
  const idx = (_qpResults || []).findIndex(([k]) => k === lcKey)
  const row = listEl.querySelector('.ps-q-row[data-lc-key="' + lcKey + '"]')
  if (row && idx !== -1) row.outerHTML = _buildReviseItem(_qpResults[idx], idx, 'qp')
  // Once everything's graded, show the closing banner (it's a summary, not a sweep — rows stay).
  const ungraded = (_qpResults || []).filter(([k]) => !_qpDoneThisSession.has(k)).length
  if (ungraded === 0 && !listEl.querySelector('.ps-session-done')) {
    listEl.insertAdjacentHTML('afterbegin', '<div class="ps-session-done">🧠 Recall sweep complete · <span style="color:var(--green)">' + _qpDoneThisSession.size + ' graded</span></div>')
  }
}

function _qpReviseShowComplete() {
  const listEl = document.getElementById('qp-results')
  if (!listEl || listEl.querySelector('.ps-session-done')) return
  listEl.insertAdjacentHTML('afterbegin', '<div class="ps-session-done">🧠 Recall sweep complete · <span style="color:var(--green)">' + _qpDoneThisSession.size + ' graded</span></div>')
}

// Generate a practice set for a single topic.
// Priority: Unsolved (weighted) → Solved (weighted), weakest grade first.
function _genPracticeSet(topicKey, count) {
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return []
  const all0        = Object.entries(mod.questions)
  // "Worked-on only" filter: exclude 📋 Pending so practice draws only from 🚧 In Progress + ✅ Solved
  const all         = _practiceWorkedOnly ? all0.filter(([k]) => getStatus(k) !== 'Pending') : all0
  // Serve your weakest (forgot → shaky) first within the topic.
  return _orderByWeakness(_orderPracticePool(all)).slice(0, count)
}

// Render a single practice row. showTopic=true adds the topic icon (dashboard).
// Jump from a practice/graded/revise row straight to the full question card below (Questions
// tab) — switches tab, clears any filter that could be hiding it, expands its accordion, and
// scrolls it into view with a brief flash. Not offered in Mock (the point there is to stay cold).
function _jumpToQuestion(ev, lcKey) {
  if (ev) ev.stopPropagation()
  if (currentQFilter !== 'all' || currentFreqFilter !== 'all' || currentCompanyFilter !== null) {
    currentQFilter = 'all'; currentFreqFilter = 'all'; currentCompanyFilter = null
  }
  if (currentTab !== 'questions') {
    showTopicTab('questions')  // re-renders tab-questions with the (now-cleared) filters
  } else {
    const mod = TOPIC_MODULES[currentTopicKey]
    if (mod) renderQuestions(mod)
  }
  requestAnimationFrame(() => {
    const item = document.querySelector('#tab-questions .accordion-item[data-lc-key="' + lcKey + '"]')
    if (!item) return
    const collapseEl = item.querySelector('.accordion-collapse')
    if (collapseEl && window.bootstrap) bootstrap.Collapse.getOrCreateInstance(collapseEl, { toggle: false }).show()
    item.scrollIntoView({ behavior: 'smooth', block: 'center' })
    item.classList.remove('ps-jump-highlight')
    void item.offsetWidth  // restart the flash animation if clicked again
    item.classList.add('ps-jump-highlight')
  })
}

function _buildPracticeItem([lcKey, q], i, showTopic) {
  const due = isDue(lcKey)
  // Mock Mode hides topic icon, difficulty, freq, status & due dot so you face the problem cold —
  // until "Reveal". Dashboard mock = _qpMock; per-topic mock = _psMode 'mock'.
  const hideMeta = showTopic ? (_qpMock && !_qpMockReveal) : (_psMode === 'mock' && !_psMockReveal)
  let topicIcon = ''
  if (showTopic && !hideMeta) {
    const tKey = Object.keys(TOPIC_MODULES).find(k => TOPIC_MODULES[k].questions?.[lcKey])
    const tEntry = tKey ? TOPICS.find(t => t.key === tKey) : null
    if (tEntry) topicIcon = '<span class="text-xxs text-secondary flex-shrink-0">' + tEntry.icon + '</span>'
  }
  // The row itself does nothing on click anymore — only the grade buttons act. Tint/chosen-button
  // only reflect a grade thrown in THIS generated set (same rule as Graded/By Pattern rows) — a
  // stale grade from before this generate doesn't pre-color the row; every row starts neutral until
  // you grade it again. The set persists across reloads (doneThisSession is saved in
  // dsa-qp-state-v1 / the practice session), so reopening the tab keeps this set's colours.
  const doneInSession = showTopic ? _qpDoneThisSession.has(lcKey) : _psDoneThisSession.has(lcKey)
  const forced   = isCodeForced(lcKey)
  const rv       = doneInSession ? getRevise(lcKey) : null
  const rowCls   = forced ? ' ps-q-forgot' : (rv && rv.grade === 'solid') ? ' ps-q-solid' : (rv && rv.grade === 'shaky') ? ' ps-q-shaky' : ''
  const dueDot   = ((due || forced) && !rv && !hideMeta) ? '<span class="ps-due-dot" title="Due for review">●</span>' : ''
  const isMock       = showTopic ? _qpMock : (_psMode === 'mock')
  // Jump-to-question assumes you're already inside that topic's page (currentTopicKey) — on the
  // dashboard there's no single "current topic" to jump within, so it doesn't actually work
  // there. Only offer it in the per-topic Practice Session.
  const jumpBtn = (isMock || showTopic) ? '' :
    '<button type="button" class="ps-q-link ps-jump-btn" title="Jump to the full question below" aria-label="Jump to question" onclick="_jumpToQuestion(event,\'' + lcKey + '\')">⤵</button>'
  // Saved-solution link — same 🔗 to your last submission that Graded/By Pattern rows have.
  const subs = getSubmissions(lcKey)
  const subLink = subs.length ?
    '<a href="' + escHtml(subs[subs.length - 1].url) + '" target="_blank" rel="noopener noreferrer" class="ps-q-link" title="Open your' +
    (subs.length > 1 ? ' most recent saved submission (' + subs.length + ' saved)' : ' saved submission') +
    '" onclick="event.stopPropagation()">🔗</a>' : ''
  // Solve-list rows also get the same ✓/~/✗ grade buttons Graded/By Pattern have. ✓ is the ONLY
  // way to mark a question Solved here now (see _practiceGrade / _psCreditCleanSolve) — hidden
  // during an un-revealed Mock so it stays a cold test.
  const chosen = g => (rv && rv.grade === g) ? ' rev-chosen' : ''
  const gradeBtns = hideMeta ? '' :
    '<span class="rev-grade-group flex-shrink-0">' +
      '<button class="rev-grade rev-solid' + chosen('solid') + '"  title="Recalled it cold — mark solved" onclick="event.stopPropagation();_practiceGrade(event,\'' + lcKey + '\',\'solid\',' + (showTopic ? 'true' : 'false') + ')">✓</button>' +
      '<button class="rev-grade rev-shaky' + chosen('shaky') + '"  title="Shaky — needed a hint"          onclick="event.stopPropagation();_practiceGrade(event,\'' + lcKey + '\',\'shaky\',' + (showTopic ? 'true' : 'false') + ')">~</button>' +
      '<button class="rev-grade rev-forgot' + chosen('forgot') + '" title="Forgot"                         onclick="event.stopPropagation();_practiceGrade(event,\'' + lcKey + '\',\'forgot\',' + (showTopic ? 'true' : 'false') + ')">✗</button>' +
    '</span>'
  return (
    '<div class="ps-q-row' + rowCls + '" data-lc-key="' + lcKey + '">' +
    '<span class="ps-q-num">' + (i + 1) + '</span>' +
    dueDot +
    topicIcon +
    '<span class="ps-q-title" title="' + escHtml(q.title) + '">' + escHtml(q.title) + '</span>' +
    (q.freq && !hideMeta ? freqBadge(q, ' flex-shrink-0') : '') +
    gradeBtns +
    jumpBtn +
    subLink +
    '<a href="' + escHtml(q.link) + '" target="_blank" rel="noopener noreferrer" class="ps-q-link" title="Open on LeetCode" onclick="event.stopPropagation()">↗</a>' +
    '</div>'
  )
}
// Grade a solve-list row (dashboard's plain generator / Worked / Mock). This is now the ONLY way
// these rows change state — the row itself has no click handler any more. ✓ Solid gets the same
// full "clean solve" credit as Graded (_psCreditCleanSolve): ladder push + mark Solved. The ring
// bump itself lives inside gradeRevise() and is deduped off the PERSISTED revise record (not the
// UI path that called it), so grading the same question twice today — from here, Graded, or By
// Pattern, in any combination — only ever credits the ring once.
function _practiceGrade(ev, lcKey, grade, showTopic) {
  if (ev) ev.stopPropagation()
  gradeRevise(lcKey, grade)
  if (grade === 'solid') _psCreditCleanSolve(lcKey)
  if (showTopic) { _qpDoneThisSession.add(lcKey); _saveQpState() } else { _psDoneThisSession.add(lcKey); _psSaveSession() }
  const items  = showTopic ? _qpResults : _psCurrentItems
  const listEl = document.getElementById(showTopic ? 'qp-results' : 'ps-list')
  if (!listEl || !items) return
  const idx = items.findIndex(([k]) => k === lcKey)
  const row = listEl.querySelector('.ps-q-row[data-lc-key="' + lcKey + '"]')
  if (row && idx !== -1) row.outerHTML = _buildPracticeItem(items[idx], idx, showTopic)
  // Session-complete banner once every row here has been graded (mirrors Graded's sweep-complete).
  if (showTopic) {
    const ungraded = items.filter(([k]) => !_qpDoneThisSession.has(k)).length
    if (ungraded === 0 && !listEl.querySelector('.ps-session-done')) {
      listEl.insertAdjacentHTML('afterbegin', '<div class="ps-session-done">✅ Session complete · <span style="color:var(--green)">' + _qpDoneThisSession.size + ' graded</span></div>')
    }
  }
}

// Build the full inner HTML for the Practice Session accordion body.
function _buildPracticePanel(topicKey, mod) {
  const total    = Object.keys(mod.questions).length
  const count    = Math.max(1, Math.min(_psQCount, total))

  // Track current topic for persistence
  const prevTopic = _psCurrentTopic
  _psCurrentTopic = topicKey

  // A saved session (any mode) is restored exactly as you left it — refresh/navigation never
  // reshuffles a set. Without one, Graded/Mock auto-generate for the topic so they're never an
  // empty "click Generate" wall (and the result is saved so it survives a refresh too).
  if (_psCurrentItems.length === 0) {
    const savedSession = _psLoadSession(topicKey)
    if (savedSession) {
      // Worked/Mock/whole-topic-Revise were removed from the UI — coerce any old saved
      // session in one of those modes to Graded so there's still a mode button to land on.
      _psMode       = ['revise-pattern', 'graded', 'recent'].includes(savedSession.mode)
        ? savedSession.mode : 'graded'
      _psMockReveal = !!savedSession.mockReveal
      if (_psMode === 'recent') {
        // Recent is a log of what you just did — it must never show a stale snapshot. A saved
        // session here only carries the restored mode/scope; the actual rows always come fresh
        // from the live log, otherwise grading something new (in Graded/By Pattern) wouldn't
        // show up here again until you happened to hit Refresh.
        // _psLoadSession (just above) already restored _psQCount from the saved session, but
        // `count` (top of this function) was computed from the OLD _psQCount before that — recompute.
        const recentCount = Math.max(1, Math.min(_psQCount, total))
        _psCurrentItems = _psModePool(topicKey, recentCount)
        _psQCount = _psCurrentItems.length || _psQCount
        _psSaveSession()
      } else {
        _psCurrentItems = savedSession.items.map(([lcKey, q]) => [lcKey, mod.questions[lcKey] || q])
        // Graded promise: ✗/~ questions ALWAYS appear. Merge in any weak graded
        // questions missing from the restored set — graded since it was saved (or saved back
        // when the old cooldown filter still hid them). They go on top, weakest first.
        if (_psMode === 'graded') {
          const have = new Set(_psCurrentItems.map(([k]) => k))
          const rank = k => ({ forgot: 0, shaky: 1 }[getRevise(k).grade] ?? 2)
          const missing = Object.entries(mod.questions)
            .filter(([k]) => getRevise(k) && !have.has(k) && rank(k) < 2)
            .sort((a, b) => rank(a[0]) - rank(b[0]))
          if (missing.length) { _psCurrentItems = [...missing, ..._psCurrentItems]; _psSaveSession() }
        }
        _psQCount = _psCurrentItems.length || _psQCount
      }
    } else if (_psMode === 'graded' || _psClearedTopics.has(topicKey)) {
      // Graded always starts empty — pick a count and hit Generate. A 🗑 Cleared topic (any mode) stays empty the same way.
    } else if (_psMode !== 'worked' || prevTopic === topicKey) {
      _psCurrentItems = _psModePool(topicKey, count)
      _psQCount = _psCurrentItems.length
      _psPickReviseCodeFlags()
      _psSaveSession()
    }
    // First visit to a topic in Worked/Graded mode: leave empty (user clicks Generate)
  }

  let html = ''
  // ── Mode toggle: Graded (solve) / By Pattern (recall, scoped to a pattern) ──
  html += '<div class="ps-mode-bar d-flex flex-wrap gap-2 mb-2">'
  html += '<button type="button" class="qp-chip' + (_psMode === 'graded' ? ' active' : '') + '" onclick="_psSetMode(\'graded\',\'' + topicKey + '\')" title="Graded — solve the questions you have graded on the cards; ranked ✗ forgot → ~ shaky → ✓ confident">🕒 Graded</button>'
  html += '<button type="button" class="qp-chip' + (_psMode === 'revise-pattern' ? ' active' : '') + '" onclick="_psSetMode(\'revise-pattern\',\'' + topicKey + '\')" title="By Pattern — active recall scoped to just the pattern(s) you pick">🧩 By Pattern</button>'
  html += '<button type="button" class="qp-chip' + (_psMode === 'recent' ? ' active' : '') + '" onclick="_psSetMode(\'recent\',\'' + topicKey + '\')" title="Recent — a read-only log of what you graded in Graded/By Pattern, newest first">🕘 Recent</button>'
  html += '</div>'
  // ── Controls bar ──────────────────────────────────────────────────────────
  html += '<div class="ps-ctrl-bar">'

  if (_psCurrentItems.length === 0) {
    if (_psMode === 'graded' || (_psMode === 'revise-pattern' && _psClearedTopics.has(topicKey))) {
      // Graded always lands empty — type a count (any number, not just +/-) and hit Generate.
      html += '<input type="number" class="ps-count-input" id="ps-gen-count-input" min="1" max="' + total + '" value="' + count + '" onclick="event.stopPropagation()">'
      html += '<span class="text-secondary text-xs">/ ' + total + '</span>'
      html += '<button type="button" class="ps-shuffle-btn ms-1" onclick="_psGenerateGraded(\'' + topicKey + '\')">▶ Generate</button>'
    } else {
      const modeLabel = _psMode === 'recent' ? '🕘 Recent' : '🧩 By Pattern'
      html += '<span class="text-xxs text-secondary text-muted">' + modeLabel + ' — nothing here right now</span>'
    }
  } else {
    html += '<button type="button" class="ps-count-btn" onclick="_psAdjCount(-1,\'' + topicKey + '\')">−</button>'
    html += '<span class="ps-count-val" id="ps-count-val">' + _psCurrentItems.length + '</span>'
    html += '<button type="button" class="ps-count-btn" onclick="_psAdjCount(1,\'' + topicKey + '\')">+</button>'
    html += '<button type="button" class="ps-count-btn" title="Show all questions" onclick="_psSetAll(\'' + topicKey + '\')">All</button>'
    html += '<span class="text-secondary text-xs">/ ' + total + '</span>'
    html += '<button type="button" class="ps-shuffle-btn ms-1" id="ps-btn-reset" onclick="_psShuffle(\'' + topicKey + '\')">↺ Refresh</button>'
    if (_psMode !== 'recent') html += '<button type="button" class="ps-shuffle-btn ms-1" id="ps-btn-clear" title="Remove every question from this list and start from an empty state (your grades and progress are kept)" onclick="_psClear(\'' + topicKey + '\')">🗑 Clear</button>'
  }

  html += '</div>'
  // ── By Pattern: pick the pattern(s) that scope the active-recall due set ────
  if (_psMode === 'revise-pattern' && mod.patterns && mod.patterns.length) {
    html += '<div class="d-flex flex-wrap gap-2 mt-2">'
    html += mod.patterns.map(p =>
      '<button type="button" class="qp-chip' + (_psRevisePatterns.has(p.id) ? ' active' : '') + '" title="' + escHtml(p.name) + '" onclick="_psToggleRevisePattern(\'' + p.id + '\',\'' + topicKey + '\')">' + p.id + '</button>'
    ).join('')
    if (_psRevisePatterns.size) html += '<button type="button" class="qp-chip" title="Deselect all patterns" onclick="_psSetRevisePatterns([],\'' + topicKey + '\')">✕ Clear</button>'
    html += '</div>'
  }
  // ── Question list ──────────────────────────────────────────────────────────
  html += '<div id="ps-list">'
  if (_psCurrentItems.length === 0) {
    html += '<div style="text-align: center; padding: 2rem 1rem;">'
    html += '<p class="text-secondary text-xs mb-0">' + _psEmptyMsg() + '</p>'
    html += '</div>'
  } else {
    html += _psRowsHtml()
  }
  html += '</div>'
  // ── Timer bar ──────────────────────────────────────────────────────────────
  html += '<div class="ps-timer-bar">'
  html += '<span class="text-secondary text-xs flex-shrink-0">⏱ Timer:</span>'
  html += '<button type="button" class="ps-preset-btn' + (_psTimerPreset===1  ? ' ps-active':'') + '" onclick="_psTimerSet(1,this)">1m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_psTimerPreset===5  ? ' ps-active':'') + '" onclick="_psTimerSet(5,this)">5m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_psTimerPreset===10 ? ' ps-active':'') + '" onclick="_psTimerSet(10,this)">10m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_psTimerPreset===20 ? ' ps-active':'') + '" onclick="_psTimerSet(20,this)">20m</button>'
  html += '<span class="ps-timer-display' + (_psTimerRun ? ' ps-running' : '') + (_psTimerRem === 0 && _psTimerTotal > 0 ? ' ps-expired' : '') + '" id="ps-timer-disp">' + _fmtTimer(_psTimerRem || _psTimerTotal) + '</span>'
  html += '<button type="button" class="ps-timer-ctrl" id="ps-timer-play" onclick="_psTimerToggle()" title="Start / Pause">'
  html += (_psTimerRun ? '⏸' : '▶') + '</button>'
  html += '<button type="button" class="ps-timer-ctrl" onclick="_psTimerReset()" title="Reset timer">↺</button>'
  html += '</div>'
  return html
}

function _fmtTimer(secs) {
  if (!secs) return 'Off'
  const m = Math.floor(secs / 60), s = secs % 60
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
}

// The count control is a plain <span> in most modes, but an editable <input> in Graded
// (so you can type 1/4/5/10/15/whatever, not just step it) — write to whichever it is.
function _psSyncCountDisplay(count) {
  const el = document.getElementById('ps-count-val')
  if (!el) return
  if (el.tagName === 'INPUT') el.value = count
  else el.textContent = count
}
// Graded starts empty — read the typed count, clamp it, and generate. Full panel re-render
// (not _psShuffle's partial DOM patch) because the ctrl bar itself changes shape here: the
// "type a count → Generate" row becomes the usual −/count/+/All/Refresh row.
// 🗑 Clear: drop every question from this topic's practice list and return the panel to its
// empty "pick a count and hit Generate" state. Only the SET is discarded — grades, statuses,
// solve counts and the Recent log live elsewhere and are untouched.
function _psClear(topicKey) {
  if (!TOPIC_MODULES[topicKey] || !_psCurrentItems.length) return
  const graded = _psCurrentItems.filter(([k]) => _psDoneThisSession.has(k)).length
  if (graded && !confirm('Clear this set? ' + graded + ' graded row' + (graded === 1 ? '' : 's') + ' will disappear from the list (your grades are kept).')) return
  _stopTimer()
  _psTimerRem = _psTimerTotal                       // back to the preset, not a half-run clock
  _psCurrentItems = []
  _psDoneThisSession.clear(); _psStruggledThisSession.clear()
  _psReviseCodeFlagged.clear(); _psReviseShownThisSession.clear()
  _psMockReveal = false
  _psClearedTopics.add(topicKey)                    // keep By Pattern from auto-refilling on re-render / revisit
  _psSaveSession()                                  // cleared topic → removes its saved session, so a reload stays empty too
  _renderPracticePanel()
}
function _psGenerateGraded(topicKey) {
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return
  const total = Object.keys(mod.questions).length
  const input = document.getElementById('ps-gen-count-input')
  const n = input ? parseInt(input.value, 10) : _psQCount
  _psQCount = Math.max(1, Math.min(total, isNaN(n) ? _psQCount : n))
  _psClearedTopics.delete(topicKey)
  _psCurrentItems = _psModePool(topicKey, _psQCount)
  _psQCount = _psCurrentItems.length || _psQCount
  _psPickReviseCodeFlags()
  _psSaveSession()
  _renderPracticePanel()
}
function _psAdjCount(delta, topicKey) {
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return
  if (_psTimerRun) return  // locked while timer is running — use Reset to restart

  // Graded/Mock pools are mode-defined — just change the cap and regenerate.
  if (_psMode !== 'worked') {
    const tot = Object.keys(mod.questions).length
    _psQCount = Math.max(1, Math.min(tot, _psCurrentItems.length + delta))
    _psShuffle(topicKey)
    return
  }

  const total = Object.keys(mod.questions).length
  const currentCount = _psCurrentItems.length
  const newCount = Math.max(1, Math.min(total, currentCount + delta))
  if (newCount === currentCount) return

  if (newCount > currentCount) {
    // Add questions from the remaining pool (not already shown)
    const currentKeys = new Set(_psCurrentItems.map(([k]) => k))
    const pool = Object.entries(mod.questions).filter(([k]) => !currentKeys.has(k) && getStatus(k) !== 'Pending' && !_onCooldown(k))
    const toAdd = _orderPracticePool(pool).slice(0, newCount - currentCount)
    _psCurrentItems = [..._psCurrentItems, ...toAdd]
  } else {
    // Remove from end — skip done-in-session items (preserve their solved state)
    const toRemove = currentCount - newCount
    const newItems = [..._psCurrentItems]
    let removed = 0
    // Pass 1: remove undone questions from the end
    for (let i = newItems.length - 1; i >= 0 && removed < toRemove; i--) {
      if (!_psDoneThisSession.has(newItems[i][0])) { newItems.splice(i, 1); removed++ }
    }
    // Pass 2: if still need to remove, take done ones from the end
    for (let i = newItems.length - 1; i >= 0 && removed < toRemove; i--) {
      newItems.splice(i, 1); removed++
    }
    _psCurrentItems = newItems
  }

  _psQCount = _psCurrentItems.length
  _psSyncCountDisplay(_psQCount)
  const listEl = document.getElementById('ps-list')
  if (listEl) {
    listEl.innerHTML = _psCurrentItems.length
      ? _psRowsHtml()
      : '<p class="text-secondary text-xs mb-0">No questions in this topic yet.</p>'
  }
  _psSaveSession()  // Persist the updated list
}

function _psSetAll(topicKey) {
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return
  if (_psTimerRun) return  // locked while timer is running
  if (_psMode !== 'worked') {   // Graded/Mock: show the whole topic's mode pool
    _psQCount = Object.keys(mod.questions).length
    _psShuffle(topicKey)
    return
  }
  const currentKeys = new Set(_psCurrentItems.map(([k]) => k))
  const toAdd = Object.entries(mod.questions).filter(([k]) => !currentKeys.has(k))
  _psCurrentItems = [..._psCurrentItems, ...toAdd]
  _psQCount = _psCurrentItems.length
  _psSyncCountDisplay(_psQCount)
  const listEl = document.getElementById('ps-list')
  if (listEl) listEl.innerHTML = _psRowsHtml()
  _psSaveSession()  // Persist the updated list
}

function _psToggleWorkedOnly(topicKey) {
  _practiceWorkedOnly = !_practiceWorkedOnly
  _saveQpState()
  document.querySelectorAll('.ps-workedonly-btn').forEach(b => b.classList.toggle('active', _practiceWorkedOnly))
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return
  // If a set is already loaded, regenerate it so the filter applies immediately (mirrors Reset).
  if (_psCurrentItems.length > 0) {
    _stopTimer()
    _psDoneThisSession.clear(); _psStruggledThisSession.clear()
    const count = Math.max(1, Math.min(_psQCount, Object.keys(mod.questions).length))
    _psCurrentItems = _genPracticeSet(topicKey, count)
    _psQCount = _psCurrentItems.length
    _psSaveSession()
    const valEl = document.getElementById('ps-count-val'); if (valEl) valEl.textContent = _psQCount
    const listEl = document.getElementById('ps-list')
    if (listEl) listEl.innerHTML = _psCurrentItems.length
      ? _psRowsHtml()
      : '<div style="text-align:center;padding:1.5rem 1rem;"><p class="text-secondary text-xs mb-0">No 🚧 In-Progress or ✅ Solved questions in this topic yet — mark some, or turn off “Worked-on only”.</p></div>'
  }
}

// Revise + By Pattern only: after a fresh pool is generated, randomly flag ~20% of it as
// "actually code this one" — a spot-check against fooling yourself with recall alone. Re-rolled
// on every regeneration (Refresh, mode switch, pattern change); a mere restore-from-storage does
// NOT re-roll, so the flagged set stays stable across a page refresh until you actually regenerate.
function _psPickReviseCodeFlags() {
  _psReviseCodeFlagged = new Set()
  if (_psMode !== 'revise' && _psMode !== 'revise-pattern') return
  const n = Math.round(_psCurrentItems.length * 0.2)
  if (n <= 0) return
  // _shuffle() mutates its argument in place — shuffle a COPY so this pick doesn't silently
  // reorder (and destroy the weakest-first ranking of) the actual displayed list.
  _shuffle([..._psCurrentItems]).slice(0, n).forEach(([k]) => _psReviseCodeFlagged.add(k))
}
// Shared by Revise + By Pattern: weakest-first ordering over an already-filtered due set.
// ✗ forgot / ~ shaky sink to the top (weighted shuffle within each rank); ✓ solid / never-graded
// fill the rest, capped at `count`.
//
// No-repeat-within-a-cycle: when `count` is capped below the full due-set (manual −), a plain
// random slice on every Refresh could hand back overlapping subsets by chance, or leave some due
// questions unshown all day. `_psReviseShownThisSession` tracks keys already surfaced by a Refresh
// since the last full cycle; within each weakness tier, not-yet-shown keys sort before
// already-shown ones, so repeated Refreshes work through the WHOLE due-set before anything repeats.
// Once every current due key has been shown, the tracker resets so the next cycle can begin.
// (When count >= due.length nothing is capped, so this never changes what's visible.)
function _psRankedRevisePool(due, count) {
  if (due.length && due.every(([k]) => _psReviseShownThisSession.has(k))) {
    _psReviseShownThisSession.clear()
  }
  const unseen  = ([k]) => !_psReviseShownThisSession.has(k)
  const seenCmp = (a, b) => (unseen(a) === unseen(b) ? 0 : unseen(a) ? -1 : 1)
  const rank = k => ({ forgot: 0, shaky: 1 }[getRevise(k)?.grade] ?? 2)
  const weak = _weightedShuffle(due.filter(([k]) => rank(k) < 2))
    .sort((a, b) => (rank(a[0]) - rank(b[0])) || seenCmp(a, b))
  const rest = _shuffle(due.filter(([k]) => rank(k) === 2)).sort(seenCmp)
  const picked = [...weak, ...rest].slice(0, count)
  picked.forEach(([k]) => _psReviseShownThisSession.add(k))
  return picked
}
// ── Per-topic mode helpers (Worked / Graded / Mock / Revise / By Pattern) ─────
// Worked/Graded/Mock decide WHICH of this topic's questions you solve, and in what order —
// click a row = solved (sinks). Revise/By Pattern are different: an active-recall pass, not a
// solve — grade ✓/~/✗ right on the row (see _buildReviseItem / _psRecallGrade).
function _psModePool(topicKey, count) {
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return []
  if (_psMode === 'graded') {
    // Graded ignores the cooldown — your grade is the single source of truth (a clean solve
    // re-grades the question ✓ solid, and THAT is what sinks it). ✗ forgot /
    // ~ shaky ALWAYS appear; ✓ solid only rejoins once its REVISE_LADDER interval is up
    // (isReviseDue), and `count` caps how many of those due-solid rows pad the list after them.
    const graded    = Object.entries(mod.questions).filter(([k]) => getRevise(k))
    const rank      = k => ({ forgot: 0, shaky: 1 }[getRevise(k).grade] ?? 2)
    const weak      = _weightedShuffleByImpact(graded.filter(([k]) => rank(k) < 2)).sort((a, b) => rank(a[0]) - rank(b[0]))
    const solid     = _weightedShuffleByImpact(graded.filter(([k]) => rank(k) === 2 && isReviseDue(k)))
    const solidFill = Math.max(0, count - weak.length)
    return [...weak, ...solid.slice(0, solidFill)]
  }
  if (_psMode === 'revise') {
    // Revise = active recall, not solving. Due set from the WHOLE topic — anything engaged
    // (solved, started, or already graded) whose REVISE_LADDER interval is up.
    // ✗ forgot / ~ shaky sink to the top — those are the ones actually worth re-testing first.
    const due = Object.entries(mod.questions).filter(([k]) => isReviseDue(k))
    return _psRankedRevisePool(due, count)
  }
  if (_psMode === 'revise-pattern') {
    // By Pattern = same active-recall pass as Revise, but scoped to only the pattern(s) selected
    // in _psRevisePatterns. No selection → empty pool (the UI prompts you to pick a pattern; this
    // mode is never "the whole topic" — that's what plain Revise is for).
    if (!_psRevisePatterns.size || !mod.patterns) return []
    // Uses each pattern's own questionIds list — NOT templateRefs on the question — because some
    // modules (e.g. sliding-window) key templateRefs to a separate T1/T2 template scheme, while
    // pattern.questionIds is always the authoritative per-pattern membership list.
    const allowed = new Set()
    mod.patterns.filter(p => _psRevisePatterns.has(p.id)).forEach(p => (p.questionIds || []).forEach(k => allowed.add(k)))
    const due = Object.entries(mod.questions).filter(([k]) => allowed.has(k) && isReviseDue(k))
    return _psRankedRevisePool(due, count)
  }
  if (_psMode === 'recent') {
    // Recent = a read-only, newest-first log of what you graded in Graded/By Pattern — a place
    // to glance back at what you just practiced, not another pool to solve or grade from.
    const seen = new Set()
    const pool = []
    for (const e of getRecentLog()) {
      if (seen.has(e.lcKey)) continue
      seen.add(e.lcKey)
      const q = mod.questions[e.lcKey]
      if (q) pool.push([e.lcKey, q])
      if (pool.length >= count) break
    }
    return pool
  }
  // Worked/Mock still drop questions on cooldown (solved & resting).
  const all = Object.entries(mod.questions).filter(([k]) => !_onCooldown(k))
  if (_psMode === 'mock') {
    // Random mixed set from this topic; difficulty hidden + timed (a mini interview run).
    return _shuffle(all).slice(0, count)
  }
  // worked = questions you've started/solved (🚧/✅)
  const base      = all.filter(([k]) => getStatus(k) !== 'Pending')
  // Weakest first: ✗ forgot → ~ shaky → ✓ confident → rest.
  return _orderByWeakness(_orderPracticePool(base)).slice(0, count)
}
// Worked/Graded/Mock render solve-rows (click a row = solved); Revise renders grade-rows
// (✓/~/✗ recall buttons, no click-to-solve).
function _psRowsHtml() {
  if (_psMode === 'recent') return _psCurrentItems.map((item, i) => _buildRecentItem(item, i)).join('')
  // Graded + By Pattern both render as grade-rows: ✓/~/✗ right on the row, jump button,
  // and a 🔗 link to your saved submission if you have one.
  return _psCurrentItems.map((item, i) => _buildReviseItem(item, i, 'ps')).join('')
}
function _psEmptyMsg() {
  if (_psClearedTopics.has(currentTopicKey)) return 'Set cleared — pick a count and hit ▶ Generate to build a new one.'
  if (_psMode === 'graded') return 'You haven’t graded any questions in this topic yet — grade them with the 🧠 ✓/~/✗ chip on the cards.'
  if (_psMode === 'recent') return 'Nothing graded yet in Graded or By Pattern for this topic — practice a set to build your log.'
  return _psRevisePatterns.size ? 'Nothing due for the selected pattern(s) right now — come back later.' : 'Select one or more patterns above to build a revise set.'
}
function _renderPracticePanel() {
  const mod = TOPIC_MODULES[currentTopicKey]
  const body = document.getElementById('ps-body')
  if (mod && body) body.innerHTML = _buildPracticePanel(currentTopicKey, mod)
}
// Switch per-topic mode → regenerate for that mode and re-render the whole panel.
function _psSetMode(mode, topicKey) {
  if (_psTimerRun) return  // don't switch mid-timed-run
  if (_psMode === mode) return
  _psMode = mode
  _psMockReveal = false
  _psClearedTopics.delete(topicKey)   // a mode switch regenerates, so the topic is no longer 'cleared'
  _stopTimer()
  _psDoneThisSession.clear(); _psStruggledThisSession.clear()
  _psReviseShownThisSession.clear()  // fresh recall-rotation memory on every mode switch
  const total = Object.keys(TOPIC_MODULES[topicKey].questions).length
  if (mode === 'graded') {
    // Graded always lands empty — pick a count and hit Generate. Keeps the count you last
    // typed/set (seedCount) as the pre-filled value, it just doesn't auto-populate.
    _psCurrentItems = []
  } else {
    // Every mode — including Revise / By Pattern — seeds from the SAME count you last set: if you
    // set 10, Revise shows 10, not every due question in the topic. Use "All" to see everything due
    // at once. (Revise's own no-repeat-within-a-cycle logic in _psRankedRevisePool means repeated
    // Refreshes still work through the WHOLE due-set over time instead of the same 10 every time.)
    const seedCount = _psQCount
    _psCurrentItems = _psModePool(topicKey, Math.max(1, Math.min(seedCount, total)))
    _psQCount = _psCurrentItems.length || seedCount
  }
  _psPickReviseCodeFlags()
  // Save BEFORE rendering — with an empty pool, the panel build restores from storage,
  // which must already hold the new mode (not the old session).
  _psSaveSession()
  _renderPracticePanel()
}
// 'revise-pattern' mode only: toggle which pattern(s) (P1, P2…) scope the due-set. Regenerates
// the pool immediately, same as switching mode.
function _psToggleRevisePattern(patternId, topicKey) {
  if (_psTimerRun) return  // don't reshuffle mid-timed-run
  if (_psRevisePatterns.has(patternId)) _psRevisePatterns.delete(patternId)
  else _psRevisePatterns.add(patternId)
  _psRevisePatternsShuffle(topicKey)
}
function _psSetRevisePatterns(ids, topicKey) {
  if (_psTimerRun) return
  _psRevisePatterns = new Set(ids)
  _psRevisePatternsShuffle(topicKey)
}
// Shared by both: a pattern-scope change regenerates at your current count (same as any other
// Refresh) — it does NOT reset to "show everything," since the count is meant to stay exactly
// what you set it to across mode/scope changes. Use "All" to see the full due-set for the scope.
function _psRevisePatternsShuffle(topicKey) {
  _psReviseShownThisSession.clear()  // scope changed — fresh recall-rotation memory for the new due-set
  _psShuffle(topicKey)
  _renderPracticePanel()
}
// Reveal hidden difficulty on a per-topic Mock for the post-mortem.
function _psRevealMock() {
  _psMockReveal = true
  _psSaveSession()
  const listEl = document.getElementById('ps-list')
  if (listEl) listEl.innerHTML = _psRowsHtml()
  const btn = document.getElementById('ps-reveal-btn')
  if (btn) btn.style.display = 'none'
}


// Grade a row in the per-topic Revise mode: same active-recall grading as the dashboard Revise
// Session, scoped to this topic. Rows stay in place on grade — tinted + the chosen button
// highlighted — so the list is a record of today's session, not a sweep.
function _psRecallGrade(ev, lcKey, grade) {
  ev.stopPropagation()
  gradeRevise(lcKey, grade)
  logRecent(lcKey, grade)
  // ✓ Solid in GRADED specifically (not By Pattern — that stays pure recall) gets full "clean
  // solve" credit, same as the old click-to-solve: push the code-cooldown ladder further out and
  // mark the question Solved. gradeRevise() already bumped the confidence ring for a solid grade.
  if (grade === 'solid' && _psMode === 'graded') _psCreditCleanSolve(lcKey)
  _psDoneThisSession.add(lcKey)
  _psSaveSession()
  const listEl = document.getElementById('ps-list')
  if (!listEl) return
  const idx = _psCurrentItems.findIndex(([k]) => k === lcKey)
  const row = listEl.querySelector('.ps-q-row[data-lc-key="' + lcKey + '"]')
  if (row && idx !== -1) row.outerHTML = _buildReviseItem(_psCurrentItems[idx], idx, 'ps')
  const ungraded = _psCurrentItems.filter(([k]) => !_psDoneThisSession.has(k)).length
  if (ungraded === 0 && !listEl.querySelector('.ps-session-done')) {
    listEl.insertAdjacentHTML('afterbegin', '<div class="ps-session-done">🧠 Recall sweep complete · <span style="color:var(--green)">' + _psDoneThisSession.size + ' graded</span></div>')
  }
}

function _psShuffle(topicKey) {
  const mod = TOPIC_MODULES[topicKey]
  if (!mod) return
  _stopTimer()
  _psClearedTopics.delete(topicKey)

  // Save which keys were done this session BEFORE clearing, so we can push
  // them to the bottom of the new set — they've been practiced already today.
  const prevDone = new Set(_psDoneThisSession)
  _psDoneThisSession.clear(); _psStruggledThisSession.clear()

  const count = Math.max(1, Math.min(_psQCount, Object.keys(mod.questions).length))
  const generated = _psModePool(topicKey, count)

  if (_psMode === 'worked') {
    // Worked: questions NOT done this session appear first, done ones at bottom.
    const fresh = generated.filter(([k]) => !prevDone.has(k))
    const done  = generated.filter(([k]) =>  prevDone.has(k))
    _psCurrentItems = [...fresh, ...done]
  } else {
    // Graded = weakest-first · Mock = random — keep _psModePool's order.
    _psCurrentItems = generated
  }

  _psQCount = _psCurrentItems.length
  _psPickReviseCodeFlags()
  _psSaveSession()  // Persist the new session

  _psSyncCountDisplay(_psQCount)
  const listEl = document.getElementById('ps-list')
  if (!listEl) return
  listEl.innerHTML = _psCurrentItems.length
    ? _psRowsHtml()
    : '<p class="text-secondary text-xs mb-0">' + _psEmptyMsg() + '</p>'
}

// ── Solve-count ring helpers ──────────────────────────────────────────────────
// 15-rung confidence ladder — one emoji per solve (1→14), GOD MODE locked at 15+.
// Plain emoji, elemental → cosmic climb.
const HERO_TIERS = [
  { name: 'Spark',       emoji: '✨' },
  { name: 'Flame',       emoji: '🔥' },
  { name: 'Bolt',        emoji: '⚡' },
  { name: 'Frost',       emoji: '❄️' },
  { name: 'Tide',        emoji: '🌊' },
  { name: 'Gale',        emoji: '🌪️' },
  { name: 'Stone',       emoji: '🪨' },
  { name: 'Storm',       emoji: '⛈️' },
  { name: 'Molten',      emoji: '🌋' },
  { name: 'Crystal',     emoji: '💎' },
  { name: 'Plasma',      emoji: '🔮' },
  { name: 'Solar',       emoji: '☀️' },
  { name: 'Nova',        emoji: '🌟' },
  { name: 'Eclipse',     emoji: '🌑' },
  { name: 'Singularity', emoji: '🌌' },   // GOD MODE — 15+, locked
]
// Solve count → tier index (1..15). One emoji per solve up to 14; 15+ stays the god tier.
function _heroTier(n) { return n <= 0 ? 0 : Math.min(n, HERO_TIERS.length) }

function _solveRingCls(n) {
  if (n >= 15) return 'solve-ring-diamond'   // god mode
  if (n >= 10) return 'solve-ring-gold'
  if (n >= 6)  return 'solve-ring-silver'
  if (n >= 3)  return 'solve-ring-bronze'
  return 'solve-ring-dim'
}

// The emoji shown in the ring for the current rank.
function _solveRingEmoji(n) {
  const t = _heroTier(n)
  if (t === 0) return '○'
  return HERO_TIERS[t - 1].emoji
}
function _solveRingTier(n) {
  const t = _heroTier(n)
  if (t === 0) return 'Not solved yet'
  const h = HERO_TIERS[t - 1]
  return (t === HERO_TIERS.length ? '🔒 GOD MODE · ' : 'Rank ' + t + ' · ') + h.name
}
// Ring tooltip: confidence rank + the exact solve count.
function _solveRingTitle(n) {
  return _solveRingTier(n) + ' · ' + n + ' solve' + (n === 1 ? '' : 's')
}

function _adjSolveCount(lcKey, delta) {
  const counts = JSON.parse(localStorage.getItem(SOLVE_COUNT_KEY) || '{}')
  counts[lcKey] = Math.max(0, (counts[lcKey] || 0) + delta)
  localStorage.setItem(SOLVE_COUNT_KEY, JSON.stringify(counts))
  const n = counts[lcKey]
  const ring = document.querySelector('[data-solve-key="' + lcKey + '"]')
  if (ring) {
    ring.className   = 'solve-ring ' + _solveRingCls(n)
    ring.innerHTML   = _solveRingEmoji(n) + '<span class="solve-ring-num">' + n + '</span>'
    ring.title       = _solveRingTitle(n)
  }
}

// Mark a practice row as solved IN PLACE — flash the outcome style but keep the row where it is
// (completed questions stay put; they no longer slide to the bottom). Then run onSettled(list).
function _markRowSolved(rowEl, outcomeCls, onSettled) {
  rowEl.classList.add(outcomeCls)
  const list = rowEl.parentElement
  if (onSettled && list) onSettled(list)
}

// A solve deliberately does NOT touch the REVISE grade — you may have peeked at the answer
// while coding, so recall grades are only ever set by hand via the ✓/~/✗ buttons (gradeRevise
// is the sole writer). The solve still clears the "re-code me" force flag: that flag queued
// the question for a cold solve, and the solve is what discharges it. Live-updates the
// revise control on the question card if it happens to be on screen.
function _refreshReviseOnSolve(lcKey) {
  setCodeForced(lcKey, false)
  _refreshReviseCtrl(lcKey)
  _refreshReviseGradeBadges(lcKey)
  _refreshDueCounts()
}

// Handle click on a practice row: a clean solve — credit a solve, expand the review interval, mark solved in place.
function _psRowClick(event, lcKey) {
  // Ignore clicks on the link, pin, or struggle button — they already stopPropagation
  if (event.target.classList.contains('ps-q-link')) return

  const rowEl = event.currentTarget
  if (!rowEl) return

  // Prevent double-counting if already done this session
  if (_psDoneThisSession.has(lcKey)) return
  _psDoneThisSession.add(lcKey)

  // Clean solve: mark practiced + push the review interval one step further out
  markPracticed(lcKey)
  bumpReviewInterval(lcKey)

  const newCount = incSolveCount(lcKey)

  // Update solve ring on the main accordion item if visible
  const acRing = document.querySelector('[data-solve-key="' + lcKey + '"]')
  if (acRing) {
    acRing.className = 'solve-ring ' + _solveRingCls(newCount)
    acRing.innerHTML = _solveRingEmoji(newCount) + '<span class="solve-ring-num">' + newCount + '</span>'
    acRing.title     = _solveRingTitle(newCount)
  }
  _refreshReviseOnSolve(lcKey)

  // Completing a practice question marks it ✅ Solved (e.g. In Progress → Completed).
  if (getStatus(lcKey) !== 'Solved') setQuestionStatus(lcKey, 'Solved')
  const stBadge = rowEl.querySelector('.ps-status-badge')
  if (stBadge) { stBadge.className = 'badge ' + STATUS_DOT.Solved + ' q-badge flex-shrink-0 ps-status-badge'; stBadge.textContent = STATUS_EMOJI.Solved }

  // Persist session state after marking as done
  _psSaveSession()

  _markRowSolved(rowEl, 'ps-q-solved', () => {
    // Show session-complete banner if every question in this set is done
    if (_psCurrentItems.length > 0 && _psDoneThisSession.size >= _psCurrentItems.length) {
      _psShowSessionComplete()
    }
  })
}


// Show a compact banner at the top of ps-list when all session questions are done.
function _psShowSessionComplete() {
  const listEl = document.getElementById('ps-list')
  if (!listEl || listEl.querySelector('.ps-session-done')) return
  const total = _psDoneThisSession.size
  let msg = '✅ Session complete · <span style="color:var(--green)">' + total + ' solved</span>'
  listEl.insertAdjacentHTML('afterbegin', '<div class="ps-session-done">' + msg + '</div>')
}

function _qpShowSessionComplete() {
  const listEl = document.getElementById('qp-results')
  if (!listEl || listEl.querySelector('.ps-session-done')) return
  const total = _qpDoneThisSession.size
  let msg = '✅ Session complete · <span style="color:var(--green)">' + total + ' solved</span>'
  listEl.insertAdjacentHTML('afterbegin', '<div class="ps-session-done">' + msg + '</div>')
}

// ─── DASHBOARD ROW CLICK HANDLERS ────────────────────────────────────────────
// Dashboard QP handlers use _qpDoneThisSession so that topic navigation never clears QP state.

// After a dashboard row is marked solved, re-sync results order to the DOM and maybe show the complete banner.
function _qpAfterRowSettled(list) {
  // Sync _qpResults order to match DOM so navigating back restores positions
  if (_qpResults) {
    const qMap = Object.fromEntries(_qpResults)
    _qpResults = Array.from(list.querySelectorAll('.ps-q-row[data-lc-key]'))
      .map(r => { const k = r.getAttribute('data-lc-key'); return k && qMap[k] ? [k, qMap[k]] : null })
      .filter(Boolean)
    _saveQpState()
  }
  if (_qpResults && _qpResults.length > 0 && _qpDoneThisSession.size >= _qpResults.length) {
    _qpShowSessionComplete()
  }
}

function _qpRowClick(event, lcKey) {
  if (event.target.classList.contains('ps-q-link')) return
  const rowEl = event.currentTarget
  if (!rowEl) return
  if (_qpDoneThisSession.has(lcKey)) return
  _qpDoneThisSession.add(lcKey)
  markPracticed(lcKey)
  bumpReviewInterval(lcKey)
  const newCount = incSolveCount(lcKey)
  const acRing = document.querySelector('[data-solve-key="' + lcKey + '"]')
  if (acRing) {
    acRing.className = 'solve-ring ' + _solveRingCls(newCount)
    acRing.innerHTML = _solveRingEmoji(newCount) + '<span class="solve-ring-num">' + newCount + '</span>'
    acRing.title     = _solveRingTitle(newCount)
  }
  _refreshReviseOnSolve(lcKey)
  // Completing a practice question marks it ✅ Solved (e.g. In Progress → Completed).
  if (getStatus(lcKey) !== 'Solved') setQuestionStatus(lcKey, 'Solved')
  const stBadge = rowEl.querySelector('.ps-status-badge')
  if (stBadge) { stBadge.className = 'badge ' + STATUS_DOT.Solved + ' q-badge flex-shrink-0 ps-status-badge'; stBadge.textContent = STATUS_EMOJI.Solved }
  _markRowSolved(rowEl, 'ps-q-solved', _qpAfterRowSettled)
}


// ── Timer controls ────────────────────────────────────────────────────────────
function _psTimerSet(mins, btn) {
  _stopTimer()
  _psTimerPreset = mins
  _psTimerTotal  = mins * 60
  _psTimerRem    = _psTimerTotal
  // Scope to this panel's timer bar only — avoids clearing dashboard preset buttons
  const bar = btn ? btn.closest('.ps-timer-bar') : null
  if (bar) bar.querySelectorAll('.ps-preset-btn').forEach(b => b.classList.remove('ps-active'))
  if (btn) btn.classList.add('ps-active')
  _syncTimerDisplay()
}

function _psTimerToggle() {
  if (!_psTimerTotal) return   // nothing configured yet
  if (_psTimerRun) {
    _stopTimer()
  } else {
    if (_psTimerRem <= 0) _psTimerRem = _psTimerTotal
    _psTimerRun = true
    const btn = document.getElementById('ps-timer-play')
    if (btn) btn.textContent = '⏸'
    _psTimerIv = setInterval(_psTimerTick, 1000)
    // Lock count controls while session is running
    ;['ps-btn-dec','ps-btn-inc','ps-btn-all'].forEach(id => { const b = document.getElementById(id); if (b) { b.disabled = true } })
  }
}

function _stopTimer() {
  if (_psTimerIv) { clearInterval(_psTimerIv); _psTimerIv = null }
  _psTimerRun = false
  const btn = document.getElementById('ps-timer-play')
  if (btn) btn.textContent = '▶'
  // Re-enable count controls when timer is stopped/reset
  ;['ps-btn-dec','ps-btn-inc','ps-btn-all'].forEach(id => { const b = document.getElementById(id); if (b) { b.disabled = false } })
}

function _psTimerReset() {
  _stopTimer()
  _psTimerRem = _psTimerTotal
  const disp = document.getElementById('ps-timer-disp')
  if (disp) disp.classList.remove('ps-expired', 'ps-running')
  _syncTimerDisplay()
}

function _psTimerTick() {
  if (_psTimerRem <= 0) {
    _stopTimer()
    _psTimerRem = 0
    const disp = document.getElementById('ps-timer-disp')
    if (disp) { disp.textContent = '00:00'; disp.className = 'ps-timer-display ps-expired' }
    return
  }
  _psTimerRem--
  _syncTimerDisplay()
}

function _syncTimerDisplay() {
  const disp = document.getElementById('ps-timer-disp')
  if (!disp) return
  const secs = _psTimerRem || _psTimerTotal
  disp.textContent = _fmtTimer(secs)
  disp.className = 'ps-timer-display' +
    (_psTimerRun ? ' ps-running' : '') +
    (!secs && _psTimerTotal > 0 ? ' ps-expired' : '')
}

// ─── QUICK PRACTICE (Dashboard) ───────────────────────────────────────────────

function _renderQuickPractice() {
  const el = document.getElementById('quick-practice-panel')
  if (!el) return
  const validTopics = TOPICS.filter(t => TOPIC_MODULES[t.key])

  const _selKeys = _uniqueQuestionKeys(Array.from(_qpTopics))
  const totalQ = _selKeys.size
  const maxQ   = totalQ
  const count  = maxQ ? Math.max(1, Math.min(_qpCount, maxQ)) : _qpCount

  let html = '<div class="card mt-4"><div class="card-body">'
  html += '<div class="d-flex align-items-center gap-2 mb-3">'
  html += '<span class="icon-xl">🎲</span>'
  html += '<h6 class="mb-0 fw-semibold">Quick Practice</h6>'
  html += '<span class="text-secondary text-xs mt-1">— pick topics, get a random set</span>'
  html += '</div>'

  // Topic chips
  html += '<div class="d-flex flex-wrap gap-2 mb-3">'
  validTopics.forEach(t => {
    const isActive = _qpTopics.has(t.key)
    html += '<button type="button" class="qp-chip' + (isActive ? ' active' : '') + '" onclick="_qpToggleTopic(\'' + t.key + '\')">' +
      t.icon + ' ' + escHtml(t.label) + '</button>'
  })
  const allSelected = validTopics.every(t => _qpTopics.has(t.key))
  html += '<button type="button" class="qp-chip' + (allSelected ? ' active' : '') + '" onclick="_qpSelectAll()">' +
    (allSelected ? '✓ All' : '+ All') + '</button>'
  html += '</div>'

  // Count + generate row
  const disabled = !_qpMock && !_qpRevised && _qpTopics.size === 0
  const genLabel = _qpMock ? '🎯 Generate Mock' : _qpRevised ? '🕒 Generate Graded' : '🎲 Generate Set'
  html += '<div class="d-flex align-items-center gap-2 flex-wrap">'
  html += '<button type="button" class="ps-count-btn" id="qp-btn-dec" onclick="_qpAdjCount(-1)">−</button>'
  html += '<span class="ps-count-val" id="qp-count-val">' + count + '</span>'
  html += '<button type="button" class="ps-count-btn" id="qp-btn-inc" onclick="_qpAdjCount(1)">+</button>'
  html += '<span class="text-secondary text-xs">questions</span>'
  if (maxQ && !_qpMock && !_qpRevised) html += '<span class="text-faint text-xxs">(max&nbsp;' + maxQ + ' from selected)</span>'
  html += '<button type="button" class="ps-shuffle-btn ms-2"' + (disabled ? ' disabled' : '') + ' onclick="_qpGenerate()">' + genLabel + '</button>'
  html += '<button type="button" class="qp-chip ms-1" id="qp-btn-clear"' + (_qpResults && _qpResults.length ? '' : ' disabled') + ' onclick="_qpClear()" title="Remove every question from the list and start from an empty state (your grades and progress are kept)">🗑 Clear</button>'
  html += '<button type="button" class="qp-chip' + (_qpRevised ? ' active' : '') + ' ms-1" onclick="_qpToggleRevised()" title="Graded — solve the questions you have graded on the cards; ranked ✗ forgot → ~ shaky → ✓ confident">🕒 Graded</button>'
  html += '</div>'

  if (_qpRevised) {
    html += '<div class="qp-mock-note mt-2">🕒 <strong>Graded:</strong> the questions you’ve graded on the cards, ranked ✗ forgot → ~ shaky → ✓ confident. Solve them — click a row when done. Leave topics empty to span all.</div>'
  }

  // Timer bar (mirrors per-topic timer)
  const qpTimerDisp = _fmtTimer(_qpTimerRem || _qpTimerTotal)
  html += '<div class="ps-timer-bar mt-2">'
  html += '<span class="text-secondary text-xs flex-shrink-0">⏱ Timer:</span>'
  html += '<button type="button" class="ps-preset-btn' + (_qpTimerPreset===5  ? ' ps-active':'') + '" onclick="_qpTimerSet(5,this)">5m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_qpTimerPreset===10 ? ' ps-active':'') + '" onclick="_qpTimerSet(10,this)">10m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_qpTimerPreset===20 ? ' ps-active':'') + '" onclick="_qpTimerSet(20,this)">20m</button>'
  html += '<button type="button" class="ps-preset-btn' + (_qpTimerPreset===30 ? ' ps-active':'') + '" onclick="_qpTimerSet(30,this)">30m</button>'
  html += '<span class="ps-timer-display' + (_qpTimerRun ? ' ps-running' : '') + (_qpTimerRem===0 && _qpTimerTotal>0 ? ' ps-expired':'') + '" id="qp-timer-disp">' + qpTimerDisp + '</span>'
  html += '<button type="button" class="ps-timer-ctrl" id="qp-timer-play" onclick="_qpTimerToggle()" title="Start / Pause">' + (_qpTimerRun ? '⏸' : '▶') + '</button>'
  html += '<button type="button" class="ps-timer-ctrl" onclick="_qpTimerReset()" title="Reset timer">↺</button>'
  html += '</div>'

  // Results
  html += '<div id="qp-results" class="mt-3"></div>'
  html += '</div></div>'
  el.innerHTML = html

  // Restore previous results if available (preserves solved styling via _qpDoneThisSession)
  if (_qpResults && _qpResults.length > 0) {
    document.getElementById('qp-results').innerHTML =
      _qpRowsHtml()
    // Restore session-complete banner if the full set was already finished
    if (_qpDoneThisSession.size >= _qpResults.length) (_qpRevised ? _qpReviseShowComplete : _qpShowSessionComplete)()
  } else {
    // Nothing generated yet — selecting a topic or toggling Graded/Mock only sets up what
    // WILL be generated; without this, the results area just looks blank/broken.
    const resultsEl = document.getElementById('qp-results')
    if (resultsEl) {
      resultsEl.innerHTML = '<p class="text-secondary text-xs mb-0">' + (disabled
        ? 'Pick at least one topic above, then generate your set.'
        : 'Click “' + genLabel + '” above to generate your set.') + '</p>'

  }
  // Re-apply +/- lock if timer was running when we navigated away
  if (_qpTimerRun) {
    const dec = document.getElementById('qp-btn-dec')
    const inc = document.getElementById('qp-btn-inc')
    if (dec) dec.disabled = true
    if (inc) inc.disabled = true
  }
}

// Keep 🗑 Clear enabled only while there is a list to clear.
function _qpSyncClearBtn() {
  const b = document.getElementById('qp-btn-clear')
  if (b) b.disabled = !(_qpResults && _qpResults.length)
}
// 🗑 Clear: drop the generated set and return the dashboard to its empty state. Topic chips, the
// count and the Graded toggle stay so one click regenerates; grades/statuses/solve counts are
// untouched (they're stored per question, not per set).
function _qpClear() {
  if (!_qpResults || !_qpResults.length) return
  const graded = _qpResults.filter(([k]) => _qpDoneThisSession.has(k)).length
  if (graded && !confirm('Clear this set? ' + graded + ' graded row' + (graded === 1 ? '' : 's') + ' will disappear from the list (your grades are kept).')) return
  _qpStopTimer()
  _qpTimerRem = _qpTimerTotal
  _qpResults = null
  _qpMockReveal = false
  _qpDoneThisSession.clear(); _qpStruggledThisSession.clear()
  _saveQpState()
  _renderQuickPractice()
}

function _qpToggleTopic(key) {
  if (_qpTimerRun) return  // don't change topic selection mid-session
  if (_qpTopics.has(key)) _qpTopics.delete(key); else _qpTopics.add(key)
  _qpResults = null  // clear stale results when topic selection changes
  _saveQpState()
  _renderQuickPractice()
}

function _qpSelectAll() {
  if (_qpTimerRun) return  // don't change topic selection mid-session
  const validTopics = TOPICS.filter(t => TOPIC_MODULES[t.key])
  const allSelected = validTopics.every(t => _qpTopics.has(t.key))
  if (allSelected) {
    _qpTopics.clear()
  } else {
    validTopics.forEach(t => _qpTopics.add(t.key))
  }
  _qpResults = null
  _saveQpState()
  _renderQuickPractice()
}

function _qpAdjCount(delta) {
  if (_qpTimerRun) return  // locked while timer is running
  const maxQ = _uniqueQuestionKeys(Array.from(_qpTopics)).size
  _qpCount = Math.max(1, Math.min(maxQ || 99, _qpCount + delta))
  const el = document.getElementById('qp-count-val')
  if (el) el.textContent = _qpCount

  // If results already exist, do smart add/remove instead of resetting
  if (!_qpResults || _qpResults.length === 0) return
  // Mock (all-topics, hidden) and Revise (revise-due, weakness-ordered) have special pools the
  // smart add/remove below doesn't understand — regenerate cleanly at the new count instead.
  if (_qpMock || _qpRevise || _qpRevised) { _qpGenerate(); return }

  const currentCount = _qpResults.length
  if (_qpCount > currentCount) {
    // Add more from the remaining pool (respect dueOnly filter)
    const currentKeys = new Set(_qpResults.map(([k]) => k))
    const pool = []
    _qpTopics.forEach(key => {
      const mod = TOPIC_MODULES[key]
      if (mod) Object.entries(mod.questions).forEach(([k, q]) => {
        if (currentKeys.has(k)) return
        if (_onCooldown(k)) return   // solved & resting
        if (_practiceWorkedOnly && getStatus(k) === 'Pending') return
        pool.push([k, q])
      })
    })
    const toAdd = _orderPracticePool(pool).slice(0, _qpCount - currentCount)
    _qpResults = [..._qpResults, ...toAdd]
  } else if (_qpCount < currentCount) {
    // Remove from end, skip done-in-session items first
    const toRemove = currentCount - _qpCount
    const newResults = [..._qpResults]
    let removed = 0
    for (let i = newResults.length - 1; i >= 0 && removed < toRemove; i--) {
      if (!_qpDoneThisSession.has(newResults[i][0])) { newResults.splice(i, 1); removed++ }
    }
    for (let i = newResults.length - 1; i >= 0 && removed < toRemove; i--) {
      newResults.splice(i, 1); removed++
    }
    _qpResults = newResults
  }

  // Sync count display to actual list length and re-render
  if (el) el.textContent = _qpResults.length
  _saveQpState()
  const resultsEl = document.getElementById('qp-results')
  if (resultsEl) {
    resultsEl.innerHTML = _qpRowsHtml()
    // Only show session-complete if every question currently in the list is done
    // (not just because count was reduced below the done count)
    const doneInCurrentResults = _qpResults.filter(([k]) => _qpDoneThisSession.has(k)).length
    if (doneInCurrentResults > 0 && doneInCurrentResults >= _qpResults.length) _qpShowSessionComplete()
  }
}

function _qpGenerate() {
  const allTopics = TOPICS.filter(t => TOPIC_MODULES[t.key]).map(t => t.key)
  // Worked needs a topic selected; Mock & Graded can sweep all topics on their own.
  if (!_qpMock && !_qpRevised && _qpTopics.size === 0) return
  if (_qpTimerRun) return  // don't reset session while timer is running
  _qpMockReveal = false    // a freshly generated set always starts hidden

  // Pool topics: Mock = all · Graded = selected (or all if none) · Worked = selected.
  const poolTopics = _qpMock ? allTopics
                   : (_qpTopics.size ? Array.from(_qpTopics) : (_qpRevised ? allTopics : []))
  const seen = new Set()
  const pool = []
  poolTopics.forEach(key => {
    const mod = TOPIC_MODULES[key]
    if (!mod) return
    Object.entries(mod.questions).forEach(([k, q]) => {
      if (seen.has(k)) return  // dedup
      seen.add(k)
      if (!_qpRevised && _onCooldown(k)) return                         // solved & resting — hidden until due again (Graded ignores it: your grade + the revise ladder decide, same as per-topic Graded)
      if (_qpRevised) {
        if (!getRevise(k)) return                                       // Graded: only problems you've graded
        if (_weaknessRank(k) === 2 && !isReviseDue(k)) return            // ✓ solid: wait for the ladder before resurfacing
      } else if (!_qpMock) {
        if (_practiceWorkedOnly && getStatus(k) === 'Pending') return   // Worked: skip untouched 📋 Pending
      }
      pool.push([k, q])
    })
  })

  const maxQ  = pool.length
  if (maxQ === 0) {
    const el = document.getElementById('qp-results')
    if (el) el.innerHTML = '<p class="text-secondary text-xs mt-2 mb-0">' + (_qpRevised ? "You haven't graded any problems yet — grade them with the 🧠 ✓/~/✗ chip on the question cards." : _practiceWorkedOnly ? 'No 🚧 In-Progress or ✅ Solved questions in the selected topics yet — mark some, or turn off “Worked-on only”.' : 'No questions found.') + '</p>'
    _qpResults = []
    _qpSyncClearBtn()
    return
  }
  const count = Math.max(1, Math.min(_qpCount, maxQ))

  // Snapshot done-this-session BEFORE clearing, so previously solved questions
  // land at the bottom of the new set instead of back at the top.
  const prevDone = new Set(_qpDoneThisSession)
  _qpDoneThisSession.clear(); _qpStruggledThisSession.clear()

  // Graded: ✗ forgot / ~ shaky NEVER get cut by the count cap (only ✓ solid padding is capped), weighted
  // by interview frequency so limited practice time goes to your weakest AND highest-impact problems.
  // Other modes go weakest-first (✗ forgot → ~ shaky → ✓ confident → rest); Mock stays random.
  let generated
  if (_qpRevised) {
    const weak      = _weightedShuffleByImpact(pool.filter(([k]) => _weaknessRank(k) < 2)).sort((a, b) => _weaknessRank(a[0]) - _weaknessRank(b[0]))
    const solid     = _weightedShuffleByImpact(pool.filter(([k]) => _weaknessRank(k) === 2))
    generated = [...weak, ...solid.slice(0, Math.max(0, count - weak.length))]
  } else {
    generated = (_qpMock ? _orderPracticePool(pool) : _orderByWeakness(_orderPracticePool(pool))).slice(0, count)
  }

  const fresh = generated.filter(([k]) => !prevDone.has(k))
  const done  = generated.filter(([k]) =>  prevDone.has(k))
  _qpResults = [...fresh, ...done]
  _saveQpState()

  // Lock +/- while timer is running
  if (_qpTimerRun) {
    const dec = document.getElementById('qp-btn-dec')
    const inc = document.getElementById('qp-btn-inc')
    if (dec) dec.disabled = true
    if (inc) inc.disabled = true
  }

  const el = document.getElementById('qp-results')
  if (el) el.innerHTML = _qpRowsHtml()
  // Sync _qpCount and display to actual result length (pool may be smaller than requested)
  _qpCount = _qpResults.length
  const countEl = document.getElementById('qp-count-val')
  if (countEl) countEl.textContent = _qpResults.length
  _qpSyncClearBtn()
}

function _qpToggleDueOnly() {
  _qpDueOnly = !_qpDueOnly
  _qpResults = null
  // Clear session state too — the pool is changing so done state against
  // the old set is meaningless and would pollute the next generated set's prevDone snapshot
  _qpDoneThisSession.clear(); _qpStruggledThisSession.clear()
  _saveQpState()
  _renderQuickPractice()
}

function _qpToggleMock() {
  if (_qpTimerRun) return  // don't flip modes mid-timed-run
  _qpMock = !_qpMock
  if (_qpMock) { _qpRevise = false; _qpRevised = false }   // Mock / Revise / Revised are mutually exclusive
  _qpMockReveal = false
  _qpResults = null
  _qpDoneThisSession.clear(); _qpStruggledThisSession.clear()
  _saveQpState()
  _renderQuickPractice()
}

function _qpToggleRevise() {
  if (_qpTimerRun) return
  _qpRevise = !_qpRevise
  if (_qpRevise) { _qpMock = false; _qpRevised = false; _qpMockReveal = false }
  _qpResults = null
  _qpDoneThisSession.clear(); _qpStruggledThisSession.clear()
  _saveQpState()
  _renderQuickPractice()
}

function _qpToggleRevised() {
  if (_qpTimerRun) return
  _qpRevised = !_qpRevised
  if (_qpRevised) { _qpMock = false; _qpRevise = false; _qpMockReveal = false }
  _qpResults = null
  _qpDoneThisSession.clear(); _qpStruggledThisSession.clear()
  _saveQpState()
  _renderQuickPractice()
}

// Reveal the hidden topic/difficulty on a finished mock for the post-mortem.
function _qpRevealMock() {
  _qpMockReveal = true
  const el = document.getElementById('qp-results')
  if (el && _qpResults) el.innerHTML = _qpRowsHtml()
  const btn = document.getElementById('qp-reveal-btn')
  if (btn) btn.style.display = 'none'
}

function _qpToggleWorkedOnly() {
  _practiceWorkedOnly = !_practiceWorkedOnly
  _qpResults = null
  // Pool is changing — done-state against the old set is meaningless for the next prevDone snapshot
  _qpDoneThisSession.clear(); _qpStruggledThisSession.clear()
  _saveQpState()
  _renderQuickPractice()
}

// ── Dashboard timer ───────────────────────────────────────────────────────────
function _qpTimerSet(mins, btn) {
  _qpStopTimer()
  _qpTimerPreset = mins
  _qpTimerTotal  = mins * 60
  _qpTimerRem    = _qpTimerTotal
  // Scope selector to qp timer bar only to avoid conflicting with per-topic preset buttons
  const bar = btn ? btn.closest('.ps-timer-bar') : null
  if (bar) bar.querySelectorAll('.ps-preset-btn').forEach(b => b.classList.remove('ps-active'))
  if (btn) btn.classList.add('ps-active')
  _qpSyncTimerDisplay()
}

function _qpTimerToggle() {
  if (!_qpTimerTotal) return
  if (_qpTimerRun) {
    _qpStopTimer()
  } else {
    if (_qpTimerRem <= 0) _qpTimerRem = _qpTimerTotal
    _qpTimerRun = true
    const btn = document.getElementById('qp-timer-play')
    if (btn) btn.textContent = '⏸'
    _qpTimerIv = setInterval(_qpTimerTick, 1000)
    // Lock count controls while running
    const dec = document.getElementById('qp-btn-dec')
    const inc = document.getElementById('qp-btn-inc')
    if (dec) dec.disabled = true
    if (inc) inc.disabled = true
  }
}

function _qpStopTimer() {
  if (_qpTimerIv) { clearInterval(_qpTimerIv); _qpTimerIv = null }
  _qpTimerRun = false
  const btn = document.getElementById('qp-timer-play')
  if (btn) btn.textContent = '▶'
  const dec = document.getElementById('qp-btn-dec')
  const inc = document.getElementById('qp-btn-inc')
  if (dec) dec.disabled = false
  if (inc) inc.disabled = false
}

function _qpTimerReset() {
  _qpStopTimer()
  _qpTimerRem = _qpTimerTotal
  const disp = document.getElementById('qp-timer-disp')
  if (disp) disp.classList.remove('ps-expired', 'ps-running')
  _qpSyncTimerDisplay()
}

function _qpTimerTick() {
  if (_qpTimerRem <= 0) {
    _qpStopTimer()
    _qpTimerRem = 0
    const disp = document.getElementById('qp-timer-disp')
    if (disp) { disp.textContent = '00:00'; disp.className = 'ps-timer-display ps-expired' }
    return
  }
  _qpTimerRem--
  _qpSyncTimerDisplay()
}

function _qpSyncTimerDisplay() {
  const disp = document.getElementById('qp-timer-disp')
  if (!disp) return
  const secs = _qpTimerRem || _qpTimerTotal
  disp.textContent = _fmtTimer(secs)
  disp.className = 'ps-timer-display' +
    (_qpTimerRun ? ' ps-running' : '') +
    (!secs && _qpTimerTotal > 0 ? ' ps-expired' : '')
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function showView(id) {
  const embed = id === 'view-google' || id === 'view-papers'
  document.body.classList.toggle('embed-view', embed)
  // html has smooth scrolling; a scrolled page would shift the locked frame
  if (embed) { window.scrollTo({ top: 0, behavior: 'instant' }) }
  const views = ['view-dashboard', 'view-topic', 'view-search-results', 'view-google', 'view-papers']
  views.forEach(v => {
    const el = document.getElementById(v)
    if (v === id) {
      el.classList.remove('d-none', 'anim-fade-in')
      void el.offsetWidth // reflow to restart animation
      el.classList.add('anim-fade-in')
    } else {
      el.classList.add('d-none')
    }
  })
}

function escHtml(str) {
  if (!str) return ''
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

// ── DATA BACKUP / RESTORE ────────────────────────────────────────────────────
const BACKUP_KEYS = [
  'dsa-progress-v1',
  'dsa-notes-v1',
  'dsa-topic-notes-v1',
  'dsa-submissions-v1',
  'dsa-pins-v1',   // legacy: pins UI was removed, kept so old pins survive export/import/sync
  'dsa-solve-counts-v1',
  'dsa-seen-v1',
  'dsa-revise-v1',
  'dsa-code-force-v1',
  'dsa-revise-migrated-v1',
  'dsa-recent-log-v1',
  'dsa-last-practiced-v1',
  'dsa-review-interval-v1',
  'dsa-streak-v1',
  'dsa-qp-state-v1',
  'dsa-practice-session-v1',
  'dsa-theme',
  'paper-club-v1'   // written by papers/paper-club.html (same origin), synced with the rest
]

// Cloud sync (shared module in sync.js): reuse the BACKUP_KEYS allowlist.
if (window.DataSync) {
  DataSync.init({
    appId: 'dsa',
    keys: BACKUP_KEYS,
    versionLabel: 'DSA Notebook',
    autoPush: true,                                  // upload a few seconds after each edit
    noiseKeys: ['dsa-streak-v1', 'dsa-theme'],       // rewritten on load / per-device; not "edits"
    maxKeys: ['dsa-solve-counts-v1']                 // on conflict keep the larger count
  })
  DataSync.autoSync()   // runs at most once / 24h if a token is set
}

function exportData() {
  const backup = {}
  BACKUP_KEYS.forEach(key => {
    const val = localStorage.getItem(key)
    if (val !== null) backup[key] = val
  })
  const json = JSON.stringify(backup, null, 2)
  const blob = new Blob([json], { type: 'application/json' })
  const url  = URL.createObjectURL(blob)
  const a    = document.createElement('a')
  a.href     = url
  a.download = `dsa-notebook-backup-${new Date().toISOString().slice(0,10)}.json`
  document.body.appendChild(a)
  a.click()
  document.body.removeChild(a)
  URL.revokeObjectURL(url)
}

function importData(input) {
  const file = input.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = function(e) {
    try {
      const backup = JSON.parse(e.target.result)
      if (typeof backup !== 'object' || Array.isArray(backup)) throw new Error('Invalid backup format')
      // Only restore known keys to avoid arbitrary data injection
      let restored = 0
      BACKUP_KEYS.forEach(key => {
        if (Object.prototype.hasOwnProperty.call(backup, key) && typeof backup[key] === 'string') {
          localStorage.setItem(key, backup[key])
          restored++
        }
      })
      input.value = '' // reset so same file can be re-imported if needed
      alert(`✅ Restored ${restored} data entr${restored === 1 ? 'y' : 'ies'}. The page will now reload.`)
      location.reload()
    } catch (err) {
      input.value = ''
      alert('❌ Import failed: the file does not appear to be a valid DSA Notebook backup.\n\n' + err.message)
    }
  }
  reader.readAsText(file)
}
