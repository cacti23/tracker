<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitGrid</title>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/dayOfYear.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/plugin/isLeapYear.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chroma-js@2.4.2/chroma.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
      --text:#e6edf3;--text-muted:#8b949e;--red-dim:#3d0c0c;--future:#21262d;
      --accent:#58a6ff;--radius:10px;
      --shadow-card:0 4px 24px rgba(0,0,0,.22);--shadow-card-h:0 4px 28px rgba(0,0,0,.28);--shadow-card-exp:0 6px 36px rgba(0,0,0,.38);
      --pk-border:rgba(255,255,255,.22);--pk-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18),0 24px 56px rgba(0,0,0,.6),0 6px 14px rgba(0,0,0,.4);--pk-shadow-h:0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.3),0 36px 72px rgba(0,0,0,.72),0 10px 24px rgba(0,0,0,.45);
      --new-poke-bg:rgba(255,255,255,.08);--hdr-hover:rgba(255,255,255,.04);
    }
    @media(prefers-color-scheme:light){html:not([data-theme="dark"]):root{
        --bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--border:#d0d7de;
        --text:#1f2328;--text-muted:#656d76;--red-dim:#ffd9d9;--future:#eaeef2;--accent:#0969da;
        --shadow-card:0 1px 3px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.07);--shadow-card-h:0 2px 6px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.1);--shadow-card-exp:0 4px 10px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.11);
        --pk-border:rgba(0,0,0,.14);--pk-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.11),0 2px 6px rgba(0,0,0,.07);--pk-shadow-h:0 0 0 1px rgba(0,0,0,.13),0 14px 36px rgba(0,0,0,.17),0 4px 10px rgba(0,0,0,.09);
        --new-poke-bg:var(--surface2);--hdr-hover:rgba(0,0,0,.04);
    }}
    html[data-theme="light"]:root{
      --bg:#f6f8fa;--surface:#fff;--surface2:#f0f3f6;--border:#d0d7de;
      --text:#1f2328;--text-muted:#656d76;--red-dim:#ffd9d9;--future:#eaeef2;--accent:#0969da;
      --shadow-card:0 1px 3px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.07);--shadow-card-h:0 2px 6px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.1);--shadow-card-exp:0 4px 10px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.11);
      --pk-border:rgba(0,0,0,.14);--pk-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.11),0 2px 6px rgba(0,0,0,.07);--pk-shadow-h:0 0 0 1px rgba(0,0,0,.13),0 14px 36px rgba(0,0,0,.17),0 4px 10px rgba(0,0,0,.09);
      --new-poke-bg:var(--surface2);--hdr-hover:rgba(0,0,0,.04);
    }
    html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{background:var(--bg);color:var(--text);min-height:100vh;padding:clamp(12px,3vw,32px)}

    /* App Header */
    .app-header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:20px}
    .app-title{font-size:clamp(1.3rem,3vw,1.9rem);font-weight:700;letter-spacing:-.5px;flex:1}
    .app-title span{color:var(--accent)}
    .year-nav{display:flex;align-items:center;gap:8px;background:var(--surface);
      border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px}
    .year-nav button{background:none;border:none;color:var(--text);cursor:pointer;
      font-size:1.1rem;line-height:1;padding:2px 6px;border-radius:6px;transition:background .15s}
    .year-nav button:hover{background:var(--surface2)}
    .year-nav .year-label{font-weight:700;font-size:1rem;min-width:44px;text-align:center}
    .btn-add{display:flex;align-items:center;gap:6px;padding:8px 18px;background:var(--accent);
      color:#fff;border:none;border-radius:var(--radius);font-size:.9rem;font-weight:600;
      cursor:pointer;transition:opacity .15s,transform .1s}
    .btn-add:hover{opacity:.85}.btn-add:active{transform:scale(.97)}
    .btn-theme{display:flex;align-items:center;justify-content:center;width:36px;height:36px;
      background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      font-size:1rem;cursor:pointer;transition:background .15s,transform .1s;line-height:1}
    .btn-theme:hover{background:var(--surface2)}.btn-theme:active{transform:scale(.92)}

    /* Top Info Bar */
    .top-info-bar{
      display:flex;align-items:center;gap:20px;flex-wrap:wrap;
      background:var(--surface);border:1px solid var(--border);border-radius:14px;
      padding:14px 22px;margin-bottom:24px;
    }
    .top-date{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)}
    .top-time{font-size:1.9rem;font-weight:800;letter-spacing:-.04em;line-height:1}
    .top-weather{display:flex;align-items:center;gap:12px;margin-left:auto;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 16px}
    .top-weather-emoji{font-size:1.8rem;line-height:1;display:flex;align-items:center;justify-content:center}
    .top-weather-temp{font-size:1.2rem;font-weight:800;letter-spacing:-.02em}
    .top-weather-note{font-size:.72rem;color:var(--text-muted);padding:6px 10px;background:var(--surface);border-radius:8px}

    /* Pokemon Section */
    .poke-section{
      background:var(--surface);border:1px solid var(--border);border-radius:16px;
      padding:clamp(16px,2.5vw,28px);margin-bottom:28px;
      display:grid;grid-template-columns:clamp(180px,22vw,260px) 1fr;
      gap:clamp(20px,3vw,36px);align-items:start;
    }
    @media(max-width:700px){.poke-section{grid-template-columns:1fr}}
    .poke-section-card-col{display:flex;flex-direction:column;align-items:center;gap:14px}
    .poke-section-info-col{display:flex;flex-direction:column;gap:12px;min-width:0}
    .poke-section-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:2px}

    /* Pokemon Card */
    .pk-card{
      position:relative;border-radius:18px;overflow:hidden;
      width:100%;aspect-ratio:63/88;
      display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
      padding:0 0 14px;cursor:pointer;
      transform-style:preserve-3d;
      transform:perspective(600px) rotateX(0deg) rotateY(0deg);
      transition:transform .08s linear,box-shadow .2s;
      border:2px solid var(--pk-border);
      box-shadow:var(--pk-shadow);
    }
    .pk-card:hover{box-shadow:var(--pk-shadow-h)}
    .pk-card-bg{position:absolute;inset:0;background:var(--pk-bg,#1a1a2e);z-index:0}
    .pk-card-holo{position:absolute;inset:0;z-index:1;border-radius:18px;opacity:0;transition:opacity .2s;mix-blend-mode:screen;pointer-events:none}
    .pk-card:hover .pk-card-holo{opacity:1}
    .pk-card-frame{position:absolute;inset:7px;border-radius:12px;border:1px solid rgba(255,255,255,.14);z-index:2;pointer-events:none}
    .pk-card-art{
      position:relative;z-index:3;width:72%;aspect-ratio:1;object-fit:contain;
      filter:drop-shadow(0 12px 32px rgba(0,0,0,.8));
      transition:transform .32s cubic-bezier(.34,1.56,.64,1);will-change:transform;margin-bottom:8px;
    }
    .pk-card:hover .pk-card-art{transform:scale(1.1) translateY(-10px)}
    .pk-card-info{position:relative;z-index:3;width:100%;text-align:center;padding:0 10px}
    .pk-card-name{font-size:clamp(.78rem,1.2vw,1rem);font-weight:900;letter-spacing:-.02em;
      text-shadow:0 2px 10px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
    .pk-card-num{font-size:.58rem;font-weight:500;opacity:.45}
    .pk-card-types{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
    .pk-card-type-badge{font-size:.54rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
      padding:2px 8px;border-radius:20px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);box-shadow:0 2px 8px rgba(0,0,0,.35)}
    .pk-skel-card{width:100%;aspect-ratio:63/88;border-radius:18px;background:var(--surface2);border:2px solid var(--border);animation:pkShimmer 1.4s ease-in-out infinite}
    @keyframes pkShimmer{0%,100%{opacity:.28}50%{opacity:.72}}
    .poke-weakness-chips{display:flex;gap:5px;flex-wrap:wrap}
    .btn-new-poke{background:var(--new-poke-bg);border:1px solid var(--border);border-radius:10px;
      color:var(--text);font-size:.78rem;font-weight:600;padding:9px 16px;cursor:pointer;width:100%;transition:background .15s,transform .12s}
    .btn-new-poke:hover{background:var(--surface2);transform:scale(1.03)}

    /* Pokedex info */
    .pkdex-name{font-size:clamp(1.3rem,2.5vw,1.9rem);font-weight:900;letter-spacing:-.03em;line-height:1.1}
    .pkdex-genus{font-size:.8rem;color:var(--text-muted);font-style:italic;margin-top:2px}
    .pkdex-types{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .pkdex-flavor{font-size:.88rem;line-height:1.65;color:var(--text);background:var(--surface2);
      border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;font-style:italic}
    .pkdex-stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
    .pkdex-stat-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
    .pkdex-stat-label{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:3px}
    .pkdex-stat-val{font-size:1rem;font-weight:700}
    .pkdex-abilities{display:flex;gap:6px;flex-wrap:wrap}
    .pkdex-ability-badge{font-size:.73rem;font-weight:600;padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:20px}
    .pkdex-ability-badge.hidden{border-style:dashed;opacity:.7}
    .pkdex-bar-row{display:flex;flex-direction:column;gap:5px}
    .pkdex-bar-item{display:flex;align-items:center;gap:8px;font-size:.72rem}
    .pkdex-bar-label{width:80px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
    .pkdex-bar-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
    .pkdex-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
    .pkdex-bar-num{width:28px;text-align:right;font-weight:700;color:var(--text-muted)}
    .poke-error{font-size:.87rem;color:var(--text-muted);padding:24px 0}
    .pkdex-skel-line{height:14px;border-radius:6px;background:var(--surface2);animation:pkShimmer 1.4s ease-in-out infinite;margin-bottom:10px}

    /* Modal */
    .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;padding:16px}
    .modal-backdrop.open{display:flex}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;width:100%;max-width:400px;animation:pop .18s ease}
    @keyframes pop{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
    .modal h2{font-size:1.1rem;margin-bottom:20px}
    .modal label{display:block;font-size:.78rem;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
    .modal input[type="text"]{width:100%;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;outline:none;margin-bottom:18px;transition:border-color .15s}
    .modal input[type="text"]:focus{border-color:var(--accent)}
    .color-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
    .color-swatch{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s,transform .12s}
    .color-swatch.selected,.color-swatch:hover{border-color:var(--text);transform:scale(1.18)}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end}
    .btn-cancel{padding:9px 18px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.9rem;cursor:pointer;transition:background .15s}
    .btn-cancel:hover{background:var(--border)}
    .btn-confirm{padding:9px 18px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .15s}
    .btn-confirm:hover{opacity:.85}

    /* Habit Cards */
    #habitsList{display:flex;flex-direction:column;gap:10px}
    .habit-card{background:var(--surface);border:1px solid var(--border);border-left-width:4px;border-radius:16px;animation:slideIn .2s ease;box-shadow:var(--shadow-card);transition:box-shadow .2s}
    .habit-card:hover{box-shadow:var(--shadow-card-h)}
    .habit-card.expanded{box-shadow:var(--shadow-card-exp)}
    @keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
    .habit-header{display:flex;align-items:center;gap:10px;padding:clamp(14px,2.5vw,20px);cursor:pointer;user-select:none;transition:background .15s}
    .habit-header:hover{background:var(--hdr-hover)}
    .habit-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
    .habit-name{font-size:clamp(.95rem,2vw,1.15rem);font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .streak-badge{display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:.78rem;font-weight:600;flex-shrink:0;white-space:nowrap}
    .streak-badge.hot{background:linear-gradient(135deg,#ff6b35 0%,#f7c948 100%);color:#1a0a00;border-color:transparent}
    .btn-delete{background:none;border:1px solid transparent;border-radius:8px;color:var(--text-muted);cursor:pointer;font-size:.8rem;padding:5px 9px;flex-shrink:0;transition:color .15s,border-color .15s,background .15s}
    .btn-delete:hover{color:#cf222e;border-color:#cf222e;background:var(--red-dim)}
    .btn-move{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:.9rem;font-weight:700;padding:5px 10px;flex-shrink:0;line-height:1;transition:color .15s,border-color .15s,background .15s,transform .1s}
    .btn-move:hover{color:var(--accent);border-color:var(--accent);background:var(--surface);transform:scale(1.15)}
    .btn-move:disabled{opacity:.2;cursor:default;pointer-events:none}
    .chevron{font-size:.68rem;color:var(--text-muted);display:inline-block;transition:transform .25s ease;transform:rotate(-90deg);flex-shrink:0;line-height:1}
    .habit-card.expanded .chevron{transform:rotate(0deg)}
    .card-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s ease}
    .habit-card.expanded .card-body{grid-template-rows:1fr}
    .card-body-inner{overflow:hidden;min-height:0}

    /* Stats */
    .stats-row{display:flex;gap:10px;flex-wrap:wrap;padding:clamp(14px,2.5vw,22px) clamp(14px,2.5vw,28px) 0;margin-bottom:12px}
    .stat{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:.8rem}
    .stat strong{font-size:1rem}

    /* Full-width calendar */
    .year-grid-wrap{padding:0 clamp(14px,2.5vw,28px) clamp(14px,2.5vw,28px)}
    .grid-inner{width:100%}
    .month-labels-row{display:grid;gap:0 var(--grid-gap,4px);margin-bottom:4px;grid-template-columns:var(--label-w,36px) 1fr}
    .days-header{display:grid;grid-template-columns:repeat(31,var(--cell-size,18px));gap:var(--grid-gap,4px)}
    .day-num-header{color:var(--text-muted);font-size:clamp(8px,1vw,10px);text-align:center;line-height:var(--cell-size,18px);font-weight:600}
    .month-row{display:grid;grid-template-columns:var(--label-w,36px) 1fr;gap:0 var(--grid-gap,4px);margin-bottom:var(--grid-gap,4px);align-items:start}
    .month-label{font-size:clamp(9px,1vw,11px);color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:right;line-height:var(--cell-size,18px);padding-right:2px;white-space:nowrap}
    .days-container{display:grid;grid-template-columns:repeat(31,var(--cell-size,18px));gap:var(--grid-gap,4px)}
    .day-cell{width:var(--cell-size,18px);height:var(--cell-size,18px);border-radius:clamp(3px,.5vw,5px);cursor:pointer;transition:transform .12s,box-shadow .15s;position:relative;flex-shrink:0}
    .day-cell:hover:not(.empty):not(.future){transform:scale(1.22);z-index:2}
    .day-cell:active:not(.empty):not(.future){transform:scale(1.05)}
    .day-cell.empty{background:transparent;cursor:default;pointer-events:none}
    .day-cell.future{background:var(--future);cursor:default;opacity:.38}
    .day-cell.missed{background:var(--red-dim)}
    .day-cell.today{outline:2px solid var(--accent);outline-offset:1px}
    @keyframes donePulse{0%{transform:scale(1)}45%{transform:scale(1.38)}100%{transform:scale(1)}}
    .day-cell.just-done{animation:donePulse .26s ease}
    .day-cell[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.88);color:#fff;font-size:11px;white-space:nowrap;padding:3px 8px;border-radius:6px;pointer-events:none;z-index:10}

    .empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
    .empty-state .big-icon{font-size:3.5rem;margin-bottom:12px}
    .empty-state p{font-size:1rem;max-width:300px;margin:0 auto;line-height:1.6}

    @media(max-width:640px){
      .year-grid-wrap{overflow-x:visible}
      .month-labels-row{display:none}
      .month-row{grid-template-columns:var(--label-w,36px) 1fr;margin-bottom:8px;align-items:flex-start}
      .month-label{padding-top:3px;line-height:1.2;font-size:10px}
      .days-container{display:flex;flex-wrap:wrap;gap:var(--grid-gap,4px)}
      .day-cell{border-radius:4px}
      .day-cell.empty{display:none}
    }

    /* 7-day dots in header */
    .week-dots{display:flex;gap:3px;flex-shrink:0;align-items:center}
    .week-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}

    /* Today overview strip */
    .overview-strip{display:flex;flex-wrap:wrap;align-items:center;gap:12px;
      background:var(--surface);border:1px solid var(--border);border-radius:14px;
      padding:12px 20px;margin-bottom:16px}
    .overview-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted)}
    .overview-habits{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
    .overview-pill{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 6px;
      border-radius:20px;font-size:.72rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
    .overview-pill-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .overview-ring{flex-shrink:0}

    /* Month summary mini-bars (inside expanded card) */
    .month-summary{display:flex;gap:4px;align-items:flex-end;
      padding:0 clamp(14px,2.5vw,28px) clamp(14px,2.5vw,28px)}
    .month-mini{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
    .month-mini-label{font-size:.5rem;color:var(--text-muted);font-weight:600;
      text-transform:uppercase;letter-spacing:.03em;line-height:1}
    .month-mini-track{width:100%;height:40px;background:var(--surface2);
      border-radius:3px 3px 0 0;position:relative;overflow:hidden}
    .month-mini-fill{position:absolute;bottom:0;left:0;right:0;height:0%;
      border-radius:3px 3px 0 0;transition:height .7s cubic-bezier(.4,0,.2,1)}
    .month-mini-pct{font-size:.5rem;color:var(--text-muted);font-weight:700;line-height:1;min-height:.7rem}

    /* ── Feature 1: Confetti canvas ── */
    #confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:9999}

    /* ── Feature 2: Milestone badges ── */
    .milestone-shelf{display:flex;gap:4px;flex-wrap:wrap;flex-shrink:0}
    .ms-badge{font-size:.62rem;font-weight:800;padding:2px 7px 2px 5px;border-radius:20px;
      background:linear-gradient(135deg,#f7c948,#ff9741);color:#1a0a00;
      box-shadow:0 2px 6px rgba(247,201,72,.4);white-space:nowrap;letter-spacing:.02em;
      animation:msBadgePop .3s cubic-bezier(.34,1.56,.64,1) both}
    @keyframes msBadgePop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

    /* ── Feature 3: Per-habit progress ring ── */
    .habit-ring{flex-shrink:0;line-height:0}
    .habit-ring circle.ring-fill{transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}

    /* ── Feature 4: Streak glow pulse ── */
    @keyframes streakGlow{
      0%,100%{box-shadow:var(--shadow-card),0 0 0 0 var(--glow-c)}
      50%{box-shadow:var(--shadow-card),0 0 18px 4px var(--glow-c)}
    }
    .habit-card.streak-hot{animation:streakGlow var(--glow-spd,2s) ease-in-out infinite}

  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>
  <header class="app-header">
    <div class="app-title">Habit<span>Grid</span></div>
    <div class="year-nav">
      <button id="yearPrev" aria-label="Previous year">&#8249;</button>
      <span class="year-label" id="yearLabel"></span>
      <button id="yearNext" aria-label="Next year">&#8250;</button>
    </div>
    <button class="btn-theme" id="themeToggle" aria-label="Toggle theme" title="Toggle light / dark"></button>
    <button class="btn-add" id="openAddModal">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      Add Habit
    </button>
  </header>

  <div class="top-info-bar" id="topInfoBar">
    <div>
      <div class="top-date" id="topDate"></div>
      <div class="top-time" id="topTime"></div>
    </div>
    <div class="top-weather" id="topWeather">
      <span class="top-weather-note">Fetching weather…</span>
    </div>
  </div>

  <div id="overviewStrip" class="overview-strip" style="display:none"></div>
  <section class="poke-section">
    <div class="poke-section-card-col" id="pokeSectionCardCol">
      <div class="pk-skel-card"></div>
    </div>
    <div class="poke-section-info-col" id="pokeSectionInfoCol">
      <div class="poke-section-title">Today's Pokémon Companion</div>
      <div class="pkdex-skel-line" style="width:60%"></div>
      <div class="pkdex-skel-line" style="width:40%"></div>
      <div class="pkdex-skel-line" style="width:90%;height:60px"></div>
    </div>
  </section>

  <main id="habitsList"></main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">New Habit</h2>
      <label for="habitNameInput">Habit name</label>
      <input type="text" id="habitNameInput" placeholder="e.g. Brush teeth, Meditate…" maxlength="60" autocomplete="off" />
      <label>Pick a color</label>
      <div class="color-row" id="colorRow"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelModal">Cancel</button>
        <button class="btn-confirm" id="confirmAdd">Add Habit</button>
      </div>
    </div>
  </div>

<script>
  dayjs.extend(window.dayjs_plugin_dayOfYear);
  dayjs.extend(window.dayjs_plugin_isLeapYear);

  var STORAGE_KEY   = 'habitgrid_v1';
  var MONTH_NAMES   = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DAYS_IN_MONTH = [31,28,31,30,31,30,31,31,30,31,30,31];
  var PALETTE = [
    '#26a641','#58a6ff','#f7c948','#ff6b35',
    '#d2a8ff','#ff7eb6','#39d353','#ffa657',
    '#79c0ff','#e05252','#56d364','#e3b341'
  ];

  var state = load();
  var viewYear = dayjs().year();
  var selectedColor = PALETTE[0];
  var expanded = new Set();

  /* ─── Milestone definitions ─────────────────────────── */
  var MILESTONES = [
    {days:7,   label:'🔥 7',   title:'Week warrior'},
    {days:14,  label:'⚡ 14',  title:'Two weeks'},
    {days:21,  label:'💪 21',  title:'Habit formed'},
    {days:30,  label:'🥈 30',  title:'One month'},
    {days:60,  label:'🥇 60',  title:'Two months'},
    {days:100, label:'💯 100', title:'Century'},
    {days:180, label:'🌟 180', title:'Half year'},
    {days:365, label:'👑 365', title:'Full year'},
  ];
  var MILESTONE_STORE_KEY = 'habitgrid_milestones_v1';
  function loadMilestones() {
    try{var r=localStorage.getItem(MILESTONE_STORE_KEY);return r?JSON.parse(r):{};}catch(e){return {};}
  }
  function saveMilestones(m){ try{localStorage.setItem(MILESTONE_STORE_KEY,JSON.stringify(m));}catch(e){} }
  var milestoneState = loadMilestones(); // {taskId: [7,30,...] reached day thresholds}

  /* ─── Confetti engine ────────────────────────────────── */
  var confettiParts=[], confettiRaf=null;
  var confettiCanvas=document.getElementById('confettiCanvas');
  var confettiCtx=confettiCanvas.getContext('2d');
  function resizeConfetti(){confettiCanvas.width=window.innerWidth;confettiCanvas.height=window.innerHeight;}
  resizeConfetti();
  window.addEventListener('resize',resizeConfetti);
  function launchConfetti(colors){
    resizeConfetti();
    var W=confettiCanvas.width, H=confettiCanvas.height;
    for(var i=0;i<160;i++){
      var c=colors[Math.floor(Math.random()*colors.length)];
      confettiParts.push({
        x:W/2+Math.random()*200-100, y:H*0.45,
        vx:(Math.random()-0.5)*14, vy:-(Math.random()*12+6),
        rot:Math.random()*360, rotV:(Math.random()-0.5)*12,
        w:Math.random()*10+5, h:Math.random()*5+3,
        color:c, alpha:1, gravity:0.38, shape:Math.random()>0.5?'rect':'circle'
      });
    }
    if(!confettiRaf) confettiLoop();
  }
  function confettiLoop(){
    confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    confettiParts=confettiParts.filter(function(p){return p.alpha>0.02;});
    confettiParts.forEach(function(p){
      p.x+=p.vx; p.y+=p.vy; p.vy+=p.gravity; p.rot+=p.rotV; p.alpha-=0.012;
      p.vx*=0.99;
      confettiCtx.save();
      confettiCtx.globalAlpha=Math.max(0,p.alpha);
      confettiCtx.translate(p.x,p.y);
      confettiCtx.rotate(p.rot*Math.PI/180);
      confettiCtx.fillStyle=p.color;
      if(p.shape==='circle'){
        confettiCtx.beginPath();confettiCtx.arc(0,0,p.w/2,0,Math.PI*2);confettiCtx.fill();
      } else {
        confettiCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      }
      confettiCtx.restore();
    });
    if(confettiParts.length>0){ confettiRaf=requestAnimationFrame(confettiLoop); }
    else { confettiRaf=null; confettiCtx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
  }

  function load() {
    try { var r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e) {}
    return { tasks: [], logs: {} };
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function uid()  { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
  function pad(n) { return String(n).padStart(2,'0'); }
  function logKey(id, y, m, d) { return id+'-'+y+'-'+m+'-'+d; }
  function isLeapYear(y) { return (y%4===0 && y%100!==0) || y%400===0; }
  function daysInMonth(m, y) { return m===2 ? (isLeapYear(y)?29:28) : DAYS_IN_MONTH[m-1]; }

  function getDoneColor(habitColor, year, month, day) {
    try {
      var doy   = dayjs(year+'-'+pad(month)+'-'+pad(day)).dayOfYear();
      var total = isLeapYear(year) ? 366 : 365;
      var t     = (doy - 1) / (total - 1);
      var base  = chroma(habitColor);
      var h     = base.get('hsl.h') || 0;
      var c0 = chroma.hsl((h + 30) % 360, 0.92, 0.62);
      var c1 = chroma.hsl(h, 1.00, 0.52);
      var c2 = chroma.hsl((h - 30 + 360) % 360, 0.88, 0.43);
      return chroma.scale([c0, c1, c2]).mode('lch')(t).hex();
    } catch(e) { return habitColor; }
  }
  function getDoneGlow(c) {
    try { return chroma(c).alpha(0.6).css(); } catch(e) { return 'transparent'; }
  }

  /* Time + Weather */
  var WMO = {
    0:'☀️',1:'🌤',2:'⛅',3:'☁️',45:'🌫',48:'🌫',
    51:'🌦',53:'🌦',55:'🌧',61:'🌧',63:'🌧',65:'🌧',
    71:'🌨',73:'🌨',75:'❄️',77:'🌨',80:'🌧',81:'🌧',82:'⛈️',
    85:'🌨',86:'🌨',95:'⛈️',96:'⛈️',99:'⛈️'
  };
  function wmoEmoji(c){ return WMO[c] || '🌡️'; }
  function fmtClock() {
    var n=new Date(),h=n.getHours(),m=n.getMinutes();
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }
  function initTopBar() {
    document.getElementById('topDate').textContent = dayjs().format('dddd, MMMM D YYYY');
    document.getElementById('topTime').textContent = fmtClock();
    if (!navigator.geolocation) {
      document.getElementById('topWeather').innerHTML = '<span class="top-weather-note">Location unavailable</span>';
      return;
    }
    navigator.geolocation.getCurrentPosition(function(pos) {
      var lat=pos.coords.latitude.toFixed(4), lon=pos.coords.longitude.toFixed(4);
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weathercode&timezone=auto')
        .then(function(r){ return r.json(); })
        .then(function(d){
          document.getElementById('topWeather').innerHTML =
            '<span class="top-weather-emoji">'+wmoEmoji(d.current.weathercode)+'</span>'+
            '<span class="top-weather-temp">'+Math.round(d.current.temperature_2m)+'°C</span>';
        })
        .catch(function(){ document.getElementById('topWeather').innerHTML='<span class="top-weather-note">Weather unavailable</span>'; });
    }, function(){ document.getElementById('topWeather').innerHTML='<span class="top-weather-note">Location denied</span>'; });
  }
  setInterval(function(){ document.getElementById('topTime').textContent=fmtClock(); }, 10000);

  /* Pokemon */
  var POKE_DAILY_KEY = 'habitgrid_daily_poke_v1';
  var pokeIsShiny = false;
  var POKE_TYPE_CACHE = {};
  var pokeCurrentData = null;
  var POKE_TYPE_COLORS = {
    normal:'#9099a1',fire:'#ff9741',water:'#3692dc',electric:'#fbd100',
    grass:'#38bf4b',ice:'#4cd1c0',fighting:'#e0306a',poison:'#b567ce',
    ground:'#e87236',flying:'#89aae3',psychic:'#ff6675',bug:'#83c300',
    rock:'#c8b686',ghost:'#4e6aef',dragon:'#006fc9',dark:'#5b5466',
    steel:'#5a8ea2',fairy:'#fb89eb'
  };
  var BASE_STAT_COLORS = {
    hp:'#ff6b6b',attack:'#ff9741',defense:'#fbd100',
    'special-attack':'#58a6ff','special-defense':'#38bf4b',speed:'#fb89eb'
  };
  var BASE_STAT_LABELS = {
    hp:'HP',attack:'ATK',defense:'DEF',
    'special-attack':'SP.ATK','special-defense':'SP.DEF',speed:'SPD'
  };
  var TYPE_WEAKNESSES = {
    normal:['fighting'],fire:['water','ground','rock'],
    water:['electric','grass'],electric:['ground'],
    grass:['fire','ice','poison','flying','bug'],
    ice:['fire','fighting','rock','steel'],
    fighting:['flying','psychic','fairy'],poison:['ground','psychic'],
    ground:['water','grass','ice'],flying:['electric','rock','ice'],
    psychic:['bug','ghost','dark'],bug:['fire','flying','rock'],
    rock:['water','grass','fighting','ground','steel'],
    ghost:['ghost','dark'],dragon:['ice','dragon','fairy'],
    dark:['fighting','bug','fairy'],steel:['fire','fighting','ground'],
    fairy:['poison','steel']
  };

  function getGlobalType() {
    var types=['fire','water','grass','electric','psychic','ice','ghost','dragon','fairy','fighting','dark','steel'];
    return types[dayjs().dayOfYear() % types.length];
  }
  function extractPokeId(url) {
    var m=url.match(/\/pokemon\/(\d+)\//);
    return m ? parseInt(m[1],10) : null;
  }
  function pokeArtwork(id, shiny) {
    var base='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/';
    return (shiny?base+'shiny/':base)+id+'.png';
  }
  function cap(s){ return s ? s.charAt(0).toUpperCase()+s.slice(1) : s; }
  function pickRandom(arr, excludeId) {
    var pool=arr.filter(function(p){ return p.id && p.id<=1025 && p.id!==excludeId; });
    if(!pool.length) pool=arr.filter(function(p){ return p.id && p.id<=1025; });
    if(!pool.length) pool=arr;
    return pool[Math.floor(Math.random()*pool.length)]||null;
  }

  function getTodayPokeCache() {
    try{var r=localStorage.getItem(POKE_DAILY_KEY);if(!r)return null;var c=JSON.parse(r);if(c.date!==dayjs().format('YYYY-MM-DD'))return null;return c;}catch(e){return null;}
  }
  function saveDailyPokeCache(d,typeName,species) {
    try{localStorage.setItem(POKE_DAILY_KEY,JSON.stringify({date:dayjs().format('YYYY-MM-DD'),data:d,typeName:typeName,species:species}));}catch(e){}
  }
  function getWeaknesses(types) {
    var seen={},result=[];
    types.forEach(function(t){(TYPE_WEAKNESSES[t]||[]).forEach(function(w){if(!seen[w]){seen[w]=1;result.push(w);}});});
    return result;
  }
  function buildPokeCard(d, typeName) {
    var types=d.types&&d.types.length?d.types:[typeName];
    var primaryType=types[0]||typeName;
    var tc=POKE_TYPE_COLORS[primaryType]||'#888';
    var bg1,bg2;
    try{ bg1=chroma(tc).brighten(0.5).hex(); bg2=chroma(tc).darken(1.4).hex(); }
    catch(e){ bg1=tc; bg2='#1a1a2e'; }
    var badges=types.map(function(t){
      return '<span class="pk-card-type-badge" style="background:'+(POKE_TYPE_COLORS[t]||'#888')+'">'+t+'</span>';
    }).join('');
    var wrapper=document.createElement('div');
    wrapper.innerHTML=
      '<div class="pk-card" style="--pk-bg:linear-gradient(160deg,'+bg1+' 0%,'+bg2+' 100%)">'+
        '<div class="pk-card-bg" style="background:var(--pk-bg)"></div>'+
        '<div class="pk-card-holo"></div>'+
        '<div class="pk-card-frame"></div>'+
        '<img class="pk-card-art" src="'+pokeArtwork(d.id)+'" alt="'+cap(d.name)+'" loading="eager"/>'+
        '<div class="pk-card-info">'+
          '<div class="pk-card-name">'+cap(d.name)+' <span class="pk-card-num">#'+String(d.id).padStart(4,'0')+'</span></div>'+
          '<div class="pk-card-types">'+badges+'</div>'+
        '</div>'+
      '</div>';
    var pkCard=wrapper.firstChild;
    var holo=pkCard.querySelector('.pk-card-holo');
    pkCard.addEventListener('mousemove',function(e){
      var rect=pkCard.getBoundingClientRect();
      var dx=(e.clientX-rect.left-rect.width*.5)/(rect.width*.5);
      var dy=(e.clientY-rect.top-rect.height*.5)/(rect.height*.5);
      pkCard.style.transform='perspective(600px) rotateY('+(dx*14)+'deg) rotateX('+(-dy*10)+'deg) scale(1.04)';
      var gx=Math.round((dx+1)*50), gy=Math.round((dy+1)*50);
      holo.style.background='radial-gradient(ellipse 70% 60% at '+gx+'% '+gy+'%,rgba(255,255,255,.22) 0%,rgba(255,200,100,.1) 30%,rgba(100,200,255,.09) 55%,transparent 75%)';
      holo.style.opacity='1';
    });
    pkCard.addEventListener('mouseleave',function(){
      pkCard.style.transform='perspective(600px) rotateX(0deg) rotateY(0deg)';
      holo.style.opacity='0';
    });
    return pkCard;
  }

  function renderPokeSection(data, typeName, species) {
    pokeIsShiny=false;
    var cardCol=document.getElementById('pokeSectionCardCol');
    var infoCol=document.getElementById('pokeSectionInfoCol');
    cardCol.innerHTML='';
    var pkCard=buildPokeCard(data,typeName);
    var btn=document.createElement('button');
    btn.className='btn-new-poke';
    btn.innerHTML='&#x1F3B2; New Pok\u00e9mon';
    btn.addEventListener('click',function(){ fetchPokeForSection(true); });
    var shinyBtn=document.createElement('button');
    shinyBtn.className='btn-new-poke';
    shinyBtn.innerHTML='&#x2728; Shiny';
    shinyBtn.addEventListener('click',function(){
      pokeIsShiny=!pokeIsShiny;
      var artEl=cardCol.querySelector('.pk-card-art');
      if(artEl) artEl.src=pokeArtwork(data.id,pokeIsShiny);
      shinyBtn.innerHTML=pokeIsShiny?'&#x2B50; Normal':'&#x2728; Shiny';
    });
    cardCol.appendChild(pkCard);
    cardCol.appendChild(btn);
    cardCol.appendChild(shinyBtn);

    var flavor='';
    if(species&&species.flavor_text_entries){
      var entry=species.flavor_text_entries.find(function(e){ return e.language.name==='en'; });
      if(entry) flavor=entry.flavor_text.replace(/\f|\n/g,' ');
    }
    var genus='';
    if(species&&species.genera){
      var g=species.genera.find(function(e){ return e.language.name==='en'; });
      if(g) genus=g.genus;
    }
    var heightM=data.height?(data.height/10).toFixed(1):'?';
    var weightKg=data.weight?(data.weight/10).toFixed(1):'?';
    var abilitiesHtml='';
    if(data.abilities&&data.abilities.length){
      abilitiesHtml='<div class="pkdex-abilities">'+
        data.abilities.map(function(a){
          return '<span class="pkdex-ability-badge'+(a.is_hidden?' hidden':'')+'">'+cap(a.ability.name.replace(/-/g,' '))+(a.is_hidden?' <small>(hidden)</small>':'')+'</span>';
        }).join('')+
        '</div>';
    }
    var statsHtml='';
    if(data.stats&&data.stats.length){
      statsHtml='<div class="pkdex-bar-row">'+
        data.stats.map(function(s){
          var pct=Math.min(100,Math.round(s.base_stat/255*100));
          var color=BASE_STAT_COLORS[s.stat.name]||'#888';
          var label=BASE_STAT_LABELS[s.stat.name]||s.stat.name.toUpperCase();
          return '<div class="pkdex-bar-item">'+
            '<span class="pkdex-bar-label">'+label+'</span>'+
            '<div class="pkdex-bar-track"><div class="pkdex-bar-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
            '<span class="pkdex-bar-num">'+s.base_stat+'</span>'+
          '</div>';
        }).join('')+
        '</div>';
    }
    var types=data.types&&data.types.length?data.types:[typeName];
    var typeBadges=types.map(function(t){
      return '<span class="pk-card-type-badge" style="background:'+(POKE_TYPE_COLORS[t]||'#888')+'">'+t+'</span>';
    }).join('');
    var gen='';
    if(species&&species.generation){
      var genMap={'generation-i':'Gen I','generation-ii':'Gen II','generation-iii':'Gen III',
        'generation-iv':'Gen IV','generation-v':'Gen V','generation-vi':'Gen VI',
        'generation-vii':'Gen VII','generation-viii':'Gen VIII','generation-ix':'Gen IX'};
      gen=genMap[species.generation.name]||cap(species.generation.name);
    }
    var catchRate=species&&species.capture_rate!=null?species.capture_rate:null;
    var catchPct=catchRate!=null?Math.round(catchRate/255*100):null;
    var weaknesses=getWeaknesses(types);
    var weakHtml=weaknesses.length?
      '<div class="poke-section-title" style="margin-bottom:6px">Weaknesses</div>'+
      '<div class="poke-weakness-chips">'+
        weaknesses.map(function(w){ return '<span class="pk-card-type-badge" style="background:'+(POKE_TYPE_COLORS[w]||'#888')+'">'+w+'</span>'; }).join('')+
      '</div>':'';

    infoCol.innerHTML=
      '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px">'+
        '<div class="poke-section-title" style="margin-bottom:0">Today\'s Pok\u00e9mon Companion</div>'+
        '<span class="pk-card-type-badge" style="background:'+(POKE_TYPE_COLORS[typeName]||'#888')+';font-size:.6rem;opacity:.85">'+typeName+' day</span>'+
      '</div>'+
      '<div>'+
        '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">'+
          '<div class="pkdex-name">'+cap(data.name)+'</div>'+
          (gen?'<span style="font-size:.68rem;font-weight:700;color:var(--text-muted);background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 7px">'+gen+'</span>':'')+
        '</div>'+
        (genus?'<div class="pkdex-genus">'+genus+'</div>':'')+
        '<div class="pkdex-types">'+typeBadges+'</div>'+
      '</div>'+
      (flavor?'<div class="pkdex-flavor">'+flavor+'</div>':'')+
      '<div class="pkdex-stats-grid">'+
        '<div class="pkdex-stat-item"><div class="pkdex-stat-label">Height</div><div class="pkdex-stat-val">'+heightM+' m</div></div>'+
        '<div class="pkdex-stat-item"><div class="pkdex-stat-label">Weight</div><div class="pkdex-stat-val">'+weightKg+' kg</div></div>'+
        '<div class="pkdex-stat-item"><div class="pkdex-stat-label">Base XP</div><div class="pkdex-stat-val">'+(data.base_experience||'—')+'</div></div>'+
        (catchPct!=null?'<div class="pkdex-stat-item"><div class="pkdex-stat-label">Catch Rate</div><div class="pkdex-stat-val">'+catchPct+'%</div></div>':'')+
      '</div>'+
      (weakHtml?'<div>'+weakHtml+'</div>':'')+
      (abilitiesHtml?'<div><div class="poke-section-title" style="margin-bottom:8px">Abilities</div>'+abilitiesHtml+'</div>':'')+
      (statsHtml?'<div><div class="poke-section-title" style="margin-bottom:8px">Base Stats</div>'+statsHtml+'</div>':'');
  }

  function fetchPokeForSection(forceNew) {
    var typeName=getGlobalType();
    var cardCol=document.getElementById('pokeSectionCardCol');
    var infoCol=document.getElementById('pokeSectionInfoCol');
    if(!forceNew){
      var daily=getTodayPokeCache();
      if(daily){pokeCurrentData={data:daily.data,typeName:daily.typeName,species:daily.species};renderPokeSection(daily.data,daily.typeName,daily.species);return;}
    }
    cardCol.innerHTML='<div class="pk-skel-card"></div>';
    infoCol.innerHTML=
      '<div class="poke-section-title">Today\'s Pok\u00e9mon Companion</div>'+
      '<div class="pkdex-skel-line" style="width:50%"></div>'+
      '<div class="pkdex-skel-line" style="width:35%"></div>'+
      '<div class="pkdex-skel-line" style="width:90%;height:56px"></div>'+
      '<div class="pkdex-skel-line" style="width:70%"></div>';
    var excludeId=(forceNew&&pokeCurrentData)?pokeCurrentData.data.id:null;

    function doFetch(list) {
      var pick=pickRandom(list,excludeId);
      if(!pick){ infoCol.innerHTML='<div class="poke-error">&#x2728; No Pok\u00e9mon found!</div>'; return; }
      Promise.all([
        fetch('https://pokeapi.co/api/v2/pokemon/'+pick.id).then(function(r){ return r.json(); }),
        fetch('https://pokeapi.co/api/v2/pokemon-species/'+pick.id).then(function(r){ return r.json(); })
      ]).then(function(res){
        var p=res[0], species=res[1];
        var d={
          name:pick.name, id:pick.id,
          types:p.types.map(function(t){ return t.type.name; }),
          abilities:p.abilities, height:p.height, weight:p.weight,
          base_experience:p.base_experience, stats:p.stats
        };
        pokeCurrentData={data:d, typeName:typeName, species:species};
        saveDailyPokeCache(d,typeName,species);
        renderPokeSection(d, typeName, species);
      }).catch(function(){
        infoCol.innerHTML='<div class="poke-error">&#x2728; Couldn\'t reach the Pok\u00e9mon world right now.</div>';
        cardCol.innerHTML='';
      });
    }

    if(POKE_TYPE_CACHE[typeName]){
      doFetch(POKE_TYPE_CACHE[typeName]);
    } else {
      fetch('https://pokeapi.co/api/v2/type/'+typeName)
        .then(function(r){ return r.json(); })
        .then(function(d){
          var list=d.pokemon
            .map(function(e){ var id=extractPokeId(e.pokemon.url); return {name:e.pokemon.name,id:id}; })
            .filter(function(p){ return p.id&&p.id<=1025; });
          POKE_TYPE_CACHE[typeName]=list;
          doFetch(list);
        })
        .catch(function(){
          infoCol.innerHTML='<div class="poke-error">&#x2728; Couldn\'t reach the Pok\u00e9mon world right now.</div>';
          cardCol.innerHTML='';
        });
    }
  }

  /* Stats */
  function calcStats(taskId, year) {
    var today=dayjs(), isCurrentYear=(today.year()===year);
    var streak=0, check=isCurrentYear?today:dayjs(year+'-12-31');
    while(check.year()===year){
      var k=logKey(taskId,check.year(),check.month()+1,check.date());
      if(state.logs[k]){streak++;check=check.subtract(1,'day');}else break;
    }
    var total=0, prefix=taskId+'-'+year+'-';
    for(var k in state.logs){ if(k.startsWith(prefix)&&state.logs[k]) total++; }
    var elapsed=isCurrentYear?today.dayOfYear():(isLeapYear(year)?366:365);
    return {streak:streak, total:total, pct:elapsed>0?Math.round(total/elapsed*100):0};
  }

  function renderOverviewStrip() {
    var strip=document.getElementById('overviewStrip');
    if(!strip) return;
    if(state.tasks.length===0){strip.style.display='none';return;}
    strip.style.display='flex';
    var today=dayjs();
    var pills=state.tasks.map(function(t){
      var done=!!state.logs[logKey(t.id,today.year(),today.month()+1,today.date())];
      return {name:t.name,color:t.color,done:done};
    });
    var doneCount=pills.filter(function(p){return p.done;}).length;
    var pct=Math.round(doneCount/state.tasks.length*100);
    var r=18,circ=+(2*Math.PI*r).toFixed(1);
    var dashOff=+(circ*(1-pct/100)).toFixed(1);
    var ringColor=pct===100?'#39d353':pct>=50?'#58a6ff':'#ff6b35';
    var pillsHtml=pills.map(function(p){
      var bg,bc;
      try{bg=p.done?chroma(p.color).alpha(0.15).css():'var(--surface2)'}catch(e){bg='var(--surface2)';}
      bc=p.done?p.color:'var(--border)';
      return '<div class="overview-pill" style="background:'+bg+';border-color:'+bc+';color:'+(p.done?p.color:'var(--text-muted)')+'">'+
        '<div class="overview-pill-dot" style="background:'+(p.done?p.color:'var(--border)')+'"></div>'+p.name+'</div>';
    }).join('');
    strip.innerHTML=
      '<div style="flex-shrink:0">'+
        '<div class="overview-label">Today\'s Progress</div>'+
        '<div style="font-size:.85rem;margin-top:3px;font-weight:600">'+doneCount+' / '+state.tasks.length+' done</div>'+
      '</div>'+
      '<div class="overview-habits">'+pillsHtml+'</div>'+
      '<div class="overview-ring" title="'+pct+'% today">'+
        '<svg width="44" height="44" viewBox="0 0 44 44" fill="none">'+
          '<circle cx="22" cy="22" r="'+r+'" stroke="var(--surface2)" stroke-width="4"/>'+
          '<circle cx="22" cy="22" r="'+r+'" stroke="'+ringColor+'" stroke-width="4"'+
            ' stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+dashOff+'"'+
            ' transform="rotate(-90 22 22)" style="transition:stroke-dashoffset .5s ease"/>'+
          '<text x="22" y="26" text-anchor="middle" font-size="9" font-weight="700" style="fill:var(--text)">'+pct+'%</text>'+
        '</svg>'+
      '</div>';
  }

  function updateWeekDots(card, task) {
    var el=card.querySelector('.week-dots');
    if(!el) return;
    var today=dayjs();
    el.innerHTML='';
    for(var wi=6;wi>=0;wi--){
      var wday=today.subtract(wi,'day');
      var wdone=!!state.logs[logKey(task.id,wday.year(),wday.month()+1,wday.date())];
      var dot=document.createElement('div');
      dot.className='week-dot';
      dot.style.background=wdone?getDoneColor(task.color,wday.year(),wday.month()+1,wday.date()):'var(--red-dim)';
      el.appendChild(dot);
    }
  }

  function render() {
    document.getElementById('yearLabel').textContent = viewYear;
    renderOverviewStrip();
    var el=document.getElementById('habitsList');
    if(state.tasks.length===0){
      el.innerHTML='<div class="empty-state"><div class="big-icon">&#x1F4CB;</div><p>No habits yet. Hit <strong>Add Habit</strong> to start tracking your year.</p></div>';
      return;
    }
    el.innerHTML='';
    state.tasks.forEach(function(task){ el.appendChild(buildCard(task)); });
  }

  /* Full-width cell sizing */
  function computeCellSize(wrapEl) {
    var LABEL_W=36, GAP=4;
    var available=wrapEl.clientWidth-LABEL_W-GAP;
    var size=Math.floor((available-30*GAP)/31);
    size=Math.max(10,size);
    return {size:size+'px', gap:GAP+'px', labelW:LABEL_W+'px'};
  }

  function buildCard(task) {
    var today=dayjs(), isOpen=expanded.has(task.id);
    var st=calcStats(task.id, viewYear);
    var card=document.createElement('div');
    card.className='habit-card'+(isOpen?' expanded':'');
    card.dataset.taskId=task.id;
    try{
      card.style.borderLeftColor=task.color;
      card.style.backgroundImage='linear-gradient(135deg,'+chroma(task.color).alpha(0.12).css()+' 0%,transparent 45%)';
    }catch(e){}

    /* Feature 4: streak glow */
    if(st.streak>=7){
      var glowC; try{glowC=chroma(task.color).alpha(0.5).css();}catch(e){glowC=task.color;}
      var spd=st.streak>=30?'1.1s':st.streak>=14?'1.6s':'2.2s';
      card.style.setProperty('--glow-c',glowC);
      card.style.setProperty('--glow-spd',spd);
      card.classList.add('streak-hot');
    }

    var hdr=document.createElement('div');
    hdr.className='habit-header';
    hdr.setAttribute('role','button');
    hdr.setAttribute('aria-expanded',String(isOpen));

    /* Feature 3: progress ring instead of plain dot */
    var ringSize=28, rr=11, rCirc=+(2*Math.PI*rr).toFixed(1);
    var rDash=+(rCirc*(1-st.pct/100)).toFixed(1);
    var ringEl=document.createElement('div');
    ringEl.className='habit-ring';
    ringEl.innerHTML=
      '<svg width="'+ringSize+'" height="'+ringSize+'" viewBox="0 0 '+ringSize+' '+ringSize+'" fill="none">'+
        '<circle cx="14" cy="14" r="'+rr+'" stroke="var(--surface2)" stroke-width="3"/>'+
        '<circle class="ring-fill" cx="14" cy="14" r="'+rr+'"'+
          ' stroke="'+task.color+'" stroke-width="3" stroke-linecap="round"'+
          ' stroke-dasharray="'+rCirc+'" stroke-dashoffset="'+rDash+'"'+
          ' transform="rotate(-90 14 14)"/>'+
        '<text x="14" y="18" text-anchor="middle" font-size="7" font-weight="700" style="fill:'+task.color+'">'+st.pct+'%</text>'+
      '</svg>';

    var nameEl=document.createElement('div');
    nameEl.className='habit-name';
    nameEl.textContent=task.name;

    /* Feature 2: milestone badges */
    var reached=milestoneState[task.id]||[];
    var shelfEl=document.createElement('div');
    shelfEl.className='milestone-shelf';
    MILESTONES.forEach(function(ms){
      if(reached.indexOf(ms.days)!==-1){
        var b=document.createElement('span');
        b.className='ms-badge';
        b.textContent=ms.label;
        b.title=ms.title;
        shelfEl.appendChild(b);
      }
    });

    var badge=document.createElement('div');
    badge.className='streak-badge'+(st.streak>=7?' hot':'');
    badge.innerHTML='<span>'+(st.streak>=7?'&#x1F525;':'&#x2728;')+'</span> '+st.streak+' day streak';

    var taskIdx=state.tasks.findIndex(function(t){ return t.id===task.id; });
    var moveUp=document.createElement('button');
    moveUp.className='btn-move'; moveUp.title='Move up'; moveUp.innerHTML='&#x2191;';
    if(taskIdx===0) moveUp.disabled=true;
    moveUp.addEventListener('click',function(e){ e.stopPropagation(); moveTask(task.id,-1); });
    var moveDown=document.createElement('button');
    moveDown.className='btn-move'; moveDown.title='Move down'; moveDown.innerHTML='&#x2193;';
    if(taskIdx===state.tasks.length-1) moveDown.disabled=true;
    moveDown.addEventListener('click',function(e){ e.stopPropagation(); moveTask(task.id,1); });

    var del=document.createElement('button');
    del.className='btn-delete';
    del.textContent='Remove';
    del.addEventListener('click',function(e){ e.stopPropagation(); deleteTask(task.id); });

    var chevron=document.createElement('span');
    chevron.className='chevron';
    chevron.setAttribute('aria-hidden','true');
    chevron.textContent='\u25BC';

    var weekDotsEl=document.createElement('div');
    weekDotsEl.className='week-dots';
    for(var wi=6;wi>=0;wi--){
      var wday=today.subtract(wi,'day');
      var wdone=!!state.logs[logKey(task.id,wday.year(),wday.month()+1,wday.date())];
      var wdot=document.createElement('div');
      wdot.className='week-dot';
      wdot.style.background=wdone?getDoneColor(task.color,wday.year(),wday.month()+1,wday.date()):'var(--red-dim)';
      weekDotsEl.appendChild(wdot);
    }

    hdr.append(ringEl, nameEl, shelfEl, weekDotsEl, badge, moveUp, moveDown, del, chevron);
    hdr.addEventListener('click',function(){ toggleExpand(task.id, card, hdr); });

    var body=document.createElement('div');
    body.className='card-body';
    var bodyInner=document.createElement('div');
    bodyInner.className='card-body-inner';

    var statsEl=document.createElement('div');
    statsEl.className='stats-row';
    statsEl.innerHTML=
      '<div class="stat">&#x2705; <strong>'+st.total+'</strong> days done</div>'+
      '<div class="stat">&#x1F4C8; <strong>'+st.pct+'%</strong> completion</div>'+
      '<div class="stat">&#x1F4C5; <strong>'+viewYear+'</strong></div>';

    var gridWrap=document.createElement('div');
    gridWrap.className='year-grid-wrap';
    var gridInner=document.createElement('div');
    gridInner.className='grid-inner';

    var headerRow=document.createElement('div');
    headerRow.className='month-labels-row';
    var hSpacer=document.createElement('div');
    var daysHeader=document.createElement('div');
    daysHeader.className='days-header';
    for(var d=1;d<=31;d++){
      var dh=document.createElement('div');
      dh.className='day-num-header';
      dh.textContent=d;
      daysHeader.appendChild(dh);
    }
    headerRow.append(hSpacer, daysHeader);
    gridInner.appendChild(headerRow);

    for(var m=1;m<=12;m++){
      var row=document.createElement('div');
      row.className='month-row';
      var mlabel=document.createElement('div');
      mlabel.className='month-label';
      mlabel.textContent=MONTH_NAMES[m-1];
      var dc=document.createElement('div');
      dc.className='days-container';
      var daysThisMonth=daysInMonth(m, viewYear);
      for(var d=1;d<=31;d++){
        var cell=document.createElement('div');
        cell.className='day-cell';
        if(d>daysThisMonth){ cell.classList.add('empty'); dc.appendChild(cell); continue; }
        var cellDate=dayjs(viewYear+'-'+pad(m)+'-'+pad(d));
        var isFuture=cellDate.isAfter(today,'day');
        var isToday=cellDate.isSame(today,'day');
        var key=logKey(task.id, viewYear, m, d);
        var done=!!state.logs[key];
        if(isFuture){
          cell.classList.add('future');
        } else if(done){
          cell.classList.add('done');
          var dColor=getDoneColor(task.color, viewYear, m, d);
          cell.style.backgroundColor=dColor;
          cell.style.boxShadow='0 0 8px 2px '+getDoneGlow(dColor);
        } else {
          cell.classList.add('missed');
        }
        if(isToday) cell.classList.add('today');
        cell.dataset.tip=cellDate.format('MMM D')+(done?' \u2713':isFuture?'':' \u2717');
        if(!isFuture){
          (function(mm,dd,cl,bg,se,tk){
            cl.addEventListener('click',function(){ toggleDay(tk.id,viewYear,mm,dd,cl,bg,se,tk); });
          })(m,d,cell,badge,statsEl,task);
        }
        dc.appendChild(cell);
      }
      row.append(mlabel, dc);
      gridInner.appendChild(row);
    }

    gridWrap.appendChild(gridInner);

    function applyGridSizing(){
      var s=computeCellSize(gridWrap);
      gridInner.style.setProperty('--cell-size',s.size);
      gridInner.style.setProperty('--grid-gap',s.gap);
      gridInner.style.setProperty('--label-w',s.labelW);
    }
    if(typeof ResizeObserver!=='undefined'){
      var ro=new ResizeObserver(applyGridSizing);
      ro.observe(gridWrap);
    }
    gridWrap._applyGridSizing=applyGridSizing;

    var monthSummary=document.createElement('div');
    monthSummary.className='month-summary';
    for(var mb=1;mb<=12;mb++){
      var mbDone=0,mbTotal=0,mbDays=daysInMonth(mb,viewYear);
      for(var mbd=1;mbd<=mbDays;mbd++){
        var mbDate=dayjs(viewYear+'-'+pad(mb)+'-'+pad(mbd));
        if(mbDate.isAfter(today,'day')) continue;
        mbTotal++;
        if(state.logs[logKey(task.id,viewYear,mb,mbd)]) mbDone++;
      }
      var mbPct=mbTotal>0?Math.round(mbDone/mbTotal*100):0;
      var mbColor=mbDone>0?getDoneColor(task.color,viewYear,mb,Math.ceil(mbDays/2)):'transparent';
      var mini=document.createElement('div');
      mini.className='month-mini';
      var mbFill=document.createElement('div');
      mbFill.className='month-mini-fill';
      mbFill.dataset.pct=mbPct;
      mbFill.style.background=mbColor;
      if(isOpen) mbFill.style.height=mbPct+'%';
      var mbTrack=document.createElement('div');
      mbTrack.className='month-mini-track';
      mbTrack.appendChild(mbFill);
      var mbLbl=document.createElement('div');
      mbLbl.className='month-mini-label';
      mbLbl.textContent=MONTH_NAMES[mb-1];
      var mbPctLbl=document.createElement('div');
      mbPctLbl.className='month-mini-pct';
      mbPctLbl.textContent=mbTotal>0?mbPct+'%':'';
      mini.append(mbPctLbl,mbTrack,mbLbl);
      monthSummary.appendChild(mini);
    }

    bodyInner.append(statsEl, gridWrap, monthSummary);
    body.appendChild(bodyInner);
    card.append(hdr, body);
    return card;
  }

  function toggleExpand(taskId, card, hdr) {
    if(expanded.has(taskId)){
      expanded.delete(taskId);
      card.classList.remove('expanded');
      hdr.setAttribute('aria-expanded','false');
      card.querySelectorAll('.month-mini-fill').forEach(function(f){ f.style.height='0%'; });
    } else {
      expanded.add(taskId);
      card.classList.add('expanded');
      hdr.setAttribute('aria-expanded','true');
      requestAnimationFrame(function(){
        var gw=card.querySelector('.year-grid-wrap');
        if(gw&&gw._applyGridSizing) gw._applyGridSizing();
        card.querySelectorAll('.month-mini-fill').forEach(function(f){
          requestAnimationFrame(function(){ f.style.height=f.dataset.pct+'%'; });
        });
      });
    }
  }

  function toggleDay(taskId, year, month, day, cell, badge, statsEl, task) {
    var key=logKey(taskId, year, month, day);
    state.logs[key]=!state.logs[key];
    if(!state.logs[key]) delete state.logs[key];
    save();
    var done=!!state.logs[key];
    cell.classList.remove('done','missed');
    cell.classList.add(done?'done':'missed');
    if(done){
      var dc=getDoneColor(task.color, year, month, day);
      cell.style.backgroundColor=dc;
      cell.style.boxShadow='0 0 8px 2px '+getDoneGlow(dc);
      cell.classList.add('just-done');
      cell.addEventListener('animationend',function(){ cell.classList.remove('just-done'); },{once:true});
    } else {
      cell.style.backgroundColor='';
      cell.style.boxShadow='';
    }
    cell.dataset.tip=dayjs(year+'-'+pad(month)+'-'+pad(day)).format('MMM D')+(done?' \u2713':' \u2717');
    var st=calcStats(taskId, viewYear);
    badge.className='streak-badge'+(st.streak>=7?' hot':'');
    badge.innerHTML='<span>'+(st.streak>=7?'&#x1F525;':'&#x2728;')+'</span> '+st.streak+' day streak';
    statsEl.innerHTML=
      '<div class="stat">&#x2705; <strong>'+st.total+'</strong> days done</div>'+
      '<div class="stat">&#x1F4C8; <strong>'+st.pct+'%</strong> completion</div>'+
      '<div class="stat">&#x1F4C5; <strong>'+viewYear+'</strong></div>';
    var hCard=cell.closest('.habit-card');
    if(hCard) updateWeekDots(hCard,task);

    /* Feature 3: update progress ring */
    if(hCard){
      var ringFill=hCard.querySelector('.ring-fill');
      var ringTxt=hCard.querySelector('.habit-ring text');
      if(ringFill){
        var rr2=11,rCirc2=+(2*Math.PI*rr2).toFixed(1);
        ringFill.setAttribute('stroke-dashoffset',+(rCirc2*(1-st.pct/100)).toFixed(1));
      }
      if(ringTxt) ringTxt.textContent=st.pct+'%';
    }

    /* Feature 4: update glow */
    if(hCard){
      if(st.streak>=7){
        var gc2;try{gc2=chroma(task.color).alpha(0.5).css();}catch(e){gc2=task.color;}
        var sp2=st.streak>=30?'1.1s':st.streak>=14?'1.6s':'2.2s';
        hCard.style.setProperty('--glow-c',gc2);
        hCard.style.setProperty('--glow-spd',sp2);
        hCard.classList.add('streak-hot');
      } else {
        hCard.classList.remove('streak-hot');
      }
    }

    /* Feature 2: milestone check */
    var reached=milestoneState[taskId]||[];
    var newBadge=false;
    MILESTONES.forEach(function(ms){
      if(st.streak>=ms.days&&reached.indexOf(ms.days)===-1){
        reached.push(ms.days); newBadge=true;
      }
    });
    if(newBadge){
      milestoneState[taskId]=reached; saveMilestones(milestoneState);
      if(hCard){
        var shelf=hCard.querySelector('.milestone-shelf');
        if(shelf){
          shelf.innerHTML='';
          MILESTONES.forEach(function(ms){
            if(reached.indexOf(ms.days)!==-1){
              var b=document.createElement('span');b.className='ms-badge';
              b.textContent=ms.label;b.title=ms.title;shelf.appendChild(b);
            }
          });
        }
      }
    }

    /* Feature 1: confetti on 100% today */
    renderOverviewStrip();
    var todayDone=state.tasks.filter(function(t){
      return !!state.logs[logKey(t.id,dayjs().year(),dayjs().month()+1,dayjs().date())];
    }).length;
    if(todayDone===state.tasks.length&&state.tasks.length>0){
      launchConfetti(state.tasks.map(function(t){return t.color;}));
    }
  }

  function moveTask(taskId, dir) {
    var idx=state.tasks.findIndex(function(t){ return t.id===taskId; });
    var newIdx=idx+dir;
    if(newIdx<0||newIdx>=state.tasks.length) return;
    var tmp=state.tasks[idx]; state.tasks[idx]=state.tasks[newIdx]; state.tasks[newIdx]=tmp;
    save(); render();
  }

  function deleteTask(taskId) {
    if(!confirm('Remove this habit? All logged data will be deleted.')) return;
    expanded.delete(taskId);
    state.tasks=state.tasks.filter(function(t){ return t.id!==taskId; });
    for(var k in state.logs){ if(k.startsWith(taskId+'-')) delete state.logs[k]; }
    save(); render();
  }

  document.getElementById('yearPrev').addEventListener('click',function(){ viewYear--; render(); });
  document.getElementById('yearNext').addEventListener('click',function(){
    if(viewYear>=dayjs().year()) return;
    viewYear++; render();
  });

  var backdrop=document.getElementById('modalBackdrop');
  var nameInput=document.getElementById('habitNameInput');
  var colorRow=document.getElementById('colorRow');

  PALETTE.forEach(function(color){
    var sw=document.createElement('div');
    sw.className='color-swatch'+(color===selectedColor?' selected':'');
    sw.style.background=color;
    sw.addEventListener('click',function(){
      selectedColor=color;
      document.querySelectorAll('.color-swatch').forEach(function(s){ s.classList.remove('selected'); });
      sw.classList.add('selected');
    });
    colorRow.appendChild(sw);
  });

  document.getElementById('openAddModal').addEventListener('click',function(){
    nameInput.value=''; backdrop.classList.add('open'); nameInput.focus();
  });
  document.getElementById('cancelModal').addEventListener('click',closeModal);
  backdrop.addEventListener('click',function(e){ if(e.target===backdrop) closeModal(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });
  nameInput.addEventListener('keydown',function(e){ if(e.key==='Enter') addHabit(); });
  document.getElementById('confirmAdd').addEventListener('click',addHabit);

  function closeModal(){ backdrop.classList.remove('open'); }
  function addHabit(){
    var name=nameInput.value.trim();
    if(!name){ nameInput.focus(); return; }
    state.tasks.push({ id:uid(), name:name, color:selectedColor });
    save(); closeModal(); render();
  }

  /* Theme toggle */
  (function(){
    var THEME_KEY='habitgrid_theme';
    var html=document.documentElement;
    var btn=document.getElementById('themeToggle');
    function getSystemTheme(){ return window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'; }
    function applyTheme(theme){
      html.dataset.theme=theme;
      btn.textContent=theme==='light'?'🌙':'☀️';
      btn.title='Switch to '+(theme==='light'?'dark':'light')+' theme';
      localStorage.setItem(THEME_KEY,theme);
    }
    var saved=localStorage.getItem(THEME_KEY);
    applyTheme(saved||getSystemTheme());
    btn.addEventListener('click',function(){
      applyTheme(html.dataset.theme==='light'?'dark':'light');
    });
  })();

  initTopBar();
  fetchPokeForSection(false);
  render();
</script>
</body>
</html>
