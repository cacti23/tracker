<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBum Method · 9-Day Split (Tracker)</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070710;
      --surface: #0f0f1a;
      --surface2: #18182a;
      --border: rgba(255, 255, 255, 0.07);
      --border-sub: rgba(255, 255, 255, 0.04);
      --text: #dde0ee;
      --text-muted: #77778a;
      --text-faint: #44445a;
      --text-faintest: #33334a;
      --tab-row: #0f0f1a;
      --tab-active: #1a1a2a;
      --tab-inactive: transparent;
      --tab-text-active: #dde0ee;
      --tab-text-inactive: #44445a;
      --accent: #e05a2b;
      --stats-row: #0f0f1a;
      --note-bg: rgba(0, 0, 0, 0.3);
      --sets-chip: #18182a;
      --sets-text: #666680;
      --divider: rgba(255, 255, 255, 0.05);
      --toggle-bg: #1a1a2a;
      --toggle-border: rgba(255, 255, 255, 0.1);
      --heading-color: #ffffff;
      --sub-heading-color: #333350;
      --shadow: none;
      --rest-text: #33334a;
      --priority-color: #ffffff;
      --normal-color: #77778a;
      --note-color: #55556a;
      --alt-bg: rgba(22, 163, 74, 0.08);
      --alt-border: rgba(22, 163, 74, 0.25);
      --alt-text: #4ade80;
      --checkbox-border: rgba(255,255,255,0.18);
      --timer-bg: #0f0f1a;
      --timer-text: #e05a2b;
      --notes-bg: #0f0f1a;
    }

    [data-theme="light"] {
      --bg: #f2f2f7;
      --surface: #ffffff;
      --surface2: #ebebf0;
      --border: rgba(0, 0, 0, 0.08);
      --border-sub: rgba(0, 0, 0, 0.05);
      --text: #1a1a28;
      --text-muted: #555568;
      --text-faint: #999aaa;
      --text-faintest: #bbbbcc;
      --tab-row: #e4e4ec;
      --tab-active: #ffffff;
      --tab-inactive: transparent;
      --tab-text-active: #1a1a28;
      --tab-text-inactive: #aaaabc;
      --accent: #e05a2b;
      --stats-row: #ffffff;
      --note-bg: rgba(0, 0, 0, 0.03);
      --sets-chip: #ebebf0;
      --sets-text: #888899;
      --divider: rgba(0, 0, 0, 0.06);
      --toggle-bg: #ffffff;
      --toggle-border: rgba(0, 0, 0, 0.1);
      --heading-color: #111122;
      --sub-heading-color: #c0c0d0;
      --shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
      --rest-text: #bbbbcc;
      --priority-color: #111122;
      --normal-color: #666678;
      --note-color: #9999aa;
      --alt-bg: rgba(22, 163, 74, 0.06);
      --alt-border: rgba(22, 163, 74, 0.2);
      --alt-text: #16a34a;
      --checkbox-border: rgba(0,0,0,0.18);
      --timer-bg: #ffffff;
      --timer-text: #e05a2b;
      --notes-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      transition: background 0.3s, color 0.3s;
      padding-bottom: 2rem;
    }
    .glow-layer {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 55% 35% at 15% 8%, rgba(224,90,43,0.08) 0%, transparent 65%),
                  radial-gradient(ellipse 45% 35% at 85% 85%, rgba(14,165,233,0.06) 0%, transparent 65%);
      transition: background 0.3s;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 32px 16px 72px; position: relative; z-index: 1; }
    .header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; flex-wrap: wrap; margin-bottom: 36px;
      border-left: 3px solid var(--accent); padding-left: 20px;
    }
    .header-mono { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
    .header-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(44px,9vw,82px); line-height: 0.88; color: var(--heading-color); }
    .header-title span { color: var(--accent); }
    .header-sub { font-family: 'Bebas Neue', sans-serif; font-size: clamp(18px,4vw,32px); color: var(--sub-heading-color); letter-spacing: 0.06em; margin-top: 4px; }
    .header-desc { margin-top: 10px; font-size: 13px; color: var(--text-muted); font-weight: 300; }
    .toggle-btn {
      cursor: pointer; border: 1px solid var(--toggle-border); background: var(--toggle-bg);
      border-radius: 8px; padding: 8px 14px; color: var(--text-muted);
      font-size: 11px; font-family: 'DM Mono', monospace; letter-spacing: 0.07em;
      flex-shrink: 0; margin-top: 8px; transition: all 0.2s; display: flex; align-items: center; gap: 7px;
      box-shadow: var(--shadow);
    }
    .toggle-btn:hover { opacity: 0.8; }
    .stats-bar {
      display: flex; gap: 1px; margin-bottom: 32px; background: rgba(255,255,255,0.03);
      border-radius: 10px; overflow: hidden; transition: background 0.3s;
    }
    .stat-item { flex: 1; background: var(--stats-row); padding: 13px 8px; text-align: center; }
    .stat-value { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent); line-height: 1; }
    .stat-label { font-family: 'DM Mono', monospace; font-size: 8px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }
    .tab-row { display: flex; gap: 2px; margin-bottom: 28px; background: var(--tab-row); border-radius: 8px; padding: 3px; }
    .tab-btn {
      flex: 1; padding: 9px 0; border-radius: 6px; font-size: 12px; font-weight: 500;
      letter-spacing: 0.03em; cursor: pointer; border: none; font-family: 'DM Sans', sans-serif;
      transition: all 0.2s; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { background: var(--tab-active); color: var(--tab-text-active); border-bottom-color: var(--accent); }
    .tab-btn.inactive { background: var(--tab-inactive); color: var(--tab-text-inactive); }
    .section-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-faint); letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .section-label .line { flex: 1; height: 1px; background: var(--divider); }
    .day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
    .day-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; cursor: pointer; box-shadow: var(--shadow);
      transition: transform 0.15s, box-shadow 0.15s, background 0.3s;
    }
    .day-card:hover { transform: translateY(-2px); }
    .day-card.rest { cursor: default; opacity: 0.6; }
    .day-card.rest:hover { transform: none; }
    .day-card-header { padding: 12px 16px; border-bottom: 1px solid var(--border-sub); display: flex; align-items: center; gap: 10px; }
    .day-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-faintest); }
    .day-tag { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 0.04em; flex: 1; }
    .day-ex-count { font-size: 9px; color: var(--text-faint); background: var(--surface2); padding: 2px 7px; border-radius: 3px; font-family: 'DM Mono', monospace; }
    .rest-msg { padding: 14px 16px; font-size: 12px; color: var(--rest-text); font-style: italic; }
    .day-card-body { padding: 10px 16px 14px; }
    .ex-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--border-sub); }
    .ex-name { font-size: 12px; }
    .ex-name.priority { color: var(--priority-color); }
    .ex-name.normal { color: var(--normal-color); }
    .ex-sets { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-faint); white-space: nowrap; }
    .more-ex { font-size: 11px; color: var(--text-faintest); margin-top: 6px; font-family: 'DM Mono', monospace; }
    .back-btn {
      cursor: pointer; background: none; border: none; font-family: 'DM Mono', monospace;
      font-size: 11px; letter-spacing: 0.12em; display: flex; align-items: center; gap: 6px;
      padding: 6px 0; margin-bottom: 20px; color: var(--text-faint); transition: opacity 0.15s;
    }
    .back-btn:hover { opacity: 0.6; }
    .expanded-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
    .expanded-header { padding: 22px 26px; border-bottom: 1px solid var(--border-sub); }
    .expanded-day-num { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-faint); margin-bottom: 6px; }
    .expanded-day-tag { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 0.04em; line-height: 1; }
    .expanded-notes { margin-top: 14px; font-size: 12.5px; color: var(--text-muted); line-height: 1.6; background: var(--note-bg); padding: 10px 14px; border-radius: 6px; border-left: 2px solid; }
    .expanded-ex { padding: 12px 26px; display: flex; align-items: flex-start; gap: 14px; border-bottom: 1px solid var(--border-sub); }
    .expanded-ex:last-child { border-bottom: none; }
    .expanded-ex-left { flex: 1; }
    .ex-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .ex-checkbox {
      width: 18px; height: 18px; border: 2px solid var(--checkbox-border); border-radius: 4px;
      background: transparent; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .ex-checkbox.checked { background: var(--accent); border-color: var(--accent); }
    .ex-checkbox.checked::after { content: '✓'; color: #fff; font-size: 12px; font-weight: bold; }
    .expanded-ex-name { font-size: 14px; }
    .expanded-ex-name.priority { font-weight: 600; color: var(--text); }
    .expanded-ex-name.normal { font-weight: 400; color: var(--text-muted); }
    .expanded-ex-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
    .tag-chip { font-size: 9px; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; padding: 2px 7px; border-radius: 3px; text-transform: uppercase; border: 1px solid; }
    .ex-note-inline { font-size: 11px; color: var(--note-color); font-style: italic; }
    .ex-sets-chip { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--sets-text); background: var(--sets-chip); padding: 5px 11px; border-radius: 5px; white-space: nowrap; flex-shrink: 0; }
    .alt-line { margin-top: 6px; font-size: 10.5px; color: var(--alt-text); background: var(--alt-bg); border-left: 2px solid var(--alt-border); padding: 4px 10px; border-radius: 3px; font-style: italic; }
    .timer-section { margin: 14px 26px 0; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .timer-display { font-family: 'DM Mono', monospace; font-size: 18px; color: var(--timer-text); background: var(--timer-bg); padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); }
    .timer-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 12px; font-size: 11px; cursor: pointer; font-family: 'DM Mono', monospace; transition: all 0.15s; }
    .timer-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .notes-area { width: 100%; margin-top: 14px; padding: 10px 14px; background: var(--notes-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'DM Sans', sans-serif; resize: vertical; min-height: 60px; }
    .principles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 10px; margin-bottom: 24px; }
    .principle-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; border-left: 3px solid var(--accent); box-shadow: var(--shadow); }
    .principle-icon-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .principle-icon { font-size: 18px; }
    .principle-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; }
    .principle-text { font-size: 13px; color: var(--text-muted); line-height: 1.65; }
    .adapt-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 22px; border-left: 3px solid #16a34a; box-shadow: var(--shadow); }
    .adapt-title { font-family: 'DM Mono', monospace; font-size: 10px; color: #16a34a; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
    .adapt-text { font-size: 13px; color: var(--text-muted); line-height: 1.75; }
    .adapt-text strong { color: var(--text); font-weight: 600; }
  </style>
</head>
<body>
<div class="glow-layer"></div>
<div class="container" id="app">
  <div class="header">
    <div>
      <div class="header-mono">CBum Method · 2024 Off-Season Program</div>
      <div class="header-title">CHRIS <span>BUMSTEAD</span></div>
      <div class="header-sub">9-DAY SPLIT · COACH JUSTIN KING</div>
      <div class="header-desc">6× Mr. Olympia Classic Physique · GVT + Tri-Sets + Double Progression</div>
    </div>
    <button class="toggle-btn" id="themeToggle" onclick="toggleTheme()">
      <span id="toggleIcon">☀️</span> <span id="toggleLabel">Light mode</span>
    </button>
  </div>
  <div class="stats-bar" id="statsBar"></div>
  <div class="tab-row" id="tabRow"></div>
  <div id="contentArea"></div>
</div>

<script>
(function() {
  // ───────────────────── DATA (NO YOUTUBE LINKS) ─────────────────────
  const days = [{
    num:"01", tag:"CHEST, TRICEPS & REAR DELTS", focus:"Chest Focus", type:"chest", color:"#e05a2b",
    notes:"Start with slow eccentrics on incline press — 3-4s down, 1s pause, explode up. GVT on machine press is brutal — keep rest short.",
    exercises:[
      {name:"Incline Dumbbell Press", sets:"4 × 6–8", tag:"SLOW ECCENTRIC", priority:true, note:"3-4s down, 1s pause at bottom, press fast", alt:null},
      {name:"Machine Chest Press", sets:"10 × 10", tag:"GVT", priority:true, note:"German Volume Training — minimal rest between sets", alt:"Barbell Bench Press or Dumbbell Press (same 10×10 GVT format)"},
      {name:"Barbell JM Press", sets:"2 × 8–10", tag:"TRI-SET A", priority:false, note:null, alt:null},
      {name:"Machine Dips", sets:"2 × 10–12", tag:"TRI-SET A", priority:false, note:null, alt:"Parallel Bar Dips or Bench Dips (targets same triceps emphasis)"},
      {name:"Standing Overhead Cable Tri Extension", sets:"2 × 12–15", tag:"TRI-SET A", priority:false, note:null, alt:null},
      {name:"Standing Single-Arm Forward Cable Extension", sets:"3 × 12–15", tag:"SUPERSET B", priority:false, note:null, alt:null},
      {name:"Cable Face Pull", sets:"3 × 12–15", tag:"SUPERSET B", priority:false, note:"Hold peak contraction, squeeze rear delts", alt:null},
    ]
  },{
    num:"02", tag:"BACK & BICEPS", focus:"Back Thickness + Biceps", type:"back", color:"#0ea5e9",
    notes:"Emphasize full range of motion — big stretch at the bottom, full contraction at top. Minimize cheating on chest-supported rows.",
    exercises:[
      {name:"Underhand Grip Barbell Row", sets:"4 × 6–8", tag:"STRAIGHT SETS", priority:true, note:"Supinated grip — hits lats differently (Dorian Yates style)", alt:null},
      {name:"Chest-Supported Dumbbell Row", sets:"10 × 10", tag:"GVT", priority:true, note:"No cheating possible — full ROM every rep", alt:null},
      {name:"EZ Bar Preacher Curl", sets:"4 × 8–10", tag:"TRI-SET A", priority:false, note:null, alt:null},
      {name:"Standing Reverse Grip EZ Bar Curl", sets:"4 × 10–12", tag:"TRI-SET A", priority:false, note:null, alt:null},
      {name:"Low Pulley Cable Curl", sets:"4 × 12–15", tag:"TRI-SET A", priority:false, note:null, alt:null},
      {name:"Machine Pullover", sets:"3 × 10–12", tag:"SUPERSET B", priority:false, note:"One of few back exercises that doesn't use biceps", alt:"Dumbbell Pullover or Straight-Arm Cable Pullover (same lat isolation)"},
      {name:"Fat Gripz Machine Preacher Curl", sets:"3 × 12–15", tag:"SUPERSET B", priority:false, note:null, alt:"Fat Gripz on EZ Bar or Dumbbell Preacher Curl (biceps + brachialis)"},
    ]
  },{
    num:"03", tag:"QUADS & CALVES", focus:"Quad Focus", type:"legs", color:"#16a34a",

    exercises:[
      {name:"Belt Squat", sets:"3–4 × 10–12", tag:"STRAIGHT SETS", priority:true, note:"Replaces barbell squat — joint-friendly, quad-dominant", alt:"Goblet Squats or Front Squats (belt squat alternative — quad-focused, spine-friendly)"},
      {name:"Pendulum Squat", sets:"3 × 10–12", tag:"TRI-SET A", priority:false, note:null, alt:"Smith Machine Squats (feet forward) or Bulgarian Split Squats (quad bias)"},
      {name:"Hack Squat", sets:"3 × 10–12", tag:"TRI-SET A", priority:false, note:"Feet LOW on platform — more knee travel = more quad", alt:"Leg Press (feet low & narrow) or Smith Machine Squats (feet forward)"},
      {name:"Leg Press", sets:"3 × 8–10", tag:"TRI-SET A", priority:false, note:null, alt:"Goblet Squats (wider stance) if leg press unavailable"},
      {name:"Leg Extension", sets:"3 × 10–12", tag:"SUPERSET B", priority:false, note:null, alt:null},
      {name:"Seated Hip Adduction Machine", sets:"3 × 12–15", tag:"SUPERSET B", priority:false, note:"Targets inner quad — often skipped but effective", alt:"Banded Seated Adduction or Wide-Stance Goblet Squats (inner thigh/quad)"},
      {name:"Seated Calf Raise", sets:"3 × 12–15", tag:"STRAIGHT SETS", priority:false, note:null, alt:"Standing Calf Raise or Leg Press Calf Raise (soleus emphasis)"},
    ]
  },{
    num:"04", tag:"REST DAY", focus:"Recovery", type:"rest", color:"#d97706",
    notes:"Active recovery only — foam rolling, stretching, walking. Let the GVT damage repair.", exercises:[]
  },{
    num:"05", tag:"SHOULDERS", focus:"Delt Isolation", type:"shoulder", color:"#9333ea",
    notes:"Extensive band warmup before loading. CBum does laterals slow and controlled with a hard pause at top — strict form, no swinging.",
    exercises:[
      {name:"Machine or Cable Lateral Raise", sets:"4 × 10–15", tag:"STRAIGHT SETS", priority:true, note:"Slow and controlled, pause at top", alt:"Dumbbell Lateral Raise (strict form, no swinging) if no cable/machine"},
      {name:"Machine Shoulder Press", sets:"4 × 8–10", tag:"STRAIGHT SETS", priority:true, note:null, alt:"Dumbbell Shoulder Press or Barbell OHP (same delt focus)"},
      {name:"Reverse Pec Deck", sets:"4 × 10–12", tag:"SUPERSET A", priority:false, note:"Rear delt focus", alt:"Bent-Over Dumbbell Reverse Fly or Cable Face Pull (rear delt target)"},
      {name:"Seated DB Lateral Raise", sets:"4 × 10–12", tag:"SUPERSET A", priority:false, note:"Do these on the pec deck seat, facing opposite", alt:null},
      {name:"Seated DB Shoulder Press", sets:"3 × 10–12", tag:"STRAIGHT SETS", priority:false, note:null, alt:null},

  },{
    num:"06", tag:"ARMS", focus:"Triceps + Biceps", type:"arms", color:"#e11d48",

      {name:"Rope Overhead Cable Extension", sets:"4 × 10–12", tag:"TRI-SET A", priority:false, note:null, alt:null},

      {name:"EZ Bar Reverse Grip Preacher Curl", sets:"4 × 8–10", tag:"TRI-SET B", priority:false, note:null, alt:null},
      {name:"Wide Incline DB Curl", sets:"4 × 10–12", tag:"TRI-SET B", priority:false, note:null, alt:null},

  },{
    num:"07", tag:"CHEST & BACK", focus:"Agonist-Antagonist Supersets", type:"chest", color:"#e05a2b",

      {name:"Cable Fly or Pec Deck", sets:"3 × 10–15", tag:"SUPERSET B", priority:false, note:null, alt:"Dumbbell Fly (flat bench) if no cable/pec deck available"},
      {name:"Seated Cable Row", sets:"3 × 10–12", tag:"SUPERSET B", priority:false, note:null, alt:null},
      {name:"Machine Chest Press", sets:"3 × 8–12", tag:"SUPERSET C", priority:false, note:null, alt:"Barbell Bench Press or Dumbbell Press (chest focus)"},
      {name:"Chest-Supported Row", sets:"3 × 8–12", tag:"SUPERSET C", priority:false, note:null, alt:"Chest-Supported Dumbbell Row on incline bench or Seated Cable Row (upper back)"},
    ]
  },{
    num:"08", tag:"HAMSTRINGS, GLUTES & CALVES", focus:"Posterior Chain", type:"legs", color:"#16a34a",
    notes:"Splitting quads and hamstrings is smart — you can't train both maximally in one session. After the opening tri-set, everything is straight sets.",
    exercises:[
      {name:"Lying Leg Curl", sets:"3 × 10–12", tag:"TRI-SET A", priority:true, note:null, alt:null},
      {name:"Romanian Deadlift", sets:"3 × 8–10", tag:"TRI-SET A", priority:true, note:"Full hip hinge — feel the hamstring stretch", alt:null},
      {name:"Glute-Focused Hip Extension / Kickback", sets:"3 × 12–15", tag:"TRI-SET A", priority:false, note:null, alt:"Cable Kickback or Glute Bridge / Hip Thrust (glute target)"},
      {name:"Seated Leg Curl", sets:"3 × 10–12", tag:"STRAIGHT SETS", priority:false, note:"Different angle vs lying curl — hits distal hamstring", alt:"Standing Single-Leg Curl or Stability Ball Hamstring Curl"},
      {name:"Stiff-Leg Deadlift", sets:"3 × 10–12", tag:"STRAIGHT SETS", priority:false, note:null, alt:null},
      {name:"Standing Calf Raise", sets:"3 × 12–15", tag:"STRAIGHT SETS", priority:false, note:null, alt:null},
      {name:"Seated Calf Raise", sets:"3 × 15–20", tag:"STRAIGHT SETS", priority:false, note:"Different calf head — soleus dominant", alt:"Donkey Calf Raise or Leg Press Calf Raise (soleus emphasis)"},
    ]
  },{
    num:"09", tag:"REST DAY", focus:"Recovery", type:"rest", color:"#d97706",
    notes:"Full rest. Cycle repeats from Day 1.", exercises:[]
  }];

  const principles = [
    {icon:"📈", label:"Double Progression", text:"Work in a set rep range. Once you hit the top for all sets, increase weight next session. Reps first, then weight."},
    {icon:"⚡", label:"German Volume Training", text:"10 sets × 10 reps with minimal rest. Used on machine chest press (Day 1) and chest-supported rows (Day 2). Brutal volume stimulus."},
    {icon:"🔗", label:"Tri-Sets & Supersets", text:"Move exercise to exercise with no rest within the cluster. Only rest between full rounds. Maximizes pump and time efficiency."},
    {icon:"🐢", label:"Slow Eccentrics", text:"3-4 seconds down, 1s pause at stretch, explode up. Especially on incline press. More time under tension = more hypertrophy."},
    {icon:"🧠", label:"Mind-Muscle Connection", text:"Quality reps over ego weight. Feel the target muscle working. CBum prioritizes a hard contraction at the top of every rep."},
    {icon:"📏", label:"Extended Range of Motion", text:"Full stretch at the bottom, full contraction at the top. This is CBum's 2024 emphasis across ALL muscle groups."},
    {icon:"🚫", label:"No Barbell Squats", text:"CBum dropped these to stay pain-free as he ages. Belt squat, hack squat, and pendulum squat replace them with zero spine load."},
    {icon:"💪", label:"Lagging Muscle Focus", text:"CBum's weak points (biceps + calves) get special intensity techniques — Fat Gripz, more volume, drop sets built into the program."},
  ];

  // ───────────────────── STATE ─────────────────────
  let activeDayIndex = null;
  let currentTab = "split";
  let isDark = true;
  let timerInterval = null;
  let timerSeconds = 90;
  let timerRunning = false;

  // completed exercises & notes stored per day (by day index)
  const storageKey = "cbum_split_data";
  let userData = JSON.parse(localStorage.getItem(storageKey)) || {};

  function saveUserData() {
    localStorage.setItem(storageKey, JSON.stringify(userData));
  }

  function getCompleted(dayIdx) {
    return userData[dayIdx]?.completed || [];
  }
  function setCompleted(dayIdx, exIdx, value) {
    if (!userData[dayIdx]) userData[dayIdx] = {};
    if (!userData[dayIdx].completed) userData[dayIdx].completed = [];
    if (value) {
      if (!userData[dayIdx].completed.includes(exIdx)) userData[dayIdx].completed.push(exIdx);
    } else {
      userData[dayIdx].completed = userData[dayIdx].completed.filter(i => i !== exIdx);
    }
    saveUserData();
  }
  function getNotes(dayIdx) {
    return userData[dayIdx]?.notes || "";
  }
  function setNotes(dayIdx, text) {
    if (!userData[dayIdx]) userData[dayIdx] = {};
    userData[dayIdx].notes = text;
    saveUserData();
  }

  // ───────────────────── TAG COLORS ─────────────────────
  function getTagColors(dark) {
    return {
      "GVT": { bg: dark ? "#e05a2b22" : "#e05a2b14", color: "#e05a2b", border: dark ? "#e05a2b44" : "#e05a2b30" },
      "TRI-SET A": { bg: dark ? "#0ea5e920" : "#0ea5e914", color: "#0ea5e9", border: dark ? "#0ea5e944" : "#0ea5e930" },
      "TRI-SET B": { bg: dark ? "#9333ea20" : "#9333ea14", color: "#9333ea", border: dark ? "#9333ea44" : "#9333ea30" },
      "TRI-SET C": { bg: dark ? "#e11d4820" : "#e11d4814", color: "#e11d48", border: dark ? "#e11d4844" : "#e11d4830" },
      "SUPERSET A": { bg: dark ? "#16a34a20" : "#16a34a14", color: "#16a34a", border: dark ? "#16a34a44" : "#16a34a30" },
      "SUPERSET B": { bg: dark ? "#d9770620" : "#d9770614", color: "#d97706", border: dark ? "#d9770644" : "#d9770630" },
      "SUPERSET C": { bg: dark ? "#9333ea20" : "#9333ea14", color: "#9333ea", border: dark ? "#9333ea44" : "#9333ea30" },
      "SLOW ECCENTRIC": { bg: dark ? "#e11d4820" : "#e11d4814", color: "#e11d48", border: dark ? "#e11d4844" : "#e11d4830" },
      "STRAIGHT SETS": { bg: dark ? "#ffffff0a" : "#00000008", color: dark ? "#666680" : "#888899", border: dark ? "#ffffff18" : "#00000015" },
    };
  }

  // ───────────────────── RENDER ─────────────────────
  function renderStatsBar() {
    const stats = [["9","Day Cycle"],["3on/1off","Structure"],["GVT","10×10 Sets"],["Tri-Sets","Method"],["1×/wk","Frequency"]];
    document.getElementById("statsBar").innerHTML = stats.map(([v,l]) => `<div class="stat-item"><div class="stat-value">${v}</div><div class="stat-label">${l}</div></div>`).join("");
  }

  function renderTabs() {
    document.getElementById("tabRow").innerHTML = `
      <button class="tab-btn ${currentTab==="split"?"active":"inactive"}" onclick="window._selectTab('split')">9-Day Split</button>
      <button class="tab-btn ${currentTab==="principles"?"active":"inactive"}" onclick="window._selectTab('principles')">CBum Principles</button>
    `;
  }

  function renderContent() {
    const area = document.getElementById("contentArea");
    if (currentTab === "split" && activeDayIndex === null) {
      area.innerHTML = renderSplitGrid();
    } else if (currentTab === "split" && activeDayIndex !== null) {
      area.innerHTML = renderExpandedDay(activeDayIndex);
    } else if (currentTab === "principles") {
      area.innerHTML = renderPrinciples();
    }
    bindEvents();
    if (activeDayIndex !== null) {
      restoreTimerDisplay();
      bindTimerButtons();
    }
  }

  function renderSplitGrid() {
    let html = `<div class="section-label">Tap any day to see workout <span class="line"></span></div><div class="day-grid">`;
    days.forEach((day, i) => {
      const isRest = day.type === "rest";
      const headerBg = isRest ? "transparent" : `linear-gradient(90deg, ${day.color}${isDark?"14":"0e"} 0%, transparent 70%)`;
      html += `<div class="day-card${isRest?" rest":""}" data-day-index="${i}" style="${isRest?"":"cursor:pointer;"}">
        <div class="day-card-header" style="background:${headerBg};">
          <span class="day-num">DAY ${day.num}</span>
          <span class="day-tag" style="color:${day.color};">${day.tag}</span>
          ${!isRest ? `<span class="day-ex-count">${day.exercises.length} exercises</span>` : ""}
        </div>
        ${isRest ? `<div class="rest-msg">Full recovery — foam roll, stretch, walk</div>` : `<div class="day-card-body">
          ${day.exercises.slice(0,4).map((ex,j) => `<div class="ex-row" style="border-bottom:${j<3?'1px solid var(--border-sub)':'none'};"><span class="ex-name ${ex.priority?'priority':'normal'}">${ex.name}${ex.priority?'<span style="color:#e05a2b;font-size:9px;">★</span>':''}</span><span class="ex-sets">${ex.sets}</span></div>`).join("")}
          ${day.exercises.length>4?`<div class="more-ex">+ ${day.exercises.length-4} more →</div>`:''}
        </div>`}
      </div>`;
    });
    html += `</div>`;
    return html;
  }

  function renderExpandedDay(index) {
    const day = days[index];
    const tagColors = getTagColors(isDark);
    const completed = getCompleted(index);
    const notesText = getNotes(index);
    let html = `
      <button class="back-btn" onclick="window._goBack()">← BACK TO SPLIT</button>
      <div class="expanded-card">
        <div class="expanded-header" style="background:linear-gradient(135deg, ${day.color}${isDark?'18':'0c'} 0%, transparent 60%);">
          <div class="expanded-day-num">DAY ${day.num} of 9</div>
          <div class="expanded-day-tag" style="color:${day.color};">${day.tag}</div>
          <div class="expanded-notes" style="border-left-color:${day.color}60;">💡 ${day.notes}</div>
        </div>
        <div>
          ${day.exercises.map((ex, i) => {
            const tc = tagColors[ex.tag] || tagColors["STRAIGHT SETS"];
            const isChecked = completed.includes(i);
            return `
              <div class="expanded-ex" style="border-bottom:${i<day.exercises.length-1?'1px solid var(--border-sub)':'none'};">
                <div class="expanded-ex-left">
                  <div class="ex-name-row">
                    <div class="ex-checkbox${isChecked?' checked':''}" data-day="${index}" data-ex="${i}" onclick="toggleCheckbox(this)" style="margin-right:4px;"></div>
                    <span class="expanded-ex-name ${ex.priority?'priority':'normal'}">${ex.name}${ex.priority?'<span style="color:#e05a2b;font-size:10px;">★</span>':''}</span>
                  </div>
                  <div class="expanded-ex-tags">
                    <span class="tag-chip" style="background:${tc.bg};color:${tc.color};border-color:${tc.border};">${ex.tag}</span>
                    ${ex.note ? `<span class="ex-note-inline">${ex.note}</span>` : ''}
                  </div>
                  ${ex.alt ? `<div class="alt-line">🔄 Alt: ${ex.alt}</div>` : ''}
                </div>
                <div class="ex-sets-chip">${ex.sets}</div>
              </div>`;
          }).join('')}
        </div>
        <div class="timer-section">
          <span class="timer-display" id="timerDisplay">${formatTime(timerSeconds)}</span>
          <button class="timer-btn" id="timerStartBtn">▶ Start</button>
          <button class="timer-btn" id="timerResetBtn">↺ Reset</button>
          <span style="font-size:10px; color:var(--text-faint); margin-left:auto;">Rest timer</span>
        </div>
        <div style="padding:0 26px 20px;">
          <textarea class="notes-area" id="dayNotes" placeholder="Add your personal notes for this workout...">${notesText}</textarea>
        </div>
      </div>
    `;
    return html;
  }

  function renderPrinciples() {
    return `
      <div class="section-label">What CBum actually preaches <span class="line"></span></div>
      <div class="principles-grid">
        ${principles.map(p => `
          <div class="principle-card">
            <div class="principle-icon-row"><span class="principle-icon">${p.icon}</span><span class="principle-label">${p.label}</span></div>
            <div class="principle-text">${p.text}</div>
          </div>
        `).join('')}
      </div>
      <div class="adapt-card">
        <div class="adapt-title">⚡ Adapting CBum's Program for You</div>
        <div class="adapt-text">CBum is a 6× Olympia champion with full-time recovery. The <strong>structure and principles</strong> are what matter. Start with <strong>straight sets</strong> before adding GVT. Ease into 10×10 over 4–6 weeks. Tri‑sets, double progression, slow eccentrics, and extended ROM are directly transferable.</div>
      </div>
    `;
  }

  // ───────────────────── TIMER ─────────────────────
  function formatTime(sec) {
    const m = Math.floor(sec/60);
    const s = sec%60;
    return `${m}:${s<10?'0':''}${s}`;
  }

  function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    document.getElementById("timerStartBtn").textContent = "⏸ Pause";
    timerInterval = setInterval(() => {
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        timerRunning = false;
        document.getElementById("timerStartBtn").textContent = "▶ Start";
        timerSeconds = 90;
        updateTimerDisplay();
        alert("Rest time's up! Get back to work.");
        return;
      }
      timerSeconds--;
      updateTimerDisplay();
    }, 1000);
  }

  function pauseTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    document.getElementById("timerStartBtn").textContent = "▶ Start";
  }

  function resetTimer() {
    clearInterval(timerInterval);
    timerRunning = false;
    timerSeconds = 90;
    updateTimerDisplay();
    document.getElementById("timerStartBtn").textContent = "▶ Start";
  }

  function updateTimerDisplay() {
    const el = document.getElementById("timerDisplay");
    if (el) el.textContent = formatTime(timerSeconds);
  }

  function restoreTimerDisplay() {
    const el = document.getElementById("timerDisplay");
    if (el) el.textContent = formatTime(timerSeconds);
  }

  function bindTimerButtons() {
    const startBtn = document.getElementById("timerStartBtn");
    const resetBtn = document.getElementById("timerResetBtn");
    if (startBtn) startBtn.onclick = () => timerRunning ? pauseTimer() : startTimer();
    if (resetBtn) resetBtn.onclick = resetTimer;
  }

  // ───────────────────── EVENTS ─────────────────────
  window.toggleCheckbox = function(el) {
    const dayIdx = parseInt(el.dataset.day);
    const exIdx = parseInt(el.dataset.ex);
    const currentlyChecked = getCompleted(dayIdx).includes(exIdx);
    setCompleted(dayIdx, exIdx, !currentlyChecked);
    el.classList.toggle('checked', !currentlyChecked);
  };

  function bindNotesHandler() {
    const notesArea = document.getElementById("dayNotes");
    if (notesArea) {
      notesArea.addEventListener("input", function() {
        if (activeDayIndex !== null) setNotes(activeDayIndex, this.value);
      });
    }
  }

  function bindCardClicks() {
    document.querySelectorAll(".day-card:not(.rest)").forEach(card => {
      card.addEventListener("click", function() {
        const idx = parseInt(this.dataset.dayIndex);
        if (!isNaN(idx) && days[idx].type !== "rest") {
          activeDayIndex = idx;
          renderContent();
          window.scrollTo({top:0, behavior:"smooth"});
        }
      });
    });
  }

  function bindEvents() {
    bindCardClicks();
    bindNotesHandler();
  }

  // ───────────────────── GLOBAL ACTIONS ─────────────────────
  window._selectTab = function(tab) {
    currentTab = tab;
    activeDayIndex = null;
    renderTabs();
    renderContent();
  };
  window._goBack = function() {
    activeDayIndex = null;
    renderContent();
    window.scrollTo({top:0, behavior:"smooth"});
  };
  window.toggleTheme = function() {
    isDark = !isDark;
    document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
    document.getElementById("toggleIcon").textContent = isDark ? "☀️" : "🌙";
    document.getElementById("toggleLabel").textContent = isDark ? "Light mode" : "Dark mode";
    renderContent();
    renderTabs();
  };

  function init() {
    renderStatsBar();
    renderTabs();
    renderContent();
  }
  init();
})();
</script>
</body>
</html>
